# =============================================================================
# GAMILIT Backend - Secrets (TEMPLATE)
# =============================================================================
# IMPORTANT: This is a TEMPLATE file. DO NOT commit actual secrets to Git!
#
# Create secrets using kubectl:
#   kubectl create secret generic gamilit-db-secret \
#     --from-literal=username='gamilit_user' \
#     --from-literal=password='YOUR_STRONG_PASSWORD' \
#     --namespace=gamilit-production
#
# Or use Sealed Secrets / External Secrets Operator for GitOps
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: gamilit-db-secret
  namespace: gamilit-production
  labels:
    app: gamilit
    component: backend
type: Opaque
stringData:
  # Database credentials
  username: "gamilit_user"
  password: "REPLACE_WITH_STRONG_PASSWORD"  # Use secrets manager in production!

---
apiVersion: v1
kind: Secret
metadata:
  name: gamilit-jwt-secret
  namespace: gamilit-production
  labels:
    app: gamilit
    component: backend
type: Opaque
stringData:
  # JWT secret (minimum 32 characters)
  # Generate with: openssl rand -base64 32
  jwt_secret: "REPLACE_WITH_JWT_SECRET_MIN_32_CHARS"

---
apiVersion: v1
kind: Secret
metadata:
  name: gamilit-redis-secret
  namespace: gamilit-production
  labels:
    app: gamilit
    component: backend
type: Opaque
stringData:
  # Redis connection URL
  redis_url: "redis://:password@gamilit-redis.gamilit-production.svc.cluster.local:6379"

---
# =============================================================================
# PRODUCTION SECRETS MANAGEMENT
# =============================================================================
#
# Option 1: Sealed Secrets (Bitnami)
# -----------------------------------
# Install: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
# Encrypt: kubeseal --format=yaml < secret.yaml > sealed-secret.yaml
#
# Option 2: External Secrets Operator
# ------------------------------------
# Install: helm install external-secrets external-secrets/external-secrets
# Integrate with AWS Secrets Manager, HashiCorp Vault, GCP Secret Manager
#
# Option 3: SOPS (Secrets OPerationS)
# -----------------------------------
# Install: https://github.com/mozilla/sops
# Encrypt: sops --encrypt --kms <KMS_KEY_ID> secret.yaml > secret.enc.yaml
#
# =============================================================================
