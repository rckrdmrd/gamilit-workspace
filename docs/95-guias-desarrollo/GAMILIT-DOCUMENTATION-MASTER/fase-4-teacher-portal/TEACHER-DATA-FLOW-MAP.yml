# ============================================================================
# HOOKS ESPECÍFICOS DEL TEACHER PORTAL
# ============================================================================
teacher_hooks:
  useTeacherClassrooms:
    file: "features/teacher/hooks/useTeacherClassrooms.ts"
    provides:
      - classrooms
      - createClassroom
      - updateClassroom
      - archiveClassroom
    api_calls:
      - "GET /teacher/classrooms"
      - "POST /teacher/classrooms"
      - "PUT /teacher/classrooms/:id"

  useClassroomStudents:
    file: "features/teacher/hooks/useClassroomStudents.ts"
    provides:
      - students
      - addStudent
      - removeStudent
      - updateStudentStatus
    api_calls:
      - "GET /teacher/classrooms/:id/students"
      - "POST /teacher/classrooms/:id/students"

  useTeacherAssignments:
    file: "features/teacher/hooks/useTeacherAssignments.ts"
    provides:
      - assignments
      - createAssignment
      - updateAssignment
      - deleteAssignment
      - assignToClassroom
    api_calls:
      - "GET /teacher/assignments"
      - "POST /teacher/assignments"
      - "PUT /teacher/assignments/:id"

  useExerciseResponses:
    file: "features/teacher/hooks/useExerciseResponses.ts"
    provides:
      - responses
      - responseDetail
      - gradeResponse
    api_calls:
      - "GET /teacher/exercises/:id/responses"
      - "PUT /teacher/responses/:id/grade"

  useManualReviews:
    file: "features/teacher/hooks/useManualReviews.ts"
    provides:
      - pendingReviews
      - submitReview
      - reviewHistory
    api_calls:
      - "GET /teacher/reviews/pending"
      - "POST /teacher/reviews/:id"

  useTeacherAnalytics:
    file: "features/teacher/hooks/useTeacherAnalytics.ts"
    provides:
      - classAnalytics
      - studentAnalytics
      - trendData
    api_calls:
      - "GET /teacher/analytics/class/:id"
      - "GET /teacher/analytics/student/:id"

  useClassProgress:
    file: "features/teacher/hooks/useClassProgress.ts"
    provides:
      - classProgress
      - moduleCompletion
      - averageScores
    api_calls:
      - "GET /teacher/progress/class/:id"
      - "GET /teacher/progress/modules"

  useInterventionAlerts:
    file: "features/teacher/hooks/useInterventionAlerts.ts"
    provides:
      - alerts
      - markAsReviewed
      - createIntervention
    api_calls:
      - "GET /teacher/alerts"
      - "PUT /teacher/alerts/:id/reviewed"

  useClassroomGamification:
    file: "features/teacher/hooks/useClassroomGamification.ts"
    provides:
      - gamificationSettings
      - updateSettings
      - rewardMultipliers
    api_calls:
      - "GET /teacher/classrooms/:id/gamification"
      - "PUT /teacher/classrooms/:id/gamification"

  useReportGenerator:
    file: "features/teacher/hooks/useReportGenerator.ts"
    provides:
      - generateReport
      - reportHistory
      - exportReport
    api_calls:
      - "POST /teacher/reports/generate"
      - "GET /teacher/reports/:id/export"

