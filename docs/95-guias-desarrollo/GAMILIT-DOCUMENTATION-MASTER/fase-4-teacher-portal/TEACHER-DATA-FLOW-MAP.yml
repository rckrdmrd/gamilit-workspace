# ============================================================================
# FLUJO DE DATOS TÍPICO
# ============================================================================
typical_flows:
  - name: "Ver progreso de clase"
    steps:
      1: "TeacherClassesPage: Select classroom"
      2: "Navigate to TeacherProgressPage with classroomId"
      3: "useClassProgress(classroomId)"
      4: "Render ProgressCharts with data"
      5: "User can export via useReportGenerator"

  - name: "Crear asignación"
    steps:
      1: "TeacherAssignmentsPage: Click 'Nueva Asignación'"
      2: "AssignmentCreator modal opens"
      3: "Select exercises, set deadline"
      4: "useTeacherAssignments.createAssignment()"
      5: "Assign to classrooms"
      6: "Students receive notification"

  - name: "Revisar ejercicio creativo"
    steps:
      1: "TeacherAlertsPage: See pending reviews"
      2: "Navigate to TeacherReviewPanelPage"
      3: "useManualReviews.pendingReviews"
      4: "Open RubricEvaluator"
      5: "Submit scores and feedback"
      6: "Student notified of grade"

