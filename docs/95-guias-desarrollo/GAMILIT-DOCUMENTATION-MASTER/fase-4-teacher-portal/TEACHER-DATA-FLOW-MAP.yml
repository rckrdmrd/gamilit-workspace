      - useTeacherClasses

  classroom_management:
    pages:
      - TeacherClassesPage
      - TeacherStudentsPage
      - TeacherMonitoringPage
    description: "Gestión de aulas y estudiantes"
    components:
      - ClassroomList
      - ClassroomCard
      - StudentTable
      - StudentProgressCard
      - MonitoringGrid
      - LiveActivityIndicator
    hooks:
      - useTeacherClassrooms
      - useClassroomStudents
      - useStudentProgress
      - useRealTimeMonitoring

  assignments:
    pages:
      - TeacherAssignmentsPage
      - TeacherExerciseResponsesPage
      - TeacherReviewPanelPage
    description: "Gestión de tareas y evaluaciones"
    components:
      - AssignmentList
      - AssignmentCreator
      - AssignmentCalendar
      - ResponsesList
      - ResponseDetailCard
      - RubricEvaluator
      - ManualReviewPanel
    hooks:
      - useTeacherAssignments
      - useExerciseResponses
      - useManualReviews

  content:
    pages:
      - TeacherContentPage
      - TeacherResourcesPage
    description: "Gestión de contenido y recursos"
    components:
      - ContentBrowser
