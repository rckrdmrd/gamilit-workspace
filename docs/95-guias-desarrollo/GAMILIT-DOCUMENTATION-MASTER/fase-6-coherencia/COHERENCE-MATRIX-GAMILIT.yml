# ============================================================================
# FLUJO DE DATOS DDL → BACKEND → FRONTEND
# ============================================================================
data_flow_tracing:

  example_flows:
    - name: "Flujo de Gamificación"
      ddl:
        tables: ["user_stats", "user_ranks", "achievements", "user_achievements"]
        functions: ["award_achievement_rewards", "check_and_unlock_achievement"]
      backend:
        entities: ["UserStats", "UserRank", "Achievement", "UserAchievement"]
        services: ["UserStatsService", "RanksService", "AchievementsService"]
        endpoints: ["GET /gamification/stats", "GET /gamification/ranks"]
      frontend:
        stores: ["ranksStore", "achievementsStore"]
        hooks: ["useUserGamification", "useRanksStore"]
        components: ["RankBadge", "AchievementCard"]
      coherence: "95%"

    - name: "Flujo de Progreso"
      ddl:
        tables: ["module_progress", "exercise_attempts", "exercise_submissions"]
        triggers: ["trg_update_progress_on_completion"]
      backend:
        entities: ["ModuleProgress", "ExerciseAttempt", "ExerciseSubmission"]
        services: ["ProgressService", "ExerciseAttemptService"]
        endpoints: ["GET /progress/modules/:id", "POST /progress/attempts"]
      frontend:
        hooks: ["useModuleProgress", "useExerciseAttempts"]
        components: ["ProgressBar", "ExercisePlayer"]
      coherence: "85%"

    - name: "Flujo de Asignaciones"
      ddl:
        tables: ["assignments", "assignment_students", "assignment_submissions"]
      backend:
        entities: ["Assignment", "AssignmentStudent", "AssignmentSubmission"]
        services: ["AssignmentsService"]
        endpoints: ["GET /assignments", "POST /assignments/:id/submit"]
      frontend:
        stores: ["studentAssignmentsStore"]
        hooks: ["useStudentAssignmentsStore"]
        pages: ["AssignmentsPage", "AssignmentDetailPage"]
      coherence: "90%"

