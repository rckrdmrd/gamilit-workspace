# ============================================================================
# FLUJO DE DATOS TÍPICO
# ============================================================================
typical_data_flows:
  - name: "Login → Dashboard"
    steps:
      1: "LoginPage: useAuth.login() → authStore.login()"
      2: "authStore: POST /auth/login → setUser()"
      3: "Navigate to DashboardComplete"
      4: "DashboardComplete: useDashboardData() → fetch stats"
      5: "DashboardComplete: useUserGamification() → fetch gamification"
      6: "DashboardComplete: useMissions() → missionsStore.fetchMissions()"

  - name: "Ejercicio → Recompensas"
    steps:
      1: "ExercisePage: getExercise() → load exercise"
      2: "User completes exercise"
      3: "ExercisePage: submitExercise() → POST /exercises/:id/submit"
      4: "Backend: triggers award_achievement_rewards()"
      5: "ExercisePage: useInvalidateDashboard() → refresh data"
      6: "Dashboard: shows new XP, coins, achievements"

  - name: "Ver Leaderboard"
    steps:
      1: "LeaderboardPage: useLeaderboards()"
      2: "Hook: leaderboardsStore.fetchGlobalLeaderboard()"
      3: "Store: GET /gamification/leaderboards/global"
      4: "Component: renders LeaderboardLayout with data"
      5: "User changes tab"
      6: "Store: fetchClassroomLeaderboard() or fetchFriendsLeaderboard()"

# ============================================================================
# ESTADÍSTICAS
# ============================================================================
statistics:
  stores_by_usage:
    high_usage: # >3 páginas
      - notificationsStore (3 páginas)
    medium_usage: # 1-3 páginas
      - studentAssignmentsStore (2 páginas)
      - authStore (1 página directa, múltiples via hooks)
      - ranksStore (1 página directa)
      - economyStore (1 página directa)
      - achievementsStore (1 página directa)
    low_usage: # acceso indirecto via hooks
      - friendsStore
      - guildsStore
      - leaderboardsStore
      - newLeaderboardsStore
      - missionsStore
      - powerUpsStore

  hooks_by_usage:
    most_used:
      - useAuth: 14 páginas
      - useUserGamification: 11 páginas
      - useNavigate: 18 páginas (react-router-dom)
    moderately_used:
      - useMissions: 2 páginas
      - useDashboardData: 2 páginas
      - useLeaderboards: 1 página
      - useFriends: 1 página
      - useGuilds: 1 página
