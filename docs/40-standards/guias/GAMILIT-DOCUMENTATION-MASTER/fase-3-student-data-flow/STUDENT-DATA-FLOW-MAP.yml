# STUDENT-DATA-FLOW-MAP.yml
# Flujo de datos completo: Página → Componentes → Hooks → Stores → API
# Generado: 2026-01-22
# Fase: 3 - Mapeo Hooks/Stores (Student Portal)

metadata:
  version: "1.0.0"
  generated: "2026-01-22"
  methodology: "CAPVED"
  portal: "Student"
  total_stores: 12
  total_hooks: ~40

# ============================================================================
# STORES ZUSTAND (12 Confirmados)
# ============================================================================
stores:
  authStore:
    file: "features/auth/store/authStore.ts"
    state:
      - user
      - isAuthenticated
      - isLoading
      - error
    actions:
      - login
      - logout
      - refreshToken
      - checkAuth
    consumers:
      pages: ["GamificationPage"]
      hooks: ["useAuth"]
    api_calls:
      - "POST /auth/login"
      - "POST /auth/logout"
      - "POST /auth/refresh"

  ranksStore:
    file: "features/gamification/ranks/store/ranksStore.ts"
    state:
      - currentRank
      - nextRank
      - xpProgress
      - rankHistory
      - multipliers
    actions:
      - fetchUserRank
      - updateXP
      - checkRankUp
    consumers:
      pages: ["GamificationPage"]
      components: ["RankBadge", "RankProgressBar"]
    api_calls:
      - "GET /gamification/ranks/current"
      - "GET /gamification/ranks/history"

  economyStore:
    file: "features/gamification/economy/store/economyStore.ts"
    state:
      - mlCoinsBalance
      - transactions
      - earningsSources
      - spendingHistory
    actions:
      - fetchBalance
      - fetchTransactions
      - addCoins
      - spendCoins
    consumers:
      pages: ["GamificationPage", "ShopPage"]
      components: ["CoinBalanceWidget", "TransactionHistory"]
    api_calls:
      - "GET /gamification/economy/balance"
      - "GET /gamification/economy/transactions"

  achievementsStore:
    file: "features/gamification/social/store/achievementsStore.ts"
    state:
      - achievements
      - userAchievements
      - unlockedRecent
      - progress
    actions:
      - fetchAchievements
      - unlockAchievement
      - fetchProgress
    consumers:
      pages: ["GamificationPage"]
      components: ["AchievementCard", "AchievementUnlockModal"]
    api_calls:
      - "GET /gamification/achievements"
      - "GET /gamification/achievements/user"

  friendsStore:
    file: "features/gamification/social/store/friendsStore.ts"
    state:
      - friends
      - pendingRequests
      - sentRequests
      - onlineFriends
    actions:
      - fetchFriends
      - sendRequest
      - acceptRequest
      - rejectRequest
      - removeFriend
    consumers:
      pages: ["FriendsPage"]
      hooks: ["useFriends"]
    api_calls:
      - "GET /social/friends"
      - "POST /social/friends/request"
      - "PUT /social/friends/accept/:id"

  guildsStore:
    file: "features/gamification/social/store/guildsStore.ts"
    state:
      - myGuilds
      - availableGuilds
      - guildMembers
      - guildStats
    actions:
      - fetchMyGuilds
      - searchGuilds
      - joinGuild
      - leaveGuild
      - createGuild
    consumers:
      pages: ["GuildsPage"]
      hooks: ["useGuilds"]
    api_calls:
      - "GET /social/guilds/my"
      - "GET /social/guilds/search"
      - "POST /social/guilds/join/:id"

  leaderboardsStore:
    file: "features/gamification/social/store/leaderboardsStore.ts"
    state:
      - globalLeaderboard
      - classroomLeaderboard
      - friendsLeaderboard
      - myPosition
    actions:
      - fetchGlobalLeaderboard
      - fetchClassroomLeaderboard
      - fetchFriendsLeaderboard
    consumers:
      pages: ["LeaderboardPage"]
      hooks: ["useLeaderboards"]
    api_calls:
      - "GET /gamification/leaderboards/global"
      - "GET /gamification/leaderboards/classroom/:id"
      - "GET /gamification/leaderboards/friends"

  newLeaderboardsStore:
    file: "features/gamification/social/store/newLeaderboardsStore.ts"
    state:
      - seasons
      - currentSeason
      - seasonLeaderboard
    actions:
      - fetchSeasons
      - fetchSeasonLeaderboard
    consumers:
      pages: ["LeaderboardPage"]
      components: ["SeasonSelector"]
    api_calls:
      - "GET /gamification/leaderboards/seasons"
      - "GET /gamification/leaderboards/season/:id"

  missionsStore:
    file: "features/gamification/missions/store/missionsStore.ts"
    state:
      - dailyMissions
      - weeklyMissions
      - activeMission
      - completedMissions
      - missionRewards
    actions:
      - fetchMissions
      - startMission
      - completeMission
      - claimReward
    consumers:
      pages: ["MissionsPage", "DashboardComplete"]
      hooks: ["useMissions"]
      components: ["MissionCard", "MissionGrid"]
    api_calls:
      - "GET /gamification/missions/daily"
      - "GET /gamification/missions/weekly"
      - "POST /gamification/missions/:id/complete"

  notificationsStore:
    file: "features/notifications/store/notificationsStore.ts"
    state:
      - notifications
      - unreadCount
      - preferences
      - pushEnabled
    actions:
      - fetchNotifications
      - markAsRead
      - markAllAsRead
      - updatePreferences
      - enablePush
    consumers:
      pages: ["NotificationsPage", "NotificationPreferencesPage", "DeviceManagementSection"]
      components: ["NotificationBell"]
    api_calls:
      - "GET /notifications"
      - "PUT /notifications/:id/read"
      - "PUT /notifications/preferences"

  powerUpsStore:
    file: "features/gamification/social/store/powerUpsStore.ts"
    state:
      - inventory
      - activePowerUps
      - cooldowns
    actions:
      - fetchInventory
      - activatePowerUp
      - checkCooldowns
    consumers:
      pages: ["InventoryPage", "ExercisePage"]
      components: ["PowerUpBar"]
    api_calls:
      - "GET /gamification/powerups/inventory"
      - "POST /gamification/powerups/:id/activate"

  studentAssignmentsStore:
    file: "features/assignments/store/studentAssignmentsStore.ts"
    state:
      - assignments
      - currentAssignment
      - submissions
      - deadlines
    actions:
      - fetchAssignments
      - fetchAssignmentDetail
      - submitAssignment
      - saveProgress
    consumers:
      pages: ["AssignmentsPage", "AssignmentDetailPage"]
    api_calls:
      - "GET /assignments/student"
      - "GET /assignments/:id"
      - "POST /assignments/:id/submit"

# ============================================================================
# HOOKS PRINCIPALES
# ============================================================================
hooks:
  # --- Hooks de Autenticación ---
  useAuth:
    file: "features/auth/hooks/useAuth.ts"
    provides:
      - user
      - isAuthenticated
      - login
      - logout
    uses_stores: ["authStore"]
    used_in:
      - DashboardComplete
      - ModuleDetailPage
      - ExercisePage
      - AssignmentsPage
      - AssignmentDetailPage
      - MissionsPage
      - LeaderboardPage
      - ShopPage
      - InventoryPage
      - FriendsPage
      - GuildsPage
      - ProfilePage
      - SettingsPage
      - NotificationsPage

  # --- Hooks de Gamificación ---
  useUserGamification:
    file: "shared/hooks/useUserGamification.ts"
    provides:
      - userStats
      - currentRank
      - mlCoins
      - xpProgress
    uses_stores: ["ranksStore", "economyStore"]
    used_in:
      - DashboardComplete
      - ModuleDetailPage
      - LeaderboardPage
      - MissionsPage
      - InventoryPage
      - FriendsPage
      - GuildsPage
      - ProfilePage
      - EnhancedProfilePage
      - SettingsPage
      - NotificationsPage

  useMissions:
    file: "features/gamification/missions/hooks/useMissions.ts"
    provides:
      - missions
      - activeMission
      - startMission
      - completeMission
    uses_stores: ["missionsStore"]
    used_in:
      - DashboardComplete
      - MissionsPage

  useLeaderboards:
    file: "features/gamification/social/hooks/useLeaderboards.ts"
    provides:
      - leaderboards
      - myPosition
      - fetchLeaderboard
    uses_stores: ["leaderboardsStore", "newLeaderboardsStore"]
    used_in:
      - LeaderboardPage

  # --- Hooks Sociales ---
  useFriends:
    file: "features/gamification/social/hooks/useFriends.ts"
    provides:
      - friends
      - pendingRequests
      - sendRequest
      - acceptRequest
    uses_stores: ["friendsStore"]
    used_in:
      - FriendsPage

  useGuilds:
    file: "features/gamification/social/hooks/useGuilds.ts"
    provides:
      - guilds
      - myGuilds
      - joinGuild
      - leaveGuild
    uses_stores: ["guildsStore"]
    used_in:
      - GuildsPage

  # --- Hooks de Dashboard ---
  useDashboardData:
    file: "apps/student/pages/hooks/useDashboardData.ts"
    provides:
      - stats
      - recentActivity
      - upcomingDeadlines
    uses_stores: []
    used_in:
      - DashboardComplete
      - LeaderboardPage

  useUserModules:
    file: "shared/hooks/useUserModules.ts"
    provides:
      - modules
      - currentModule
      - moduleProgress
    uses_stores: []
    used_in:
      - DashboardComplete

  # --- Hooks de Ejercicios ---
  useExerciseAutoSave:
    file: "apps/student/pages/hooks/useExerciseAutoSave.ts"
    provides:
      - autoSave
      - saveProgress
      - lastSaved
    uses_stores: []
    used_in:
      - ExercisePage

  useExercisePowerUps:
    file: "apps/student/pages/hooks/useExercisePowerUps.ts"
    provides:
      - activePowerUps
      - usePowerUp
    uses_stores: ["powerUpsStore"]
    used_in:
      - ExercisePage

  # --- Hooks de Utilidad ---
  useInvalidateDashboard:
    file: "shared/hooks/useInvalidateDashboard.ts"
    provides:
      - invalidateDashboard
    uses_stores: []
    used_in:
      - ExercisePage
      - MissionsPage

  useUserStatistics:
    file: "shared/hooks/useUserStatistics.ts"
    provides:
      - statistics
      - fetchStatistics
    uses_stores: []
    used_in:
      - ProfilePage

  useUserPreferences:
    file: "shared/hooks/useUserPreferences.ts"
    provides:
      - preferences
      - updatePreferences
    uses_stores: []
    used_in:
      - SettingsPage

  usePushNotifications:
    file: "features/notifications/hooks/usePushNotifications.ts"
    provides:
      - isPushEnabled
      - enablePush
      - disablePush
    uses_stores: ["notificationsStore"]
    used_in:
      - DeviceManagementSection

