# ============================================================================
# IMPLEMENTACION
# ============================================================================

implementation:
  database:
    schemas: [social_features, educational_content, progress_tracking, auth]
    tables:
      - name: classrooms
        schema: social_features
        path: apps/database/ddl/schemas/social_features/tables/classrooms.sql

      - name: classroom_settings
        schema: social_features
        path: apps/database/ddl/schemas/social_features/tables/classroom_settings.sql

      - name: classroom_students
        schema: social_features
        path: apps/database/ddl/schemas/social_features/tables/classroom_students.sql

      - name: groups
        schema: social_features
        path: apps/database/ddl/schemas/social_features/tables/groups.sql

      - name: group_students
        schema: social_features
        path: apps/database/ddl/schemas/social_features/tables/group_students.sql

      - name: classroom_modules
        schema: social_features
        path: apps/database/ddl/schemas/social_features/tables/classroom_modules.sql

      - name: modules
        schema: educational_content
        path: apps/database/ddl/schemas/educational_content/tables/modules.sql

  backend:
    module: teacher
    path: apps/backend/src/teacher/

    entities:
      - name: classroom.entity.ts
        path: apps/backend/src/teacher/entities/classroom.entity.ts
        description: Entity de aula

      - name: classroom-settings.entity.ts
        path: apps/backend/src/teacher/entities/classroom-settings.entity.ts
        description: Entity de configuracion de aula

      - name: group.entity.ts
        path: apps/backend/src/teacher/entities/group.entity.ts
        description: Entity de grupos

    services:
      - name: classroom.service.ts
        path: apps/backend/src/teacher/services/classroom.service.ts
        description: Servicio de gestion de aulas

      - name: teacher.service.ts
        path: apps/backend/src/teacher/services/teacher.service.ts
        description: Servicio general del maestro (dashboard)

      - name: classroom-activity.service.ts
        path: apps/backend/src/teacher/services/classroom-activity.service.ts
        description: Servicio de actividad del aula

      - name: group.service.ts
        path: apps/backend/src/teacher/services/group.service.ts
        description: Servicio de grupos

      - name: module.service.ts
        path: apps/backend/src/teacher/services/module.service.ts
        description: Servicio de modulos (catalogo)

    controllers:
      - name: teacher-classroom.controller.ts
        path: apps/backend/src/teacher/controllers/teacher-classroom.controller.ts
        description: Controlador CRUD de aulas

      - name: teacher-dashboard.controller.ts
        path: apps/backend/src/teacher/controllers/teacher-dashboard.controller.ts
        description: Controlador del dashboard

      - name: classroom-group.controller.ts
        path: apps/backend/src/teacher/controllers/classroom-group.controller.ts
        description: Controlador de grupos

      - name: teacher-module.controller.ts
        path: apps/backend/src/teacher/controllers/teacher-module.controller.ts
        description: Controlador de modulos

    endpoints:
      classrooms:
        - path: /api/teacher/classrooms
          method: POST
          description: Crear aula
          specification: ET-ADM-001

        - path: /api/teacher/classrooms
          method: GET
          description: Listar aulas del profesor
          specification: ET-ADM-001

        - path: /api/teacher/classrooms/:id
          method: GET
          description: Obtener aula especifica
          specification: ET-ADM-001

        - path: /api/teacher/classrooms/:id
          method: PATCH
          description: Actualizar aula
          specification: ET-ADM-001

        - path: /api/teacher/classrooms/:id
          method: DELETE
          description: Eliminar aula
          specification: ET-ADM-001

        - path: /api/teacher/classrooms/:id/settings
          method: GET
          description: Obtener configuracion
          specification: ET-ADM-001

        - path: /api/teacher/classrooms/:id/settings
          method: PATCH
          description: Actualizar configuracion
          specification: ET-ADM-001

      students:
        - path: /api/teacher/classrooms/:id/students
          method: GET
          description: Listar estudiantes del aula
          specification: ET-ADM-002

        - path: /api/teacher/classrooms/:id/students
          method: POST
          description: Agregar estudiante existente
          specification: ET-ADM-002

        - path: /api/teacher/classrooms/:id/students/create
          method: POST
          description: Crear y agregar estudiante
          specification: ET-ADM-002

        - path: /api/teacher/classrooms/:id/students/:studentId
          method: DELETE
          description: Remover estudiante
          specification: ET-ADM-002

      groups:
        - path: /api/teacher/classrooms/:id/groups
          method: GET
          description: Listar grupos del aula
          specification: ET-ADM-002

        - path: /api/teacher/classrooms/:id/groups
          method: POST
          description: Crear grupo
          specification: ET-ADM-002

        - path: /api/teacher/classrooms/:id/groups/:groupId
          method: PATCH
          description: Actualizar grupo
          specification: ET-ADM-002

        - path: /api/teacher/classrooms/:id/groups/:groupId
          method: DELETE
          description: Eliminar grupo
          specification: ET-ADM-002

        - path: /api/teacher/classrooms/:id/groups/:groupId/students
          method: POST
          description: Asignar estudiantes a grupo
          specification: ET-ADM-002

        - path: /api/teacher/classrooms/:id/groups/:groupId/students/:studentId
          method: DELETE
          description: Remover estudiante de grupo
          specification: ET-ADM-002

      dashboard:
        - path: /api/teacher/dashboard
          method: GET
          description: Dashboard general del maestro
          specification: ET-ADM-003

        - path: /api/teacher/classrooms/:id/activity-summary
          method: GET
          description: Actividad del aula
          specification: ET-ADM-003

      modules:
        - path: /api/teacher/modules/catalog
          method: GET
          description: Catalogo de modulos disponibles
          specification: ET-ADM-004

        - path: /api/teacher/classrooms/:id/modules
          method: GET
          description: Modulos asignados al aula
          specification: ET-ADM-004

        - path: /api/teacher/classrooms/:id/modules
          method: POST
          description: Asignar modulo al aula
          specification: ET-ADM-004

        - path: /api/teacher/classrooms/:id/modules/:moduleId
          method: DELETE
          description: Remover modulo del aula
          specification: ET-ADM-004

        - path: /api/teacher/classrooms/:id/modules/:moduleId/stats
          method: GET
          description: Stats del modulo en aula
          specification: ET-ADM-004

  frontend:
    features: [teacher/dashboard, teacher/classrooms, teacher/modules]

    pages:
      - name: TeacherDashboard
        path: apps/frontend/src/pages/teacher/TeacherDashboard.tsx
        specification: ET-ADM-003

      - name: ClassroomListView
        path: apps/frontend/src/pages/teacher/classrooms/ClassroomListView.tsx
        specification: ET-ADM-001

      - name: ClassroomForm
        path: apps/frontend/src/pages/teacher/classrooms/ClassroomForm.tsx
        specification: ET-ADM-001

      - name: ClassroomSettingsView
        path: apps/frontend/src/pages/teacher/classroom/ClassroomSettingsView.tsx
        specification: ET-ADM-001

      - name: ClassroomStudentsView
        path: apps/frontend/src/pages/teacher/classroom/ClassroomStudentsView.tsx
        specification: ET-ADM-002

      - name: ClassroomGroupsView
        path: apps/frontend/src/pages/teacher/classroom/ClassroomGroupsView.tsx
        specification: ET-ADM-002

      - name: ClassroomActivityView
        path: apps/frontend/src/pages/teacher/classroom/ClassroomActivityView.tsx
        specification: ET-ADM-003

      - name: AssignedModulesView
        path: apps/frontend/src/pages/teacher/classroom/AssignedModulesView.tsx
        specification: ET-ADM-004

      - name: ModuleCatalogView
        path: apps/frontend/src/pages/teacher/classroom/ModuleCatalogView.tsx
        specification: ET-ADM-004

    hooks:
      - name: useTeacherDashboard
        path: apps/frontend/src/hooks/teacher/useTeacherDashboard.ts
        specification: ET-ADM-003

      - name: useClassroomActivity
        path: apps/frontend/src/hooks/teacher/useClassroomActivity.ts
        specification: ET-ADM-003

      - name: useModuleCatalog
        path: apps/frontend/src/hooks/teacher/useModuleCatalog.ts
        specification: ET-ADM-004

      - name: useAssignedModules
        path: apps/frontend/src/hooks/teacher/useAssignedModules.ts
        specification: ET-ADM-004

    routes:
      - /teacher/dashboard
      - /teacher/classrooms
      - /teacher/classrooms/new
      - /teacher/classrooms/:id/edit
      - /teacher/classroom/:classroomId/settings
      - /teacher/classroom/:classroomId/students
      - /teacher/classroom/:classroomId/groups
      - /teacher/classroom/:classroomId/activity
      - /teacher/classroom/:classroomId/modules
      - /teacher/classroom/:classroomId/modules/catalog

