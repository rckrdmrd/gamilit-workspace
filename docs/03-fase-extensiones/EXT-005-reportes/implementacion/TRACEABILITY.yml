# TRACEABILITY.yml - EXT-005: Reportes

epic_code: EXT-005
epic_name: Reportería Avanzada
phase: 3
budget_mxn: 12000
story_points: 50
status: completed

implementation:
  database:
    tables:
      - name: reports_templates
        type: new
        description: Templates de reportes custom

      - name: report_schedules
        type: new
        description: Reportes programados

    views:
      - student_progress_summary (materialized)
      - classroom_engagement_metrics (materialized)
      - achievement_distribution (regular)

  backend:
    module: reports
    services:
      - report-builder.service.ts
      - report-export.service.ts (PDF, CSV, XLSX)
      - report-scheduler.service.ts
      - chart-data.service.ts

    endpoints:
      - GET /api/v1/reports/templates
      - POST /api/v1/reports/generate
      - POST /api/v1/reports/export/:format
      - POST /api/v1/reports/schedule

  frontend:
    components:
      - ReportBuilder.tsx
      - ReportTemplates.tsx
      - ChartRenderer.tsx
      - ExportPanel.tsx
      - SchedulerConfig.tsx

metrics:
  avg_generation_time_seconds: 3.5
  export_success_rate: 98%

status:
  completion: 100%
  completion_date: "2024-11-15"
