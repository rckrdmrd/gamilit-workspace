    components:
      - apps/frontend/src/features/mechanics/components/MediaViewer.tsx
      # FIX GAP-CRIT-002: El componente existe como RankProgressWidget
      - apps/frontend/src/apps/student/components/dashboard/RankProgressWidget.tsx
      - apps/frontend/src/apps/teacher/components/dashboard/GradeSubmissionModal.tsx
    constants:
      - apps/frontend/src/apps/teacher/constants/manualReviewExercises.ts  # 13 ejercicios manuales
    stores:
      - apps/frontend/src/stores/exerciseStore.ts

