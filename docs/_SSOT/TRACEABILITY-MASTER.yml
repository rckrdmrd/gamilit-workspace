# =============================================================================
# CADENAS DE TRAZABILIDAD PRINCIPALES
# =============================================================================

traceability_chains:
  authentication:
    requirement: RF-AUTH-001
    specification: ET-AUTH-001
    epic: EAI-001
    implementation:
      database:
        schema: auth_management
        tables: [users, roles, permissions, user_roles]
      backend:
        module: auth
        entities: [User, Role, Permission]
      frontend:
        feature: auth
        components: [LoginForm, RegisterForm, AuthProvider]
    status: implemented

  gamification:
    requirement: RF-GAM-001
    specification: ET-GAM-001
    epic: EAI-003
    implementation:
      database:
        schema: gamification_system
        tables: [achievements, user_achievements, maya_ranks, comodines]
      backend:
        module: gamification
        entities: [Achievement, UserAchievement, MayaRank]
      frontend:
        feature: student/gamification
        components: [AchievementCard, RankBadge, ComodinButton]
    status: implemented

  activities:
    requirement: RF-ACT-001
    specification: ET-ACT-001
    epic: EAI-002
    implementation:
      database:
        schema: educational_content
        tables: [activities, activity_types, activity_attempts]
      backend:
        module: activities
        entities: [Activity, ActivityType, ActivityAttempt]
      frontend:
        feature: student/activities
        components: [ActivityCard, ExerciseRenderer, ProgressBar]
    status: implemented

  teacher_portal:
    requirement: RF-TCH-001
    specification: ET-TCH-001
    epic: EXT-001
    implementation:
      database:
        schema: teacher_portal
        tables: [teacher_assignments, class_progress]
      backend:
        module: teacher
        entities: [TeacherAssignment, ClassProgress]
      frontend:
        feature: teacher
        components: [TeacherDashboard, ClassView, AssignmentManager]
    status: implemented

