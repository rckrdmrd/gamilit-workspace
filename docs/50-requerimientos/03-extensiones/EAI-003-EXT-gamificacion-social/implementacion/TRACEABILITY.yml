        status: planned

      - name: AddFriendModal.tsx
        path: apps/frontend/src/features/gamification/social/components/AddFriendModal.tsx
        rf: RF-SOC-001
        status: planned

      - name: FriendLeaderboard.tsx
        path: apps/frontend/src/features/gamification/social/components/FriendLeaderboard.tsx
        rf: RF-SOC-001
        status: planned

      - name: MultiplierBadge.tsx
        path: apps/frontend/src/features/gamification/social/components/MultiplierBadge.tsx
        rf: RF-SOC-001
        status: planned

      # Sistema de Gremios
      - name: GuildCard.tsx
        path: apps/frontend/src/features/gamification/social/components/GuildCard.tsx
        rf: RF-SOC-002
        status: planned

      - name: GuildSearchList.tsx
        path: apps/frontend/src/features/gamification/social/components/GuildSearchList.tsx
        rf: RF-SOC-002
        status: planned

      - name: CreateGuildModal.tsx
        path: apps/frontend/src/features/gamification/social/components/CreateGuildModal.tsx
