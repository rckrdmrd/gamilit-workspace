# ============================================================================
# IMPLEMENTACION - BASE DE DATOS
# ============================================================================

implementation:
  database:
    schemas:
      - name: analytics
        path: apps/database/ddl/schemas/analytics/
        description: Schema para logs de actividad y analytics

      - name: progress_tracking
        path: apps/database/ddl/schemas/progress_tracking/
        description: Schema para tracking de progreso

    tables:
      - name: activity_logs
        schema: analytics
        file: apps/database/ddl/schemas/analytics/tables/activity_logs.sql
        description: Registro de todas las actividades de estudiantes
        rf: RF-ANA-002
        columns:
          - id (UUID PK)
          - type (VARCHAR)
          - student_id (UUID FK)
          - classroom_id (UUID FK)
          - module_id (UUID FK nullable)
          - activity_id (UUID FK nullable)
          - timestamp (TIMESTAMPTZ)
          - metadata (JSONB)
          - created_at (TIMESTAMPTZ)

      - name: module_progress
        schema: progress_tracking
        file: apps/database/ddl/schemas/progress_tracking/tables/module_progress.sql
        description: Progreso de estudiantes por modulo
        rf: RF-ANA-001

    indexes:
      - name: idx_activity_logs_classroom_timestamp
        table: activity_logs
        columns: [classroom_id, timestamp DESC]
        description: Index para consultas del timeline por clase
        rf: RF-ANA-002

      - name: idx_activity_logs_student_id
        table: activity_logs
        columns: [student_id]
        description: Index para consultas por estudiante
        rf: RF-ANA-002

# ============================================================================
# IMPLEMENTACION - BACKEND
# ============================================================================

  backend:
    module: teacher-analytics
    path: apps/backend/src/modules/teacher-analytics/
    rf: [RF-ANA-001, RF-ANA-002, RF-ANA-003]

    services:
      - name: teacher-analytics.service.ts
        path: apps/backend/src/modules/teacher-analytics/services/teacher-analytics.service.ts
        description: Logica de dashboards y vistas de progreso
        rf: RF-ANA-001
        methods:
          - getClassroomDashboard()
          - getClassroomStudents()
          - getStudentProfile()

      - name: activity-feed.service.ts
        path: apps/backend/src/modules/teacher-analytics/services/activity-feed.service.ts
        description: Logica del timeline de actividades
        rf: RF-ANA-002
        methods:
          - getActivityFeed()
          - getActivityStats()

      - name: at-risk.service.ts
        path: apps/backend/src/modules/teacher-analytics/services/at-risk.service.ts
        description: Logica de identificacion de estudiantes en riesgo
        rf: RF-ANA-002
        methods:
          - getAtRiskStudents()
          - analyzeStudentRisk()
          - calculateRiskLevel()

      - name: progress-report.service.ts
        path: apps/backend/src/modules/teacher-analytics/services/progress-report.service.ts
        description: Logica de reportes de progreso
        rf: RF-ANA-003
        methods:
          - getProgressReport()
          - calculateModuleProgressStats()

      - name: csv-export.service.ts
        path: apps/backend/src/modules/teacher-analytics/services/csv-export.service.ts
        description: Generacion de archivos CSV
        rf: RF-ANA-003
        methods:
          - exportProgressReportCSV()
          - generateCSV()

    controllers:
      - name: teacher-analytics.controller.ts
        path: apps/backend/src/modules/teacher-analytics/controllers/teacher-analytics.controller.ts
        description: Endpoints de analytics para profesores
        rf: [RF-ANA-001, RF-ANA-002, RF-ANA-003]
        endpoints:
          - "GET /api/teacher/classroom/:id/dashboard"
          - "GET /api/teacher/classroom/:id/students"
          - "GET /api/teacher/student/:id/profile"
          - "GET /api/teacher/classroom/:id/activity-feed"
          - "GET /api/teacher/classroom/:id/at-risk-students"
          - "GET /api/teacher/classroom/:id/progress-report"
          - "GET /api/teacher/classroom/:id/progress-report/export"

    dtos:
      - name: student-list-query.dto.ts
        path: apps/backend/src/modules/teacher-analytics/dto/student-list-query.dto.ts
        rf: RF-ANA-001

      - name: activity-feed-query.dto.ts
        path: apps/backend/src/modules/teacher-analytics/dto/activity-feed-query.dto.ts
        rf: RF-ANA-002

      - name: at-risk-query.dto.ts
        path: apps/backend/src/modules/teacher-analytics/dto/at-risk-query.dto.ts
        rf: RF-ANA-002

      - name: progress-report.dto.ts
        path: apps/backend/src/modules/teacher-analytics/dto/progress-report.dto.ts
        rf: RF-ANA-003

# ============================================================================
# IMPLEMENTACION - FRONTEND
# ============================================================================

  frontend:
    feature: teacher/analytics
    path: apps/frontend/src/features/teacher/analytics/
    rf: [RF-ANA-001, RF-ANA-002, RF-ANA-003]

    components:
      # Dashboard Components (RF-ANA-001)
      - name: ClassroomDashboard.tsx
        description: Dashboard principal de clase
        rf: RF-ANA-001

      - name: MetricsCards.tsx
        description: Cards de metricas generales
        rf: RF-ANA-001

      - name: StudentListTable.tsx
        description: Tabla de estudiantes con metricas
        rf: RF-ANA-001

      - name: StudentProfileView.tsx
        description: Vista individual de estudiante
        rf: RF-ANA-001

      # Activity Feed Components (RF-ANA-002)
      - name: ActivityFeedView.tsx
        description: Vista de timeline de actividades
        rf: RF-ANA-002

      - name: AtRiskStudentsView.tsx
        description: Vista de estudiantes en riesgo
        rf: RF-ANA-002

      - name: StudentRiskCard.tsx
        description: Card de estudiante con indicador de riesgo
        rf: RF-ANA-002

      # Report Components (RF-ANA-003)
      - name: ProgressReportView.tsx
        description: Vista principal de reportes
        rf: RF-ANA-003

      - name: ModuleProgressTable.tsx
        description: Tabla de progreso por modulo
        rf: RF-ANA-003

      - name: ExportButton.tsx
        description: Boton de exportacion a CSV
        rf: RF-ANA-003

    hooks:
      - name: useClassroomDashboard.ts
        description: Hook para datos del dashboard
        rf: RF-ANA-001
        technology: React Query

      - name: useActivityFeed.ts
        description: Hook para timeline de actividades
        rf: RF-ANA-002
        technology: React Query

      - name: useAtRiskStudents.ts
        description: Hook para estudiantes en riesgo
        rf: RF-ANA-002
        technology: React Query

      - name: useProgressReport.ts
        description: Hook para reportes de progreso
        rf: RF-ANA-003
        technology: React Query

