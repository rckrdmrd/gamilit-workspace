        file: apps/backend/src/modules/gamification/entities/notification.entity.ts
        relations_removed: 1
        fields_affected: [user_id]

  migration_guide:
    when_to_apply: "Cuando una entidad necesita referenciar otra entidad en diferente schema"

    steps:
      1: "Comentar decoradores @ManyToOne/@OneToMany/@OneToOne"
      2: "Mantener solo @Column({ type: 'uuid' }) para el foreign key"
      3: "Agregar comentario explicativo sobre la limitación TypeORM"
      4: "Modificar service para hacer join manual cuando se necesite la relación"
      5: "Actualizar tests si es necesario"

    example_service: |
      // Service haciendo join manual entre progress y auth
      async getTeacherNoteWithRelations(noteId: string) {
        const note = await this.progressDataSource
          .getRepository(TeacherNote)
          .findOne({ where: { id: noteId } });

        if (!note) return null;

        // Join manual con teacher (auth schema)
        const teacher = await this.authDataSource
          .getRepository(User)
          .findOne({ where: { id: note.teacher_id } });

        return { ...note, teacher };
      }

