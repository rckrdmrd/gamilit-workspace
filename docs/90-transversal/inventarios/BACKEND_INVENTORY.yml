# ============================================================================
# ARQUITECTURA MULTI-DATASOURCE (TypeORM)
# ============================================================================
# CORRECCIONES APLICADAS: 2025-11-09
# 17 entidades corregidas - Relaciones cross-schema comentadas

multi_datasource_architecture:
  description: |
    TypeORM no soporta relaciones (@ManyToOne, @OneToMany, @OneToOne) entre
    entidades que pertenecen a diferentes data sources (schemas en PostgreSQL).

    Backend usa 6 conexiones TypeORM separadas:
    - 'auth' → schemas: auth, auth_management
    - 'educational' → schema: educational_content
    - 'progress' → schema: progress_tracking
    - 'social' → schema: social_features
    - 'gamification' → schema: gamification_system
    - 'content' → schema: content_management

  datasources:
    - name: auth
      schemas: [auth, auth_management]
      entities: 10
      file: apps/backend/src/shared/database/data-source-auth.ts

    - name: educational
      schemas: [educational_content]
      entities: 4
      file: apps/backend/src/shared/database/data-source-educational.ts

    - name: progress
      schemas: [progress_tracking]
      entities: 5
      file: apps/backend/src/shared/database/data-source-progress.ts

    - name: social
      schemas: [social_features]
      entities: 7
      file: apps/backend/src/shared/database/data-source-social.ts

    - name: gamification
      schemas: [gamification_system]
      entities: 11
      file: apps/backend/src/shared/database/data-source-gamification.ts

    - name: content
      schemas: [content_management]
      entities: 3
      file: apps/backend/src/shared/database/data-source-content.ts

  cross_database_pattern:
    limitation: "TypeORM NO soporta @ManyToOne/@OneToMany entre diferentes data sources"

    solution: |
      Usar UUID foreign keys sin decoradores de relación TypeORM.
      Hacer joins manuales en los services cuando sea necesario.

    example_before: |
      // ❌ NO FUNCIONA - Cruza data sources (progress → auth)
      @ManyToOne(() => User, { onDelete: 'CASCADE' })
      @JoinColumn({ name: 'teacher_id' })
      teacher?: User;

    example_after: |
      // ✅ CORRECTO - Solo UUID, join manual en service
      @Column({ type: 'uuid' })
      teacher_id!: string;

      // En el service:
      const teacher = await this.authDataSource
        .getRepository(User)
        .findOne({ where: { id: note.teacher_id } });

  entities_corrected_2025_11_09:
    total: 17

    progress_module:
      - entity: TeacherNote
        file: apps/backend/src/modules/progress/entities/teacher-note.entity.ts
        relations_removed: 2
        fields_affected: [teacher_id, student_id]

      - entity: ExerciseSubmission
        file: apps/backend/src/modules/progress/entities/exercise-submission.entity.ts
        relations_removed: 1
        fields_affected: [student_id]

      - entity: ExerciseAttempt
        file: apps/backend/src/modules/progress/entities/exercise-attempt.entity.ts
        relations_removed: 1
        fields_affected: [student_id]

      - entity: LearningSession
        file: apps/backend/src/modules/progress/entities/learning-session.entity.ts
        relations_removed: 1
        fields_affected: [student_id]

      - entity: ModuleProgress
        file: apps/backend/src/modules/progress/entities/module-progress.entity.ts
        relations_removed: 1
        fields_affected: [student_id]

    assignments_module:
      - entity: Assignment
        file: apps/backend/src/modules/assignments/entities/assignment.entity.ts
        relations_removed: 2
        fields_affected: [created_by, tenant_id]

      - entity: AssignmentClassroom
        file: apps/backend/src/modules/assignments/entities/assignment-classroom.entity.ts
        relations_removed: 2
        fields_affected: [assignment_id, classroom_id]

      - entity: AssignmentSubmission
        file: apps/backend/src/modules/assignments/entities/assignment-submission.entity.ts
        relations_removed: 2
        fields_affected: [assignment_id, student_id]

    content_module:
      - entity: ContentTemplate
        file: apps/backend/src/modules/content/entities/content-template.entity.ts
        relations_removed: 1
        fields_affected: [created_by]

      - entity: MarieCurieContent
        file: apps/backend/src/modules/content/entities/marie-curie-content.entity.ts
        relations_removed: 1
