# =============================================================================
# GAMILIT Database - PostgreSQL StatefulSet
# =============================================================================
# Purpose: Deploys PostgreSQL as a StatefulSet with persistent storage
# NOTE: For production, consider using managed database (AWS RDS, GCP Cloud SQL)
# This is for self-hosted Kubernetes deployment
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: gamilit-postgres
  namespace: gamilit-production
  labels:
    app: gamilit
    component: database
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: gamilit
    component: database
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gamilit-postgres
  namespace: gamilit-production
  labels:
    app: gamilit
    component: database
spec:
  serviceName: gamilit-postgres
  replicas: 1
  selector:
    matchLabels:
      app: gamilit
      component: database

  template:
    metadata:
      labels:
        app: gamilit
        component: database

    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgresql
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: "gamilit_platform"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: gamilit-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gamilit-db-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "standard"  # Adjust based on your cluster
        resources:
          requests:
            storage: 100Gi
