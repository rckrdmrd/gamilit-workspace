    - "Documentar ADRs y estándares"
    - "Expandir quick references"
    
  amenazas:
    - "Deuda técnica acumulada por falta de tests"
    - "Riesgo de regresión en funcionalidades críticas"
    - "Dificultad para onboarding sin tests como documentación"
    
