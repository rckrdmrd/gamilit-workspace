##############################################################################
# GAMILIT Platform - Nginx Production Configuration
#
# Server: 74.208.126.102
# Created: 2026-02-21 (ALT-10)
#
# Architecture:
#   Client -> Nginx (443/HTTPS) -> Backend (3006) + Frontend (3005)
#   SSL terminated at Nginx via Certbot/Let's Encrypt
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/gamilit.conf
#   2. ln -s /etc/nginx/sites-available/gamilit.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   - Certbot SSL certificates at /etc/letsencrypt/live/gamilit.isem.edu.mx/
#   - Backend running on port 3006 (PM2)
#   - Frontend running on port 3005 (PM2)
#   - Or replace domain with IP if no DNS is configured
#
##############################################################################

# ============================================================================
# Rate limiting zones (placed in http context or before server blocks)
# If using includes, add this to nginx.conf http{} block:
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
#   limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
# ============================================================================

# ============================================================================
# HTTP -> HTTPS redirect
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name 74.208.126.102;

    # Allow ACME challenge for Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# HTTPS — Main server block
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 74.208.126.102;

    # ------------------------------------------------------------------
    # SSL Configuration (Certbot / Let's Encrypt)
    # ------------------------------------------------------------------
    # NOTE: If using IP-only (no domain), replace paths with self-signed certs:
    #   ssl_certificate /etc/ssl/certs/gamilit-selfsigned.crt;
    #   ssl_certificate_key /etc/ssl/private/gamilit-selfsigned.key;
    ssl_certificate     /etc/letsencrypt/live/gamilit.isem.edu.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gamilit.isem.edu.mx/privkey.pem;

    # SSL hardening (Mozilla Intermediate profile)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/gamilit.isem.edu.mx/chain.pem;

    # SSL session caching
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ------------------------------------------------------------------
    # Security Headers
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy — adjust connect-src for your API domain
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss://74.208.126.102 https://74.208.126.102; frame-ancestors 'self';" always;

    # ------------------------------------------------------------------
    # Gzip Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # ------------------------------------------------------------------
    # Request size limits
    # ------------------------------------------------------------------
    client_max_body_size 50m;

    # ------------------------------------------------------------------
    # Backend API: /api/ -> localhost:3006
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (generous for long-running report endpoints)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 64k;

        # Rate limiting (uncomment after adding zone to nginx.conf http block)
        # limit_req zone=api burst=50 nodelay;
    }

    # Auth endpoints — stricter rate limiting
    location /api/v1/auth/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Rate limiting (uncomment after adding zone to nginx.conf http block)
        # limit_req zone=auth burst=10 nodelay;
    }

    # ------------------------------------------------------------------
    # WebSocket: /socket.io/ -> localhost:3006
    # ------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;

        # WebSocket upgrade headers (required)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific timeouts (longer for persistent connections)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Disable buffering for real-time
        proxy_buffering off;
        proxy_cache off;
    }

    # ------------------------------------------------------------------
    # Frontend static assets (JS, CSS, images, fonts)
    # Served from frontend build output via PM2 serve on port 3005
    # ------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aggressive caching for immutable hashed assets
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Gzip for static assets
        gzip_static on;
    }

    # ------------------------------------------------------------------
    # Frontend SPA: everything else -> localhost:3005
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # No caching for HTML (SPA entry point must always be fresh)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ------------------------------------------------------------------
    # Deny access to hidden files and sensitive paths
    # ------------------------------------------------------------------
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ /\.env {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------
    # Health check endpoint (for monitoring/load balancer)
    # ------------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------------------------------
    # Access & Error Logs
    # ------------------------------------------------------------------
    access_log /var/log/nginx/gamilit-access.log;
    error_log  /var/log/nginx/gamilit-error.log warn;
}
