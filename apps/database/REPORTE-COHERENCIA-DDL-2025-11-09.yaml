# ============================================================================
# 7. RECOMENDACIONES
# ============================================================================

recomendaciones:

  prioridad_critica:

    - id: REC-01
      titulo: "Crear archivos _MAP.md para todos los schemas"
      impacto: "CRÍTICO"
      esfuerzo: "ALTO"
      descripcion: "Actualmente 0% de schemas tienen documentación _MAP.md"
      accion: "Crear _MAP.md en cada schema con:"
      contenido_minimo:
        - "Propósito del schema"
        - "Lista de tablas con descripción"
        - "Lista de funciones principales"
        - "Dependencias con otros schemas"
        - "Ejemplos de uso común"
      priorizar:
        - gamification_system
        - educational_content
        - auth_management
        - social_features
        - progress_tracking

  prioridad_alta:

    - id: REC-02
      titulo: "Numerar archivos sin numeración en tables/"
      impacto: "ALTO"
      esfuerzo: "MEDIO"
      descripcion: "30 archivos de tables sin numeración estándar"
      accion: "Renombrar archivos para seguir patrón XX-nombre.sql"
      schemas_afectados:
        - educational_content: "11 archivos"
        - progress_tracking: "8 archivos"
        - social_features: "5 archivos"
        - content_management: "3 archivos"
        - system_configuration: "3 archivos"
      beneficio: "Claridad en orden de ejecución y dependencias"

    - id: REC-03
      titulo: "Corregir gaps en numeración"
      impacto: "MEDIO"
      esfuerzo: "BAJO"
      descripcion: "Gaps en auth_management (falta 13) y social_features (faltan 08-10)"
      accion: "Renumerar archivos para secuencia continua"
      archivos_afectados: 6
      beneficio: "Consistencia y profesionalismo"

    - id: REC-04
      titulo: "Eliminar carpetas vacías"
      impacto: "MEDIO"
      esfuerzo: "BAJO"
      descripcion: "9 carpetas vacías detectadas"
      accion: "Eliminar carpetas sin contenido ni propósito"
      carpetas:
        - auth/functions
        - public/tables
        - public/functions
        - public/indexes
        - public/enums/_deprecated
        - social_features/indexes
        - system_configuration/indexes
        - auth_management/validaciones
      excepcion: "Mantener lti_integration/* (en desarrollo)"

  prioridad_media:

    - id: REC-05
      titulo: "Revisar estrategia de numeración de triggers"
      impacto: "MEDIO"
      esfuerzo: "ALTO"
      descripcion: "Numeración global compartida entre schemas (01-30)"
      problema: "Dificulta añadir triggers nuevos en schemas intermedios"
      opciones:
        opcion_a:
          descripcion: "Mantener numeración global"
          pros: ["Secuencia única clara"]
          contras: ["Difícil mantener", "Gaps al añadir nuevos"]
        opcion_b:
          descripcion: "Cambiar a numeración por schema"
          pros: ["Más mantenible", "Cada schema independiente"]
          contras: ["Requiere renombrar todos los triggers"]
      recomendacion: "OPCIÓN B - Numerar por schema reiniciando en 01"

    - id: REC-06
      titulo: "Añadir tests para funciones críticas"
      impacto: "MEDIO"
      esfuerzo: "ALTO"
      descripcion: "Solo gamification_system/functions/tests/ existe"
      accion: "Crear carpeta tests/ en schemas con funciones complejas"
      schemas_prioritarios:
        - gamilit (14 funciones helper)
        - gamification_system (21 funciones)
        - auth_management (6 funciones)
        - progress_tracking (6 funciones)
      beneficio: "Validación automática, prevención de regresiones"

    - id: REC-07
      titulo: "Poblar o eliminar carpetas indexes vacías"
      impacto: "BAJO"
      esfuerzo: "MEDIO"
      descripcion: "social_features y system_configuration tienen indexes/ vacío"
      accion: "Revisar si necesitan índices, si no eliminar carpeta"
      considerar: "Índices importantes para performance en queries comunes"

  prioridad_baja:

    - id: REC-08
      titulo: "Consolidar documentación en carpeta _deprecated"
      impacto: "BAJO"
      esfuerzo: "BAJO"
      descripcion: "public/enums/_deprecated está vacío"
      accion: "Eliminar carpeta o documentar por qué existe"

    - id: REC-09
      titulo: "Considerar subdivisión de gamification_system"
      impacto: "BAJO"
      esfuerzo: "MUY ALTO"
      descripcion: "87 objetos hacen schema muy grande"
      precaucion: "NO urgente, estructura actual funciona bien"
      considerar_si: "Schema crece más de 120 objetos"
      posibles_divisiones:
        - gamification_achievements
        - gamification_economy
        - gamification_leaderboards

