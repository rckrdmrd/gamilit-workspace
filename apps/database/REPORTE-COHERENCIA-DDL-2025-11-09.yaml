    - "Estructura de schemas bien organizada por dominio"
    - "Separación clara de responsabilidades"
    - "Balance apropiado en tamaño de schemas"
    - "100% de archivos SQL con headers descriptivos"
    - "Convenciones de nombres mayormente correctas"
    - "Triggers y functions bien nombrados"
    - "Enums correctamente organizados"
    - "Carpetas _deprecated documentadas"

  debilidades:
    - "0% de schemas tienen _MAP.md (documentación crítica faltante)"
    - "30 archivos de tables sin numeración (27% del total)"
    - "9 carpetas vacías sin propósito claro"
    - "Gaps en numeración (auth_management, social_features)"
    - "Numeración global de triggers poco mantenible"
    - "Falta de tests para funciones"

  riesgos:
    - nivel: BAJO
      descripcion: "Falta de _MAP.md dificulta onboarding de nuevos desarrolladores"
      mitigacion: "Crear documentación incremental priorizando schemas core"

    - nivel: BAJO
      descripcion: "Archivos sin numerar pueden causar confusión en orden de ejecución"
      mitigacion: "Numerar archivos siguiendo dependencias de FK"

    - nivel: MUY_BAJO
      descripcion: "Carpetas vacías generan noise"
      mitigacion: "Limpieza rápida en próximo sprint"

