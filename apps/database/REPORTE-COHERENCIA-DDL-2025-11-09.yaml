---
# ============================================================================
# REPORTE DE COHERENCIA ESTRUCTURA DDL
# ============================================================================
# Fecha: 2025-11-09
# Ubicación: /apps/database/ddl/schemas/
# Objetivo: Validar consistencia, organización y best practices post-reorganización
# ============================================================================

coherencia_estructura:
  schemas_analizados: 14
  archivos_sql_totales: 310
  fecha_analisis: "2025-11-09"

  # --------------------------------------------------------------------------
  # 1. ESTRUCTURA DE CARPETAS POR SCHEMA
  # --------------------------------------------------------------------------

  estructura_carpetas:

    schemas_completos:
      - schema: audit_logging
        carpetas: [tables, functions, triggers, indexes, enums, rls-policies]
        estado: "COMPLETO"

      - schema: auth_management
        carpetas: [tables, functions, triggers, indexes, rls-policies]
        estado: "COMPLETO (tiene carpeta validaciones vacía)"

      - schema: content_management
        carpetas: [tables, triggers, indexes, enums, rls-policies]
        estado: "COMPLETO"

      - schema: educational_content
        carpetas: [tables, functions, triggers, indexes, enums, rls-policies]
        estado: "COMPLETO"

      - schema: gamification_system
        carpetas: [tables, functions, triggers, indexes, enums, rls-policies, views, materialized-views]
        estado: "COMPLETO (más complejo)"

      - schema: progress_tracking
        carpetas: [tables, functions, triggers, indexes, enums, rls-policies, views]
        estado: "COMPLETO"

      - schema: social_features
        carpetas: [tables, functions, triggers, enums, rls-policies]
        estado: "COMPLETO (indexes vacío)"

      - schema: system_configuration
        carpetas: [tables, functions, triggers, rls-policies]
        estado: "COMPLETO (indexes vacío)"

    schemas_minimalistas:
      - schema: admin_dashboard
        carpetas: [views]
        razon: "Solo vistas administrativas"
        estado: "APROPIADO"

      - schema: auth
        carpetas: [tables, enums]
        razon: "Schema de Supabase Auth (no modificable)"
        estado: "APROPIADO"

      - schema: gamilit
        carpetas: [functions]
        razon: "Solo funciones helper globales"
        estado: "APROPIADO"

      - schema: storage
        carpetas: [enums]
        razon: "Schema de Supabase Storage"
        estado: "APROPIADO"

      - schema: lti_integration
        carpetas: [tables, functions, triggers]
        razon: "Funcionalidad nueva (EXT-007), en desarrollo"
        estado: "EN DESARROLLO"

    schemas_sin_estructura_estandar:
      - schema: public
        carpetas: [tables, functions, indexes, enums, views]
        problema: "Carpetas presentes pero TODAS VACÍAS"
        estado: "NECESITA LIMPIEZA"
        accion: "Eliminar carpetas vacías o poblar con contenido"

    carpetas_vacias_detectadas:
      - ubicacion: "auth/functions"
        accion: "ELIMINAR"

      - ubicacion: "lti_integration/functions"
        accion: "MANTENER (schema en desarrollo)"

      - ubicacion: "lti_integration/triggers"
        accion: "MANTENER (schema en desarrollo)"

      - ubicacion: "public/tables"
        accion: "ELIMINAR"

      - ubicacion: "public/functions"
        accion: "ELIMINAR"

      - ubicacion: "public/indexes"
        accion: "ELIMINAR"

      - ubicacion: "public/enums"
        accion: "REVISAR (_deprecated existe pero vacío)"

      - ubicacion: "social_features/indexes"
        accion: "ELIMINAR o POBLAR"

      - ubicacion: "system_configuration/indexes"
        accion: "ELIMINAR o POBLAR"

      - ubicacion: "auth_management/validaciones"
        accion: "ELIMINAR (vacía, sin uso claro)"

    carpetas_deprecated:
      - ubicacion: "progress_tracking/functions/_deprecated"
        archivos: 1
        estado: "OK (documentado con README)"

      - ubicacion: "public/enums/_deprecated"
        archivos: 0
        estado: "VACÍO - ELIMINAR"

  # --------------------------------------------------------------------------
  # 2. NUMERACIÓN DE ARCHIVOS
  # --------------------------------------------------------------------------

  numeracion:

    schemas_con_numeracion_correcta:
      - audit_logging:
          tables: "01-06 (secuencial completo)"
          triggers: "01 (solo uno)"

      - gamification_system:
          tables: "01-15 (secuencial completo)"
          triggers: "01-02, 15-20 (numeración global compartida)"

      - lti_integration:
          tables: "01-03 (secuencial completo)"
          triggers: "No hay aún"

    problemas_numeracion:

      - schema: auth_management
        tipo: "SALTO EN NUMERACIÓN"
        detalle: "tables tiene 01-12, luego salta a 14-16"
        gap: "Falta 13"
        impacto: "MENOR"
        accion: "Renumerar 14→13, 15→14, 16→15"
        archivos_afectados:
          - "14-parent_accounts.sql → 13-parent_accounts.sql"
          - "15-parent_student_links.sql → 14-parent_student_links.sql"
          - "16-parent_notifications.sql → 15-parent_notifications.sql"

      - schema: social_features
        tipo: "SALTOS EN NUMERACIÓN"
        detalle: "tables tiene 01-07, luego salta a 11-13"
        gap: "Faltan 08, 09, 10"
        impacto: "MENOR"
        accion: "Renumerar 11→08, 12→09, 13→10"
        archivos_afectados:
          - "11-peer_challenges.sql → 08-peer_challenges.sql"
          - "12-challenge_participants.sql → 09-challenge_participants.sql"
          - "13-challenge_results.sql → 10-challenge_results.sql"

      - schema: content_management
        tipo: "ARCHIVOS SIN NUMERAR"
        detalle: "Tiene 01-05 numerados, pero 3 sin numerar"
        archivos_sin_numerar: 3
        total_archivos: 8
        impacto: "MEDIO"
        accion: "Numerar archivos: content_authors, content_categories, media_metadata"

      - schema: educational_content
        tipo: "ARCHIVOS SIN NUMERAR"
        detalle: "Tiene 01-04 numerados, pero 11 sin numerar"
        archivos_sin_numerar: 11
        total_archivos: 15
        impacto: "ALTO"
        accion: "Numerar todos los archivos assignment_*, exercise_*, content_*, taxonomies, module_dependencies"

      - schema: progress_tracking
        tipo: "ARCHIVOS SIN NUMERAR"
        detalle: "Tiene 01-05 numerados, pero 8 sin numerar"
        archivos_sin_numerar: 8
        total_archivos: 13
        impacto: "ALTO"
        accion: "Numerar archivos: engagement_metrics, learning_paths, mastery_tracking, etc."

      - schema: social_features
        tipo: "ARCHIVOS SIN NUMERAR (además de gaps)"
        detalle: "Tiene gaps Y archivos sin numerar"
        archivos_sin_numerar: 5
        total_archivos: 15
        impacto: "ALTO"
        accion: "Primero corregir gaps, luego numerar los 5 restantes"

      - schema: system_configuration
        tipo: "ARCHIVOS SIN NUMERAR"
        detalle: "Tiene 01-03 numerados, pero 3 sin numerar"
        archivos_sin_numerar: 3
        total_archivos: 6
        impacto: "MEDIO"
        accion: "Numerar archivos: api_configuration, environment_config, tenant_configurations"

    triggers_numeracion_global:
      estrategia: "NUMERACIÓN GLOBAL COMPARTIDA"
      descripcion: "Los triggers están numerados de 01-30 compartiendo secuencia entre schemas"
      evaluacion: "ACEPTABLE pero NO IDEAL"
      problemas:
        - "auth_management: 02-07 (falta 01)"
        - "content_management: 08-10"
        - "educational_content: 11-14"
        - "gamification_system: 01-02, 15-20 (mezcla con otros schemas)"
        - "progress_tracking: 21-23"
        - "social_features: 24-28"
        - "system_configuration: 29-30"
      alternativa_recomendada: "Numerar por schema (cada schema reinicia en 01)"

