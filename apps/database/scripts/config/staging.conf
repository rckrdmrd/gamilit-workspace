#!/bin/bash
##############################################################################
# GAMILIT Platform - Staging Environment Configuration
# Archivo: staging.conf
# Uso: Cargado automaticamente por scripts cuando --env staging
#
# Creado: 2026-02-21 (ALT-07)
# Basado en: dev.conf + prod.conf (valores intermedios para staging)
##############################################################################

# ============================================================================
# DATABASE CONNECTION
# ============================================================================

# Host y puerto (local — staging runs on same server or separate staging host)
export ENV_DB_HOST="localhost"
export ENV_DB_PORT="5432"

# SSL Configuration (deshabilitado para conexion local en staging)
export ENV_DB_SSL="false"
export ENV_DB_SSL_MODE="disable"

# Connection Type
export ENV_CONNECTION_TYPE="local"  # local | remote
export ENV_VALIDATE_REMOTE="false"

# ============================================================================
# SEEDS CONFIGURATION
# ============================================================================

# Seeds directory — uses staging-specific seeds
export ENV_SEEDS_DIR="seeds/staging"

# Load demo data (limited demo data in staging for QA)
export ENV_LOAD_DEMO_DATA="true"
export ENV_LOAD_DEMO_USERS="true"
export ENV_LOAD_DEMO_EXERCISES="true"
export ENV_LOAD_DEMO_GAMIFICATION="false"
export ENV_FAIL_ON_SEED_ERROR="true"
export ENV_FAIL_ON_MISSING_SEED="false"

# ============================================================================
# VALIDATION
# ============================================================================

# Strict validation (moderately strict in staging — closer to prod)
export ENV_STRICT_VALIDATION="true"
export ENV_ENFORCE_BUSINESS_INVARIANTS="true"
export ENV_ALLOW_MULTI_TENANT="false"

# Skip validations (none skipped — staging should mirror prod behavior)
export ENV_SKIP_RLS_VALIDATION="false"
export ENV_SKIP_TRIGGER_VALIDATION="false"
export ENV_SKIP_INDEX_VALIDATION="false"

# Minimum object counts (same as prod expectations)
export ENV_MIN_SCHEMAS="9"
export ENV_MIN_TABLES="64"
export ENV_MIN_FUNCTIONS="60"
export ENV_MIN_TRIGGERS="50"
export ENV_MIN_RLS_POLICIES="200"
export ENV_MIN_INDEXES="250"

# ============================================================================
# SECURITY
# ============================================================================

# Password requirements (strict — same as prod)
export ENV_REQUIRE_STRONG_PASSWORD="true"
export ENV_MIN_PASSWORD_LENGTH="32"
export ENV_GENERATE_PASSWORD="true"

# Additional security
export ENV_REQUIRE_PASSWORD_CONFIRMATION="false"
export ENV_SAVE_CREDENTIALS_ENCRYPTED="false"

# ============================================================================
# PERFORMANCE
# ============================================================================

# Parallel execution
export ENV_PARALLEL_INDEXES="true"
export ENV_PARALLEL_SEEDS="false"

# Timeouts (moderate — between dev and prod)
export ENV_DDL_TIMEOUT="600"       # 10 minutos
export ENV_SEED_TIMEOUT="1200"     # 20 minutos

# ============================================================================
# LOGGING
# ============================================================================

# Log level: info (more verbose than prod, less than dev)
export ENV_LOG_LEVEL="info"

# Log file
export ENV_LOG_FILE="logs/init-staging-$(date +%Y%m%d-%H%M%S).log"

# Verbose output (enabled for debugging staging issues)
export ENV_VERBOSE="true"

# ============================================================================
# FEATURES
# ============================================================================

# Feature flags for staging (experimental features enabled for testing)
export ENV_ENABLE_EXPERIMENTAL="true"
export ENV_ENABLE_DEBUG_QUERIES="false"
export ENV_ENABLE_QUERY_LOGGING="false"

# ============================================================================
# BACKUP
# ============================================================================

# Create backup before destructive operations (yes — staging has QA data)
export ENV_CREATE_BACKUP_BEFORE_DROP="true"
export ENV_BACKUP_DIR="backups/pre-init-staging"

# ============================================================================
# NOTIFICATIONS
# ============================================================================

# Notifications (placeholder)
export ENV_NOTIFY_ON_SUCCESS="false"
export ENV_NOTIFY_ON_ERROR="false"
export ENV_NOTIFICATION_EMAIL=""

# ============================================================================
# NOTES
# ============================================================================

# Ambiente: Staging
# - Limited demo data (users + exercises, no gamification demo)
# - Validaciones estrictas (mirror prod)
# - Logs at info level for QA debugging
# - Staging seeds include production-style users + QA-specific data
# - Backups enabled before destructive operations
# - Password requirements same as prod (32 chars, strong)
# - No SSL locally (Nginx terminates SSL if applicable)
