<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" preserveAspectRatio="none">
  <!-- Expert Reader Frame - Purple/Gold decorative border -->
  <!-- Outer border -->
  <rect x="4" y="4" width="192" height="192" rx="16" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <!-- Inner border -->
  <rect x="7" y="7" width="186" height="186" rx="12" fill="none" stroke="#D4AF37" stroke-width="1"/>
  <!-- Corner ornaments -->
  <g fill="#8B5CF6">
    <!-- Top-left -->
    <circle cx="10" cy="10" r="3"/>
    <path d="M10 7 L13 10 L10 13 L7 10 Z" fill="#D4AF37"/>
    <!-- Top-right -->
    <circle cx="190" cy="10" r="3"/>
    <path d="M190 7 L193 10 L190 13 L187 10 Z" fill="#D4AF37"/>
    <!-- Bottom-left -->
    <circle cx="10" cy="190" r="3"/>
    <path d="M10 187 L13 190 L10 193 L7 190 Z" fill="#D4AF37"/>
    <!-- Bottom-right -->
    <circle cx="190" cy="190" r="3"/>
    <path d="M190 187 L193 190 L190 193 L187 190 Z" fill="#D4AF37"/>
  </g>
  <!-- Side book motifs -->
  <rect x="5" y="91" width="3" height="18" rx="1" fill="#8B5CF6" opacity="0.6"/>
  <rect x="192" y="91" width="3" height="18" rx="1" fill="#8B5CF6" opacity="0.6"/>
  <rect x="91" y="5" width="18" height="3" rx="1" fill="#8B5CF6" opacity="0.6"/>
  <rect x="91" y="192" width="18" height="3" rx="1" fill="#8B5CF6" opacity="0.6"/>
</svg>
