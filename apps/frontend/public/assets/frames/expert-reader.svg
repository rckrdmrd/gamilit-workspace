<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Expert Reader Frame - Purple/Gold decorative border -->
  <!-- Outer border -->
  <rect x="4" y="4" width="192" height="192" rx="16" fill="none" stroke="#8B5CF6" stroke-width="4"/>
  <!-- Inner border -->
  <rect x="12" y="12" width="176" height="176" rx="12" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <!-- Corner ornaments -->
  <g fill="#8B5CF6">
    <!-- Top-left -->
    <circle cx="16" cy="16" r="6"/>
    <path d="M16 10 L22 16 L16 22 L10 16 Z" fill="#D4AF37"/>
    <!-- Top-right -->
    <circle cx="184" cy="16" r="6"/>
    <path d="M184 10 L190 16 L184 22 L178 16 Z" fill="#D4AF37"/>
    <!-- Bottom-left -->
    <circle cx="16" cy="184" r="6"/>
    <path d="M16 178 L22 184 L16 190 L10 184 Z" fill="#D4AF37"/>
    <!-- Bottom-right -->
    <circle cx="184" cy="184" r="6"/>
    <path d="M184 178 L190 184 L184 190 L178 184 Z" fill="#D4AF37"/>
  </g>
  <!-- Side book motifs -->
  <rect x="8" y="90" width="4" height="20" rx="1" fill="#8B5CF6" opacity="0.6"/>
  <rect x="188" y="90" width="4" height="20" rx="1" fill="#8B5CF6" opacity="0.6"/>
  <rect x="90" y="8" width="20" height="4" rx="1" fill="#8B5CF6" opacity="0.6"/>
  <rect x="90" y="188" width="20" height="4" rx="1" fill="#8B5CF6" opacity="0.6"/>
</svg>
