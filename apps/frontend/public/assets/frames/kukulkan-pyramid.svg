  <rect x="4" y="4" width="192" height="192" rx="8" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
  <!-- Stepped pyramid pattern - top -->
  <path d="M60 4 L60 8 L80 8 L80 12 L90 12 L90 8 L100 8 L100 4" stroke="#8B4513" stroke-width="1" fill="none"/>
  <path d="M100 4 L100 8 L110 8 L110 12 L120 12 L120 8 L140 8 L140 4" stroke="#8B4513" stroke-width="1" fill="none"/>
  <!-- Stepped pyramid pattern - bottom -->
  <path d="M60 196 L60 192 L80 192 L80 188 L90 188 L90 192 L100 192 L100 196" stroke="#8B4513" stroke-width="1" fill="none"/>
  <path d="M100 196 L100 192 L110 192 L110 188 L120 188 L120 192 L140 192 L140 196" stroke="#8B4513" stroke-width="1" fill="none"/>
  <!-- Stepped pyramid pattern - left -->
  <path d="M4 60 L8 60 L8 80 L12 80 L12 90 L8 90 L8 100 L4 100" stroke="#8B4513" stroke-width="1" fill="none"/>
  <path d="M4 100 L8 100 L8 110 L12 110 L12 120 L8 120 L8 140 L4 140" stroke="#8B4513" stroke-width="1" fill="none"/>
  <!-- Stepped pyramid pattern - right -->
  <path d="M196 60 L192 60 L192 80 L188 80 L188 90 L192 90 L192 100 L196 100" stroke="#8B4513" stroke-width="1" fill="none"/>
  <path d="M196 100 L192 100 L192 110 L188 110 L188 120 L192 120 L192 140 L196 140" stroke="#8B4513" stroke-width="1" fill="none"/>
  <!-- Corner serpent heads (simplified K'uk'ulkan) -->
  <circle cx="10" cy="10" r="4" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
  <circle cx="190" cy="10" r="4" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
  <circle cx="10" cy="190" r="4" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
  <circle cx="190" cy="190" r="4" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
</svg>
