<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Marco Piramide Kukulkan - Pyramid-stepped frame -->
  <!-- Outer border -->
  <rect x="4" y="4" width="192" height="192" rx="8" stroke="#D4AF37" stroke-width="3" fill="none"/>
  <!-- Stepped pyramid pattern - top -->
  <path d="M60 4 L60 12 L80 12 L80 20 L90 20 L90 12 L100 12 L100 4" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M100 4 L100 12 L110 12 L110 20 L120 20 L120 12 L140 12 L140 4" stroke="#8B4513" stroke-width="2" fill="none"/>
  <!-- Stepped pyramid pattern - bottom -->
  <path d="M60 196 L60 188 L80 188 L80 180 L90 180 L90 188 L100 188 L100 196" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M100 196 L100 188 L110 188 L110 180 L120 180 L120 188 L140 188 L140 196" stroke="#8B4513" stroke-width="2" fill="none"/>
  <!-- Stepped pyramid pattern - left -->
  <path d="M4 60 L12 60 L12 80 L20 80 L20 90 L12 90 L12 100 L4 100" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M4 100 L12 100 L12 110 L20 110 L20 120 L12 120 L12 140 L4 140" stroke="#8B4513" stroke-width="2" fill="none"/>
  <!-- Stepped pyramid pattern - right -->
  <path d="M196 60 L188 60 L188 80 L180 80 L180 90 L188 90 L188 100 L196 100" stroke="#8B4513" stroke-width="2" fill="none"/>
  <path d="M196 100 L188 100 L188 110 L180 110 L180 120 L188 120 L188 140 L196 140" stroke="#8B4513" stroke-width="2" fill="none"/>
  <!-- Corner serpent heads (simplified K'uk'ulkan) -->
  <circle cx="18" cy="18" r="8" stroke="#D4AF37" stroke-width="2" fill="none"/>
  <circle cx="182" cy="18" r="8" stroke="#D4AF37" stroke-width="2" fill="none"/>
  <circle cx="18" cy="182" r="8" stroke="#D4AF37" stroke-width="2" fill="none"/>
  <circle cx="182" cy="182" r="8" stroke="#D4AF37" stroke-width="2" fill="none"/>
  <!-- Inner content area -->
  <rect x="30" y="30" width="140" height="140" rx="4" stroke="#D4AF37" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
