<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" preserveAspectRatio="none">
  <!-- Stars Frame - Golden stars border -->
  <rect x="4" y="4" width="192" height="192" rx="16" fill="none" stroke="#FFD700" stroke-width="1.5"/>
  <rect x="6" y="6" width="188" height="188" rx="12" fill="none" stroke="#DAA520" stroke-width="0.75" stroke-dasharray="8 4"/>
  <!-- Star function: 5-pointed stars at intervals -->
  <g fill="#FFD700">
    <!-- Top edge -->
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(75,4)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(200,4)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(325,4)"/>
    <!-- Bottom edge -->
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(75,473)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(200,473)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(325,473)"/>
    <!-- Left edge -->
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(22,116)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(22,296)"/>
    <!-- Right edge -->
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(490,116)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.4) translate(490,296)"/>
  </g>
  <!-- Corner circles -->
  <g fill="#FFD700" opacity="0.8">
    <circle cx="8" cy="8" r="3"/>
    <circle cx="192" cy="8" r="3"/>
    <circle cx="8" cy="192" r="3"/>
    <circle cx="192" cy="192" r="3"/>
  </g>
</svg>
