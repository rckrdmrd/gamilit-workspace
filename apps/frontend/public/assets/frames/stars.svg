<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Stars Frame - Golden stars border -->
  <rect x="4" y="4" width="192" height="192" rx="16" fill="none" stroke="#FFD700" stroke-width="3"/>
  <rect x="10" y="10" width="180" height="180" rx="12" fill="none" stroke="#DAA520" stroke-width="1.5" stroke-dasharray="8 4"/>
  <!-- Star function: 5-pointed stars at intervals -->
  <g fill="#FFD700">
    <!-- Top edge -->
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(33,-2)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(117,-2)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(200,-2)"/>
    <!-- Bottom edge -->
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(33,310)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(117,310)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(200,310)"/>
    <!-- Left edge -->
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(-2,72)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(-2,192)"/>
    <!-- Right edge -->
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(310,72)"/>
    <polygon points="50,8 52,14 58,14 53,18 55,24 50,20 45,24 47,18 42,14 48,14" transform="scale(0.6) translate(310,192)"/>
  </g>
  <!-- Corner stars (larger) -->
  <g fill="#FFD700" opacity="0.8">
    <circle cx="16" cy="16" r="5"/>
    <circle cx="184" cy="16" r="5"/>
    <circle cx="16" cy="184" r="5"/>
    <circle cx="184" cy="184" r="5"/>
  </g>
</svg>
