<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A1887F"/><stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
  </defs>
  <!-- Stepped corners - top-left -->
  <path d="M0 0L20 0 20 4 16 4 16 8 12 8 12 12 8 12 8 16 4 16 4 20 0 20Z" fill="url(#s)"/>
  <!-- Top-right -->
  <path d="M128 0L108 0 108 4 112 4 112 8 116 8 116 12 120 12 120 16 124 16 124 20 128 20Z" fill="url(#s)"/>
  <!-- Bottom-left -->
  <path d="M0 128L20 128 20 124 16 124 16 120 12 120 12 116 8 116 8 112 4 112 4 108 0 108Z" fill="url(#s)"/>
  <!-- Bottom-right -->
  <path d="M128 128L108 128 108 124 112 124 112 120 116 120 116 116 120 116 120 112 124 112 124 108 128 108Z" fill="url(#s)"/>
  <!-- Side bars connecting corners -->
  <rect x="20" y="0" width="88" height="4" fill="#8D6E63"/>
  <rect x="20" y="124" width="88" height="4" fill="#8D6E63"/>
  <rect x="0" y="20" width="4" height="88" fill="#8D6E63"/>
  <rect x="124" y="20" width="4" height="88" fill="#8D6E63"/>
  <!-- Inner border -->
  <rect x="22" y="22" width="84" height="84" fill="none" stroke="#8D6E63" stroke-width="1.5"/>
  <rect x="26" y="26" width="76" height="76" fill="none" stroke="#6D4C41" stroke-width="1"/>
  <!-- Step texture lines -->
  <g stroke="#5D4037" stroke-width=".5" opacity=".5">
    <line x1="0" y1="4" x2="16" y2="4"/><line x1="0" y1="8" x2="12" y2="8"/>
    <line x1="4" y1="0" x2="4" y2="16"/><line x1="8" y1="0" x2="8" y2="12"/>
    <line x1="128" y1="124" x2="112" y2="124"/><line x1="128" y1="120" x2="116" y2="120"/>
    <line x1="124" y1="128" x2="124" y2="112"/><line x1="120" y1="128" x2="120" y2="116"/>
  </g>
  <!-- Top/bottom mini pyramids -->
  <polygon points="64,24 54,30 74,30" fill="#8D6E63" opacity=".5"/>
  <polygon points="64,104 54,98 74,98" fill="#8D6E63" opacity=".5"/>
