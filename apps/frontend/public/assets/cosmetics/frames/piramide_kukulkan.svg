<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" preserveAspectRatio="none">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A1887F"/><stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
  </defs>
  <!-- Stepped corners - top-left (depth halved: 20→10) -->
  <path d="M0 0L10 0 10 2 8 2 8 4 6 4 6 6 4 6 4 8 2 8 2 10 0 10Z" fill="url(#s)"/>
  <!-- Top-right -->
  <path d="M128 0L118 0 118 2 120 2 120 4 122 4 122 6 124 6 124 8 126 8 126 10 128 10Z" fill="url(#s)"/>
  <!-- Bottom-left -->
  <path d="M0 128L10 128 10 126 8 126 8 124 6 124 6 122 4 122 4 120 2 120 2 118 0 118Z" fill="url(#s)"/>
  <!-- Bottom-right -->
  <path d="M128 128L118 128 118 126 120 126 120 124 122 124 122 122 124 122 124 120 126 120 126 118 128 118Z" fill="url(#s)"/>
  <!-- Side bars connecting corners -->
  <rect x="10" y="0" width="108" height="2" fill="#8D6E63"/>
  <rect x="10" y="126" width="108" height="2" fill="#8D6E63"/>
  <rect x="0" y="10" width="2" height="108" fill="#8D6E63"/>
  <rect x="126" y="10" width="2" height="108" fill="#8D6E63"/>
  <!-- Step texture lines -->
  <g stroke="#5D4037" stroke-width=".5" opacity=".5">
    <line x1="0" y1="2" x2="8" y2="2"/><line x1="0" y1="4" x2="6" y2="4"/>
    <line x1="2" y1="0" x2="2" y2="8"/><line x1="4" y1="0" x2="4" y2="6"/>
    <line x1="128" y1="126" x2="120" y2="126"/><line x1="128" y1="124" x2="122" y2="124"/>
    <line x1="126" y1="128" x2="126" y2="120"/><line x1="124" y1="128" x2="124" y2="122"/>
  </g>
  <!-- Top/bottom mini pyramids -->
  <polygon points="64,14 54,20 74,20" fill="#8D6E63" opacity=".5"/>
  <polygon points="64,114 54,108 74,108" fill="#8D6E63" opacity=".5"/>
  <!-- Corner serpent heads -->
  <g fill="#D4AF37" opacity=".6">
    <circle cx="14" cy="14" r="3"/><path d="M10 12L8 8 12 10Z"/>
    <circle cx="114" cy="14" r="3"/><path d="M118 12L120 8 116 10Z"/>
    <circle cx="14" cy="114" r="3"/><path d="M10 116L8 120 12 118Z"/>
    <circle cx="114" cy="114" r="3"/><path d="M118 116L120 120 116 118Z"/>
  </g>
  <!-- Side glyph dots -->
  <g fill="#D4AF37" opacity=".4">
    <rect x="16" y="62" width="4" height="4" rx=".5"/>
    <rect x="108" y="62" width="4" height="4" rx=".5"/>
    <rect x="62" y="16" width="4" height="4" rx=".5"/>
    <rect x="62" y="108" width="4" height="4" rx=".5"/>
  </g>
</svg>
