<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="kBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="50%" stop-color="#43A047"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="kGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="kBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0D2B0F"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#kBg)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.6"/>
  <!-- Serpent body - sinuous S-curve -->
  <path d="M30 90 C30 70, 50 65, 55 50 C60 35, 45 25, 64 20 C83 15, 75 35, 80 50 C85 65, 98 55, 98 40" fill="none" stroke="url(#kBody)" stroke-width="10" stroke-linecap="round"/>
  <path d="M30 90 C30 70, 50 65, 55 50 C60 35, 45 25, 64 20 C83 15, 75 35, 80 50 C85 65, 98 55, 98 40" fill="none" stroke="#66BB6A" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <!-- Feathered crest (plumes) -->
  <path d="M90 38 L105 20 L100 40 Z" fill="url(#kGold)"/>
  <path d="M93 42 L112 30 L104 46 Z" fill="url(#kGold)" opacity="0.8"/>
  <path d="M95 48 L115 42 L105 52 Z" fill="#FFD700" opacity="0.6"/>
  <!-- Feathers along body -->
  <path d="M50 52 L40 42 L48 48" fill="#FFD700" opacity="0.7"/>
  <path d="M58 30 L52 18 L56 28" fill="#FFD700" opacity="0.7"/>
  <path d="M72 22 L70 10 L74 20" fill="#FFD700" opacity="0.7"/>
  <!-- Serpent head detail -->
  <circle cx="96" cy="38" r="5" fill="#1B5E20"/>
  <circle cx="97" cy="37" r="2.5" fill="#FFD700"/>
  <circle cx="97.5" cy="37" r="1" fill="#0D2B0F"/>
  <!-- Jaw -->
  <path d="M100 40 L110 44 L100 43 Z" fill="#2E7D32"/>
  <!-- Scales pattern -->
  <circle cx="45" cy="72" r="2" fill="#A5D6A7" opacity="0.4"/>
  <circle cx="52" cy="58" r="2" fill="#A5D6A7" opacity="0.4"/>
  <circle cx="68" cy="26" r="2" fill="#A5D6A7" opacity="0.4"/>
  <circle cx="78" cy="42" r="2" fill="#A5D6A7" opacity="0.4"/>
  <!-- Tail rattle -->
  <path d="M30 90 L22 98 L28 94 L20 102 L26 98 L18 106" fill="none" stroke="url(#kGold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Decorative glyphs -->
  <rect x="56" cy="105" y="105" width="16" height="16" rx="2" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
  <path d="M60 109 L68 109 L64 117 Z" fill="#FFD700" opacity="0.4"/>
</svg>