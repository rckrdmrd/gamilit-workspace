<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Sacerdotisa Ixchel - Moon goddess avatar -->
  <circle cx="50" cy="50" r="48" fill="#1C1C1C"/>
  <circle cx="50" cy="50" r="44" fill="#2D3B6E"/>
  <!-- Crescent moon behind -->
  <path d="M25 25 Q50 10 75 25 Q65 20 50 22 Q35 20 25 25Z" fill="#D4AF37" opacity="0.4"/>
  <!-- Head -->
  <ellipse cx="50" cy="42" rx="16" ry="18" fill="#C68642"/>
  <!-- Hair flowing down -->
  <path d="M34 38 Q30 50 28 70" stroke="#1C1C1C" stroke-width="3" fill="none"/>
  <path d="M66 38 Q70 50 72 70" stroke="#1C1C1C" stroke-width="3" fill="none"/>
  <!-- Eyes -->
  <ellipse cx="44" cy="41" rx="3.5" ry="3" fill="#1C1C1C"/>
  <ellipse cx="56" cy="41" rx="3.5" ry="3" fill="#1C1C1C"/>
  <circle cx="44.5" cy="40.5" r="1.5" fill="#E8E8E8"/>
  <circle cx="56.5" cy="40.5" r="1.5" fill="#E8E8E8"/>
  <!-- Lips -->
  <path d="M45 49 Q50 52 55 49" stroke="#B85450" stroke-width="1.5" fill="none"/>
  <!-- Moon crown -->
  <path d="M35 28 Q42 20 50 22 Q58 20 65 28" stroke="#D4AF37" stroke-width="2.5" fill="none"/>
  <circle cx="50" cy="20" r="4" fill="#D4AF37"/>
  <circle cx="50" cy="20" r="2.5" fill="#2D3B6E"/>
  <!-- Jade earrings -->
  <circle cx="33" cy="45" r="3" fill="#2D5016"/>
  <circle cx="67" cy="45" r="3" fill="#2D5016"/>
  <!-- Robe -->
  <path d="M36 58 L28 88 L72 88 L64 58" fill="#4A2D82"/>
  <!-- Jade necklace -->
  <path d="M38 58 Q50 63 62 58" stroke="#2D5016" stroke-width="2.5" fill="none"/>
  <circle cx="50" cy="62" r="3" fill="#2D5016"/>
</svg>
