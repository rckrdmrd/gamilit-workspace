<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Magic Library Background -->
  <rect width="200" height="200" fill="#1a0a2e"/>
  <!-- Bookshelves -->
  <rect x="10" y="40" width="180" height="8" fill="#5D3A1A" rx="2"/>
  <rect x="10" y="100" width="180" height="8" fill="#5D3A1A" rx="2"/>
  <rect x="10" y="160" width="180" height="8" fill="#5D3A1A" rx="2"/>
  <!-- Books row 1 -->
  <g opacity="0.9">
    <rect x="15" y="20" width="8" height="20" fill="#E74C3C" rx="1"/>
    <rect x="25" y="22" width="10" height="18" fill="#3498DB" rx="1"/>
    <rect x="37" y="18" width="7" height="22" fill="#2ECC71" rx="1"/>
    <rect x="46" y="24" width="12" height="16" fill="#9B59B6" rx="1"/>
    <rect x="60" y="20" width="9" height="20" fill="#F39C12" rx="1"/>
    <rect x="72" y="22" width="8" height="18" fill="#1ABC9C" rx="1"/>
    <rect x="82" y="19" width="11" height="21" fill="#E67E22" rx="1"/>
    <rect x="100" y="23" width="8" height="17" fill="#8E44AD" rx="1"/>
    <rect x="115" y="20" width="10" height="20" fill="#2980B9" rx="1"/>
    <rect x="130" y="22" width="7" height="18" fill="#C0392B" rx="1"/>
    <rect x="145" y="18" width="9" height="22" fill="#27AE60" rx="1"/>
    <rect x="160" y="24" width="12" height="16" fill="#D35400" rx="1"/>
  </g>
  <!-- Floating sparkles -->
  <circle cx="30" cy="75" r="2" fill="#FFD700" opacity="0.8"/>
  <circle cx="90" cy="55" r="1.5" fill="#E8D5FF" opacity="0.6"/>
  <circle cx="150" cy="70" r="2" fill="#FFD700" opacity="0.7"/>
  <circle cx="60" cy="130" r="1.5" fill="#E8D5FF" opacity="0.5"/>
  <circle cx="120" cy="140" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="170" cy="125" r="1" fill="#E8D5FF" opacity="0.7"/>
  <circle cx="45" cy="185" r="1.5" fill="#FFD700" opacity="0.5"/>
  <circle cx="140" cy="180" r="2" fill="#E8D5FF" opacity="0.6"/>
  <!-- Magic swirls -->
  <path d="M40 90 Q60 80 80 90 Q100 100 120 85" stroke="#8B5CF6" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M70 150 Q100 135 130 150 Q150 160 170 145" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.3"/>
</svg>
