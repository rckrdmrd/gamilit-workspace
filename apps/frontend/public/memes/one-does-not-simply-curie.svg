<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <!-- One Does Not Simply: No se puede ignorar la radioactividad -->
  <defs>
    <style>
      .boromir-text { font-family: Impact, 'Arial Black', sans-serif; fill: #ffffff; text-transform: uppercase;
        paint-order: stroke; stroke: #000000; stroke-width: 3px; stroke-linecap: butt; stroke-linejoin: miter; }
    </style>
    <radialGradient id="bg-grad">
      <stop offset="0%" stop-color="#636e72"/>
      <stop offset="100%" stop-color="#2d3436"/>
    </radialGradient>
  </defs>

  <!-- Background - dark dramatic -->
  <rect width="600" height="500" fill="url(#bg-grad)"/>
  <!-- Vignette effect -->
  <rect width="600" height="500" fill="none" stroke="#000000" stroke-width="80" opacity="0.3"/>

  <!-- Character - Marie Curie with Boromir gesture -->
  <g transform="translate(300, 260)">
    <!-- Body -->
    <ellipse cx="0" cy="80" rx="80" ry="70" fill="#2d3436"/>
    <!-- Lab coat -->
    <ellipse cx="0" cy="80" rx="75" ry="65" fill="#636e72"/>
    <line x1="0" y1="20" x2="0" y2="140" stroke="#b2bec3" stroke-width="1"/>

    <!-- Head -->
    <circle cx="0" cy="-20" r="55" fill="#ffeaa7"/>

    <!-- Hair (period updo) -->
    <path d="M-55 -30 Q-58 -70 -25 -78 Q0 -85 25 -78 Q58 -70 55 -30" fill="#2d3436"/>
    <ellipse cx="0" cy="-72" rx="30" ry="14" fill="#2d3436"/>
    <!-- Hair bun -->
    <circle cx="0" cy="-80" r="15" fill="#2d3436"/>

    <!-- Face - serious/explaining -->
    <ellipse cx="-15" cy="-28" rx="5" ry="4" fill="#2d3436"/>
    <ellipse cx="15" cy="-28" rx="5" ry="4" fill="#2d3436"/>
    <!-- Eyebrows - serious -->
    <line x1="-22" y1="-38" x2="-8" y2="-36" stroke="#2d3436" stroke-width="2.5"/>
    <line x1="8" y1="-36" x2="22" y2="-38" stroke="#2d3436" stroke-width="2.5"/>
    <!-- Mouth - speaking -->
    <ellipse cx="0" cy="-5" rx="12" ry="6" fill="#e17055"/>
    <path d="M-12 -5 Q0 2 12 -5" stroke="#d63031" stroke-width="1" fill="none"/>

    <!-- THE GESTURE - hands forming the pinch -->
    <!-- Left hand -->
    <g transform="translate(-90, 20)">
      <circle cx="0" cy="0" r="18" fill="#ffeaa7"/>
      <!-- Fingers pinching -->
      <line x1="15" y1="-5" x2="30" y2="-10" stroke="#ffeaa7" stroke-width="6" stroke-linecap="round"/>
      <line x1="15" y1="0" x2="28" y2="-3" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round"/>
      <line x1="12" y1="5" x2="22" y2="5" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Right hand -->
    <g transform="translate(90, 20)">
      <circle cx="0" cy="0" r="18" fill="#ffeaa7"/>
      <!-- Fingers pinching -->
      <line x1="-15" y1="-5" x2="-30" y2="-10" stroke="#ffeaa7" stroke-width="6" stroke-linecap="round"/>
      <line x1="-15" y1="0" x2="-28" y2="-3" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round"/>
      <line x1="-12" y1="5" x2="-22" y2="5" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- Arms connecting body to hands -->
    <line x1="-55" y1="50" x2="-90" y2="20" stroke="#636e72" stroke-width="15" stroke-linecap="round"/>
    <line x1="55" y1="50" x2="90" y2="20" stroke="#636e72" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Glowing particles around hands (radioactivity!) -->
  <circle cx="185" cy="270" r="3" fill="#55efc4" opacity="0.7"/>
  <circle cx="195" cy="255" r="2" fill="#55efc4" opacity="0.5"/>
  <circle cx="175" cy="285" r="2" fill="#00b894" opacity="0.6"/>
  <circle cx="415" cy="270" r="3" fill="#55efc4" opacity="0.7"/>
  <circle cx="405" cy="255" r="2" fill="#55efc4" opacity="0.5"/>
  <circle cx="425" cy="285" r="2" fill="#00b894" opacity="0.6"/>

  <!-- Radioactive symbols floating -->
  <text x="130" y="200" font-size="18" opacity="0.3">☢️</text>
  <text x="450" y="180" font-size="16" opacity="0.3">☢️</text>
  <text x="500" y="350" font-size="14" opacity="0.2">☢️</text>

  <!-- TOP TEXT -->
  <text x="300" y="50" text-anchor="middle" class="boromir-text" font-size="28">NO SE PUEDE</text>
  <text x="300" y="85" text-anchor="middle" class="boromir-text" font-size="28">SIMPLEMENTE</text>

  <!-- BOTTOM TEXT -->
  <text x="300" y="440" text-anchor="middle" class="boromir-text" font-size="26">IGNORAR LA</text>
  <text x="300" y="475" text-anchor="middle" class="boromir-text" font-size="26">RADIOACTIVIDAD</text>

  <!-- Watermark -->
  <text x="300" y="496" text-anchor="middle" font-size="9" fill="#636e72" font-family="Arial, sans-serif">gamilit — Análisis de Memes</text>
</svg>