<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <!-- This Is Fine: Marie Curie en su laboratorio rodeada de materiales radioactivos -->
  <defs>
    <style>
      .fine-text { font-family: Impact, 'Arial Black', sans-serif; fill: #ffffff; text-transform: uppercase;
        paint-order: stroke; stroke: #000000; stroke-width: 3px; }
      .speech { font-family: 'Comic Sans MS', cursive, sans-serif; fill: #2d3436; }
    </style>
    <radialGradient id="glow-green">
      <stop offset="0%" stop-color="#55efc4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#55efc4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background - laboratory -->
  <rect width="600" height="500" fill="#2d3436"/>
  <!-- Lab walls -->
  <rect x="0" y="0" width="600" height="400" fill="#636e72"/>
  <!-- Lab floor -->
  <rect x="0" y="380" width="600" height="120" fill="#b2bec3"/>
  <!-- Floor tiles -->
  <line x1="0" y1="380" x2="600" y2="380" stroke="#a0aab0" stroke-width="1"/>
  <line x1="100" y1="380" x2="100" y2="500" stroke="#a0aab0" stroke-width="0.5" opacity="0.3"/>
  <line x1="200" y1="380" x2="200" y2="500" stroke="#a0aab0" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="380" x2="300" y2="500" stroke="#a0aab0" stroke-width="0.5" opacity="0.3"/>
  <line x1="400" y1="380" x2="400" y2="500" stroke="#a0aab0" stroke-width="0.5" opacity="0.3"/>
  <line x1="500" y1="380" x2="500" y2="500" stroke="#a0aab0" stroke-width="0.5" opacity="0.3"/>

  <!-- Shelves with glowing bottles -->
  <rect x="20" y="50" width="150" height="8" fill="#8B4513"/>
  <rect x="430" y="70" width="150" height="8" fill="#8B4513"/>

  <!-- Glowing bottles on shelves -->
  <rect x="40" y="25" width="18" height="25" rx="3" fill="#55efc4" opacity="0.8"/>
  <circle cx="49" cy="30" r="15" fill="url(#glow-green)"/>
  <rect x="75" y="30" width="15" height="20" rx="2" fill="#00b894" opacity="0.7"/>
  <circle cx="82" cy="35" r="12" fill="url(#glow-green)"/>
  <rect x="110" y="20" width="22" height="30" rx="4" fill="#55efc4" opacity="0.6"/>
  <circle cx="121" cy="30" r="18" fill="url(#glow-green)"/>

  <rect x="450" y="45" width="20" height="25" rx="3" fill="#00b894" opacity="0.8"/>
  <circle cx="460" cy="50" r="15" fill="url(#glow-green)"/>
  <rect x="490" y="40" width="16" height="30" rx="2" fill="#55efc4" opacity="0.7"/>
  <circle cx="498" cy="50" r="14" fill="url(#glow-green)"/>
  <rect x="530" y="48" width="18" height="22" rx="3" fill="#00b894" opacity="0.6"/>
  <circle cx="539" cy="55" r="12" fill="url(#glow-green)"/>

  <!-- Lab table -->
  <rect x="150" y="280" width="300" height="12" rx="3" fill="#8B4513"/>
  <rect x="160" y="292" width="10" height="90" fill="#8B4513"/>
  <rect x="430" y="292" width="10" height="90" fill="#8B4513"/>

  <!-- Glowing materials on table -->
  <circle cx="220" cy="265" r="15" fill="#55efc4" opacity="0.7"/>
  <circle cx="220" cy="265" r="25" fill="url(#glow-green)"/>
  <rect x="280" y="255" width="30" height="25" rx="3" fill="#00b894" opacity="0.8"/>
  <circle cx="295" cy="265" r="22" fill="url(#glow-green)"/>
  <circle cx="370" cy="268" r="12" fill="#55efc4" opacity="0.6"/>
  <circle cx="370" cy="268" r="20" fill="url(#glow-green)"/>

  <!-- Test tubes -->
  <rect x="340" y="250" width="8" height="30" rx="4" fill="rgba(255,255,255,0.3)" stroke="#55efc4" stroke-width="1"/>
  <rect x="355" y="245" width="8" height="35" rx="4" fill="rgba(255,255,255,0.3)" stroke="#00b894" stroke-width="1"/>

  <!-- GREEN GLOW everywhere (the "fire" equivalent) -->
  <circle cx="300" cy="300" r="200" fill="url(#glow-green)" opacity="0.3"/>
  <circle cx="200" cy="250" r="100" fill="url(#glow-green)" opacity="0.2"/>
  <circle cx="400" cy="270" r="120" fill="url(#glow-green)" opacity="0.2"/>

  <!-- Floating radioactive particles -->
  <circle cx="100" cy="150" r="4" fill="#55efc4" opacity="0.8"/>
  <circle cx="250" cy="120" r="3" fill="#00b894" opacity="0.6"/>
  <circle cx="480" cy="180" r="4" fill="#55efc4" opacity="0.7"/>
  <circle cx="150" cy="250" r="3" fill="#55efc4" opacity="0.5"/>
  <circle cx="500" cy="250" r="3" fill="#00b894" opacity="0.6"/>
  <circle cx="350" cy="150" r="2" fill="#55efc4" opacity="0.8"/>
  <circle cx="80" cy="300" r="3" fill="#00b894" opacity="0.4"/>
  <circle cx="520" cy="150" r="2" fill="#55efc4" opacity="0.5"/>

  <!-- Marie Curie character - sitting calmly -->
  <g transform="translate(300, 200)">
    <!-- Chair -->
    <rect x="-25" y="110" width="50" height="60" rx="5" fill="#8B4513" opacity="0.8"/>

    <!-- Body sitting -->
    <ellipse cx="0" cy="120" rx="32" ry="40" fill="#2d3436"/>
    <!-- Lab coat -->
    <ellipse cx="0" cy="120" rx="30" ry="38" fill="#dfe6e9"/>
    <line x1="0" y1="85" x2="0" y2="155" stroke="#b2bec3" stroke-width="1"/>

    <!-- Head -->
    <circle cx="0" cy="50" r="35" fill="#ffeaa7"/>

    <!-- Hair -->
    <path d="M-35 40 Q-38 10 -15 5 Q0 0 15 5 Q38 10 35 40" fill="#2d3436"/>
    <ellipse cx="0" cy="8" rx="22" ry="10" fill="#2d3436"/>
    <circle cx="0" cy="2" r="12" fill="#2d3436"/>

    <!-- Face - calm, content (the "this is fine" expression) -->
    <circle cx="-12" cy="45" r="3" fill="#2d3436"/>
    <circle cx="12" cy="45" r="3" fill="#2d3436"/>
    <path d="M-10 62 Q0 68 10 62" stroke="#2d3436" stroke-width="2" fill="none"/>

    <!-- Arm holding coffee -->
    <line x1="30" y1="100" x2="55" y2="80" stroke="#ffeaa7" stroke-width="8" stroke-linecap="round"/>
    <!-- Coffee cup -->
    <rect x="50" y="68" width="15" height="18" rx="2" fill="#ffffff" stroke="#b2bec3" stroke-width="1"/>
    <path d="M65 73 Q72 73 72 80 Q72 85 65 85" stroke="#b2bec3" stroke-width="1" fill="none"/>
    <!-- Steam from coffee -->
    <path d="M55 65 Q58 58 55 52" stroke="#b2bec3" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M60 65 Q63 55 60 48" stroke="#b2bec3" stroke-width="1" fill="none" opacity="0.5"/>
  </g>

  <!-- Speech bubble -->
  <g transform="translate(420, 100)">
    <ellipse cx="0" cy="0" rx="80" ry="40" fill="#ffffff" stroke="#2d3436" stroke-width="2"/>
    <!-- Bubble tail -->
    <path d="M-40 30 L-60 60 L-20 35" fill="#ffffff" stroke="#2d3436" stroke-width="2"/>
    <path d="M-40 30 L-20 35" fill="#ffffff" stroke="#ffffff" stroke-width="3"/>
    <!-- Text -->
    <text x="0" y="-5" text-anchor="middle" class="speech" font-size="16" font-weight="bold">Está bien.</text>
    <text x="0" y="15" text-anchor="middle" class="speech" font-size="11">Todo está bajo control.</text>
  </g>

  <!-- Top text -->
  <text x="300" y="35" text-anchor="middle" class="fine-text" font-size="22">MARIE CURIE EN SU LABORATORIO</text>

  <!-- Bottom text -->
  <rect x="0" y="430" width="600" height="70" fill="rgba(0,0,0,0.7)"/>
  <text x="300" y="460" text-anchor="middle" class="fine-text" font-size="24">ESTO ESTÁ BIEN</text>
  <text x="300" y="485" text-anchor="middle" font-size="12" fill="#55efc4" font-family="Arial, sans-serif">*rodeada de materiales altamente radioactivos sin protección*</text>

  <!-- Watermark -->
  <text x="300" y="498" text-anchor="middle" font-size="8" fill="#636e72" font-family="Arial, sans-serif">gamilit — Análisis de Memes</text>
</svg>