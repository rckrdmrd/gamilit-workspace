<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <!-- Change My Mind: Marie Curie es la científica más influyente -->
  <defs>
    <style>
      .sign-text { font-family: Impact, 'Arial Black', sans-serif; fill: #2d3436; text-transform: uppercase; }
      .caption { font-family: Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background - outdoor scene -->
  <rect width="600" height="500" fill="#81ecec"/>
  <!-- Grass -->
  <rect x="0" y="320" width="600" height="180" fill="#00b894"/>
  <!-- Path -->
  <rect x="0" y="380" width="600" height="50" fill="#b2bec3"/>

  <!-- Trees in background -->
  <circle cx="80" cy="200" r="60" fill="#00b894" opacity="0.5"/>
  <rect x="72" y="240" width="16" height="80" fill="#6c5ce7" opacity="0.3"/>
  <circle cx="520" cy="180" r="70" fill="#00b894" opacity="0.4"/>
  <rect x="512" y="230" width="16" height="90" fill="#6c5ce7" opacity="0.3"/>

  <!-- Table -->
  <rect x="200" y="300" width="250" height="10" rx="3" fill="#e17055"/>
  <!-- Table legs -->
  <rect x="210" y="310" width="8" height="60" fill="#d63031"/>
  <rect x="432" y="310" width="8" height="60" fill="#d63031"/>
  <!-- Tablecloth -->
  <rect x="195" y="290" width="260" height="15" rx="3" fill="#e17055"/>

  <!-- Sign on table -->
  <g transform="translate(230, 140)">
    <rect x="0" y="0" width="220" height="140" rx="5" fill="#ffffff" stroke="#2d3436" stroke-width="2"/>
    <!-- Sign text -->
    <text x="110" y="35" text-anchor="middle" class="sign-text" font-size="15">MARIE CURIE ES</text>
    <text x="110" y="58" text-anchor="middle" class="sign-text" font-size="15">LA CIENTÍFICA MÁS</text>
    <text x="110" y="81" text-anchor="middle" class="sign-text" font-size="15">INFLUYENTE DE</text>
    <text x="110" y="104" text-anchor="middle" class="sign-text" font-size="15">LA HISTORIA</text>
    <!-- Sign support -->
    <rect x="105" y="140" width="10" height="30" fill="#b2bec3"/>
  </g>

  <!-- Marie Curie character sitting -->
  <g transform="translate(160, 180)">
    <!-- Chair -->
    <rect x="-20" y="90" width="60" height="80" rx="5" fill="#636e72"/>
    <rect x="-25" y="85" width="70" height="10" rx="3" fill="#636e72"/>

    <!-- Body sitting -->
    <ellipse cx="10" cy="110" rx="30" ry="35" fill="#6c5ce7"/>

    <!-- Head -->
    <circle cx="10" cy="55" r="32" fill="#ffeaa7"/>

    <!-- Hair (period-appropriate) -->
    <path d="M-22 45 Q-25 20 -5 18 Q10 12 25 18 Q42 22 42 45" fill="#2d3436"/>
    <ellipse cx="10" cy="20" rx="22" ry="10" fill="#2d3436"/>

    <!-- Face - confident/smug -->
    <circle cx="0" cy="50" r="3" fill="#2d3436"/>
    <circle cx="20" cy="50" r="3" fill="#2d3436"/>
    <path d="M-2 65 Q10 72 22 65" stroke="#2d3436" stroke-width="2" fill="none"/>
    <!-- Raised eyebrow -->
    <line x1="15" y1="40" x2="25" y2="38" stroke="#2d3436" stroke-width="2"/>

    <!-- Arm resting on table -->
    <line x1="40" y1="95" x2="80" y2="85" stroke="#ffeaa7" stroke-width="10" stroke-linecap="round"/>

    <!-- Lab coat detail -->
    <path d="M-15 80 L10 75 L35 80" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>

  <!-- Coffee cup on table -->
  <rect x="400" y="278" width="20" height="20" rx="3" fill="#ffffff" stroke="#b2bec3" stroke-width="1"/>
  <path d="M420 285 Q428 285 428 293 Q428 298 420 298" stroke="#b2bec3" stroke-width="1.5" fill="none"/>
  <!-- Steam -->
  <path d="M405 275 Q408 268 405 262" stroke="#b2bec3" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M412 275 Q415 265 412 258" stroke="#b2bec3" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Nobel medals on table -->
  <circle cx="360" cy="293" r="8" fill="#fdcb6e" stroke="#f39c12" stroke-width="1"/>
  <text x="360" y="297" text-anchor="middle" font-size="8" fill="#d63031" font-weight="bold">N</text>
  <circle cx="380" cy="293" r="8" fill="#fdcb6e" stroke="#f39c12" stroke-width="1"/>
  <text x="380" y="297" text-anchor="middle" font-size="8" fill="#d63031" font-weight="bold">N</text>

  <!-- Bottom caption -->
  <rect x="100" y="430" width="400" height="45" rx="10" fill="rgba(0,0,0,0.75)"/>
  <text x="300" y="452" text-anchor="middle" font-size="14" fill="#ffffff" font-family="Impact, sans-serif" letter-spacing="1">CHANGE MY MIND</text>
  <text x="300" y="468" text-anchor="middle" font-size="10" fill="#b2bec3" font-family="Arial, sans-serif">*con dos Premios Nobel como evidencia*</text>

  <!-- Watermark -->
  <text x="300" y="495" text-anchor="middle" font-size="9" fill="#b2bec3" font-family="Arial, sans-serif">gamilit — Análisis de Memes</text>
</svg>