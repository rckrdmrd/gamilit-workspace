<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <!-- Drake Hotline Bling: Marie Curie - Protección vs Experimentar -->
  <defs>
    <style>
      .meme-text { font-family: Impact, 'Arial Black', sans-serif; fill: #1a1a1a; }
      .panel-text { font-family: Impact, 'Arial Black', sans-serif; fill: #ffffff; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="#f5e6d3"/>

  <!-- Top Panel - Rejection -->
  <rect x="0" y="0" width="600" height="250" fill="#ffeaa7" stroke="#d4a574" stroke-width="2"/>

  <!-- Top Panel - Character (rejecting pose) -->
  <circle cx="140" cy="105" r="45" fill="#e8c39e"/>
  <ellipse cx="140" cy="180" rx="55" ry="50" fill="#6c5ce7"/>
  <!-- Rejection hand -->
  <line x1="195" y1="140" x2="240" y2="100" stroke="#e8c39e" stroke-width="12" stroke-linecap="round"/>
  <!-- Face - disgusted -->
  <circle cx="125" cy="98" r="4" fill="#2d3436"/>
  <circle cx="155" cy="98" r="4" fill="#2d3436"/>
  <path d="M120 120 Q140 115 160 120" stroke="#2d3436" stroke-width="3" fill="none"/>
  <!-- Head turn away -->
  <path d="M165 80 Q180 75 170 65" stroke="#e8c39e" stroke-width="2" fill="none"/>

  <!-- Top Panel - Text -->
  <rect x="280" y="20" width="290" height="210" rx="10" fill="rgba(0,0,0,0.05)"/>
  <text x="425" y="90" text-anchor="middle" class="panel-text" font-size="22" fill="#2d3436">PROTECCIÓN</text>
  <text x="425" y="120" text-anchor="middle" class="panel-text" font-size="22" fill="#2d3436">CONTRA</text>
  <text x="425" y="150" text-anchor="middle" class="panel-text" font-size="22" fill="#2d3436">RADIACIÓN</text>
  <text x="425" y="195" text-anchor="middle" font-size="14" fill="#636e72" font-family="Arial, sans-serif">🚫 No gracias</text>

  <!-- Divider -->
  <line x1="0" y1="250" x2="600" y2="250" stroke="#d4a574" stroke-width="3"/>

  <!-- Bottom Panel - Approval -->
  <rect x="0" y="250" width="600" height="250" fill="#55efc4" stroke="#d4a574" stroke-width="2"/>

  <!-- Bottom Panel - Character (approving/happy pose) -->
  <circle cx="140" cy="355" r="45" fill="#e8c39e"/>
  <ellipse cx="140" cy="430" rx="55" ry="50" fill="#6c5ce7"/>
  <!-- Pointing finger -->
  <line x1="195" y1="390" x2="250" y2="370" stroke="#e8c39e" stroke-width="12" stroke-linecap="round"/>
  <!-- Face - happy/approving -->
  <circle cx="125" cy="348" r="4" fill="#2d3436"/>
  <circle cx="155" cy="348" r="4" fill="#2d3436"/>
  <path d="M120 370 Q140 380 160 370" stroke="#2d3436" stroke-width="3" fill="none"/>
  <!-- Glowing effect around character -->
  <circle cx="140" cy="380" r="90" fill="none" stroke="#00b894" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>

  <!-- Bottom Panel - Text -->
  <rect x="280" y="270" width="290" height="210" rx="10" fill="rgba(0,0,0,0.05)"/>
  <text x="425" y="340" text-anchor="middle" class="panel-text" font-size="20" fill="#2d3436">SEGUIR</text>
  <text x="425" y="370" text-anchor="middle" class="panel-text" font-size="20" fill="#2d3436">EXPERIMENTANDO</text>
  <text x="425" y="400" text-anchor="middle" class="panel-text" font-size="20" fill="#2d3436">SIN PROTECCIÓN</text>
  <text x="425" y="445" text-anchor="middle" font-size="14" fill="#636e72" font-family="Arial, sans-serif">✨ ¡Así sí!</text>

  <!-- Radioactive symbol on bottom panel -->
  <circle cx="530" cy="460" r="18" fill="#fdcb6e" stroke="#f39c12" stroke-width="2"/>
  <text x="530" y="467" text-anchor="middle" font-size="20">☢️</text>

  <!-- Watermark -->
  <text x="300" y="495" text-anchor="middle" font-size="10" fill="#b2bec3" font-family="Arial, sans-serif">gamilit — Análisis de Memes</text>
</svg>