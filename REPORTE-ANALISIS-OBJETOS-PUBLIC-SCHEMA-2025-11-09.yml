          nota: "Verificar tabla exacta antes de mover"

# =============================================================================
# 6. ANÁLISIS DETALLADO: VIEWS (3 views)
# =============================================================================

views:
  total: 3
  estado_general: "PROBLEMÁTICAS - Referencias a tablas inexistentes o incorrectas"
  
  - nombre: "assignment_submission_stats"
    archivo: "apps/database/ddl/schemas/public/views/01-assignment_submission_stats.sql"
    proposito: "Provides comprehensive statistics on assignment submissions"
    
    tablas_referenciadas:
      - "educational_content.assignments (existe)"
      - "social_features.assignment_classrooms (existe)"
      - "social_features.classrooms (existe)"
      - "social_features.classroom_members (existe)"
      - "educational_content.assignment_submissions (existe)"
    
    schemas_involucrados:
      - educational_content
      - social_features
    
    estado: "FUNCIONAL pero mal ubicada"
    
    problemas:
      - "View hace JOIN entre multiple schemas (cross-schema)"
      - "No está clara la ownership (¿educational_content? ¿social_features?)"
    
    schema_destino: "educational_content"
    
    accion: "MOVER CON REVISIÓN"
    
    justificacion: |
      Esta view agrega estadísticas de submissions de assignments.
      El dominio principal es educational_content (assignments, submissions).
      Social_features aporta información de classrooms (contexto).
      
      DECISIÓN: Mover a educational_content porque el objeto principal
      es assignment_submissions y su análisis.
    
    impacto:
      severidad: "MEDIO"
      objetos_afectados:
        - "Queries en backend que usan esta view"
        - "Reportes de teachers/admins"
      breaking_changes: true
    
    plan_migracion:
      paso_1: "Crear view en educational_content"
      paso_2: "Mantener alias en public temporalmente"
      paso_3: "Migrar queries de backend"
      paso_4: "Eliminar alias en public"
      
      script_sql: |
        -- Crear en schema correcto
        CREATE OR REPLACE VIEW educational_content.assignment_submission_stats AS
        SELECT ... FROM educational_content.assignments ...;
        
        -- Alias temporal para backward compatibility
        CREATE OR REPLACE VIEW public.assignment_submission_stats AS
        SELECT * FROM educational_content.assignment_submission_stats;
        
        -- Después de migración backend:
        DROP VIEW public.assignment_submission_stats;

  - nombre: "classroom_overview"
    archivo: "apps/database/ddl/schemas/public/views/02-classroom_overview.sql"
    proposito: "Provides comprehensive overview of classroom statistics and status"
    
    tablas_referenciadas:
      - "educational_content.classrooms (NO EXISTE - ERROR)"
      - "gamilit.users (existe)"
      - "educational_content.assignments (existe)"
      - "educational_content.chapters (NO EXISTE)"
      - "educational_content.exercises (existe)"
      - "progress_tracking.user_progress (esperado)"
    
    schemas_involucrados:
      - educational_content (incorrectamente)
      - social_features (debería ser)
      - gamilit
      - progress_tracking
    
    estado: "ROTA - Referencias incorrectas"
    
    problemas:
      - "CRÍTICO: Referencia educational_content.classrooms (NO EXISTE)"
      - "Classrooms está en social_features, NO en educational_content"
      - "Referencia educational_content.chapters (NO EXISTE)"
      - "JOIN u.classroom_id (columna no existe en auth.users)"
    
    accion: "CORREGIR Y MOVER"
    
    justificacion: |
      Esta view está ROTA por referencias incorrectas.
      
      CORRECCIONES NECESARIAS:
      1. educational_content.classrooms → social_features.classrooms
      2. educational_content.chapters → NO EXISTE (eliminar)
      3. JOIN u.classroom_id → Usar classroom_members M2M
      4. Eliminar referencias a chapters
      
      DESPUÉS DE CORREGIR: Mover a social_features (domain de classrooms)
    
    schema_destino: "social_features (después de corregir)"
    
    plan_migracion:
      paso_1: "CORREGIR la view (referencias incorrectas)"
      paso_2: "Probar que funciona correctamente"
      paso_3: "Mover a social_features"
      paso_4: "Crear alias temporal en public"
      paso_5: "Migrar backend y eliminar alias"
      
      script_correccion: |
        CREATE OR REPLACE VIEW public.classroom_overview AS
        SELECT
          c.id AS classroom_id,
          c.name AS classroom_name,
          c.description AS classroom_description,
          t.id AS teacher_id,
          t.display_name AS teacher_name,
          COUNT(DISTINCT cm.student_id) AS total_students,
          COUNT(DISTINCT CASE WHEN p.status = 'ACTIVE' THEN cm.student_id END) AS active_students,
          -- FIX: Usar classroom_members M2M, no u.classroom_id
          -- FIX: Cambiar educational_content.classrooms → social_features.classrooms
          -- FIX: Eliminar referencias a chapters
        FROM social_features.classrooms c
        LEFT JOIN auth.users t ON c.teacher_id = t.id
        LEFT JOIN social_features.classroom_members cm ON c.id = cm.classroom_id
        LEFT JOIN auth_management.profiles p ON cm.student_id = p.user_id
        ...;

  - nombre: "for"
    archivo: "apps/database/ddl/schemas/public/views/03-for.sql"
    proposito: "Utility view to support iterative queries and FOR-EACH operations"
    
    tablas_referenciadas: []
    
    contenido: |
      SELECT
        generate_series(1, 1000, 1) AS iteration_number,
        NOW() AS generated_at,
        CURRENT_USER AS query_user;
    
    estado: "EXTRAÑO - Nombre reservado, funcionalidad cuestionable"
    
    problemas:
      - "Nombre 'for' es una palabra reservada (aunque PostgreSQL lo permite con comillas)"
      - "Funcionalidad muy básica (generate_series)"
      - "No está claro su uso real en el sistema"
    
    accion: "ELIMINAR o MOVER A GAMILIT"
    
    justificacion: |
      Esta view es sospechosa:
      1. Nombre 'for' (palabra reservada)
      2. Funcionalidad trivial (generate_series existe nativamente)
      3. No encontrada en backend
      
      OPCIONES:
      A) ELIMINAR si no se usa
      B) MOVER a gamilit como utility (si realmente se necesita)
      C) REEMPLAZAR con función directa
      
      RECOMENDACIÓN: ELIMINAR. Cualquier código que use esto puede
      llamar directamente a generate_series().
    
    impacto:
      severidad: "BAJO (probablemente no se usa)"
      objetos_afectados: []
      breaking_changes: false
    
    plan_migracion:
      paso_1: "BUSCAR referencias en backend/queries"
      paso_2: "Si NO se usa: ELIMINAR"
      paso_3: "Si SÍ se usa: Reemplazar con generate_series() directo"

# =============================================================================
# 7. PLAN DE MIGRACIÓN GLOBAL
# =============================================================================

plan_migracion_global:
  objetivo: "Mover TODOS los objetos de public a sus schemas correctos"
  
  orden_de_ejecucion: "CRÍTICO - Seguir estrictamente por dependencias"
  
  fase_0_preparacion:
    titulo: "Análisis y Preparación"
    duracion_estimada: "1 día"
    
    tareas:
      - id: "P0.1"
        descripcion: "Verificar existencia de tablas referenciadas"
        accion: |
          SELECT schemaname, tablename 
          FROM pg_tables 
          WHERE tablename IN (
            'assignments', 'assignment_submissions', 'assignment_classrooms',
            'classrooms', 'system_alerts', 'user_activity'
          );
      
      - id: "P0.2"
        descripcion: "Identificar queries en backend que usan objetos de public"
        accion: "grep -r 'public\\.' apps/backend/src"
      
      - id: "P0.3"
        descripcion: "Crear backup completo de schema public"
        accion: "pg_dump -n public -f backup-public-schema-$(date +%Y%m%d).sql"
      
      - id: "P0.4"
        descripcion: "Comunicar al equipo sobre breaking changes"
        impacto: "Alto - múltiples objetos afectados"
  
  fase_1_enums:
    titulo: "Migración de ENUMs"
    duracion_estimada: "1 día"
    prioridad: "MÁXIMA"
    
    orden:
      - paso: 1
        enum: "aggregation_period"
        schema_destino: "audit_logging"
        impacto: "Medio"
        script: "CREATE TYPE audit_logging.aggregation_period..."
      
      - paso: 2
        enum: "metric_type"
        schema_destino: "audit_logging"
        impacto: "Medio"
        script: "CREATE TYPE audit_logging.metric_type..."
      
      - paso: 3
        enum: "attempt_result"
        schema_destino: "progress_tracking"
        impacto: "Medio"
        script: "CREATE TYPE progress_tracking.attempt_result..."
      
      - paso: 4
        enum: "social_event_type"
        schema_destino: "social_features"
        impacto: "Medio"
        script: "CREATE TYPE social_features.social_event_type..."
      
      - paso: 5
        enum: "content_type"
        schema_destino: "content_management"
        impacto: "ALTO - Usado en AdminContentModule"
        script: "CREATE TYPE content_management.content_type..."
        nota: "REQUIERE COORDINACIÓN CON BACKEND"
    
    validacion_post_migracion:
      - "SELECT * FROM pg_type WHERE typname IN ('aggregation_period', 'metric_type', ...)"
      - "npm run test:backend"
      - "Verificar que backend compila sin errores"
  
  fase_2_functions:
    titulo: "Migración de Funciones"
    duracion_estimada: "2 días"
    prioridad: "ALTA"
    
    dependencias:
      - "Fase 1 (enums) debe estar completa"
    
    orden:
      - paso: 1
        funcion: "validate_date_range"
        schema_destino: "gamilit"
        impacto: "Bajo"
        razon: "No tiene dependencias"
      
      - paso: 2
        funcion: "cleanup_old_system_logs"
        schema_destino: "audit_logging"
        impacto: "Bajo"
      
      - paso: 3
        funcion: "cleanup_old_user_activity"
        schema_destino: "audit_logging"
        impacto: "Bajo"
      
      - paso: 4
        funcion: "is_feature_enabled"
        schema_destino: "system_configuration"
        impacto: "Alto"
        nota: "Función muy usada - verificar referencias"
      
      - paso: 5
        funcion: "update_feature_flag"
        schema_destino: "system_configuration"
        impacto: "Medio"
      
      - paso: 6
        funcion: "send_notification"
        schema_destino: "gamification_system"
        impacto: "Medio"
        dependencia: "Requiere log_system_event ya migrado"
      
      - paso: 7
        funcion: "log_system_event"
        schema_destino: "audit_logging"
        impacto: "Alto - Llamada por múltiples funciones"
        nota: "ÚLTIMO - Actualizar referencias en otras funciones"
    
    validacion:
      - "SELECT proname, nspname FROM pg_proc p JOIN pg_namespace n ON p.pronamespace = n.oid WHERE proname IN (...)"
      - "Ejecutar tests de cada función migrada"
  
  fase_3_triggers:
    titulo: "Limpieza de Triggers Obsoletos"
    duracion_estimada: "0.5 días"
    prioridad: "MEDIA"
    
    accion: "ELIMINAR archivos obsoletos"
    
    justificacion: |
      TODOS los triggers en public/ son OBSOLETOS.
      Ya fueron migrados a sus schemas correctos el 2025-11-08.
    
    archivos_a_eliminar:
      - "apps/database/ddl/schemas/public/triggers/01-trg_assignment_classrooms_updated_at.sql"
      - "apps/database/ddl/schemas/public/triggers/02-trg_assignment_exercises_updated_at.sql"
      - "apps/database/ddl/schemas/public/triggers/03-trg_assignment_students_updated_at.sql"
      - "apps/database/ddl/schemas/public/triggers/04-trg_assignment_submissions_updated_at.sql"
      - "apps/database/ddl/schemas/public/triggers/05-trg_assignments_updated_at.sql"
      - "apps/database/ddl/schemas/public/triggers/09-trg_teacher_notes_updated_at.sql"
      - "apps/database/ddl/schemas/public/triggers/10-trg_assignment_audit_creation.sql"
      - "apps/database/ddl/schemas/public/triggers/11-trg_assignment_submissions_publish.sql"
    
    verificacion_previa:
      - "Verificar que cada trigger existe en su schema correcto"
      - "Verificar que NO hay triggers huérfanos en base de datos"
      - "SELECT * FROM pg_trigger WHERE tgname LIKE 'trg_assignment%'"
    
    script_eliminacion: |
      # Eliminar archivos obsoletos de triggers
      rm apps/database/ddl/schemas/public/triggers/0*.sql
      rm apps/database/ddl/schemas/public/triggers/1*.sql
  
  fase_4_indexes:
    titulo: "Migración de Índices"
    duracion_estimada: "2 días"
    prioridad: "ALTA"
    
    estrategia: "Mover por grupo de schema destino"
    
    subggrupos:
      - grupo: "Gamification System (15 indexes)"
        schema_destino: "gamification_system"
        duracion: "0.5 días"
        crear_directorio: "apps/database/ddl/schemas/gamification_system/indexes/"
        indexes:
          - "idx_user_achievements_*"
          - "idx_user_ranks_*"
          - "idx_user_stats_*"
          - "idx_achievements_*"
      
      - grupo: "Audit Logging (9 indexes)"
        schema_destino: "audit_logging"
        duracion: "0.3 días"
        crear_directorio: "apps/database/ddl/schemas/audit_logging/indexes/"
        indexes:
          - "idx_user_activity_*"
          - "idx_audit_logs_*"
          - "idx_activity_*"
          - "idx_alerts_*"
      
      - grupo: "Auth Management (10 indexes)"
        schema_destino: "auth_management"
        duracion: "0.3 días"
        crear_directorio: "apps/database/ddl/schemas/auth_management/indexes/"
        indexes:
          - "idx_user_roles_*"
          - "idx_user_sessions_*"
          - "idx_user_suspensions_*"
      
      - grupo: "Educational Content (14 indexes)"
        schema_destino: "educational_content"
        duracion: "0.4 días"
        nota: "CORREGIR nombres de tablas sin schema calificado"
        crear_directorio: "apps/database/ddl/schemas/educational_content/indexes/"
        indexes:
          - "idx_assignments_*"
          - "idx_assignment_submissions_*"
          - "idx_assignment_exercises_*"
          - "idx_assignment_students_*"
      
      - grupo: "Social Features (2 indexes)"
        schema_destino: "social_features"
        duracion: "0.1 días"
        crear_directorio: "apps/database/ddl/schemas/social_features/indexes/"
        indexes:
          - "idx_assignment_classrooms_*"
    
    proceso_por_index:
      paso_1: "Mover archivo a directorio del schema destino"
      paso_2: "Actualizar CREATE INDEX para usar nombre calificado de tabla"
      paso_3: "Agregar COMMENT ON INDEX"
      paso_4: "Ejecutar script de creación"
      paso_5: "Validar existencia del índice"
    
    ejemplo_transformacion: |
      ANTES (public/indexes/idx_assignments_teacher_id.sql):
      CREATE INDEX idx_assignments_teacher_id ON assignments(teacher_id);
      
      DESPUÉS (educational_content/indexes/idx_assignments_teacher_id.sql):
      CREATE INDEX idx_assignments_teacher_id 
      ON educational_content.assignments(teacher_id);
      
      COMMENT ON INDEX educational_content.idx_assignments_teacher_id IS
      'Performance optimization for teacher assignments queries';
    
    validacion:
      - |
        SELECT schemaname, tablename, indexname 
        FROM pg_indexes 
        WHERE schemaname != 'public'
        ORDER BY schemaname, tablename;
      
      - "Verificar que NO quedan índices en public (excepto system tables)"
  
  fase_5_views:
    titulo: "Corrección y Migración de Views"
    duracion_estimada: "1 día"
    prioridad: "MEDIA"
    
    view_1:
      nombre: "assignment_submission_stats"
      accion: "MOVER"
      schema_destino: "educational_content"
      requiere_correccion: false
      
      pasos:
        - "Crear en educational_content"
        - "Crear alias temporal en public"
        - "Migrar queries de backend"
        - "Eliminar alias"
    
    view_2:
      nombre: "classroom_overview"
      accion: "CORREGIR Y MOVER"
      schema_destino: "social_features"
      requiere_correccion: true
      
      correcciones_necesarias:
        - "educational_content.classrooms → social_features.classrooms"
        - "Eliminar references a educational_content.chapters (no existe)"
        - "Corregir JOIN usando classroom_members M2M"
        - "Actualizar lógica de student count"
      
      pasos:
        - "CORREGIR referencias (CRÍTICO)"
        - "Probar que funciona"
        - "Mover a social_features"
        - "Crear alias en public"
        - "Migrar backend"
        - "Eliminar alias"
    
    view_3:
      nombre: "for"
      accion: "ELIMINAR"
      razon: "No se usa, funcionalidad trivial"
      
      verificacion_previa:
        - "grep -r '\"for\"' apps/backend"
        - "grep -r 'FROM for' apps/backend"
      
      si_se_usa:
        alternativa: "Reemplazar con generate_series() directo"
        ejemplo: "SELECT * FROM generate_series(1, 1000) AS iteration_number;"
  
  fase_6_cleanup:
    titulo: "Limpieza y Validación Final"
    duracion_estimada: "1 día"
    prioridad: "ALTA"
    
    tareas:
      - id: "C1"
        descripcion: "Eliminar directorio public/triggers/ (obsoleto)"
        comando: "rm -rf apps/database/ddl/schemas/public/triggers/"
      
      - id: "C2"
        descripcion: "Eliminar directorio public/indexes/ (vacío)"
        comando: "rm -rf apps/database/ddl/schemas/public/indexes/"
      
      - id: "C3"
        descripcion: "Eliminar archivos de enums obsoletos"
        comando: "rm apps/database/ddl/schemas/public/enums/*.sql"
      
      - id: "C4"
        descripcion: "Eliminar archivos de functions obsoletas"
        comando: "rm apps/database/ddl/schemas/public/functions/*.sql"
      
      - id: "C5"
        descripcion: "Actualizar init-database.sh para NO ejecutar scripts de public"
        archivo: "apps/database/scripts/init-database.sh"
      
      - id: "C6"
        descripcion: "Ejecutar validación de schema completo"
        comando: "npm run db:validate"
      
      - id: "C7"
        descripcion: "Ejecutar suite completa de tests"
        comandos:
          - "npm run test:backend"
          - "npm run test:e2e"
          - "npm run test:db"
      
      - id: "C8"
        descripcion: "Generar reporte de objetos en base de datos"
        script: |
          SELECT 
            n.nspname AS schema,
            CASE c.relkind
              WHEN 'r' THEN 'table'
              WHEN 'v' THEN 'view'
              WHEN 'i' THEN 'index'
              WHEN 'S' THEN 'sequence'
            END AS type,
            COUNT(*) AS count
          FROM pg_class c
          JOIN pg_namespace n ON c.relnamespace = n.oid
          WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
          GROUP BY n.nspname, c.relkind
          ORDER BY n.nspname, type;
      
      - id: "C9"
        descripcion: "Verificar que public solo tiene extensiones y system objects"
        validacion: |
          SELECT * FROM pg_tables WHERE schemaname = 'public';
          -- Resultado esperado: VACÍO (excepto spatial_ref_sys de PostGIS)
          
          SELECT * FROM pg_views WHERE schemaname = 'public';
          -- Resultado esperado: VACÍO
          
          SELECT proname FROM pg_proc p 
          JOIN pg_namespace n ON p.pronamespace = n.oid 
          WHERE n.nspname = 'public' AND proname NOT LIKE 'st_%';
          -- Resultado esperado: VACÍO (excepto PostGIS functions)

# =============================================================================
# 8. RESUMEN EJECUTIVO
# =============================================================================

resumen_ejecutivo:
  titulo: "Análisis Exhaustivo de Objetos en Schema PUBLIC"
  fecha: "2025-11-09"
  
  hallazgos_principales:
    - hallazgo: "82 objetos mal ubicados en public"
      severidad: "ALTA"
      detalle: "64 indexes, 7 functions, 5 enums, 3 views, 8 triggers (obsoletos)"
    
    - hallazgo: "5 ENUMs críticos en public"
      severidad: "ALTA"
      impacto: "Usados extensamente en backend y frontend"
      accion: "Migrar a schemas de dominio (audit_logging, progress_tracking, etc.)"
    
    - hallazgo: "64 índices sin schema calificado"
      severidad: "MEDIA"
      problema: "Nombres de tablas ambiguos (assignments, alerts, activity)"
      accion: "Mover y corregir a schemas correctos con nombres calificados"
    
    - hallazgo: "8 triggers obsoletos"
      severidad: "BAJA"
      razon: "Ya fueron migrados el 2025-11-08"
      accion: "ELIMINAR archivos"
    
    - hallazgo: "1 view rota (classroom_overview)"
      severidad: "CRÍTICA"
      problema: "Referencias a tablas inexistentes (educational_content.classrooms)"
      accion: "CORREGIR referencias antes de usar"
    
    - hallazgo: "7 funciones compartidas en public"
      severidad: "MEDIA"
      problema: "Funciones de utilidad sin home claro"
      accion: "Mover a schemas de dominio o gamilit"
  
  impacto_backend:
    severidad: "ALTO"
    objetos_criticos:
      - "content_type enum → Usado en AdminContentModule"
      - "is_feature_enabled function → Muy usada cross-cutting"
      - "send_notification function → Sistema de notificaciones"
    
    breaking_changes: true
    requiere_coordinacion: true
    testing_necesario: "Suite completa (unit + e2e + integration)"
  
  recomendaciones:
    - recomendacion: "Ejecutar migración en SPRINTS de 1 día cada uno"
      razon: "Minimizar riesgo, validar progresivamente"
    
    - recomendacion: "Comenzar con ENUMs (Fase 1)"
      razon: "Son fundamentales, alto impacto"
    
    - recomendacion: "Mantener aliases temporales en public"
      razon: "Backward compatibility durante migración de backend"
    
    - recomendacion: "ELIMINAR triggers obsoletos inmediatamente"
      razon: "Causan confusión, ya están en schemas correctos"
    
    - recomendacion: "CORREGIR classroom_overview antes de usar"
      razon: "Referencias incorrectas causarán errores en runtime"
  
  estimacion_esfuerzo:
    total_dias: 7.5
    desglose:
      preparacion: 1.0
      enums: 1.0
      functions: 2.0
      triggers: 0.5
      indexes: 2.0
      views: 1.0
      cleanup: 1.0
    
    riesgo: "MEDIO"
    mitigacion: "Migración gradual, testing exhaustivo, rollback plan"

# =============================================================================
# 9. DECISIONES ARQUITECTÓNICAS PENDIENTES
# =============================================================================

decisiones_pendientes:
  - decision: "D1: ¿Dónde colocar utility functions como validate_date_range?"
    opciones:
      A: "Mantener en public (schema de utilities)"
      B: "Mover a schema gamilit (utilities compartidas)"
      C: "Mover a schemas específicos (duplicar si necesario)"
    
    recomendacion: "OPCIÓN B: Mover a gamilit"
    razon: "Centralizar utilities, evitar public, mantener cohesión"
  
  - decision: "D2: ¿Qué hacer con is_feature_enabled (cross-cutting concern)?"
    opciones:
      A: "Mover a system_configuration (dueño de feature_flags)"
      B: "Mantener en public (accesible desde múltiples schemas)"
      C: "Mover a gamilit (utilities compartidas)"
    
    recomendacion: "OPCIÓN A: Mover a system_configuration"
    razon: "Domain ownership > cross-cutting convenience"
  
  - decision: "D3: ¿Crear schema 'gamilit' para utilities compartidas?"
    estado: "YA EXISTE gamilit schema"
    accion: "Usar gamilit para utility functions"
    funciones_candidatas:
      - "validate_date_range"
      - "update_updated_at_column (ya está en gamilit)"
  
  - decision: "D4: ¿Mantener aliases en public temporalmente?"
    recomendacion: "SÍ, durante migración de backend"
    duracion: "1-2 sprints"
    razon: "Minimizar breaking changes, migración gradual"

# =============================================================================
# 10. SCRIPTS DE VALIDACIÓN
# =============================================================================

scripts_validacion:
  script_1_objetos_en_public:
    descripcion: "Lista TODOS los objetos en schema public"
    sql: |
      SELECT 
        c.relname AS nombre,
        CASE c.relkind
          WHEN 'r' THEN 'TABLE'
          WHEN 'v' THEN 'VIEW'
          WHEN 'i' THEN 'INDEX'
          WHEN 'S' THEN 'SEQUENCE'
          WHEN 'm' THEN 'MATERIALIZED VIEW'
        END AS tipo,
        pg_size_pretty(pg_total_relation_size(c.oid)) AS tamaño
      FROM pg_class c
      JOIN pg_namespace n ON c.relnamespace = n.oid
      WHERE n.nspname = 'public'
        AND c.relkind IN ('r', 'v', 'i', 'S', 'm')
      ORDER BY tipo, nombre;
  
  script_2_enums_en_schemas:
    descripcion: "Verifica ubicación de ENUMs"
    sql: |
      SELECT 
        n.nspname AS schema,
        t.typname AS enum_name,
        array_agg(e.enumlabel ORDER BY e.enumsortorder) AS valores
      FROM pg_type t
      JOIN pg_namespace n ON t.typnamespace = n.oid
      JOIN pg_enum e ON t.oid = e.enumtypid
      WHERE t.typtype = 'e'
        AND n.nspname NOT IN ('pg_catalog', 'information_schema')
      GROUP BY n.nspname, t.typname
      ORDER BY n.nspname, t.typname;
  
  script_3_funciones_en_schemas:
    descripcion: "Lista funciones por schema"
    sql: |
      SELECT 
        n.nspname AS schema,
        p.proname AS function_name,
        pg_get_function_arguments(p.oid) AS argumentos,
        pg_get_function_result(p.oid) AS retorna
      FROM pg_proc p
      JOIN pg_namespace n ON p.pronamespace = n.oid
      WHERE n.nspname NOT IN ('pg_catalog', 'information_schema')
      ORDER BY n.nspname, p.proname;
  
  script_4_indices_huerfanos:
    descripcion: "Detecta índices que apuntan a tablas que no existen"
    sql: |
      SELECT 
        schemaname,
        tablename,
        indexname,
        indexdef
      FROM pg_indexes
      WHERE schemaname = 'public'
      ORDER BY tablename, indexname;
  
  script_5_dependencias_objetos:
    descripcion: "Muestra dependencias entre objetos"
    sql: |
      SELECT DISTINCT
        n1.nspname || '.' || c1.relname AS objeto_dependiente,
        c1.relkind AS tipo_dependiente,
        n2.nspname || '.' || c2.relname AS objeto_requerido,
        c2.relkind AS tipo_requerido
      FROM pg_depend d
      JOIN pg_class c1 ON d.objid = c1.oid
      JOIN pg_namespace n1 ON c1.relnamespace = n1.oid
      JOIN pg_class c2 ON d.refobjid = c2.oid
      JOIN pg_namespace n2 ON c2.relnamespace = n2.oid
      WHERE n1.nspname = 'public'
        AND d.deptype = 'n'
      ORDER BY objeto_dependiente;

# =============================================================================
# FIN DEL REPORTE
