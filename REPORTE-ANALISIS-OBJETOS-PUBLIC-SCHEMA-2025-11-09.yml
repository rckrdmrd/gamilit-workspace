          archivo: "apps/database/ddl/schemas/public/indexes/idx_alerts_type.sql"
          schema_destino: "audit_logging"
        
        - nombre: "idx_activity_user"
          tabla: "activity"
          tabla_posible: "audit_logging.user_activity"
          columnas: ["user_id"]
          archivo: "apps/database/ddl/schemas/public/indexes/idx_activity_user.sql"
          schema_destino: "audit_logging"
        
        - nombre: "idx_activity_type"
          tabla: "activity"
          tabla_posible: "audit_logging.user_activity"
          columnas: ["activity_type"]
          archivo: "apps/database/ddl/schemas/public/indexes/idx_activity_type.sql"
          schema_destino: "audit_logging"
        
        - nombre: "idx_activity_session"
          tabla: "activity"
          tabla_posible: "audit_logging.user_activity"
