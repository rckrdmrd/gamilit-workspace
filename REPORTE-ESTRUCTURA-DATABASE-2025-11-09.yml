problemas_globales:
  - tipo: "NUMERACION_INCONSISTENTE"
    descripcion: "No hay estándar unificado: algunos schemas numeran, otros no, otros mezclan"
    schemas_afectados: 
      - "content_management"
      - "educational_content"
      - "gamification_system"
      - "progress_tracking"
      - "public"
      - "social_features"
      - "system_configuration"
    impacto: "ALTO - Dificulta mantenimiento y orden de ejecución"
    
  - tipo: "NUMEROS_DUPLICADOS"
    descripcion: "Múltiples archivos con el mismo número en varias carpetas"
    schemas_afectados:
      - "auth_management (tables 08, 09, 10)"
      - "gamification_system (tables 08, 09; indexes 01, 02; rls-policies 02, 03; triggers 18)"
      - "gamilit (functions 09)"
      - "social_features (tables 07; rls-policies 02, 03)"
    impacto: "CRÍTICO - Provoca errores de ejecución en scripts secuenciales"
    
  - tipo: "SALTOS_NUMERACION"
    descripcion: "Numeración con gaps (ej: 01,02,03,08,09) sugiere eliminaciones sin renumeración"
    schemas_afectados:
      - "auth_management"
      - "gamification_system (triggers: 01,02,15-20)"
      - "gamilit (functions: 1-5,8-14)"
      - "progress_tracking (functions falta 02)"
      - "public (triggers falta 06-08)"
    impacto: "MEDIO - Dificulta rastreo y sugiere deuda técnica"
    
  - tipo: "TRIGGERS_MAL_NUMERADOS"
    descripcion: "Triggers numerados desde números altos (>20) en vez de 01-NN"
    schemas_afectados:
      - "content_management (08-10)"
      - "educational_content (11-14)"
      - "progress_tracking (21-23)"
      - "social_features (24-28)"
      - "system_configuration (29-30)"
    impacto: "MEDIO - Sugiere numeración global anterior incorrecta"
    razon: "Probablemente usaban numeración única global antes de separar por schemas"
    
  - tipo: "MEZCLA_ARCHIVOS_NUMERADOS_Y_NO"
    descripcion: "Carpetas con algunos archivos numerados y otros sin numerar"
    schemas_afectados:
      - "content_management/tables"
      - "educational_content/tables"
      - "gamification_system/functions"
      - "progress_tracking/tables"
      - "public/indexes"
      - "social_features/tables"
      - "system_configuration/tables"
    impacto: "ALTO - Sin criterio claro de qué numerar"
    
  - tipo: "NUMERACION_ABSURDA_PUBLIC_INDEXES"
    descripcion: "Indexes en public/ numerados desde 239 hasta 271"
    ubicacion: "public/indexes/"
    impacto: "CRÍTICO - Indica migración mal ejecutada o sistema heredado caótico"
    accion: "Renumerar completamente desde 01"
    
  - tipo: "CARPETAS_NO_ESTANDAR"
    descripcion: "Carpetas fuera del estándar DDL"
    casos:
      - "auth_management/validaciones/ (vacía)"
      - "gamification_system/functions/tests/"
      - "progress_tracking/functions/_deprecated/"
      - "public/enums/_deprecated/"
    impacto: "BAJO - Pero aumenta complejidad organizacional"
    
  - tipo: "CARPETAS_VACIAS"
    descripcion: "Carpetas creadas pero sin archivos SQL"
    casos:
      - "auth/functions/"
      - "auth_management/validaciones/"
      - "lti_integration/functions/"
      - "lti_integration/triggers/"
    impacto: "BAJO - Ruido en estructura"
    accion: "Eliminar o documentar por qué existen"
    
  - tipo: "FALTA_DOCUMENTACION"
    descripcion: "No hay archivos _MAP.md ni README.md en schemas"
    schemas_afectados: "TODOS (solo 2 README en subcarpetas _deprecated)"
    impacto: "MEDIO - Dificulta navegación y onboarding"
    
  - tipo: "PUBLIC_SCHEMA_CONTAMINADO"
    descripcion: "public/ debería estar casi vacío pero tiene 87 objetos DDL"
    detalle:
      enums: 5
      functions: 7
      indexes: 64
      triggers: 8
      views: 3
    impacto: "ALTO - Mala práctica PostgreSQL, dificulta gestión RLS"
    accion: "Migrar objetos a schemas apropiados o justificar presencia"
    
  - tipo: "SCHEMAS_INCOMPLETOS"
    descripcion: "Schemas con estructura parcial (solo 1-2 tipos de objetos)"
    casos:
      - "admin_dashboard (solo views)"
      - "gamilit (solo functions)"
      - "storage (solo enums)"
    impacto: "MEDIO - Sugiere schemas en desarrollo o mal organizados"
    
  - tipo: "ARCHIVOS_SOSPECHOSOS"
    descripcion: "Archivos con nombres problemáticos o mal formados"
    casos:
      - "public/views/03-for.sql (usa palabra reservada 'for')"
    impacto: "BAJO - Pero puede causar confusión"

estructura_propuesta:
  filosofia:
    - "Numeración obligatoria en tables, triggers, rls-policies"
    - "Numeración opcional (por defecto SIN numerar) en functions, enums, views"
    - "Numeración obligatoria en indexes solo si orden de creación importa"
    - "Usar prefijos consistentes para claridad"
    - "Documentación obligatoria por schema (_MAP.md)"
    
  estandar:
    carpetas_requeridas:
      - "tables (si el schema tiene datos)"
      - "rls-policies (si hay tables)"
      - "triggers (si hay tables con lógica)"
    
    carpetas_opcionales:
      - "enums (si se definen tipos)"
      - "functions (si hay lógica de negocio)"
      - "views (si hay consultas comunes)"
      - "materialized-views (si hay agregaciones)"
      - "indexes (si hay optimizaciones específicas)"
    
    carpetas_especiales:
      - "tests/ (dentro de functions/ o como subcarpeta)"
      - "_deprecated/ (para código legacy temporal)"
      - "_migrations/ (para scripts one-time)"
    
    convenciones_nomenclatura:
      tables: 
        patron: "NN-nombre_tabla.sql"
        descripcion: "Numeración obligatoria 01-99, orden de dependencias"
        ejemplo: "01-users.sql, 02-profiles.sql, 03-user_stats.sql"
        
      functions:
        patron: "nombre_funcion.sql"
        descripcion: "SIN numeración por defecto, orden alfabético"
        ejemplo: "calculate_level.sql, award_ml_coins.sql"
        excepcion: "Si hay dependencias funcionales, numerar: 01-base.sql, 02-derived.sql"
        
      enums:
        patron: "nombre_enum.sql"
        descripcion: "SIN numeración, un archivo por enum"
        ejemplo: "maya_rank.sql, notification_type.sql"
        
      triggers:
        patron: "NN-trg_evento_tabla.sql"
        descripcion: "Numeración obligatoria, prefijo 'trg_'"
        ejemplo: "01-trg_users_updated_at.sql, 02-trg_profile_audit.sql"
        
      rls-policies:
        patron: "NN-descripcion_policies.sql"
        descripcion: "Numeración obligatoria"
        recomendado: "01-enable-rls.sql, 02-tabla-policies.sql, 03-otra-tabla-policies.sql"
        
      indexes:
        patron: "NN-idx_tabla_columna.sql o idx_tabla_columna.sql"
        descripcion: "Numerar SOLO si orden de creación importa (ej: índices dependientes)"
        ejemplo: "idx_users_email_unique.sql, idx_achievements_metadata_gin.sql"
        
      views:
        patron: "nombre_view.sql o NN-nombre_view.sql"
        descripcion: "Numerar si hay dependencias entre views"
        ejemplo: "user_stats_summary.sql, 01-base_leaderboard.sql"
        
      materialized_views:
        patron: "NN-mv_nombre.sql"
        descripcion: "Numeración recomendada, prefijo 'mv_'"
        ejemplo: "01-mv_global_leaderboard.sql"
    
    numeracion:
      inicio: "01"
      incremento: 1
      padding: 2
      formato: "%02d"
      rango_maximo: "01-99 (por carpeta)"
      
    separadores:
      preferido: "guión (-)"
      permitido: "underscore (_) solo en nombres de objetos"
      ejemplo_correcto: "01-user_stats.sql"
      ejemplo_incorrecto: "01_user_stats.sql"
    
    documentacion:
      archivos_requeridos:
        - path: "_MAP.md"
          ubicacion: "raiz de cada schema/"
          contenido: |
            # Schema: {nombre_schema}
            
            ## Propósito
            Descripción del schema
            
            ## Objetos
            - Tables: N archivos
            - Functions: N archivos
            - ...
            
            ## Dependencias
            - Depende de: schema_x, schema_y
            - Usado por: schema_z
            
            ## Orden de ejecución
            1. tables/
            2. enums/
            3. functions/
            ...
        
        - path: "README.md"
          ubicacion: "dentro de carpetas especiales (_deprecated, tests, _migrations)"
          contenido: "Explicar por qué existe la carpeta y qué contiene"
      
      comentarios_sql:
        header_obligatorio: |
          -- =============================================================================
          -- {TIPO}: {schema}.{nombre_objeto}
          -- =============================================================================
          -- Purpose: {descripción breve}
          -- Priority: {P0|P1|P2|P3}
          -- Responsibility: {código-responsable}
          -- Created: {YYYY-MM-DD}
          -- Dependencies: {lista de dependencias}
          -- =============================================================================
        
        footer_recomendado: |
          -- Documentation comment
          COMMENT ON {tipo} {schema}.{nombre} IS '{descripción detallada}';

plan_reorganizacion:
  
  fase_0_preparacion:
    - accion: "BACKUP_COMPLETO"
      comando: "git commit -am 'Pre-reorganization backup'"
      
    - accion: "CREAR_BRANCH"
      comando: "git checkout -b refactor/database-structure-reorganization"
      
    - accion: "DOCUMENTAR_ESTADO_ACTUAL"
      script: "scripts/audit-current-structure.sh"
  
  fase_1_limpieza_critica:
    descripcion: "Eliminar duplicados y carpetas problemáticas"
    
    pasos:
      - accion: "ELIMINAR_CARPETAS_VACIAS"
        ubicaciones:
          - "auth/functions/"
          - "auth_management/validaciones/"
          - "lti_integration/functions/"
          - "lti_integration/triggers/"
        comando: "rmdir {ubicacion}"
        
      - accion: "CONSOLIDAR_DEPRECATED"
        origen: 
          - "progress_tracking/functions/_deprecated/"
          - "public/enums/_deprecated/"
        destino: "apps/database/backups/deprecated-objects-2025-11-09/"
        comando: |
          mkdir -p apps/database/backups/deprecated-objects-2025-11-09/
          mv progress_tracking/functions/_deprecated/* backups/deprecated-objects-2025-11-09/
          mv public/enums/_deprecated/* backups/deprecated-objects-2025-11-09/
          rmdir progress_tracking/functions/_deprecated
          rmdir public/enums/_deprecated
        
      - accion: "RESOLVER_NUMEROS_DUPLICADOS"
        estrategia: "Renumerar archivos más recientes (según git log)"
        schemas_afectados:
          - schema: "auth_management"
            carpeta: "tables"
            duplicados:
              - numero: "08"
                archivos: ["08-security_events.sql", "08-parent_accounts.sql"]
                decision: "Renumerar parent_accounts a 10"
              - numero: "09"
                archivos: ["09-user_preferences.sql", "09-parent_student_links.sql"]
                decision: "Renumerar parent_student_links a 11"
              - numero: "10"
                archivos: ["10-user_roles.sql", "10-parent_notifications.sql"]
                decision: "Renumerar parent_notifications a 12"
          
          - schema: "gamification_system"
            carpeta: "tables"
            duplicados:
              - numero: "08"
                archivos: ["08-notifications.sql", "08-comodin_usage_log.sql"]
                decision: "Renumerar comodin_usage_log a 14"
              - numero: "09"
                archivos: ["09-leaderboard_metadata.sql", "09-comodin_usage_tracking.sql"]
                decision: "Renumerar comodin_usage_tracking a 15"
          
          - schema: "social_features"
            carpeta: "tables"
            duplicados:
              - numero: "07"
                archivos: ["07-team_challenges.sql", "07-peer_challenges.sql"]
                decision: "Renumerar peer_challenges a 10"
        
        script: |
          # auth_management/tables
          cd apps/database/ddl/schemas/auth_management/tables
          git mv 08-parent_accounts.sql 10-parent_accounts.sql
          git mv 09-parent_student_links.sql 11-parent_student_links.sql
          git mv 10-parent_notifications.sql 12-parent_notifications.sql
          
          # gamification_system/tables
          cd ../../gamification_system/tables
          git mv 08-comodin_usage_log.sql 14-comodin_usage_log.sql
          git mv 09-comodin_usage_tracking.sql 15-comodin_usage_tracking.sql
          
          # social_features/tables
          cd ../../social_features/tables
          git mv 07-peer_challenges.sql 10-peer_challenges.sql
  
  fase_2_estandarizacion_numeracion:
    descripcion: "Aplicar convenciones de numeración uniformes"
    
    pasos:
      - accion: "RENUMERAR_TABLES_MEZCLADOS"
        estrategia: "Numerar TODOS los archivos de tables/ secuencialmente"
        schemas:
          - "content_management/tables"
          - "educational_content/tables"
          - "progress_tracking/tables"
          - "social_features/tables"
          - "system_configuration/tables"
        
        ejemplo_content_management: |
          cd content_management/tables
          # Ya numerados: 01-03 (mantener)
          git mv content_authors.sql 04-content_authors.sql
          git mv content_categories.sql 05-content_categories.sql
          git mv media_metadata.sql 06-media_metadata.sql
        
      - accion: "RENUMERAR_TRIGGERS_DESDE_01"
        descripcion: "Triggers deben empezar en 01, no heredar numeración global"
        schemas:
          - schema: "content_management"
            actual: "08-10"
            nuevo: "01-03"
          - schema: "educational_content"
            actual: "11-14"
            nuevo: "01-04"
          - schema: "progress_tracking"
            actual: "21-23"
            nuevo: "01-03"
          - schema: "social_features"
            actual: "24-28"
            nuevo: "01-05"
          - schema: "system_configuration"
            actual: "29-30"
            nuevo: "01-02"
        
        script: |
          cd content_management/triggers
          git mv 08-trg_content_templates_updated_at.sql 01-trg_content_templates_updated_at.sql
          git mv 09-trg_marie_curie_content_updated_at.sql 02-trg_marie_curie_content_updated_at.sql
          git mv 10-trg_media_files_updated_at.sql 03-trg_media_files_updated_at.sql
          
          # Repetir para otros schemas...
      
      - accion: "DENUMERAR_FUNCTIONS"
        descripcion: "Quitar numeración de funciones que no tienen dependencias"
        schemas:
          - "gamification_system/functions (conservar 06-08, quitar otros)"
        
        ejemplo: |
          cd gamification_system/functions
          # Solo conservar numeración en funciones con dependencias conocidas
          # Resto: git mv NN-nombre.sql nombre.sql
      
      - accion: "RENUMERAR_PUBLIC_INDEXES"
        descripcion: "Renumerar indexes de public/ desde 01 (actualmente 239-271)"
        script: |
          cd public/indexes
          # Generar mapeo automático
          i=1
          for file in $(ls -1 *.sql | sort); do
            if [[ $file =~ ^[0-9]+ ]]; then
              nuevo=$(printf "%02d-${file##*-}" $i)
              git mv "$file" "$nuevo"
              ((i++))
            fi
          done
  
  fase_3_migracion_public_schema:
    descripcion: "Mover objetos de public/ a schemas apropiados"
    
    pasos:
      - accion: "MOVER_ENUMS_PUBLIC"
        mapeo:
          - enum: "aggregation_period.sql"
            destino: "system_configuration/enums/"
          - enum: "attempt_result.sql"
            destino: "progress_tracking/enums/"
          - enum: "content_type.sql"
            destino: "content_management/enums/"
          - enum: "processing_status.sql"
            destino: "content_management/enums/"
          - enum: "subscription_status.sql"
            destino: "auth_management/enums/"
        
        script: |
          cd public/enums
          mkdir -p ../../system_configuration/enums
          mkdir -p ../../progress_tracking/enums
          mkdir -p ../../content_management/enums
          mkdir -p ../../auth_management/enums
          
          git mv aggregation_period.sql ../../system_configuration/enums/
          git mv attempt_result.sql ../../progress_tracking/enums/
          git mv content_type.sql ../../content_management/enums/
          git mv processing_status.sql ../../content_management/enums/
          git mv subscription_status.sql ../../auth_management/enums/
      
      - accion: "EVALUAR_FUNCTIONS_PUBLIC"
        estrategia: "Analizar cada función y decidir destino o mantener en public si son utilidades globales"
        funciones_a_revisar:
          - "01-cleanup_old_system_logs.sql → system_configuration/functions/"
          - "02-cleanup_old_user_activity.sql → audit_logging/functions/"
          - "03-is_feature_enabled.sql → system_configuration/functions/"
          - "04-trg_classroom_updated_at.sql → social_features/triggers/ (es trigger, no function)"
          - "05-update_user_stats_after_achievement.sql → gamification_system/functions/"
          - "06-update_user_stats_on_exercise.sql → progress_tracking/functions/"
          - "07-verify_user_permission.sql → auth_management/functions/ (duplicado?)"
      
      - accion: "REORGANIZAR_INDEXES_PUBLIC"
        descripcion: "64 indexes deben moverse a schemas de las tablas que indexan"
        estrategia: "Script automático que lee nombre de index y mueve a schema de la tabla"
        script: |
          # Analizar cada index y extraer nombre de tabla
          cd public/indexes
          for idx_file in *.sql; do
            # Extraer nombre de tabla del index
            table=$(grep -oP 'ON \K\w+\.\w+' "$idx_file" | cut -d. -f2)
            # Buscar schema de esa tabla
            schema=$(find ../.. -name "${table}.sql" -o -name "*-${table}.sql" | cut -d/ -f2)
            if [ -n "$schema" ]; then
              mkdir -p "../../${schema}/indexes"
              git mv "$idx_file" "../../${schema}/indexes/"
            fi
          done
      
      - accion: "MOVER_TRIGGERS_PUBLIC"
        mapeo:
          - "01-trg_assignment_classrooms_updated_at.sql → social_features/triggers/"
          - "02-trg_assignment_exercises_updated_at.sql → educational_content/triggers/"
          - "03-trg_assignment_students_updated_at.sql → educational_content/triggers/"
          - "04-trg_assignment_submissions_updated_at.sql → educational_content/triggers/"
          - "05-trg_assignments_updated_at.sql → educational_content/triggers/"
          - "09-trg_user_activity_updated_at.sql → audit_logging/triggers/"
          - "10-trg_user_sessions_updated_at.sql → auth_management/triggers/"
          - "11-trg_user_stats_updated_at.sql → gamification_system/triggers/"
      
      - accion: "EVALUAR_VIEWS_PUBLIC"
        vistas:
          - "01-assignment_submission_stats.sql → educational_content/views/"
          - "02-classroom_overview.sql → social_features/views/"
          - "03-for.sql → ELIMINAR O RENOMBRAR (nombre problemático)"
  
  fase_4_crear_estructura_faltante:
    descripcion: "Crear carpetas faltantes donde sean necesarias"
    
    pasos:
      - accion: "CREAR_CARPETAS_ENUMS"
        schemas:
          - "content_management"
          - "auth_management"
          - "system_configuration"
        comando: |
          mkdir -p content_management/enums
          mkdir -p auth_management/enums
          mkdir -p system_configuration/enums
      
      - accion: "CREAR_CARPETAS_FUNCTIONS"
        schemas:
          - "content_management"
          - "system_configuration"
        comando: |
          mkdir -p content_management/functions
          mkdir -p system_configuration/functions
      
      - accion: "CREAR_CARPETAS_INDEXES"
        descripcion: "Donde hayan tablas sin indexes definidos"
        schemas:
          - "educational_content"
          - "social_features"
          - "system_configuration"
  
  fase_5_documentacion:
    descripcion: "Crear documentación estándar"
    
    pasos:
      - accion: "GENERAR_MAP_FILES"
        script: |
          #!/bin/bash
          # Para cada schema, generar _MAP.md
          
          for schema_dir in apps/database/ddl/schemas/*/; do
            schema=$(basename "$schema_dir")
            map_file="${schema_dir}_MAP.md"
            
            cat > "$map_file" << MAPEOF
          # Schema: ${schema}
          
          ## Propósito
          [Descripción del schema]
          
          ## Estructura
          
          MAPEOF
            
            # Listar carpetas y archivos
            for folder in tables enums functions triggers rls-policies indexes views materialized-views; do
              if [ -d "${schema_dir}${folder}" ]; then
                count=$(find "${schema_dir}${folder}" -name "*.sql" | wc -l)
                echo "### ${folder}/ (${count} archivos)" >> "$map_file"
                echo "" >> "$map_file"
                find "${schema_dir}${folder}" -name "*.sql" -exec basename {} \; | sort | sed 's/^/- /' >> "$map_file"
                echo "" >> "$map_file"
              fi
            done
            
            cat >> "$map_file" << MAPEOF
          
          ## Dependencias
          
          - Depende de: [schemas de los que depende]
          - Usado por: [schemas que lo usan]
          
          ## Orden de ejecución
          
          1. enums/
          2. tables/
          3. indexes/
          4. functions/
          5. triggers/
          6. rls-policies/
          7. views/
          8. materialized-views/
          
          ## Notas
          
          [Notas adicionales]
          MAPEOF
          done
      
      - accion: "CREAR_README_PRINCIPAL"
        ubicacion: "apps/database/ddl/schemas/README.md"
        contenido: |
          # Database DDL Structure
          
          ## Convenciones
          
          ### Numeración
          - Tables: OBLIGATORIA (01-99)
          - Triggers: OBLIGATORIA (01-99)
          - RLS Policies: OBLIGATORIA (01-99)
          - Functions: OPCIONAL (solo si hay dependencias)
          - Enums: NO numerar
          - Views: OPCIONAL (si hay dependencias)
          
          ### Nomenclatura
          - Tables: `NN-nombre_tabla.sql`
          - Functions: `nombre_funcion.sql`
          - Triggers: `NN-trg_evento_tabla.sql`
          - Indexes: `idx_tabla_columna.sql`
          - Views: `nombre_view.sql`
          
          ## Schemas
          
          [Lista de schemas con descripción breve]
          
          ## Orden de ejecución global
          
          1. auth
          2. auth_management
          3. storage
          4. content_management
          5. educational_content
          6. gamification_system
          7. progress_tracking
          8. social_features
          9. system_configuration
          10. audit_logging
          11. admin_dashboard
          12. gamilit
          13. lti_integration
      
      - accion: "ACTUALIZAR_COMENTARIOS_SQL"
        descripcion: "Agregar headers estándar a archivos que no los tengan"
        script: "scripts/add-sql-headers.sh"

  fase_6_validacion:
    descripcion: "Verificar que la reorganización sea correcta"
    
    pasos:
      - accion: "VALIDAR_NUMERACION"
        script: |
          #!/bin/bash
          # Verificar que no haya duplicados ni saltos
          for schema_dir in apps/database/ddl/schemas/*/; do
            for folder in tables triggers rls-policies; do
              if [ -d "${schema_dir}${folder}" ]; then
                nums=$(find "${schema_dir}${folder}" -name "*.sql" | \
                       grep -oP '^\d+' | sort -n)
                # Verificar secuencia
                # ...
              fi
            done
          done
      
      - accion: "VALIDAR_REFERENCIAS"
        descripcion: "Verificar que referencias entre archivos sigan válidas después del move"
        script: "scripts/validate-schema-references.sh"
      
      - accion: "TEST_INIT_DATABASE"
        descripcion: "Ejecutar init-database.sh en ambiente de prueba"
        comando: "cd apps/database && ./scripts/init-database.sh (en test DB)"
      
      - accion: "GENERAR_REPORTE_CAMBIOS"
        script: |
          git diff --name-status > reorganization-changes.txt
          git diff --stat > reorganization-stats.txt

scripts_reorganizacion:
  
  script_principal: |
    #!/bin/bash
    # =============================================================================
    # Database Structure Reorganization Script
    # =============================================================================
    # Execute: apps/database/scripts/reorganize-structure.sh
    # =============================================================================
    
    set -euo pipefail
    
    SCRIPTS_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    SCHEMAS_DIR="${SCRIPTS_DIR}/../ddl/schemas"
    BACKUP_DIR="${SCRIPTS_DIR}/../backups/reorganization-$(date +%Y-%m-%d)"
    
    echo "🔄 Database Structure Reorganization"
    echo "====================================="
    echo ""
    
    # Fase 0: Preparación
    echo "📦 Fase 0: Preparación"
    mkdir -p "$BACKUP_DIR"
    git status > "${BACKUP_DIR}/git-status-before.txt"
    
    # Fase 1: Limpieza crítica
    echo "🧹 Fase 1: Limpieza crítica"
    
    # Eliminar carpetas vacías
    find "$SCHEMAS_DIR" -type d -empty -delete
    
    # Consolidar deprecated
    mkdir -p "${BACKUP_DIR}/deprecated"
    find "$SCHEMAS_DIR" -path "*/_deprecated/*" -type f -exec mv {} "${BACKUP_DIR}/deprecated/" \;
    find "$SCHEMAS_DIR" -type d -name "_deprecated" -delete
    
    # Resolver duplicados (auth_management/tables)
    cd "${SCHEMAS_DIR}/auth_management/tables"
    [ -f "08-parent_accounts.sql" ] && git mv 08-parent_accounts.sql 10-parent_accounts.sql
    [ -f "09-parent_student_links.sql" ] && git mv 09-parent_student_links.sql 11-parent_student_links.sql
    [ -f "10-parent_notifications.sql" ] && git mv 10-parent_notifications.sql 12-parent_notifications.sql
    
    # Resolver duplicados (gamification_system/tables)
    cd "${SCHEMAS_DIR}/gamification_system/tables"
    [ -f "08-comodin_usage_log.sql" ] && git mv 08-comodin_usage_log.sql 14-comodin_usage_log.sql
    [ -f "09-comodin_usage_tracking.sql" ] && git mv 09-comodin_usage_tracking.sql 15-comodin_usage_tracking.sql
    
    # Resolver duplicados (social_features/tables)
    cd "${SCHEMAS_DIR}/social_features/tables"
    [ -f "07-peer_challenges.sql" ] && git mv 07-peer_challenges.sql 10-peer_challenges.sql
    
    # Fase 2: Estandarización de numeración
    echo "🔢 Fase 2: Estandarización de numeración"
    
    # Renumerar triggers (content_management)
    cd "${SCHEMAS_DIR}/content_management/triggers"
    [ -f "08-trg_content_templates_updated_at.sql" ] && \
      git mv 08-trg_content_templates_updated_at.sql 01-trg_content_templates_updated_at.sql
    [ -f "09-trg_marie_curie_content_updated_at.sql" ] && \
      git mv 09-trg_marie_curie_content_updated_at.sql 02-trg_marie_curie_content_updated_at.sql
    [ -f "10-trg_media_files_updated_at.sql" ] && \
      git mv 10-trg_media_files_updated_at.sql 03-trg_media_files_updated_at.sql
    
    # Renumerar triggers (educational_content)
    cd "${SCHEMAS_DIR}/educational_content/triggers"
    [ -f "11-trg_assessment_rubrics_updated_at.sql" ] && \
      git mv 11-trg_assessment_rubrics_updated_at.sql 01-trg_assessment_rubrics_updated_at.sql
    [ -f "12-trg_exercises_updated_at.sql" ] && \
      git mv 12-trg_exercises_updated_at.sql 02-trg_exercises_updated_at.sql
    [ -f "13-trg_media_resources_updated_at.sql" ] && \
      git mv 13-trg_media_resources_updated_at.sql 03-trg_media_resources_updated_at.sql
    [ -f "14-trg_modules_updated_at.sql" ] && \
      git mv 14-trg_modules_updated_at.sql 04-trg_modules_updated_at.sql
    
    # Renumerar triggers (progress_tracking)
    cd "${SCHEMAS_DIR}/progress_tracking/triggers"
    [ -f "21-trg_update_user_stats_on_exercise.sql" ] && \
      git mv 21-trg_update_user_stats_on_exercise.sql 01-trg_update_user_stats_on_exercise.sql
    [ -f "22-exercise_submissions_updated_at.sql" ] && \
      git mv 22-exercise_submissions_updated_at.sql 02-trg_exercise_submissions_updated_at.sql
    [ -f "23-trg_module_progress_updated_at.sql" ] && \
      git mv 23-trg_module_progress_updated_at.sql 03-trg_module_progress_updated_at.sql
    
    # Renumerar triggers (social_features)
    cd "${SCHEMAS_DIR}/social_features/triggers"
    [ -f "24-trg_classroom_members_updated_at.sql" ] && \
      git mv 24-trg_classroom_members_updated_at.sql 01-trg_classroom_members_updated_at.sql
    [ -f "25-trg_update_classroom_count.sql" ] && \
      git mv 25-trg_update_classroom_count.sql 02-trg_update_classroom_count.sql
    [ -f "26-trg_classrooms_updated_at.sql" ] && \
      git mv 26-trg_classrooms_updated_at.sql 03-trg_classrooms_updated_at.sql
    [ -f "27-trg_friendships_updated_at.sql" ] && \
      git mv 27-trg_friendships_updated_at.sql 04-trg_friendships_updated_at.sql
    [ -f "28-trg_schools_updated_at.sql" ] && \
      git mv 28-trg_schools_updated_at.sql 05-trg_schools_updated_at.sql
    
    # Renumerar triggers (system_configuration)
    cd "${SCHEMAS_DIR}/system_configuration/triggers"
    [ -f "29-trg_feature_flags_updated_at.sql" ] && \
      git mv 29-trg_feature_flags_updated_at.sql 01-trg_feature_flags_updated_at.sql
    [ -f "30-trg_system_settings_updated_at.sql" ] && \
      git mv 30-trg_system_settings_updated_at.sql 02-trg_system_settings_updated_at.sql
    
    # Numerar tables mezclados (content_management)
    cd "${SCHEMAS_DIR}/content_management/tables"
    [ -f "content_authors.sql" ] && git mv content_authors.sql 04-content_authors.sql
    [ -f "content_categories.sql" ] && git mv content_categories.sql 05-content_categories.sql
    [ -f "media_metadata.sql" ] && git mv media_metadata.sql 06-media_metadata.sql
    
    # Numerar tables mezclados (educational_content)
    cd "${SCHEMAS_DIR}/educational_content/tables"
    i=5
    for file in assignment_exercises.sql assignment_students.sql assignment_submissions.sql assignments.sql \
                content_approvals.sql content_metadata.sql content_tags.sql exercise_answers.sql \
                exercise_options.sql module_dependencies.sql taxonomies.sql; do
      [ -f "$file" ] && git mv "$file" "$(printf "%02d-$file" $i)"
      ((i++))
    done
    
    # Fase 3: Crear carpetas faltantes
    echo "📁 Fase 3: Crear estructura faltante"
    mkdir -p "${SCHEMAS_DIR}/content_management/enums"
    mkdir -p "${SCHEMAS_DIR}/content_management/functions"
    mkdir -p "${SCHEMAS_DIR}/auth_management/enums"
    mkdir -p "${SCHEMAS_DIR}/system_configuration/enums"
    mkdir -p "${SCHEMAS_DIR}/system_configuration/functions"
    mkdir -p "${SCHEMAS_DIR}/educational_content/indexes"
    mkdir -p "${SCHEMAS_DIR}/social_features/indexes"
    
    # Fase 4: Migración de public schema (enums)
    echo "📦 Fase 4: Migrar objetos de public/"
    cd "${SCHEMAS_DIR}/public/enums"
    [ -f "aggregation_period.sql" ] && git mv aggregation_period.sql ../../system_configuration/enums/
    [ -f "attempt_result.sql" ] && git mv attempt_result.sql ../../progress_tracking/enums/
    [ -f "content_type.sql" ] && git mv content_type.sql ../../content_management/enums/
    [ -f "processing_status.sql" ] && git mv processing_status.sql ../../content_management/enums/
    [ -f "subscription_status.sql" ] && git mv subscription_status.sql ../../auth_management/enums/
    
    echo ""
    echo "✅ Reorganización completada"
    echo ""
    echo "📊 Resumen de cambios:"
    git status --short
    
    echo ""
    echo "⚠️  IMPORTANTE: Revisar cambios antes de commit"
    echo "   git diff --name-status"
    echo "   git add -p"
  
  script_validacion: |
    #!/bin/bash
    # =============================================================================
    # Database Structure Validation Script
    # =============================================================================
    
    set -euo pipefail
    
    SCHEMAS_DIR="apps/database/ddl/schemas"
    ERRORS=0
    
    echo "🔍 Validando estructura de base de datos"
    echo "========================================="
    echo ""
    
    # Validar numeración sin duplicados
    echo "📋 Validando numeración..."
    
    for schema_dir in "$SCHEMAS_DIR"/*/; do
      schema=$(basename "$schema_dir")
      
      for folder in tables triggers rls-policies; do
        folder_path="${schema_dir}${folder}"
        
        if [ -d "$folder_path" ]; then
          # Extraer números
          nums=$(find "$folder_path" -maxdepth 1 -name "[0-9]*-*.sql" | \
                 sed 's/.*\/\([0-9]\+\)-.*/\1/' | sort -n)
          
          if [ -n "$nums" ]; then
            # Verificar duplicados
            duplicates=$(echo "$nums" | uniq -d)
            if [ -n "$duplicates" ]; then
              echo "  ❌ $schema/$folder/ - Números duplicados: $duplicates"
              ((ERRORS++))
            else
              echo "  ✅ $schema/$folder/ - OK"
            fi
          fi
        fi
      done
    done
    
    echo ""
    echo "📁 Validando carpetas vacías..."
    
    empty_folders=$(find "$SCHEMAS_DIR" -type d -empty)
    if [ -n "$empty_folders" ]; then
      echo "  ⚠️  Carpetas vacías encontradas:"
      echo "$empty_folders"
    else
      echo "  ✅ No hay carpetas vacías"
    fi
    
    echo ""
    echo "📄 Validando documentación..."
    
    missing_maps=0
    for schema_dir in "$SCHEMAS_DIR"/*/; do
      schema=$(basename "$schema_dir")
      
      if [ ! -f "${schema_dir}_MAP.md" ]; then
        echo "  ⚠️  Falta _MAP.md en $schema/"
        ((missing_maps++))
      fi
    done
    
    if [ $missing_maps -eq 0 ]; then
      echo "  ✅ Todos los schemas tienen _MAP.md"
    else
      echo "  ⚠️  $missing_maps schemas sin _MAP.md"
    fi
    
    echo ""
    echo "================================="
    if [ $ERRORS -eq 0 ]; then
      echo "✅ Validación completada sin errores críticos"
      exit 0
    else
      echo "❌ Validación completada con $ERRORS errores"
      exit 1
    fi
  
  script_generar_map_files: |
    #!/bin/bash
    # =============================================================================
    # Generate _MAP.md files for all schemas
    # =============================================================================
    
    SCHEMAS_DIR="apps/database/ddl/schemas"
    
    for schema_dir in "$SCHEMAS_DIR"/*/; do
      schema=$(basename "$schema_dir")
      map_file="${schema_dir}_MAP.md"
      
      echo "📝 Generando _MAP.md para $schema..."
      
      cat > "$map_file" << MAPEOF
    # Schema: ${schema}
    
    ## Propósito
    
    [Descripción del schema - COMPLETAR]
    
    ## Estructura
    
    MAPEOF
      
      # Listar carpetas y archivos
      for folder in tables enums functions triggers rls-policies indexes views materialized-views; do
        folder_path="${schema_dir}${folder}"
        
        if [ -d "$folder_path" ]; then
          count=$(find "$folder_path" -maxdepth 1 -name "*.sql" | wc -l)
          
          if [ $count -gt 0 ]; then
            echo "### ${folder}/ (${count} archivos)" >> "$map_file"
            echo "" >> "$map_file"
            find "$folder_path" -maxdepth 1 -name "*.sql" -exec basename {} \; | \
              sort | sed 's/^/- /' >> "$map_file"
            echo "" >> "$map_file"
          fi
        fi
      done
      
      cat >> "$map_file" << 'MAPEOF'
    ## Dependencias
    
    - **Depende de**: [schemas]
    - **Usado por**: [schemas]
    
    ## Orden de ejecución
    
    1. enums/
    2. tables/
    3. indexes/
    4. functions/
    5. triggers/
    6. rls-policies/
    7. views/
    8. materialized-views/
    
    ## Notas
    
    [Notas adicionales]
    MAPEOF
    done
    
    echo ""
    echo "✅ _MAP.md files generados para todos los schemas"

resumen_impacto:
  
  archivos_afectados:
    renombrados: "~150 archivos"
    movidos: "~80 archivos (desde public/)"
    eliminados: "~15 archivos (deprecated)"
    creados: "~20 archivos (_MAP.md, README.md)"
  
  beneficios:
    - "Numeración consistente y predecible"
    - "Fácil navegación en IDE"
    - "Scripts de inicialización más robustos"
    - "Reducción de errores de orden de ejecución"
    - "Documentación clara de estructura"
    - "Separación limpia de responsabilidades por schema"
    - "Public schema limpio (best practice PostgreSQL)"
  
  riesgos:
    - "Referencias rotas si hay hardcoded paths en backend"
    - "Merge conflicts con branches activos"
    - "Tiempo de revisión del PR (~2-3 horas)"
  
  mitigacion:
    - "Ejecutar en branch separado"
    - "Validar con scripts automatizados"
    - "Test completo de init-database.sh"
    - "Comunicar cambios al equipo antes de merge"

timeline_estimado:
  preparacion: "30 minutos"
  fase_1_limpieza: "1 hora"
  fase_2_numeracion: "2 horas"
  fase_3_estructura: "30 minutos"
  fase_4_migracion_public: "1.5 horas"
  fase_5_documentacion: "1 hora"
  fase_6_validacion: "1 hora"
  total: "7.5 horas"
  
  recomendacion: "Ejecutar en 2-3 sesiones de trabajo, con validaciones intermedias"
