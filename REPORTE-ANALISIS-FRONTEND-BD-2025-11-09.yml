  accion_requerida: "Actualizar comentarios JSDoc (opcional, no crítico)"

# ============================================================================
# ARQUITECTURA DEL FRONTEND
# ============================================================================

arquitectura:
  patron_comunicacion: "REST API"

  capas:
    - nombre: "API Layer"
      ubicacion: "src/services/api/"
      descripcion: "Cliente Axios con interceptores para auth y errores"
      archivos_principales:
        - "apiClient.ts"
        - "apiConfig.ts"
        - "apiErrorHandler.ts"
        - "educationalAPI.ts"
        - "notificationsAPI.ts"

    - nombre: "Types Layer"
      ubicacion: "src/shared/types/"
      descripcion: "Interfaces TypeScript sincronizadas con Backend DTOs"
      archivos_principales:
        - "educational.types.ts"
        - "gamification.types.ts"
        - "progress.types.ts"
        - "social.types.ts"
        - "profile.types.ts"

    - nombre: "Constants Layer"
      ubicacion: "src/shared/constants/"
      descripcion: "ENUMs compartidos con Backend (sincronizados con BD)"
      archivos_principales:
        - "enums.constants.ts"
        - "ranks.constants.ts"

  comunicacion_backend:
    metodo: "HTTP REST"
    base_url: "VITE_API_URL || http://localhost:3006/api"
    autenticacion: "Bearer Token (JWT)"
    formato_datos: "JSON"

  no_usa:
    - "Supabase Client directo"
    - "GraphQL queries"
    - "RPC calls directos a funciones de BD"
    - "Referencias directas a schemas de BD"
    - "SQL queries"

