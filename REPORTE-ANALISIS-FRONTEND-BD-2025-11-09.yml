# ============================================================================
# PATRON REST API - DESACOPLAMIENTO
# ============================================================================

patron_rest_api:
  descripcion: |
    El frontend de GAMILIT usa un patrón REST API completamente desacoplado.
    NO hay acceso directo a la base de datos desde el navegador.

  flujo_datos:
    - capa: "Frontend (React)"
      descripcion: "Componentes y páginas solicitan datos mediante hooks"
      ejemplo: "useModules(), useUserStats(), useNotifications()"

    - capa: "API Layer (Axios)"
      descripcion: "Cliente HTTP hace requests al backend REST API"
      ubicacion: "src/services/api/educationalAPI.ts"
      ejemplo: "apiClient.get('/api/v1/modules')"

    - capa: "Backend (NestJS)"
      descripcion: "API REST procesa requests y consulta BD"
      endpoints: "/api/v1/educational, /api/v1/gamification, etc"

    - capa: "Database (PostgreSQL)"
      descripcion: "TypeORM ejecuta queries contra schemas organizados"
      schemas: "educational_content, gamification_system, progress_tracking, etc"

  ventajas_arquitectura:
    - "✅ Desacoplamiento total Frontend ↔ Backend ↔ Database"
    - "✅ Cambios en BD no afectan directamente al frontend"
    - "✅ Backend controla toda la lógica de negocio"
    - "✅ Frontend solo consume DTOs vía HTTP"
    - "✅ Seguridad: No hay queries SQL en el navegador"
    - "✅ Escalabilidad: API puede cache, optimizar, etc"

  no_hay_riesgo_por:
    reorganizacion_schemas: |
      Los schemas de BD pueden reorganizarse libremente porque el frontend
      solo consume la API REST. El backend absorbe todos los cambios.

    renombrado_funciones: |
      Las funciones de PostgreSQL son llamadas solo por el backend.
      El frontend no tiene awareness de funciones de BD.

    migracion_enums: |
      Los ENUMs son mapeados en backend a TypeScript y expuestos vía API.
      El frontend usa ENUMs TypeScript sincronizados, no ENUMs de PostgreSQL.

# ============================================================================
# SINCRONIZACIÓN TYPES FRONTEND ↔ BACKEND
# ============================================================================

sincronizacion_types:
  patron: "Mirror Types"
  descripcion: |
    El frontend mantiene interfaces TypeScript que son "mirrors" de los
    DTOs del backend. Esta sincronización se hace manualmente pero está
    bien documentada.

  archivos_sincronizados:

    - frontend: "shared/types/educational.types.ts"
      backend: "modules/educational/dto/*.dto.ts"
      entidades: ["Module", "Exercise", "ModuleProgress"]
      estado: "SINCRONIZADO ✅"
      nota: "Frontend tiene campos adicionales para UI (progress_percentage, etc)"

    - frontend: "shared/types/gamification.types.ts"
      backend: "modules/gamification/dto/*.dto.ts"
      entidades: ["UserStats", "MayaRank", "MLCoinsBalance"]
      estado: "SINCRONIZADO ✅"
      nota: "UserStats es idéntico a backend entity"

    - frontend: "shared/types/progress.types.ts"
      backend: "modules/progress/entities/*.entity.ts"
      entidades: ["ModuleProgress", "ExerciseAttempt", "ProgressSummary"]
      estado: "SINCRONIZADO ✅"
      nota: "ModuleProgress tiene 30+ campos sincronizados con entity"

    - frontend: "shared/types/social.types.ts"
      backend: "modules/social/entities/*.entity.ts"
      entidades: ["Friendship", "Team", "Classroom", "School"]
      estado: "SINCRONIZADO ✅"
      nota: "Incluye DTOs de creación y actualización"

    - frontend: "shared/types/profile.types.ts"
      backend: "modules/auth/entities/user.entity.ts"
      entidades: ["Profile", "UserPreferences"]
      estado: "SINCRONIZADO ✅"
      nota: "Profile mapea a auth_management.profiles en BD"

  constantes_sincronizadas:

    - frontend: "shared/constants/enums.constants.ts"
      backend: "shared/constants/enums.constants.ts"
      total_enums: 32
      estado: "SINCRONIZADO ✅"
      nota: "Archivo compartido entre apps monorepo"

    - frontend: "shared/constants/ranks.constants.ts"
      backend: "shared/constants/ranks.constants.ts"
      estado: "SINCRONIZADO ✅"
      nota: "Configuración de rangos maya"

  proceso_sincronizacion:
    actual: "Manual - Desarrollador actualiza types cuando backend cambia"
    propuesto: "Automatizar con script sync-types.ts similar a sync-enums.ts"

    validacion:
      metodo: "TypeScript compiler detecta incompatibilidades en build"
      ejemplo: "Si backend cambia DTO, frontend tendrá type errors en API calls"

# ============================================================================
# RECOMENDACIONES
# ============================================================================

recomendaciones:

  # --------------------------------------------------------------------------
  # RECOMENDACIONES DE DOCUMENTACIÓN
  # --------------------------------------------------------------------------

  documentacion:

    - id: "REC-DOC-001"
      titulo: "Actualizar comentarios JSDoc con schemas correctos"
      prioridad: "P2 - MEDIA"
      esfuerzo: "10 minutos"
      impacto: "Bajo - Solo documentación"

      archivos_a_modificar:
        - archivo: "apps/frontend/src/shared/types/educational.types.ts"
          linea: 8
          cambio: "public.difficulty_level → educational_content.difficulty_level"

        - archivo: "apps/frontend/src/shared/constants/enums.constants.ts"
          linea: 253
          cambio: "public.notification_type → gamification_system.notification_type"

      razon: |
        Aunque no afecta funcionalidad, los comentarios incorrectos pueden
        confundir a desarrolladores que busquen la ubicación de ENUMs en DDL.

    - id: "REC-DOC-002"
      titulo: "Documentar arquitectura REST API en README"
      prioridad: "P3 - BAJA"
      esfuerzo: "30 minutos"
      impacto: "Medio - Ayuda a nuevos desarrolladores"

      ubicacion_propuesta: "apps/frontend/README.md"

      contenido_sugerido: |
        ## Arquitectura de Comunicación con Backend

        El frontend de GAMILIT NO accede directamente a la base de datos.
        Toda la comunicación se hace vía API REST usando Axios.

        ### Flujo de Datos
        ```
        Component → Hook → API Client → Backend REST → TypeORM → PostgreSQL
        ```

        ### No Usamos
        - ❌ Supabase Client directo
        - ❌ GraphQL queries
        - ❌ RPC calls a funciones de BD
        - ❌ SQL queries en frontend

        ### Sincronización Types
        Los types de `src/shared/types/` son "mirrors" de los DTOs del backend.
        Cuando el backend actualiza un DTO, debe actualizarse el type correspondiente.

  # --------------------------------------------------------------------------
  # RECOMENDACIONES TÉCNICAS
  # --------------------------------------------------------------------------

  tecnicas:

    - id: "REC-TEC-001"
      titulo: "Implementar script de sincronización de types"
      prioridad: "P3 - BAJA"
      esfuerzo: "2-4 horas"
      impacto: "Alto - Previene desincronización"

      propuesta: |
        Crear un script similar a sync-enums.ts que valide que los types
        del frontend estén sincronizados con los DTOs del backend.

        Opciones:
        1. Script que compara interfaces TypeScript (complejo)
        2. Shared package en monorepo con types (recomendado)
        3. Generación automática desde OpenAPI/Swagger

      ejemplo_implementacion: |
        # Opción 2: Shared Package (RECOMENDADO)

        1. Crear: packages/shared-types/
        2. Mover types compartidos allí
        3. Importar desde frontend y backend

        ```typescript
        // Frontend
        import { Module, Exercise } from '@gamilit/shared-types';

        // Backend
        import { Module, Exercise } from '@gamilit/shared-types';
        ```

        Ventaja: Un solo source of truth, imposible desincronizar.

    - id: "REC-TEC-002"
      titulo: "Agregar validación de schemas en CI/CD"
      prioridad: "P3 - BAJA"
      esfuerzo: "1 hora"
      impacto: "Bajo - Detección temprana"

      propuesta: |
        Agregar step en CI que valide que comentarios JSDoc referencien
        schemas correctos según DDL actual.

        ```bash
        # Script de validación
        npm run validate:schema-references
        ```

      implementacion: |
        Script que:
        1. Lee comentarios @see DDL de archivos TypeScript
        2. Verifica que schemas/enums existan en DDL
        3. Falla CI si hay referencias a schemas inexistentes

  # --------------------------------------------------------------------------
  # RECOMENDACIONES DE ARQUITECTURA
  # --------------------------------------------------------------------------

  arquitectura:

    - id: "REC-ARQ-001"
      titulo: "Mantener arquitectura REST API desacoplada"
      prioridad: "P0 - CRÍTICA"
      esfuerzo: "N/A - Ya implementado"
      impacto: "Crítico - Core architecture"

      recomendacion: |
        ✅ MANTENER el patrón actual de REST API + Axios.
        ❌ NO introducir acceso directo a Supabase en frontend.
        ❌ NO usar GraphQL queries directas desde componentes.

        Razones:
        - Seguridad: Backend controla acceso a datos
        - Mantenibilidad: Cambios en BD no afectan frontend
        - Escalabilidad: Backend puede optimizar queries
        - Testing: Frontend puede mockearse fácilmente

    - id: "REC-ARQ-002"
      titulo: "Continuar usando ENUMs TypeScript sincronizados"
      prioridad: "P0 - CRÍTICA"
      esfuerzo: "N/A - Ya implementado"
      impacto: "Crítico - Type safety"

      recomendacion: |
        ✅ MANTENER sistema actual de ENUMs en enums.constants.ts
        ✅ CONTINUAR sincronizando con backend via shared constants
        ❌ NO referenciar ENUMs de PostgreSQL directamente

        El sistema actual funciona perfectamente:
        - PostgreSQL ENUM → Backend TypeScript Enum → Frontend TypeScript Enum
        - Sincronización garantizada por compilador TypeScript
        - Cambios en BD se propagan via backend

# ============================================================================
# PLAN DE ACCIÓN
# ============================================================================

plan_accion:

  acciones_requeridas: 2
  acciones_opcionales: 4

  # --------------------------------------------------------------------------
  # ACCIONES REQUERIDAS (P0-P2)
  # --------------------------------------------------------------------------

  requeridas:

    - id: "ACCION-001"
      titulo: "Actualizar comentario JSDoc en educational.types.ts"
