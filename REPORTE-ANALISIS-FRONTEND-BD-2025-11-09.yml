        sed -i 's/public\.difficulty_level/educational_content.difficulty_level/' \
          apps/frontend/src/shared/types/educational.types.ts

    - id: "ACCION-002"
      titulo: "Actualizar comentario JSDoc en enums.constants.ts"
      prioridad: "P2 - MEDIA"
      esfuerzo: "1 minuto"
      responsable: "Desarrollador Frontend"

      archivo: "apps/frontend/src/shared/constants/enums.constants.ts"
      linea: 253

      cambio:
        antes: "@see DDL: public.notification_type ENUM"
        despues: |
          @see DDL: gamification_system.notification_type ENUM
          @see DDL: apps/database/ddl/schemas/gamification_system/enums/notification_type.sql

      comando: |
