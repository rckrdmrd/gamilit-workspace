# ============================================================================
# ANEXOS
# ============================================================================

anexos:

  # --------------------------------------------------------------------------
  # ANEXO A: ESTRUCTURA DE DIRECTORIOS FRONTEND
  # --------------------------------------------------------------------------

  estructura_directorios:
    apps/frontend/src/:
      - app/ # Configuración de aplicación
      - apps/ # Aplicaciones (student, admin, teacher)
      - components/ # Componentes compartidos
      - features/ # Features por módulo
      - hooks/ # Custom React hooks
      - lib/api/ # Clientes API (deprecated, usar services/api)
      - pages/ # Páginas de routing
      - services/api/ # API clients y configuración
      - shared/ # Código compartido
        - constants/ # ENUMs y constantes
        - types/ # Interfaces TypeScript
        - hooks/ # Hooks compartidos
        - components/ # Componentes compartidos
        - schemas/ # Zod schemas de validación
        - factories/ # Factory functions
      - stories/ # Storybook stories
      - test/ # Configuración de tests

  # --------------------------------------------------------------------------
  # ANEXO B: ARCHIVOS CLAVE
  # --------------------------------------------------------------------------

  archivos_clave:

    api_clients:
      - path: "services/api/apiClient.ts"
        descripcion: "Cliente Axios configurado con interceptores"

      - path: "services/api/educationalAPI.ts"
        descripcion: "API de módulos y ejercicios"
        endpoints: ["/modules", "/exercises", "/progress"]

      - path: "services/api/notificationsAPI.ts"
        descripcion: "API de notificaciones"
        endpoints: ["/notifications"]

      - path: "lib/api/client.ts"
        descripcion: "Cliente API legacy (deprecated)"

    types:
      - path: "shared/types/educational.types.ts"
        descripcion: "Types de contenido educativo"
        interfaces: ["Module", "Exercise", "ModuleWithProgress"]

      - path: "shared/types/gamification.types.ts"
        descripcion: "Types de gamificación"
        interfaces: ["UserStats", "MayaRank", "MLCoinsBalance"]

      - path: "shared/types/progress.types.ts"
        descripcion: "Types de progreso"
        interfaces: ["ModuleProgress", "ExerciseAttempt", "ProgressSummary"]

      - path: "shared/types/social.types.ts"
        descripcion: "Types de features sociales"
        interfaces: ["Friendship", "Team", "Classroom", "School"]

      - path: "shared/types/profile.types.ts"
        descripcion: "Types de perfiles de usuario"
        interfaces: ["Profile", "ProfileWithStats", "UserPreferences"]

    constants:
      - path: "shared/constants/enums.constants.ts"
        descripcion: "ENUMs sincronizados con BD y backend"
        total_enums: 32
        nota: "Archivo compartido en monorepo"

      - path: "shared/constants/ranks.constants.ts"
        descripcion: "Configuración de rangos maya"

  # --------------------------------------------------------------------------
  # ANEXO C: ENDPOINTS DE API USADOS
  # --------------------------------------------------------------------------

  endpoints_api:
    base_url: "VITE_API_URL || http://localhost:3006/api"

    educational:
      - GET /modules
      - GET /modules/:id
      - GET /modules/:id/exercises
      - GET /exercises/:id
      - POST /exercises/:id/submit
      - GET /users/:userId/progress

    gamification:
      - GET /users/:userId/stats
      - GET /users/:userId/rank
      - POST /ml-coins/transaction

    notifications:
      - GET /notifications
      - POST /notifications/send
      - PATCH /notifications/:id/read

    social:
      - GET /friendships
      - POST /friendships
      - GET /teams
      - POST /teams
      - GET /classrooms

  # --------------------------------------------------------------------------
  # ANEXO D: COMPARACIÓN SCHEMAS BD vs TYPES FRONTEND
  # --------------------------------------------------------------------------

  comparacion_schemas:

    educational_content:
      tabla: "modules"
      type_frontend: "Module (educational.types.ts)"
      campos_sincronizados: 30+
      estado: "SINCRONIZADO ✅"

    educational_content:
      tabla: "exercises"
      type_frontend: "Exercise (educational.types.ts)"
      campos_sincronizados: 40+
      estado: "SINCRONIZADO ✅"

    progress_tracking:
      tabla: "module_progress"
      type_frontend: "ModuleProgress (progress.types.ts)"
      campos_sincronizados: 35+
      estado: "SINCRONIZADO ✅"

    gamification_system:
      tabla: "user_stats"
      type_frontend: "UserStats (gamification.types.ts)"
      campos_sincronizados: 15+
      estado: "SINCRONIZADO ✅"

    auth_management:
      tabla: "profiles"
      type_frontend: "Profile (profile.types.ts)"
      campos_sincronizados: 25+
      estado: "SINCRONIZADO ✅"

    social_features:
      tabla: "friendships"
      type_frontend: "Friendship (social.types.ts)"
      campos_sincronizados: 7
      estado: "SINCRONIZADO ✅"

    social_features:
      tabla: "teams"
      type_frontend: "Team (social.types.ts)"
      campos_sincronizados: 8
      estado: "SINCRONIZADO ✅"

    social_features:
      tabla: "classrooms"
      type_frontend: "Classroom (social.types.ts)"
      campos_sincronizados: 9
      estado: "SINCRONIZADO ✅"

