    - name: "Admin Portal"
      url: "http://localhost:3000/admin"
      description: "Administrative portal"
      key_features:
        - "User management"
        - "School configuration"
        - "System reports"
        - "Content management"

    - name: "Parent Portal"
      url: "http://localhost:3000/parent"
      description: "Parent monitoring portal"
      key_features:
        - "Child progress view"
