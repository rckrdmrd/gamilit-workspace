# STACK TECNOLÓGICO
# ─────────────────────────────────────────────────────────────────────────────

stack:
  backend:
    framework: "NestJS"
    version: "^11.0.0"
    lenguaje: "TypeScript 5.9+"
    orm: "TypeORM 0.3.x"
    auth: "JWT + Passport + RBAC"
    realtime: "Socket.IO 4.8+"

  frontend:
    framework: "React"
    version: "^19.0.0"
    lenguaje: "TypeScript 5.x"
    ui: "Tailwind CSS 4.x"
    estado: "Zustand 5.x"
    build: "Vite 6.x"

  database:
    motor: "PostgreSQL"
    version: "15"
    schemas: 18
    schemas_active: 16
    rls: true

  infraestructura:
    contenedores: "Docker"
    orquestacion: "docker-compose"
    cache: "Redis"
    proceso: "PM2"

