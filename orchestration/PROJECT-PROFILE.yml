# ─────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────

proyecto:
  nombre: "Gamilit"
  nombre_completo: "Gamificación Maya para la Lectoescritura en Tecnología"
  codigo: "gamilit"
  tipo: "STANDALONE_HEREDERO"
  nivel: "2A"
  version: "14.9.4"
  rol_especial: "REFERENCIA_INTERNA"

descripcion: |
  Plataforma EdTech con gamificación educativa basada en cultura maya.
  Sistema académico completo con:
  - 4 portales (Estudiante, Maestro, Administrador, Padres)
  - 5 módulos educativos (23 tipos de ejercicios)
  - Sistema de gamificación maya (5 rangos, ML Coins, logros, misiones)
  - Leaderboards competitivos y sistema social
  - Analytics y reportes de progreso
  - Portal de padres con notificaciones

  Es el proyecto más maduro del workspace y sirve como fuente
  de patrones reutilizables.

