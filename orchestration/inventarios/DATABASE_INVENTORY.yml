# -------------------------------------------------------------------------------
# COHERENCIA ENTITY-DDL
# -------------------------------------------------------------------------------

coherencia:
  entities_backend: 156          # 156 files, 157 @Entity classes (message.entity.ts has 2: Message + MessageParticipant). Corrected 2026-02-27 (was 159)
  tablas_ddl: 173
  tablas_con_entity: 157         # 173 - 16 data_warehouse = 157 non-DW tables, all have entities
  tablas_sin_entity: 16          # All 16 in data_warehouse schema
  cobertura: "90.2%"             # 156 files / 173 tables (100% for non-data_warehouse)
  entity_registration: "100%"        # All entities registered in forFeature() and barrel exports
  gap_justificado: "16 data_warehouse (dim_*, fact_*, etl_*, ml_*) — intencional, sin ORM"

