# ===============================================================================
# DATABASE INVENTORY - GAMILIT
# ===============================================================================

version: "8.7.0"
fecha: "2026-02-18"
proyecto: "gamilit"
database: "gamilit_platform"
engine: "PostgreSQL 15"

# -------------------------------------------------------------------------------
# RESUMEN
# -------------------------------------------------------------------------------

resumen:
  schemas: 18
  tablas: 169                 # 168 SQL files - 1 MV file + 2 multi-table files
  views: 22
  materialized_views: 7
  funciones: 183               # 183 = DDL source files, ~249 = PostgreSQL runtime functions (includes auto-generated trigger functions)
  triggers: 67                 # CREATE TRIGGER statements (not trigger functions)
  rls_policies: 231            # 231 DDL source (CREATE POLICY statements). Runtime: 471 (includes global RLS files 07/07b/07c/07d). +4 user_purchases (FIX-P0-1, 2026-02-18)
  foreign_keys: 299              # +1 missions_template_id_fkey (REC-009)
  enums: 42                     # 42 CREATE TYPE AS ENUM (incl. alert_severity, alert_status in audit_logging)
  index_statements: 979          # +1 implicit from UNIQUE constraint missions_user_template_type_date_unique (REC-001)

# -------------------------------------------------------------------------------
# SCHEMAS (Nombres fisicos DDL)
# -------------------------------------------------------------------------------
# NOTA: Estos nombres corresponden a los directorios en apps/database/ddl/schemas/
# Los nombres conceptuales usados en documentacion pueden diferir.
# Ver: docs/20-architecture/schema-reference/_INDEX.md para mapeo completo.
# -------------------------------------------------------------------------------

schemas:
  activos:
    - nombre: "auth"
      tablas: 1
      descripcion: "Base auth (compatible Supabase): tabla users"
      tipo: "core"

    - nombre: "auth_management"
      tablas: 17
      descripcion: "Perfiles, roles, tenants, sesiones, tokens, parents, RBAC"
      tipo: "core"
      conceptual: "auth + tenants + parents (en docs)"

    - nombre: "educational_content"
      tablas: 21
      descripcion: "Modulos educativos, ejercicios (23 tipos), asignaciones, rubricas"
      tipo: "domain"
      conceptual: "education (en docs)"

    - nombre: "gamification_system"
      tablas: 21                    # Verified 2026-02-18: 19 root + 2 _cross_schema (classroom_missions, comodin_uses). +1 user_equipped_items (21-user_equipped_items.sql)
      descripcion: "XP, rangos maya, achievements, ML Coins, tienda, misiones, leaderboards, equipamiento"
      tipo: "domain"
      conceptual: "gamification + store + missions + leaderboard (en docs)"

    - nombre: "progress_tracking"
      tablas: 21
      descripcion: "Progreso de estudiantes, intentos, learning paths, mastery, certificados"
      tipo: "domain"
      conceptual: "education (parcial, en docs)"

    - nombre: "social_features"
      tablas: 30
      descripcion: "Escuelas, aulas, equipos, guilds, amistades, challenges, foros"
      tipo: "domain"
      conceptual: "social + classrooms + reports (parcial, en docs)"

    - nombre: "notifications"
      tablas: 7
      descripcion: "Multi-canal: email, push, in-app, SMS con templates y cola"
      tipo: "support"

    - nombre: "content_management"
      tablas: 10
      descripcion: "Templates, media, moderacion, tags, versiones"
      tipo: "domain"
      conceptual: "content (en docs)"

    - nombre: "system_configuration"
      tablas: 9
      descripcion: "Settings, feature flags, rate limits, parametros gamificacion"
      tipo: "support"
      conceptual: "settings (en docs)"

    - nombre: "audit_logging"
      tablas: 7
      descripcion: "Auditoria, logs sistema, alertas, activity tracking"
      tipo: "support"
      conceptual: "audit (en docs)"

    - nombre: "admin_dashboard"
      tablas: 3                  # bulk_operations, admin_reports, metrics_history (01-materialized_views.sql = MVs, not tables)
      views: 7
      materialized_views: 3
      descripcion: "Dashboard admin, bulk ops, reportes, metricas"
      tipo: "support"
      conceptual: "analytics + reports (parcial, en docs)"

    - nombre: "data_warehouse"
      tablas: 16
      views: 3
      descripcion: "Star schema: 8 dimensiones, 4 facts, 2 ML, 2 ETL"
      tipo: "analytics"
      conceptual: "analytics (parcial, en docs)"

    - nombre: "communication"
      tablas: 4                  # messages, message_participants, conversations, conversation_participants
      descripcion: "Mensajeria interna: messages, participants, conversations"
      tipo: "domain"

    - nombre: "lti_integration"
      tablas: 3
      descripcion: "LTI 1.3: consumers, sessions, grade passback"
      tipo: "integration"
      conceptual: "integrations (placeholder en docs, pero activo en DDL)"

    - nombre: "gamilit"
      tablas: 0
      funciones: 37
      views: 1
      descripcion: "Funciones utilitarias compartidas (now_mexico, RLS helpers, triggers)"
      tipo: "utility"

    - nombre: "optimization"
      tablas: 0
      descripcion: "Indexes y triggers de optimizacion"
      tipo: "performance"

  placeholder:
    - nombre: "public"
      descripcion: "Schema publico legacy, vacio"
    - nombre: "storage"
      descripcion: "Storage backend, vacio (placeholder)"

# -------------------------------------------------------------------------------
# MATERIALIZED VIEWS (7)
# -------------------------------------------------------------------------------

materialized_views:
  - nombre: "mv_global_leaderboard"
    schema: "gamification_system"
    refresh: "15 min"
    descripcion: "Ranking global XP"

  - nombre: "mv_classroom_leaderboard"
    schema: "gamification_system"
    refresh: "5 min"
    descripcion: "Rankings por aula"

  - nombre: "mv_weekly_leaderboard"
    schema: "gamification_system"
    refresh: "15 min"
    descripcion: "Ranking semanal (reset lunes)"

  - nombre: "mv_mechanic_leaderboard"
    schema: "gamification_system"
    refresh: "15 min"
    descripcion: "Ranking por tipo de ejercicio"

  - nombre: "(3 MVs en admin_dashboard)"
    schema: "admin_dashboard"
    refresh: "Variable"
    descripcion: "Vistas materializadas administrativas"

