resumen:
  schemas: 18
  tablas: 173                 # 173 ^CREATE TABLE in tables/**/*.sql: 171 files (166 main + 5 _cross_schema), 2 multi-table (guild_missions, conversation_participants). Verified 2026-02-21
  views: 18                   # 18 ^CREATE VIEW in views/*.sql (18 files, 18 views). Verified 2026-02-21. Was 22 (overcounted)
  materialized_views: 7
  funciones: 158               # 158 ^CREATE FUNCTION in functions/*.sql (116 files). Verified 2026-02-21. Note: ~44 additional inline functions in table/trigger/view files
  triggers: 68                 # 68 CREATE TRIGGER in triggers/*.sql (37 files). Verified 2026-02-21. Note: ~64 additional inline triggers in table/function files
  rls_policies: 251            # 251 ^CREATE POLICY in rls-policies/*.sql (37 files). Verified 2026-02-21. Note: ~143 additional inline policies in table files
  foreign_keys: 301              # 299 + missions_exercise_id_fkey + mission_templates_exercise_id_fkey (exercise_id FK added to missions/mission_templates)
  enums: 42                     # 42 CREATE TYPE AS ENUM (incl. alert_severity, alert_status in audit_logging)
  index_statements: 979          # +1 implicit from UNIQUE constraint missions_user_template_type_date_unique (REC-001)
  uuid_standardization: "131 placeholder UUIDs replaced with gen_random_uuid() + dynamic lookups across ~25 seed files (2026-02-21)"

