      descripcion: "Eliminacion completa y recreacion (usuario + BD). Acepta --env dev|prod --force"
    - nombre: "recreate-database-dev.sh"
      descripcion: "Wrapper DEV: ejecuta recreate-database.sh --env dev"
    - nombre: "recreate-database-prod.sh"
      descripcion: "Wrapper PROD: ejecuta recreate-database.sh --env prod"
  utilidades:
    - nombre: "force-recreate-all.sh"
      descripcion: "Recreacion forzada sin confirmacion"
    - nombre: "pre-deploy-backup.sh"
      descripcion: "Backup antes de deploy"
    - nombre: "update-env-files.sh"
      descripcion: "Actualizar archivos .env"
    - nombre: "validar-integridad.sh"
      descripcion: "Validacion de integridad de BD"
    - nombre: "validate-ddl-coverage.sh"
      descripcion: "Validar cobertura DDL vs entities"
    - nombre: "validate-ddl-organization.sh"
      descripcion: "Validar organizacion de archivos DDL"

