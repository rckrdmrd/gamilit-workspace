# -------------------------------------------------------------------------------
# SEGURIDAD
# -------------------------------------------------------------------------------

seguridad:
  rls_activo: true
  total_policies: 231           # 231 DDL source. Runtime: 471 (+4 user_purchases FIX-P0-1, 2026-02-18)
  tenant_column: "tenant_id"
  context_method: "SET LOCAL app.current_tenant_id"

# -------------------------------------------------------------------------------
# COHERENCIA ENTITY-DDL
# -------------------------------------------------------------------------------

coherencia:
  entities_backend: 153          # 152 files, 153 @Entity classes (message.entity.ts has 2)
  tablas_ddl: 169
  tablas_con_entity: 153
  tablas_sin_entity: 16          # All 16 in data_warehouse schema
  cobertura: "90.5%"             # 153/169
  entity_registration: "100%"        # All 153 entities registered in forFeature() and barrel exports (FIX P2, 2026-02-17)
  gap_justificado: "16 data_warehouse (dim_*, fact_*, etl_*, ml_*) — intencional, sin ORM"

