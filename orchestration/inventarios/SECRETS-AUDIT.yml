# =============================================================================
# SECRETS-AUDIT.yml - GAMILIT
# =============================================================================
# Auditoria y Estado de Secrets del Proyecto
# Responsable: @PERFIL_SECRETS_MANAGER
# =============================================================================

version: "1.0.0"
fecha_creacion: "2026-01-18"
fecha_actualizacion: "2026-01-18"
responsable: "@PERFIL_SECRETS_MANAGER"

# =============================================================================
# ESTADO GENERAL
# =============================================================================

estado_general:
  salud: "VERDE"
  ultima_auditoria: "2026-01-18"
  proxima_auditoria: "2026-02-18"
  alertas_activas: 0
  issues_resueltos_recientes: 2

# =============================================================================
# INVENTARIO DE SECRETS
# =============================================================================

secrets_inventario:
  total_variables: 15
  sensibles: 7
  no_sensibles: 8

  por_categoria:
    database:
      total: 6
      sensibles: 1
      variables:
        - nombre: "DB_HOST"
          sensible: false
          rotacion: "N/A"
          formato: "hostname"
          ejemplo: "localhost"

        - nombre: "DB_PORT"
          sensible: false
          rotacion: "N/A"
          formato: "numero (1024-65535)"
          ejemplo: "5432"

        - nombre: "DB_NAME"
          sensible: false
          rotacion: "N/A"
          formato: "string (snake_case)"
          ejemplo: "gamilit_platform"

        - nombre: "DB_USER"
          sensible: false
          rotacion: "N/A"
          formato: "string (snake_case)"
          ejemplo: "gamilit_user"

        - nombre: "DB_PASSWORD"
          sensible: true
          rotacion: "90 dias"
          formato: "string (32+ caracteres)"
          generacion: "openssl rand -base64 32 | tr -d '=+/'"

        - nombre: "DATABASE_URL"
          sensible: true
          rotacion: "Con DB_PASSWORD"
          formato: "postgresql://{user}:{pass}@{host}:{port}/{db}"

    authentication:
      total: 4
      sensibles: 3
      variables:
        - nombre: "JWT_SECRET"
          sensible: true
          rotacion: "90 dias"
          formato: "string (64+ bytes base64)"
          generacion: "openssl rand -base64 64"

        - nombre: "JWT_REFRESH_SECRET"
          sensible: true
          rotacion: "90 dias"
          formato: "string (64+ bytes base64)"
          generacion: "openssl rand -base64 64"

        - nombre: "JWT_EXPIRES_IN"
          sensible: false
          rotacion: "N/A"
          formato: "duration string"
          ejemplo: "7d"

        - nombre: "JWT_REFRESH_EXPIRES_IN"
          sensible: false
          rotacion: "N/A"
          formato: "duration string"
          ejemplo: "30d"

    encryption:
      total: 1
      sensibles: 1
      variables:
        - nombre: "ENCRYPTION_KEY"
          sensible: true
          rotacion: "180 dias"
          formato: "string (64+ bytes base64)"
          generacion: "openssl rand -base64 64"

    environment:
      total: 2
      sensibles: 0
      variables:
        - nombre: "NODE_ENV"
          sensible: false
          valores_permitidos: ["development", "test", "staging", "production"]

        - nombre: "APP_ENV"
          sensible: false
          valores_permitidos: ["dev", "prod"]

    external_apis:
      total: 2
      sensibles: 2
      variables:
        - nombre: "OPENAI_API_KEY"
          sensible: true
          rotacion: "Segun politica OpenAI"
          formato: "sk-..."
          documentacion: "https://platform.openai.com/api-keys"
          estado: "CONFIGURACION_PENDIENTE"

        - nombre: "SENDGRID_API_KEY"
          sensible: true
          rotacion: "Anual"
          formato: "SG...."
          documentacion: "https://app.sendgrid.com/settings/api_keys"
          estado: "CONFIGURACION_PENDIENTE"

# =============================================================================
# ARCHIVOS DE CONFIGURACION
# =============================================================================

archivos_configuracion:
  - path: "apps/backend/.env"
    tipo: "principal"
    sensible: true
    permisos_requeridos: "600"
    en_gitignore: true
    estado: "OK"

  - path: "apps/backend/.env.example"
    tipo: "template"
    sensible: false
    permisos_requeridos: "644"
    en_gitignore: false
    estado: "OK"

  - path: "apps/database/.env.database"
    tipo: "auxiliar"
    sensible: true
    permisos_requeridos: "600"
    en_gitignore: true
    estado: "OK"

  - path: "apps/database/database-credentials-dev.txt"
    tipo: "referencia"
    sensible: true
    permisos_requeridos: "600"
    en_gitignore: true
    estado: "OK"

  - path: "apps/frontend/.env.dev"
    tipo: "frontend"
    sensible: false
    permisos_requeridos: "600"
    en_gitignore: true
    estado: "OK"

# =============================================================================
# SINCRONIZACION DE CREDENCIALES
# =============================================================================

sincronizacion:
  mecanismo: "Scripts automatizados"

  scripts:
    - nombre: "force-recreate-all.sh"
      version: "2.0.0"
      sincroniza:
        - "apps/backend/.env"
        - "apps/database/.env.database"
        - "apps/database/database-credentials-dev.txt"
      respaldo: true
      validacion: true

    - nombre: "manage-secrets.sh"
      version: "1.1.0"
      comandos:
        sync:
          sincroniza:
            - "apps/backend/.env.{env}"
            - "apps/frontend/.env.{env}"
            - "apps/database/.env.database"
            - "apps/database/database-credentials-{env}.txt"
          respaldo: true

  trigger_asociado: "TRIGGER-CREDENCIALES-SINCRONIZADAS"
  directiva_asociada: "SIMCO-RECREACION-BD"

# =============================================================================
# RESPALDOS
# =============================================================================

respaldos:
  ubicacion: "apps/database/credentials-backups/"
  politica: "10 ultimos respaldos"
  frecuencia: "Automatico al recrear/rotar"
  formato: "{archivo}.{YYYYMMDD_HHMMSS}.ext"

  estado:
    existe_directorio: true
    respaldos_actuales: "verificar"
    ultimo_respaldo: "2026-01-18"

# =============================================================================
# AUDITORIA - ISSUES HISTORICOS
# =============================================================================

issues_historicos:
  - id: "SEC-2026-01-18-001"
    titulo: "Passwords hardcodeados en force-recreate-all.sh"
    severidad: "CRITICA"
    detectado: "2026-01-18"
    resuelto: "2026-01-18"
    accion: "Reescritura completa del script v2.0.0"
    verificado: true

  - id: "SEC-2026-01-18-002"
    titulo: "Puerto PostgreSQL configurado incorrectamente a 5433"
    severidad: "ALTA"
    detectado: "2026-01-18"
    resuelto: "2026-01-18"
    accion: "Restaurado puerto estandar 5432 en todos los archivos"
    verificado: true
    nota: "PostgreSQL corre en instancia unica compartida en puerto 5432"

# =============================================================================
# AUDITORIA - VERIFICACIONES
# =============================================================================

verificaciones:
  gitignore:
    estado: "OK"
    archivos_protegidos:
      - ".env"
      - ".env.*"
      - "*.env"
      - "database-credentials-*.txt"
      - "credentials-backups/"
    verificado: "2026-01-18"

  secrets_en_codigo:
    estado: "OK"
    ultima_verificacion: "2026-01-18"
    patrones_buscados:
      - "DB_PASSWORD=.*[^\\$\\{]"  # Password hardcodeado
      - "sk_live_"                   # Stripe live key
      - "sk_test_"                   # Stripe test key
      - "eyJ.*\\."                   # JWT hardcodeado
      - "postgresql://.*:.*@"        # Connection string con password
    hallazgos: 0

  git_history:
    estado: "PENDIENTE"
    ultima_verificacion: null
    notas: "Recomendado ejecutar auditoria de git history"

# =============================================================================
# ROTACION DE CREDENCIALES
# =============================================================================

rotacion:
  politicas:
    - categoria: "database"
      frecuencia: "90 dias"
      responsable: "@PERFIL_DBA"
      procedimiento: "SIMCO-RECREACION-BD.md"

    - categoria: "authentication"
      frecuencia: "90 dias"
      responsable: "@PERFIL_SECRETS_MANAGER"
      procedimiento: "manage-secrets.sh rotate"

    - categoria: "encryption"
      frecuencia: "180 dias"
      responsable: "@PERFIL_SECRETS_MANAGER"
      notas: "Requiere re-encripcion de datos"

    - categoria: "external_apis"
      frecuencia: "Segun proveedor"
      responsable: "@PERFIL_SECRETS_MANAGER"

  proximas_rotaciones:
    - variable: "DB_PASSWORD"
      fecha_estimada: "2026-04-18"

    - variable: "JWT_SECRET"
      fecha_estimada: "2026-04-18"

# =============================================================================
# CHECKLIST DE AUDITORIA
# =============================================================================

checklist_auditoria:
  semanal:
    - "[ ] Verificar permisos de archivos .env (debe ser 600)"
    - "[ ] Verificar respaldos existen en credentials-backups/"
    - "[ ] Verificar sincronizacion de passwords entre archivos"

  mensual:
    - "[ ] Ejecutar busqueda de secrets en codigo"
    - "[ ] Verificar .gitignore actualizado"
    - "[ ] Revisar alertas de proveedores externos"
    - "[ ] Verificar estado de APIs externas"

  trimestral:
    - "[ ] Auditoria completa de git history"
    - "[ ] Revision de politicas de rotacion"
    - "[ ] Verificar credenciales de staging/prod (si aplica)"
    - "[ ] Documentar cambios de variables"

# =============================================================================
# ALERTAS ACTIVAS
# =============================================================================

alertas_activas: []

# =============================================================================
# NOTAS Y OBSERVACIONES
# =============================================================================

notas:
  - "2026-01-18: Auditoria inicial creada tras incidente de recreacion de BD"
  - "2026-01-18: Scripts actualizados para sincronizacion automatica"
  - "Pendiente: Configurar OPENAI_API_KEY y SENDGRID_API_KEY"

# =============================================================================
# REFERENCIAS
# =============================================================================

referencias:
  perfil_responsable: "orchestration/agents/perfiles/PERFIL-SECRETS-MANAGER.md"
  directiva_recreacion: "orchestration/directivas/simco/SIMCO-RECREACION-BD.md"
  trigger_sincronizacion: "orchestration/directivas/triggers/TRIGGER-CREDENCIALES-SINCRONIZADAS.md"
  devenv_inventory: "orchestration/inventarios/DEVENV-MASTER-INVENTORY.yml"

# =============================================================================
# FIN DE AUDITORIA
# =============================================================================
