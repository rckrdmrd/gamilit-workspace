# =============================================================================
# DEPENDENCY GRAPH
# =============================================================================

dependencies:
  frontend_to_backend:
    - frontend: "student portal"
      depends_on:
        - "backend/auth"
        - "backend/educational"
        - "backend/gamification"
        - "backend/progress"
        - "backend/social"

    - frontend: "teacher portal"
      depends_on:
        - "backend/auth"
        - "backend/teacher"
        - "backend/assignments"
        - "backend/social"

    - frontend: "admin portal"
      depends_on:
        - "backend/auth"
        - "backend/admin"

  backend_to_database:
    - backend: "auth module"
      depends_on:
        - "database/auth_management"

    - backend: "educational module"
      depends_on:
        - "database/educational_content"

    - backend: "gamification module"
      depends_on:
        - "database/gamification_system"

    - backend: "progress module"
      depends_on:
        - "database/progress_tracking"

    - backend: "social module"
      depends_on:
        - "database/social_features"

