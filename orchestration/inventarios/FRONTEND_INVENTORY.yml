        description: "Hook para fetch de datos"
        returns: "data, loading, error, refetch"

    utility:
      - name: "useDebounce.ts"
        description: "Hook de debounce"
        returns: "debouncedValue"

      - name: "useToggle.ts"
        description: "Hook de toggle"
        returns: "[value, toggle]"

      - name: "useLocalStorage.ts"
        description: "Hook de localStorage"
        returns: "[value, setValue]"

      - name: "useMediaQuery.ts"
        description: "Hook de media queries"
        returns: "matches"

      - name: "useClickOutside.ts"
        description: "Hook de click fuera"
        returns: "ref"

      - name: "useIntersectionObserver.ts"
        description: "Hook de intersection observer"
        returns: "isIntersecting, ref"

      - name: "usePrevious.ts"
        description: "Hook para valor anterior"
        returns: "previousValue"

    forms:
      - name: "useForm.ts"
        description: "Hook de formularios"
        returns: "values, errors, handleChange, handleSubmit"

    ui:
      - name: "useSanitizedHTML.ts"
        description: "Hook para HTML sanitizado"
        returns: "sanitizedHTML"

    navigation:
      - name: "useNavigation.ts"
        description: "Hook de navegación"
        returns: "navigate, goBack, goForward"

    educational:
      - name: "useModules.ts"
        description: "Hook de módulos educativos"
        returns: "modules, loading, error"

      - name: "useModuleAccess.ts"
        description: "Hook de acceso a módulos"
        returns: "hasAccess, isLocked"

      - name: "useExerciseAttempts.ts"
