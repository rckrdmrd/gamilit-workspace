# CROSS-REFERENCE-MASTER.yml
# SSOT: Mapeo unificado de procesos, modulos, schemas, portales y governance
# Queryable bidireccional: Flow->Modules/Schemas AND Module->Flows
version: "1.0.0"
fecha: "2026-03-03"
proyecto: "gamilit"

# ===========================================================================
# DIMENSION 1: FLOWS -> Everything
# Primary axis: Process flows mapping to all implementation artifacts
# Sources: COBERTURA-TOTAL-PROCESOS.md, TRACEABILITY-MATRIX.md, _INDEX.md files
# ===========================================================================

flows:

  # --- AUTH FLOWS (3) ---

  FL-AUTH-01:
    portal: Shared
    epic: EPIC-GAM-F1-AUTH
    process: "Registro + login + inicializacion"
    frontend:
      pages: ["pages/auth/*"]
      components: ["RegisterForm.tsx", "LoginForm.tsx"]
    backend:
      modules: ["auth"]
      endpoints: ["/auth/register", "/auth/login"]
    database:
      schemas: ["auth", "auth_management", "gamification_system"]
      tables: ["auth.users", "auth_management.profiles", "gamification_system.user_stats"]
    flow_doc: "auth/FLUJO-REGISTRO-LOGIN.md"

  FL-AUTH-02:
    portal: Shared
    epic: EPIC-GAM-F1-AUTH
    process: "Recuperacion de password"
    frontend:
      pages: ["pages/auth/ForgotPasswordPage.tsx", "apps/student/pages/PasswordResetPage.tsx"]
      components: ["formulario reset request"]
    backend:
      modules: ["auth"]
      endpoints: ["/auth/forgot-password", "/auth/reset-password"]
    database:
      schemas: ["auth", "auth_management"]
      tables: ["auth_management.password_reset_tokens", "auth.users"]
    flow_doc: "auth/FLUJO-RECUPERACION-PASSWORD.md"

  FL-AUTH-03:
    portal: Shared
    epic: EPIC-GAM-F1-AUTH
    process: "Verificacion de email"
    frontend:
      pages: ["features/auth/store/authStore.ts"]
      components: ["estado de verificacion"]
    backend:
      modules: ["auth"]
      endpoints: ["email-verification.service.ts"]
    database:
      schemas: ["auth", "auth_management"]
      tables: ["auth_management.email_verification_tokens", "auth.users"]
    flow_doc: "auth/FLUJO-VERIFICACION-EMAIL.md"

  # --- STUDENT FLOWS (21) ---

  FL-STU-01:
    portal: Student
    epic: EPIC-GAM-F1-EXERCISES
    process: "Resolucion de ejercicio autocalificable (M1-M2)"
    frontend:
      pages: ["apps/student/pages/ExercisePage.tsx"]
      components: ["guardar/enviar respuesta"]
    backend:
      modules: ["progress", "educational"]
      endpoints: ["/api/v1/progress/submissions/submit"]
    database:
      schemas: ["progress_tracking", "gamification_system"]
      tables: ["progress_tracking.exercise_attempts", "progress_tracking.exercise_submissions", "gamification_system.user_stats"]
    flow_doc: "student/FLUJO-EJERCICIO-COMPLETO.md"

  FL-STU-02:
    portal: Student
    epic: EPIC-GAM-F2-MODULES-M4M5
    process: "Resolucion de ejercicio con revision (M3-M5)"
    frontend:
      pages: ["apps/student/pages/ExercisePage.tsx"]
      components: ["submit para revision docente"]
    backend:
      modules: ["progress", "teacher"]
      endpoints: ["/api/v1/progress/submissions/submit", "/api/v1/teacher/reviews/*"]
    database:
      schemas: ["progress_tracking"]
      tables: ["progress_tracking.manual_reviews", "progress_tracking.exercise_submissions"]
    flow_doc: "student/FLUJO-EJERCICIO-M3-M5.md"

  FL-STU-03:
    portal: Student
    epic: EPIC-GAM-F1-GAMIFICATION
    process: "Compra en tienda + asignacion"
    frontend:
      pages: ["apps/student/pages/ShopPage.tsx"]
      components: ["boton comprar"]
    backend:
      modules: ["gamification"]
      endpoints: ["/api/v1/gamification/shop/purchase"]
      services: ["shop.service.ts", "boost.service.ts"]
    database:
      schemas: ["gamification_system"]
      tables: ["gamification_system.shop_items", "gamification_system.user_purchases", "gamification_system.ml_coins_transactions", "gamification_system.user_stats", "gamification_system.active_boosts"]
    flow_doc: "student/FLUJO-TIENDA-COMPRA.md"

  FL-STU-04:
    portal: Student
    epic: EPIC-GAM-F1-GAMIFICATION
    process: "Claim de logros y misiones"
    frontend:
      pages: ["apps/student/pages/AchievementsPage.tsx", "apps/student/pages/MissionsPage.tsx"]
      components: ["boton claim reward"]
    backend:
      modules: ["gamification"]
      endpoints: ["/api/v1/gamification/achievements/:id/claim", "/api/v1/gamification/missions/:id/claim"]
    database:
      schemas: ["gamification_system"]
      tables: ["gamification_system.user_achievements", "gamification_system.missions", "gamification_system.ml_coins_transactions", "gamification_system.user_stats"]
    flow_doc: "student/FLUJO-LOGROS-MISIONES-CLAIM.md"

  FL-STU-05:
    portal: Student
    epic: EPIC-GAM-F3-PROFILES
    process: "Perfil y ajustes del estudiante (Compuesto)"
    type: compound
    sub_flows: ["FL-SHR-01", "FL-STU-11", "FL-STU-12"]
    frontend:
      pages: ["apps/student/pages/SettingsPage.tsx"]
      components: ["ProfileSection.tsx", "AccountSection.tsx", "NotificationsSection.tsx", "PrivacySection.tsx"]
    backend:
      modules: ["auth", "notifications"]
      endpoints: ["PUT /users/profile", "PUT /auth/change-password", "GET /notifications/preferences", "PATCH /notifications/preferences", "PUT /users/preferences"]
    database:
      schemas: ["auth_management", "auth", "notifications"]
      tables: ["auth_management.profiles", "auth.users", "notifications.notification_preferences"]
    flow_doc: "student/FLUJO-PERFIL-AJUSTES-ESTUDIANTE.md"

  FL-STU-06:
    portal: Student
    epic: EPIC-GAM-F1-ANALYTICS
    process: "Dashboard y progreso academico (Compuesto)"
    type: compound
    sub_flows: ["FL-STU-13", "FL-STU-01", "FL-STU-04", "FL-STU-15"]
    frontend:
      pages: ["apps/student/pages/DashboardComplete.tsx"]
      components: ["dashboard orquestador"]
    backend:
      modules: ["progress", "gamification", "educational"]
      endpoints: ["/api/v1/progress/*", "/api/v1/gamification/*", "/api/v1/educational/*"]
    database:
      schemas: ["progress_tracking", "gamification_system", "educational_content"]
      tables: ["progress_tracking.*", "gamification_system.*", "educational_content.*"]
    flow_doc: "student/FLUJO-DASHBOARD-ACADEMICO.md"

  FL-STU-07:
    portal: Student
    epic: EPIC-GAM-F1-GAMIFICATION
    process: "Tienda: overview y catalogo"
    frontend:
      pages: ["apps/student/pages/ShopPage.tsx"]
      components: ["ver catalogo, filtros"]
    backend:
      modules: ["gamification"]
      endpoints: ["/gamification/shop/categories", "/gamification/shop/items", "/gamification/shop/purchases/:userId"]
    database:
      schemas: ["gamification_system"]
      tables: ["gamification_system.shop_categories", "gamification_system.shop_items", "gamification_system.user_purchases"]
    flow_doc: "student/FLUJO-TIENDA-OVERVIEW.md"

  FL-STU-08:
    portal: Student
    epic: EPIC-GAM-F1-GAMIFICATION
    process: "Inventario de items"
    frontend:
      pages: ["apps/student/pages/InventoryPage.tsx"]
      components: ["ver inventario, usar power-up"]
    backend:
      modules: ["gamification"]
      endpoints: ["/gamification/comodines/users/:userId/inventory", "/gamification/comodines/use"]
    database:
      schemas: ["gamification_system"]
      tables: ["gamification_system.comodines_inventory", "gamification_system.comodin_usage_log"]
    flow_doc: "student/FLUJO-INVENTARIO-ITEMS.md"

  FL-STU-09:
    portal: Student
    epic: EPIC-GAM-F3-SOCIAL-GAMIFICATION
    process: "Sistema de amigos"
    frontend:
      pages: ["apps/student/pages/FriendsPage.tsx"]
      components: ["listar/agregar amigos"]
    backend:
      modules: ["social"]
      endpoints: ["/social/users/:userId/friends", "/social/friendships/request", "/social/activities/feed"]
    database:
      schemas: ["social_features"]
      tables: ["social_features.friendships", "social_features.friend_requests", "social_features.user_activities"]
    flow_doc: "student/FLUJO-AMIGOS.md"

  FL-STU-10:
    portal: Student
    epic: EPIC-GAM-F3-SOCIAL-GAMIFICATION
    process: "Gremios"
    frontend:
      pages: ["apps/student/pages/GuildsPage.tsx"]
      components: ["crear/gestionar gremio"]
    backend:
      modules: ["social"]
      endpoints: ["/social/teams", "/social/teams/:teamId/members/:userId"]
    database:
      schemas: ["social_features"]
      tables: ["social_features.guilds", "social_features.guild_members"]
    flow_doc: "student/FLUJO-GREMIOS.md"

  FL-STU-11:
    portal: Student
    epic: EPIC-GAM-F3-PROFILES
    process: "Settings dispositivos"
    frontend:
      pages: ["apps/student/pages/DeviceManagementSection.tsx"]
      components: ["gestionar dispositivos"]
    backend:
      modules: ["notifications"]
      endpoints: ["/notifications/devices", "/notifications/devices/:id"]
    database:
      schemas: ["notifications"]
      tables: ["notifications.user_devices"]
    flow_doc: "student/FLUJO-SETTINGS-DISPOSITIVOS.md"

  FL-STU-12:
    portal: Student
    epic: EPIC-GAM-F3-NOTIFICATIONS
    process: "Settings notificaciones"
    frontend:
      pages: ["apps/student/pages/NotificationPreferencesPage.tsx"]
      components: ["preferencias notificaciones"]
    backend:
      modules: ["notifications"]
      endpoints: ["/notifications/preferences", "/notifications/preferences/:type"]
    database:
      schemas: ["notifications"]
      tables: ["notifications.notification_preferences"]
    flow_doc: "student/FLUJO-SETTINGS-NOTIFICACIONES.md"

  FL-STU-13:
    portal: Student
    epic: EPIC-GAM-F1-ANALYTICS
    process: "Dashboard y overview de progreso"
    frontend:
      pages: ["apps/student/pages/DashboardComplete.tsx"]
      components: ["useDashboardData.ts"]
    backend:
      modules: ["progress", "gamification"]
      endpoints: ["/api/v1/progress/*", "/api/v1/gamification/user-stats/*"]
    database:
      schemas: ["progress_tracking", "gamification_system"]
      tables: ["progress_tracking.module_progress", "gamification_system.user_stats"]
    flow_doc: "student/FLUJO-DASHBOARD-PROGRESO.md"

  FL-STU-14:
    portal: Student
    epic: EPIC-GAM-F3-SOCIAL-GAMIFICATION
    process: "Leaderboards y rankings"
    frontend:
      pages: ["apps/student/pages/LeaderboardPage.tsx"]
      components: ["leaderboardsStore.ts"]
    backend:
      modules: ["social"]
      endpoints: ["/api/v1/social/leaderboards/*"]
    database:
      schemas: ["social_features", "gamification_system"]
      tables: ["social_features.leaderboard_entries", "gamification_system.user_stats"]
    flow_doc: "student/FLUJO-LEADERBOARDS.md"

  FL-STU-15:
    portal: Student
    epic: EPIC-GAM-F1-EXERCISES
    process: "Pagina de aprendizaje"
    frontend:
      pages: ["apps/student/pages/LearningPage.tsx"]
      components: ["ver modulos, seleccionar ejercicio"]
    backend:
      modules: ["educational"]
      endpoints: ["/api/v1/educational/modules/*", "/api/v1/educational/exercises/*"]
    database:
      schemas: ["educational_content"]
      tables: ["educational_content.modules", "educational_content.exercises"]
    flow_doc: "student/FLUJO-PAGINA-APRENDIZAJE.md"

  FL-STU-16:
    portal: Student
    epic: EPIC-GAM-F1-ANALYTICS
    process: "Progreso academico detallado"
    frontend:
      pages: ["apps/student/pages/MyProgressPage.tsx", "apps/student/pages/ModuleDetailsPage.tsx"]
      components: ["modulo progress, exercise attempts"]
    backend:
      modules: ["progress"]
      endpoints: ["/api/v1/progress/modules/*"]
      controllers: ["module-progress.controller.ts", "exercise-attempt.controller.ts"]
    database:
      schemas: ["progress_tracking"]
      tables: ["progress_tracking.module_progress", "progress_tracking.exercise_attempts", "progress_tracking.learning_sessions"]
    flow_doc: "student/FLUJO-PROGRESO-ACADEMICO.md"

  FL-STU-17:
    portal: Student
    epic: EPIC-GAM-F1-EXERCISES
    process: "Asignaciones del estudiante"
    frontend:
      pages: ["apps/student/pages/AssignmentsPage.tsx", "apps/student/pages/AssignmentDetailPage.tsx"]
      components: ["ver asignaciones, detalle"]
    backend:
      modules: ["assignments"]
      endpoints: ["/api/v1/assignments/*"]
      controllers: ["assignment.controller.ts", "assignment-student.controller.ts"]
    database:
      schemas: ["educational_content"]
      tables: ["educational_content.assignments", "educational_content.assignment_students", "educational_content.assignment_submissions"]
    flow_doc: "student/FLUJO-ASIGNACIONES-ESTUDIANTE.md"

  FL-STU-18:
    portal: Student
    epic: EPIC-GAM-F3-PROFILES
    process: "Perfil y notificaciones"
    frontend:
      pages: ["apps/student/pages/EnhancedProfilePage.tsx", "apps/student/pages/NotificationsPage.tsx"]
      components: ["perfil, notificaciones"]
    backend:
      modules: ["profile", "notifications"]
      endpoints: ["/api/v1/profile/*", "/api/v1/notifications/*"]
      controllers: ["profile.controller.ts", "notifications.controller.ts"]
    database:
      schemas: ["auth_management", "notifications"]
      tables: ["auth_management.profiles", "notifications.notifications", "notifications.notification_preferences"]
    flow_doc: "student/FLUJO-PERFIL-NOTIFICACIONES.md"

  FL-STU-19:
    portal: Student
    epic: EPIC-GAM-F1-GAMIFICATION
    process: "Equipamiento de items cosmeticos"
    frontend:
      pages: ["apps/student/pages/InventoryPage.tsx"]
      components: ["ProfileInventoryTab.tsx", "useEquipment.ts"]
    backend:
      modules: ["gamification"]
      endpoints: ["/gamification/inventory/equipped", "/gamification/inventory/equip", "/gamification/inventory/unequip"]
    database:
      schemas: ["gamification_system"]
      tables: ["gamification_system.user_equipped_items", "gamification_system.shop_items", "gamification_system.user_purchases"]
    flow_doc: "student/FLUJO-EQUIPAMIENTO-ITEMS-COSMETICOS.md"

  FL-STU-20:
    portal: Student
    epic: EPIC-GAM-F1-GAMIFICATION
    process: "Compra inventario equipar (Compuesto)"
    type: compound
    sub_flows: ["FL-STU-03", "FL-STU-19"]
    frontend:
      pages: ["apps/student/pages/ShopPage.tsx", "apps/student/pages/InventoryPage.tsx"]
      components: ["compra + equipamiento flow"]
    backend:
      modules: ["gamification"]
      endpoints: ["/api/v1/gamification/shop/purchase", "/gamification/inventory/equip"]
    database:
      schemas: ["gamification_system"]
      tables: ["gamification_system.shop_items", "gamification_system.user_purchases", "gamification_system.user_equipped_items", "gamification_system.ml_coins_transactions"]
    flow_doc: "student/FLUJO-COMPRA-INVENTARIO-EQUIPAR.md"

  FL-STU-21:
    portal: Student
    epic: EPIC-GAM-F1-GAMIFICATION
    process: "Consulta de boosts activos"
    frontend:
      pages: ["shared/components/layout/GamifiedHeader.tsx"]
      components: ["indicador de boost activo"]
    backend:
      modules: ["gamification"]
      endpoints: ["GET /api/v1/gamification/boosts/:userId/active"]
      controllers: ["boost.controller.ts"]
      services: ["boost.service.ts"]
    database:
      schemas: ["gamification_system"]
      tables: ["gamification_system.active_boosts"]
    flow_doc: "student/FLUJO-TIENDA-COMPRA.md (rama boost)"

  # --- SHARED FLOWS (3) ---

  FL-SHR-01:
    portal: Shared
    epic: EPIC-GAM-F3-PROFILES
    process: "Perfil/configuracion multiportal"
    frontend:
      pages: ["apps/student/pages/settings/ProfileSection.tsx", "apps/teacher/pages/TeacherSettings.tsx", "apps/admin/components/settings/*"]
      components: ["AvatarSelectionModal.tsx"]
    backend:
      modules: ["auth", "profile"]
      endpoints: ["PUT /users/profile", "/api/auth/profile"]
    database:
      schemas: ["auth_management", "auth"]
      tables: ["auth_management.profiles", "auth.users"]
    flow_doc: "shared/FLUJO-PERFIL-CONFIGURACION.md"

  FL-SHR-02:
    portal: Shared
    epic: EPIC-GAM-F1-AUTH
    process: "Sesion/seguridad y recuperacion de acceso (Compuesto)"
    type: compound
    sub_flows: ["FL-AUTH-01", "FL-AUTH-02", "FL-AUTH-03"]
    frontend:
      pages: ["features/auth/components/*"]
      components: ["RegisterForm.tsx", "LoginForm.tsx", "ForgotPasswordPage.tsx", "PasswordResetPage.tsx"]
    backend:
      modules: ["auth"]
      endpoints: ["/auth/*"]
    database:
      schemas: ["auth", "auth_management"]
      tables: ["auth.users", "auth_management.profiles", "auth_management.password_reset_tokens", "auth_management.email_verification_tokens"]
    flow_doc: "shared/FLUJO-SESION-SEGURIDAD.md"

  FL-SHR-03:
    portal: Shared
    epic: EPIC-GAM-F3-WHITE-LABEL
    process: "White-label y theming"
    frontend:
      pages: ["features/admin/branding/BrandingSettingsPage.tsx"]
      components: ["BrandingSettingsPage"]
    backend:
      modules: ["admin"]
      endpoints: ["/api/v1/tenants/:id/branding", "/api/v1/tenants/:id/theme"]
    database:
      schemas: ["auth_management"]
      tables: ["auth_management.tenants", "auth_management.tenant_settings"]
    flow_doc: "shared/FLUJO-WHITE-LABEL-THEMING.md"

  # --- TEACHER FLOWS (17) ---

  FL-TCH-01:
    portal: Teacher
    epic: EPIC-GAM-F3-TEACHER-PORTAL
    process: "Revision manual y cierre de calificacion M3-M5"
    frontend:
      pages: ["apps/teacher/pages/TeacherReviewPanel.tsx"]
      components: ["ReviewDetail.tsx"]
    backend:
      modules: ["teacher"]
      endpoints: ["/api/v1/teacher/reviews/*"]
      services: ["manual-review.service.ts"]
    database:
      schemas: ["progress_tracking", "gamification_system"]
      tables: ["progress_tracking.manual_reviews", "progress_tracking.exercise_submissions", "gamification_system.user_stats"]
    flow_doc: "teacher/FLUJO-REVISION-MANUAL-M3-M5.md"

  FL-TCH-02:
    portal: Teacher
    epic: EPIC-GAM-F3-TEACHER-PORTAL
    process: "Gestion de asignaciones"
    frontend:
      pages: ["apps/teacher/pages/TeacherAssignments.tsx"]
      components: ["AssignmentCreator.tsx"]
    backend:
      modules: ["teacher", "assignments"]
      endpoints: ["/api/v1/teacher/assignments/*"]
    database:
      schemas: ["educational_content", "progress_tracking"]
      tables: ["educational_content.assignments", "progress_tracking.*"]
    flow_doc: "teacher/FLUJO-ASIGNACIONES-CLASE.md"

  FL-TCH-03:
    portal: Teacher
    epic: EPIC-GAM-F3-NOTIFICATIONS
    process: "Monitoreo y alertas docentes"
    frontend:
      pages: ["apps/teacher/pages/TeacherAlerts.tsx", "apps/teacher/pages/TeacherMonitoringPage.tsx"]
      components: ["AlertCard.tsx", "useClassroomRealtime.ts"]
    backend:
      modules: ["teacher", "notifications"]
      endpoints: ["/api/v1/teacher/alerts/*"]
      websocket_events: ["exercise_started", "exercise_completed", "achievement_unlocked", "level_up", "student_online", "student_offline", "help_requested"]
    database:
      schemas: ["progress_tracking", "notifications"]
      tables: ["progress_tracking.student_intervention_alerts", "progress_tracking.alert_configurations"]
    flow_doc: "teacher/FLUJO-MONITOREO-ALERTAS.md"

  FL-TCH-04:
    portal: Teacher
    epic: EPIC-GAM-F1-ANALYTICS
    process: "Analytics y reportes docentes"
    frontend:
      pages: ["apps/teacher/pages/TeacherAnalytics.tsx", "apps/teacher/pages/TeacherReports.tsx"]
      components: ["ScheduledReportsTab.tsx", "SharedReportsTab.tsx"]
    backend:
      modules: ["teacher"]
      endpoints: ["/api/v1/teacher/analytics/*", "/api/v1/teacher/reports/*"]
      api_services: ["scheduledReportsApi (7ep)", "sharedReportsApi (6ep)"]
    database:
      schemas: ["progress_tracking", "gamification_system", "social_features"]
      tables: ["progress_tracking.*", "gamification_system.*", "social_features.teacher_reports", "social_features.scheduled_reports", "social_features.shared_reports"]
    flow_doc: "teacher/FLUJO-ANALYTICS-REPORTES.md"

  FL-TCH-05:
    portal: Teacher
    epic: EPIC-GAM-F3-CONTENT
    process: "Gestion de contenido docente"
    frontend:
      pages: ["apps/teacher/pages/TeacherContentManagement.tsx"]
      components: ["content management"]
    backend:
      modules: ["content", "teacher"]
      endpoints: ["/api/v1/content/*", "/api/v1/teacher/content/*"]
    database:
      schemas: ["educational_content"]
      tables: ["educational_content.content_items", "educational_content.content_templates"]
    flow_doc: "teacher/FLUJO-GESTION-CONTENIDO.md"

  FL-TCH-06:
    portal: Teacher
    epic: EPIC-GAM-F1-AUTH
    process: "Login con redireccion por rol"
    frontend:
      pages: ["apps/teacher/layouts/TeacherLayout.tsx"]
      components: ["autenticacion + redirect docente"]
    backend:
      modules: ["auth"]
      endpoints: ["/auth/login"]
    database:
      schemas: ["auth", "auth_management"]
      tables: ["auth.users", "auth_management.profiles", "auth_management.user_roles"]
    flow_doc: "teacher/FLUJO-LOGIN-DOCENTE.md"

  FL-TCH-07:
    portal: Teacher
    epic: EPIC-GAM-F3-TEACHER-PORTAL
    process: "Configuracion docente y mensajeria"
    frontend:
      pages: ["apps/teacher/pages/TeacherSettings.tsx"]
      components: ["preferencias, canales"]
    backend:
      modules: ["teacher"]
      endpoints: ["/api/v1/teacher/settings/*", "/api/v1/messages/*"]
    database:
      schemas: ["auth_management", "communication"]
      tables: ["auth_management.profiles", "communication.*"]
    flow_doc: "shared/FLUJO-PERFIL-CONFIGURACION.md"

  FL-TCH-08:
    portal: Teacher
    epic: EPIC-GAM-F3-TEACHER-PORTAL
    process: "Dashboard docente"
    frontend:
      pages: ["apps/teacher/pages/TeacherDashboardPage.tsx"]
      components: ["dashboard docente"]
    backend:
      modules: ["teacher"]
      endpoints: ["/api/v1/teacher/dashboard/*"]
      controllers: ["teacher.controller.ts"]
    database:
      schemas: ["social_features", "progress_tracking", "gamification_system"]
      tables: ["social_features.teacher_classrooms", "progress_tracking.module_progress", "progress_tracking.exercise_attempts", "gamification_system.user_stats"]
    flow_doc: "teacher/FLUJO-DASHBOARD-DOCENTE.md"

  FL-TCH-09:
    portal: Teacher
    epic: EPIC-GAM-F3-TEACHER-PORTAL
    process: "Gestion de clases y estudiantes"
    frontend:
      pages: ["apps/teacher/pages/TeacherClassesPage.tsx", "apps/teacher/pages/TeacherStudentsPage.tsx"]
      components: ["gestion clases"]
