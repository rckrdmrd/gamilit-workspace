# -------------------------------------------------------------------------------
# DATASOURCES (11 en app.module.ts)
# -------------------------------------------------------------------------------

datasources:
  - nombre: "auth"
    schema: "auth_management"
    entities_path: "modules/auth/entities/**/*.entity + admin system_configuration entities"
  - nombre: "educational"
    schema: "educational_content"
    entities_path: "modules/educational + assignments + teacher-content"
  - nombre: "gamification"
    schema: "gamification_system"
    entities_path: "modules/gamification + profile + tenant (notification.entity path removed FIX-CORR-001)"
  - nombre: "progress"
    schema: "progress_tracking"
    entities_path: "modules/progress + teacher-alert + profile + classroom + tenant + school + module + exercise"
  - nombre: "social"
    schema: "social_features"
    entities_path: "modules/social + assignments + teacher-report + scheduled-report + shared-report + profile + tenant"
  - nombre: "content"
    schema: "content_management"
    entities_path: "modules/content/entities/**/*.entity"
  - nombre: "audit"
    schema: "audit_logging"
    entities_path: "modules/audit/entities/**/*.entity + admin audit_logging entities"
  - nombre: "notifications"
    schema: "notifications"
    entities_path: "modules/notifications/entities/multichannel/**/*.entity + rate-limit-log.entity"
  - nombre: "communication"
    schema: "communication"
    entities_path: "modules/communication/entities/**/*.entity + modules/teacher/entities/message*.entity"
    nota: "communication.module.ts importado en app.module.ts. Entities: conversation, conversation-participant (communication module) + message, message-participant (teacher module)"
  - nombre: "admin_dashboard"
    schema: "admin_dashboard"
    entities_path: "admin-report + metrics-history + user + role"
  - nombre: "lti"
    schema: "lti_integration"
    entities_path: "modules/lti/entities/**/*.entity"
    nota: "FIX-CORR-007: 11th datasource created for LTI module"
  - nombre: "data_warehouse"
    schema: "data_warehouse"
    entities_path: "modules/etl + modules/ml + modules/visualization (conditional)"
    nota: "Conditional — activated when ENABLE_DATA_WAREHOUSE=true env var set. Used by etl/ml/visualization modules (conditionally imported in app.module.ts lines 441-471). Phase 6D remediation."
    estado: "CONDITIONAL"

