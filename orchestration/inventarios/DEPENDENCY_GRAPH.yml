# DEPENDENCY GRAPH - GAMILIT
# Grafo de dependencias entre modulos, schemas y componentes
# Version: 4.0.0
# Fecha: 2026-02-27
# Fuente: Documentation-Maintainer (auditoria gobernanza)

version: "4.0.0"
proyecto: "GAMILIT - Sistema de Gamificacion Educativa"
fecha_actualizacion: "2026-02-27"
descripcion: "Grafo de dependencias entre capas (Database -> Backend -> Frontend)"
estado_proyecto: "98% completado (MVP Produccion Activa)"

# ========================================
# SCHEMAS DE DATABASE (18 schemas, 173 tablas)
# ========================================

database_schemas:
  auth:
    descripcion: "Schema base auth (compatible Supabase)"
    tablas: 1
    dependencias: []
    usado_por:
      - backend: ["auth"]

  auth_management:
    descripcion: "Perfiles, roles, tenants, sesiones, tokens, parents, RBAC"
    tablas: 17
    dependencias: ["auth"]
    usado_por:
      - backend: ["auth", "profile", "parents"]
      - frontend: ["AuthContext", "authStore"]

  educational_content:
    descripcion: "Modulos educativos, ejercicios (23 tipos), asignaciones, rubricas, resource sharing"
    tablas: 24                    # +3 vs prev: resource_ratings (28), resource_comments (29), resource_downloads (30). 2 cross_schema refs: exercise_mechanic_mapping, content_approvals
    dependencias: ["auth_management"]
    usado_por:
      - backend: ["educational", "assignments", "teacher"]
      - frontend: ["ExercisePage", "ModulePage"]

  gamification_system:
    descripcion: "XP, rangos maya, achievements, ML Coins, tienda, misiones, leaderboards, equipamiento"
    tablas: 21                    # 19 root + 2 _cross_schema (classroom_missions, comodin_uses). 2 cross_schema refs to progress_tracking + social_features
    dependencias: ["auth_management"]
    usado_por:
      - backend: ["gamification", "notifications"]
      - frontend: ["GamifiedHeader", "ranksStore", "economyStore", "achievementsStore"]

  progress_tracking:
    descripcion: "Progreso, intentos, learning paths, mastery, certificados"
    tablas: 21                    # 1 cross_schema ref from gamification_system (scheduled_missions)
    dependencias: ["auth_management", "educational_content"]
    usado_por:
      - backend: ["progress", "teacher"]
      - frontend: ["ProgressDashboard", "CertificatesPage"]

  social_features:
    descripcion: "Escuelas, aulas, equipos, guilds, amistades, challenges, foros"
    tablas: 30
    dependencias: ["auth_management"]
    usado_por:
      - backend: ["social", "assignments", "teacher"]
      - frontend: ["ClassroomPages", "GuildsPage", "FriendsPage"]

  notifications:
    descripcion: "Multi-canal: email, push, in-app, SMS con templates y cola"
    tablas: 7
    dependencias: ["auth_management"]
    usado_por:
      - backend: ["notifications"]
      - frontend: ["NotificationBell"]

  content_management:
    descripcion: "Templates, media, moderacion, tags, versiones"
    tablas: 10
    dependencias: ["auth_management"]
    usado_por:
      - backend: ["content"]
      - frontend: ["ContentManagementPage"]

  system_configuration:
    descripcion: "Settings, feature flags, rate limits, parametros gamificacion"
    tablas: 9
    dependencias: []
    usado_por:
      - backend: ["admin"]
      - frontend: ["AdminSettingsPage"]

  audit_logging:
    descripcion: "Auditoria, logs sistema, alertas, activity tracking"
    tablas: 7
    dependencias: ["auth_management"]
    usado_por:
      - backend: ["audit", "admin"]

  admin_dashboard:
    descripcion: "Dashboard admin, bulk ops, reportes, metricas"
    tablas: 3
    views: 7
    materialized_views: 3
    dependencias: ["auth_management"]
    usado_por:
      - backend: ["admin"]
      - frontend: ["AdminDashboard"]

  data_warehouse:
    descripcion: "Star schema: 8 dimensiones, 4 facts, 2 ML, 2 ETL"
    tablas: 16
    views: 3
    dependencias: ["auth_management", "educational_content", "gamification_system", "progress_tracking"]
    usado_por:
      - backend: ["etl", "ml", "visualization"]
    nota: "16 tablas DDL-only (sin entities TypeORM) — intencional"

  communication:
    descripcion: "Mensajeria interna: messages, message_participants, conversations, conversation_participants"
    tablas: 4
    dependencias: ["auth_management"]
    usado_por:
      - backend: ["communication", "teacher"]
      - frontend: ["TeacherCommunicationPage"]

  lti_integration:
    descripcion: "LTI 1.3: consumers, sessions, grade passback"
    tablas: 3
    dependencias: ["auth_management"]
    usado_por:
      - backend: ["lti"]

  gamilit:
    descripcion: "Funciones utilitarias compartidas (now_mexico, RLS helpers, triggers)"
    tablas: 0
    funciones: 37
    views: 1
    dependencias: []
    usado_por:
      - backend: ["(all modules via RLS)"]

  optimization:
    descripcion: "Indexes y triggers de optimizacion"
    tablas: 0
    dependencias: ["(all schemas)"]

  public:
    descripcion: "Schema publico legacy (placeholder, vacio)"
    tablas: 0

  storage:
    descripcion: "Storage backend (placeholder, vacio)"
    tablas: 0

# ========================================
# MODULOS DE BACKEND (23 modulos, 914 endpoints)
# NOTA: etl, ml, visualization existen en disco pero NO importados en app.module.ts
#       (requieren datasource data_warehouse no configurado — evaluacion pendiente)
# ========================================

backend_modules:
  auth:
    descripcion: "JWT + Passport + RBAC, multi-tenant"
    dependencias_db: ["auth", "auth_management"]
    dependencias_backend: []
    entities: 18
    services: 6
    controllers: 3
    endpoints: 29
    estado: "100%"

  admin:
    descripcion: "Gestion de sistema, settings, analytics globales"
    dependencias_db: ["audit_logging", "admin_dashboard", "system_configuration"]
    dependencias_backend: ["auth"]
    entities: 16
    services: 22
    controllers: 21
    endpoints: 158
    estado: "90%"

  educational:
    descripcion: "5 modulos educativos, 23 tipos de ejercicio"
    dependencias_db: ["educational_content"]
    dependencias_backend: ["auth"]
    entities: 16
    services: 7
    controllers: 5
    endpoints: 51
    estado: "95%"

  gamification:
    descripcion: "XP, rangos maya, achievements, ML Coins, missions, leaderboard, store"
    dependencias_db: ["gamification_system"]
    dependencias_backend: ["auth"]
    entities: 22
    services: 18
    controllers: 11
    endpoints: 72
    estado: "95%"

  social:
    descripcion: "Classrooms, schools, teams, guilds, friendships, challenges"
    dependencias_db: ["social_features"]
    dependencias_backend: ["auth"]
    entities: 26
    services: 13
    controllers: 13
    endpoints: 135
    estado: "60%"

  progress:
    descripcion: "Module progress, attempts, learning sessions, certificates"
    dependencias_db: ["progress_tracking"]
    dependencias_backend: ["auth", "educational"]
    entities: 20
    services: 13
    controllers: 6
    endpoints: 59
    estado: "90%"

  content:
    descripcion: "Templates, media, tags, moderacion"
    dependencias_db: ["content_management"]
    dependencias_backend: ["auth"]
    entities: 10
    services: 10
    controllers: 10
    endpoints: 102
    estado: "95%"

  notifications:
    descripcion: "Multi-channel: in-app, email, push, SMS"
    dependencias_db: ["notifications", "gamification_system"]
    dependencias_backend: ["auth"]
    entities: 7
    services: 12
    controllers: 8
    endpoints: 46
    estado: "90%"

  teacher:
    descripcion: "Portal docente, asignaciones, reportes, revision manual"
    dependencias_db: ["educational_content", "progress_tracking", "social_features", "communication"]
    dependencias_backend: ["auth", "educational", "progress", "social"]
    entities: 9
    services: 21
    controllers: 10
    endpoints: 117
    estado: "95%"

  parents:
    descripcion: "Portal padres, vinculacion, notificaciones"
    dependencias_db: ["auth_management"]
    dependencias_backend: ["auth", "notifications"]
    entities: 0
    services: 7
    controllers: 2
    endpoints: 17
    estado: "100%"

  # Otros modulos (resumidos)
  health: { estado: "100%", endpoints: 4 }
  profile: { estado: "100%", endpoints: 3 }
  audit: { estado: "100%", endpoints: 0 }
  assignments: { estado: "95%", endpoints: 19 }
  communication: { estado: "20%", endpoints: 0 }
  tasks: { estado: "100%", endpoints: 0 }
  websocket: { estado: "100%", endpoints: 0 }
  mail: { estado: "100%", endpoints: 0 }
  lti: { estado: "75%", endpoints: 42 }
  etl: { estado: "75%", endpoints: 16 }
  ml: { estado: "50%", endpoints: 21 }
  visualization: { estado: "50%", endpoints: 21 }

# ========================================
# COMPONENTES DE FRONTEND (4 portales, 575 componentes)
# ========================================

frontend_portals:
  student:
    descripcion: "Dashboard, ejercicios, gamificacion, leaderboards, tienda, misiones"
    paginas: 19
    componentes: 103
    completitud: "~100%"
    dependencias_backend: ["auth", "educational", "gamification", "progress", "social"]

  teacher:
    descripcion: "Gestion aulas, asignaciones, reportes, revision manual"
    paginas: 16
    componentes: 44
    completitud: "~95%"
    dependencias_backend: ["auth", "teacher", "educational", "progress", "social"]

  admin:
    descripcion: "Dashboard, usuarios, contenido, analytics, monitoreo"
    paginas: 19
    componentes: 123
    completitud: "~90%"
    dependencias_backend: ["auth", "admin", "content"]

  parent:
    descripcion: "Dashboard, progreso hijo, login, registro, comunicacion maestro-padre, notificaciones, configuracion"
    paginas: 7
    componentes: 7
    completitud: "100%"
    dependencias_backend: ["auth", "parents"]

