# ==============================================================================
# ALIASES.yml - Registro de Agentes NEXUS
# ==============================================================================
# Proposito: Mapeo de agentes a sus perfiles y aliases
# Mantenido por: Tech-Leader
# Actualizado: 2025-12-18
# ==============================================================================

version: "2.0.0"
updated: "2025-12-18"

# ------------------------------------------------------------------------------
# AGENTES DE DESARROLLO
# ------------------------------------------------------------------------------
agents:

  NEXUS-BACKEND:
    profile: "perfiles/PERFIL-BACKEND-NESTJS.md"
    role: "Desarrollo de APIs y logica de negocio"
    aliases:
      - "backend-agent"
      - "api-agent"
      - "backend"
    capabilities:
      - "api-development"
      - "business-logic"
      - "database-queries"
    directivas:
      - "SIMCO-BACKEND.md"
      - "SIMCO-SERVICE-DESCRIPTOR.md"

  NEXUS-FRONTEND:
    profile: "perfiles/PERFIL-FRONTEND-REACT.md"
    role: "Desarrollo de interfaces de usuario"
    aliases:
      - "frontend-agent"
      - "ui-agent"
      - "frontend"
    capabilities:
      - "ui-development"
      - "state-management"
      - "api-integration"
    directivas:
      - "SIMCO-FRONTEND.md"
      - "SIMCO-SERVICE-DESCRIPTOR.md"

  NEXUS-DATABASE:
    profile: "perfiles/PERFIL-DATABASE-POSTGRESQL.md"
    role: "Diseño y gestion de bases de datos"
    aliases:
      - "database-agent"
      - "db-agent"
      - "ddl-agent"
      - "database"
    capabilities:
      - "schema-design"
      - "migrations"
      - "query-optimization"
    directivas:
      - "SIMCO-DDL.md"

  NEXUS-ML:
    profile: "perfiles/_archive/PERFIL-ML.md"  # Archived
    role: "Machine Learning y modelos"
    aliases:
      - "ml-agent"
      - "ai-agent"
      - "data-science-agent"
    capabilities:
      - "model-training"
      - "data-pipelines"
      - "inference"
    directivas:
      - "SIMCO-ML.md"

# ------------------------------------------------------------------------------
# AGENTES DE OPERACIONES
# ------------------------------------------------------------------------------

  NEXUS-DEVOPS:
    profile: "perfiles/PERFIL-DEVOPS.md"
    role: "Operaciones, CI/CD, Infraestructura"
    aliases:
      - "devops-agent"
      - "infra-agent"
      - "ci-agent"
      - "ops-agent"
      - "devops"
    capabilities:
      - "registry-management"
      - "ci-cd"
      - "docker"
      - "deployment"
    directivas:
      - "SIMCO-DEVOPS.md"
      - "SIMCO-SERVICE-DESCRIPTOR.md"

  NEXUS-QA:
    profile: "perfiles/PERFIL-TESTING.md"
    role: "Quality Assurance y Testing"
    aliases:
      - "qa-agent"
      - "test-agent"
      - "quality-agent"
    capabilities:
      - "testing"
      - "test-automation"
      - "quality-metrics"
    directivas:
      - "SIMCO-QA.md"

  NEXUS-SECURITY:
    profile: "perfiles/PERFIL-SECURITY-AUDITOR.md"
    role: "Seguridad y Auditoria"
    aliases:
      - "security-agent"
      - "sec-agent"
      - "audit-agent"
    capabilities:
      - "security-audit"
      - "vulnerability-scan"
      - "compliance"
    directivas:
      - "SIMCO-SECURITY.md"

# ------------------------------------------------------------------------------
# AGENTES DE COORDINACION
# ------------------------------------------------------------------------------

  NEXUS-TECH-LEADER:
    profile: "perfiles/PERFIL-TECH-LEADER.md"
    role: "Arquitectura y decisiones tecnicas"
    aliases:
      - "tech-leader"
      - "architect"
      - "lead"
    capabilities:
      - "architecture-design"
      - "technical-decisions"
      - "code-review"
      - "coordination"
    directivas:
      - "SIMCO-ARQUITECTURA.md"
      - "Todas las directivas"

  NEXUS-WORKSPACE:
    profile: "perfiles/PERFIL-WORKSPACE-MANAGER.md"
    role: "Organizacion y estructura del workspace"
    aliases:
      - "workspace-agent"
      - "ws-agent"
      - "org-agent"
    capabilities:
      - "workspace-organization"
      - "project-structure"
      - "inventory-management"
    directivas:
      - "SIMCO-NIVELES.md"
      - "SIMCO-PROPAGACION.md"

  NEXUS-DOCS:
    profile: "perfiles/PERFIL-DOCUMENTATION-VALIDATOR.md"
    role: "Validacion de Documentacion"
    aliases:
      - "docs-agent"
      - "documentation-agent"
      - "doc-agent"
    capabilities:
      - "documentation"
      - "api-docs"
      - "knowledge-base"
    directivas:
      - "SIMCO-DOCUMENTAR.md"

# ------------------------------------------------------------------------------
# CONFIGURACION DE DELEGACION
# ------------------------------------------------------------------------------
delegation:
  # Quien puede delegar a quien
  rules:
    NEXUS-TECH-LEADER:
      can_delegate_to: "all"

    NEXUS-BACKEND:
      can_delegate_to:
        - "NEXUS-DATABASE"
        - "NEXUS-DEVOPS"
        - "NEXUS-QA"

    NEXUS-FRONTEND:
      can_delegate_to:
        - "NEXUS-BACKEND"
        - "NEXUS-DEVOPS"
        - "NEXUS-QA"

    NEXUS-DEVOPS:
      can_delegate_to:
        - "NEXUS-DATABASE"

    NEXUS-DATABASE:
      can_delegate_to: []

  # Tareas que requieren coordinacion
  requires_coordination:
    - "architecture-change"
    - "new-service"
    - "breaking-change"
    - "security-issue"

# ------------------------------------------------------------------------------
# PROTOCOLOS
# ------------------------------------------------------------------------------
protocols:
  initialization:
    directive: "SIMCO-INICIALIZACION.md"
    required: true

  validation:
    directive: "SIMCO-VALIDAR.md"
    required: true

  documentation:
    directive: "SIMCO-DOCUMENTAR.md"
    required: true

# ------------------------------------------------------------------------------
# LOOKUP
# ------------------------------------------------------------------------------
# Para busqueda rapida de agente por alias
lookup:
  backend-agent: "NEXUS-BACKEND"
  api-agent: "NEXUS-BACKEND"
  frontend-agent: "NEXUS-FRONTEND"
  ui-agent: "NEXUS-FRONTEND"
  database-agent: "NEXUS-DATABASE"
  db-agent: "NEXUS-DATABASE"
  ddl-agent: "NEXUS-DATABASE"
  devops-agent: "NEXUS-DEVOPS"
  infra-agent: "NEXUS-DEVOPS"
  ci-agent: "NEXUS-DEVOPS"
  ml-agent: "NEXUS-ML"
  qa-agent: "NEXUS-QA"
  test-agent: "NEXUS-QA"
  security-agent: "NEXUS-SECURITY"
  tech-leader: "NEXUS-TECH-LEADER"
  architect: "NEXUS-TECH-LEADER"
  workspace-agent: "NEXUS-WORKSPACE"
  docs-agent: "NEXUS-DOCS"

# ------------------------------------------------------------------------------
# PATH ALIASES - Referencias a recursos del workspace
# ------------------------------------------------------------------------------
paths:
  # Standalone — all paths relative to project root
  # (control-plane/ paths removed — not applicable to standalone project)

  # Directivas SIMCO
  "@SIMCO": "orchestration/directivas/simco/"
  "@SIMCO_INDEX": "orchestration/directivas/simco/_INDEX.md"
  "@PRINCIPIOS": "orchestration/directivas/principios/"

  # Perfiles
  "@PERFILES": "orchestration/agents/perfiles/"

  # Inventarios
  "@INVENTORY": "orchestration/inventarios/"
  "@INV_DB": "orchestration/inventarios/DATABASE_INVENTORY.yml"
  "@INV_BE": "orchestration/inventarios/BACKEND_INVENTORY.yml"
  "@INV_FE": "orchestration/inventarios/FRONTEND_INVENTORY.yml"
  "@INV_MASTER": "orchestration/inventarios/MASTER_INVENTORY.yml"
  "@SKILLS_REGISTRY": "orchestration/inventarios/SKILLS-REGISTRY.yml"
  "@PROFILE_SKILL_MAP": "orchestration/agents/configs/PROFILE-SKILL-MAP.json"
  "@PROFILE_RESOLVER": "orchestration/agents/tools/profile_skill_resolver.py"

  # Proyecto
  "@BACKEND": "apps/backend/src/"
  "@FRONTEND": "apps/frontend/src/"
  "@DDL": "apps/database/ddl/"
  "@SEEDS": "apps/database/seeds/"
  "@DOCS": "docs/"

  # Knowledge Base
  "@KNOWLEDGE": "docs/80-references/knowledge-base/"
