# ─────────────────────────────────────────────────────────────────────────────────
# INSTRUCCIONES DE USO
# ─────────────────────────────────────────────────────────────────────────────────

instrucciones:
  registrar_actividad: |
    1. Abrir/crear archivo TRAZA-AGENTE-{PERFIL}.md
    2. Agregar entrada con formato del template
    3. Actualizar contador total_tareas en este índice
    4. Actualizar ultima_actividad

  consultar_historial: |
    - Por agente: Abrir archivo específico
    - Resumen global: Revisar este índice
    - Estadísticas: Ver sección estadisticas

  crear_nuevo_perfil: |
    1. Agregar entrada en sección perfiles
    2. Crear archivo usando TRAZA-AGENTE-TEMPLATE.md
    3. Actualizar estadisticas.total_agentes_activos

