# ─────────────────────────────────────────────────────────────────────────────────
# INSTRUCCIONES DE USO
# ─────────────────────────────────────────────────────────────────────────────────

instrucciones:
  crear_tarea_nueva: |
    1. Generar ID: TAREA-{YYYY-MM-DD}-{NNN}-{NOMBRE}
    2. Crear carpeta en orchestration/analisis/tareas/
    3. Copiar template de _templates/METADATA-TEMPLATE.yml
    4. Completar METADATA.yml con información de la tarea
    5. Crear archivos de fase según necesidad (F1-F7)
    6. Actualizar este índice (_INDEX.yml)

  usar_tarea_existente: |
    1. Consultar tareas existentes por dominio/tipo
    2. Navegar a carpeta correspondiente
    3. Leer archivos de fase para contexto
    4. Continuar desde última fase completada

  consultar: |
    Por dominio: por_dominio.auth
    Por tipo: por_tipo.analysis
    Por estado: estadisticas.completadas

