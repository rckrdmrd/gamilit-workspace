# CONTEXT-MAP: GAMILIT
# Sistema: SIMCO - NEXUS v4.1
# Proposito: Mapear contexto automatico por nivel y tarea
# Version: 4.0.0
# Fecha: 2026-02-11

metadata:
  proyecto: "gamilit"
  nivel: "STANDALONE"
  version: "4.0.0"
  ultima_actualizacion: "2026-02-11"
  project_root: "."  # Rutas relativas al root del proyecto gamilit-workspace

# ═══════════════════════════════════════════════════════════════════════════════
# VARIABLES DEL PROYECTO (PRE-RESUELTAS)
# ═══════════════════════════════════════════════════════════════════════════════

variables:
  # Identificación
  PROJECT: "gamilit"
  PROJECT_NAME: "GAMILIT"
  PROJECT_LEVEL: "STANDALONE"

  # Base de datos
  DB_NAME: "gamilit_platform"
  DB_DDL_PATH: "./apps/database/ddl"
  DB_SCRIPTS_PATH: "./apps/database"
  DB_SEEDS_PATH: "./apps/database/seeds"
  RECREATE_CMD: "apps/database/scripts/recreate-database.sh"
  AUTH_SCHEMA: "auth_management"

  # Backend
  BACKEND_ROOT: "./apps/backend"
  BACKEND_SRC: "./apps/backend/src"
  BACKEND_TESTS: "./apps/backend/tests"

  # Frontend
  FRONTEND_ROOT: "./apps/frontend"
  FRONTEND_SRC: "./apps/frontend/src"
  FRONTEND_TESTS: "./apps/frontend/tests"

  # Documentación
  DOCS_PATH: "./docs"
  ORCHESTRATION_PATH: "./orchestration"

# ═══════════════════════════════════════════════════════════════════════════════
# ALIASES RESUELTOS
# ═══════════════════════════════════════════════════════════════════════════════

aliases:
  # Directivas locales (standalone — governance is project-local)
  "@SIMCO": "./orchestration/directivas/simco"
  "@PRINCIPIOS": "./orchestration/directivas/principios"
  "@PERFILES": "./orchestration/agents/perfiles"

  # Proyecto específico
  "@DDL": "./apps/database/ddl"
  "@SEEDS": "./apps/database/seeds"
  "@BACKEND": "./apps/backend/src"
  "@FRONTEND": "./apps/frontend/src"
  "@DOCS": "./docs"

  # Inventarios
  "@INVENTORY": "./orchestration/inventarios"
  "@INV_DB": "./orchestration/inventarios/DATABASE_INVENTORY.yml"
  "@INV_BE": "./orchestration/inventarios/BACKEND_INVENTORY.yml"
  "@INV_FE": "./orchestration/inventarios/FRONTEND_INVENTORY.yml"

  # Trazas
  "@TRAZA_DB": "./orchestration/trazas/TRAZA-TAREAS-DATABASE.md"
  "@TRAZA_BE": "./orchestration/trazas/TRAZA-TAREAS-BACKEND.md"
  "@TRAZA_FE": "./orchestration/trazas/TRAZA-TAREAS-FRONTEND.md"

# ═══════════════════════════════════════════════════════════════════════════════
# CONTEXTO POR NIVEL
# ═══════════════════════════════════════════════════════════════════════════════

contexto_por_nivel:
  L0_sistema:
    descripcion: "CLAUDE.md, principios fundamentales y perfil de agente"
    tokens_estimados: 8000
    obligatorio: true
    nunca_purgar: true
    archivos:
      - path: "./orchestration/directivas/principios/PRINCIPIO-CAPVED.md"
        proposito: "Ciclo de vida de tareas"
        tokens: 800
      - path: "./orchestration/directivas/principios/PRINCIPIO-DOC-PRIMERO.md"
        proposito: "Documentación antes de código"
        tokens: 500
      - path: "./orchestration/directivas/principios/PRINCIPIO-ANTI-DUPLICACION.md"
        proposito: "Verificar catálogo antes de crear"
        tokens: 600
      - path: "./orchestration/directivas/principios/PRINCIPIO-VALIDACION-OBLIGATORIA.md"
        proposito: "Build/lint deben pasar"
        tokens: 600
      - path: "./orchestration/directivas/principios/PRINCIPIO-ECONOMIA-TOKENS.md"
        proposito: "Límites de contexto"
        tokens: 500
      - path: "./orchestration/directivas/principios/PRINCIPIO-NO-ASUMIR.md"
        proposito: "Preguntar si falta información"
        tokens: 500
      - path: "./orchestration/referencias/ALIASES.yml"
        proposito: "Resolución de @ALIAS"
        tokens: 400

  L1_proyecto:
    descripcion: "Contexto especifico de GAMILIT"
    tokens_estimados: 5000
    obligatorio: true
    archivos:
      - path: "./orchestration/PROJECT-CONTEXT.md"
        proposito: "Variables y configuración del proyecto"
        tokens: 1500
      - path: "./orchestration/PROXIMA-ACCION.md"
        proposito: "Estado actual y siguiente paso"
        tokens: 500
      - path: "./orchestration/inventarios/MASTER_INVENTORY.yml"
        proposito: "Estado de artefactos"
        tokens: 1000

  L2_operacion:
    descripcion: "SIMCO especificos segun operacion y dominio"
    tokens_estimados: 4000
    archivos_por_operacion:
      CREAR:
        - "./orchestration/directivas/simco/SIMCO-CREAR.md"
      MODIFICAR:
        - "./orchestration/directivas/simco/SIMCO-MODIFICAR.md"
      VALIDAR:
        - "./orchestration/directivas/simco/SIMCO-VALIDAR.md"
      DELEGAR:
        - "./orchestration/directivas/simco/SIMCO-DELEGACION.md"
    archivos_por_dominio:
      DDL:
        - "./orchestration/directivas/simco/SIMCO-DDL.md"
        - "./orchestration/inventarios/DATABASE_INVENTORY.yml"
      BACKEND:
        - "./orchestration/directivas/simco/SIMCO-BACKEND.md"
        - "./orchestration/inventarios/BACKEND_INVENTORY.yml"
      FRONTEND:
        - "./orchestration/directivas/simco/SIMCO-FRONTEND.md"
        - "./orchestration/inventarios/FRONTEND_INVENTORY.yml"

  L3_tarea:
    descripcion: "Contexto específico de la tarea"
    tokens_max: 8000
    dinamico: true

# ═══════════════════════════════════════════════════════════════════════════════
# INTEGRACIÓN CON DOCUMENTACIÓN (docs/)
# ═══════════════════════════════════════════════════════════════════════════════

integracion_docs:
  mapa_docs: "@DOCS/_MAP.md"

  estructura:
    overview: "@DOCS/00-overview/"
    requirements: "@DOCS/10-requirements/"
    architecture: "@DOCS/20-architecture/"
    ux_ui: "@DOCS/30-ux-ui/"
    api: "@DOCS/40-api/"
    standards: "@DOCS/40-standards/"
    guides: "@DOCS/50-guides/"
    portals: "@DOCS/60-portals/"
    onboarding: "@DOCS/70-onboarding/"
    references: "@DOCS/80-references/"
    adr: "@DOCS/90-adr/"
    delivery: "@DOCS/99-delivery/"

  archivos_clave:
    arquitectura: "@DOCS/20-architecture/README.md"
    stack: "@DOCS/20-architecture/STACK-TECNOLOGICO.md"
    gamificacion: "@DOCS/20-architecture/ARQUITECTURA-GAMIFICACION.md"
    mecanicas: "@DOCS/20-architecture/MECANICAS-GAMIFICACION-V6.md"
    vision: "@DOCS/00-overview/VISION-ALCANCE.md"
    ambientes: "@DOCS/20-architecture/AMBIENTES-DEV-PROD.md"
    standards: "@DOCS/40-standards/README.md"

  epics_por_fase:
    mvp: ["EPIC-GAM-SCAFFOLD", "EPIC-GAM-REQUIREMENTS", "EPIC-GAM-ARCHITECTURE", "EPIC-GAM-DATABASE", "EPIC-GAM-BACKEND", "EPIC-GAM-FRONTEND", "EPIC-GAM-INTEGRATION"]
    post_mvp: ["EPIC-GAM-K8S", "EPIC-GAM-TESTING", "EPIC-GAM-DEVOPS", "EPIC-GAM-DOCS"]

# ═══════════════════════════════════════════════════════════════════════════════
# MAPA TAREA → ARCHIVOS (Específico GAMILIT)
# ═══════════════════════════════════════════════════════════════════════════════

mapa_tarea_contexto:
  database:
    crear_tabla:
      simco: ["SIMCO-CREAR.md", "SIMCO-DDL.md"]
      inventario: "@INV_DB"
      referencia: "@DDL/schemas/*/tables/*.sql"
      docs: "@DOCS/20-architecture/"

    crear_indice:
      simco: ["SIMCO-CREAR.md", "SIMCO-DDL.md"]
      inventario: "@INV_DB"
      referencia: "DDL de tabla objetivo"

  backend:
    crear_entity:
      simco: ["SIMCO-CREAR.md", "SIMCO-BACKEND.md"]
      inventario: "@INV_BE"
      referencia: "@BACKEND/modules/*/entities/*.entity.ts"

    crear_service:
      simco: ["SIMCO-CREAR.md", "SIMCO-BACKEND.md"]
      inventario: "@INV_BE"
      referencia: "@BACKEND/modules/*/services/*.service.ts"

    crear_controller:
      simco: ["SIMCO-CREAR.md", "SIMCO-BACKEND.md"]
      inventario: "@INV_BE"
      referencia: "@BACKEND/modules/*/controllers/*.controller.ts"

  frontend:
    crear_componente:
      simco: ["SIMCO-CREAR.md", "SIMCO-FRONTEND.md"]
      inventario: "@INV_FE"
      referencia: "@FRONTEND/components/**/*.tsx"

    crear_pagina:
      simco: ["SIMCO-CREAR.md", "SIMCO-FRONTEND.md"]
      inventario: "@INV_FE"
      referencia: "@FRONTEND/pages/**/*.tsx"

