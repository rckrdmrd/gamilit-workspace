# Version: 4.0.0
# Fecha: 2026-02-14
# Proposito: Navegacion rapida mediante aliases cortos
# Nota: Reescrito para standalone gamilit. Workspace-era refs eliminados.
#       Fuente primaria de aliases para agentes: orchestration/agents/ALIASES.yml
