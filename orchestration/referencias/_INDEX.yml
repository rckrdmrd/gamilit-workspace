# _INDEX.yml - Índice de Archivos de Referencias
# ============================================================================
# Propósito: Acceso rápido a trazabilidad sin cargar documentación completa
# ============================================================================

version: "1.0.0"
updated: "2026-01-16"
description: "Archivos de referencia pequeños (<10KB) para trazabilidad eficiente"

# ============================================================================
# ARCHIVOS DE REFERENCIA
# ============================================================================

archivos:
  SCHEMA-REFERENCES.yml:
    proposito: "Mapeo Schema → Épica → Objetos"
    tamaño_aproximado: "5KB"
    caso_uso: "Encontrar qué épica y funcionalidad implementa un schema"
    contiene:
      - "16 schemas documentados"
      - "Índice inverso épica → schemas"
      - "Rutas a DDL y documentación detallada"
    ejemplo_consulta: "¿Qué épica implementa gamification_system?"

  TABLE-ENTITY-MAP.yml:
    proposito: "Mapeo bidireccional Tabla DDL ↔ Entity Backend"
    tamaño_aproximado: "6KB"
    caso_uso: "Verificar coherencia DDL-Backend"
    contiene:
      - "137 tablas mapeadas"
      - "121 entities correspondientes"
      - "16 tablas sin entity (intencionales, documentadas)"
      - "Índice inverso entity → tabla"
    ejemplo_consulta: "¿Qué entity corresponde a profiles?"
    coherencia_actual: "88%"

  FUNCTIONALITY-INDEX.yml:
    proposito: "Mapeo Funcionalidad → Implementación Multi-Capa"
    tamaño_aproximado: "8KB"
    caso_uso: "Encontrar todos los objetos que implementan una funcionalidad"
    contiene:
      - "15 funcionalidades core documentadas"
      - "Mapeo a Database (schema, tablas, funciones)"
      - "Mapeo a Backend (módulo, entities, services)"
      - "Mapeo a Frontend (feature, pages, components, stores)"
      - "Búsqueda rápida por objeto"
    ejemplo_consulta: "¿Qué objetos implementan sistema de logros?"

# ============================================================================
# CÓMO USAR ESTAS REFERENCIAS
# ============================================================================

uso_recomendado:
  para_agentes:
    - "Cargar _INDEX.yml primero para entender qué referencias existen"
    - "Cargar archivo específico según necesidad (evitar cargar todos)"
    - "Usar enlaces a documentación detallada solo cuando se requiera profundidad"

  para_trazabilidad:
    schema_a_funcionalidad: "SCHEMA-REFERENCES.yml → buscar schema → ver epic/funcionalidad"
    tabla_a_entity: "TABLE-ENTITY-MAP.yml → buscar tabla → ver entity y path"
    funcionalidad_a_objetos: "FUNCTIONALITY-INDEX.yml → buscar funcionalidad → ver todos los objetos"
    objeto_a_definicion: "FUNCTIONALITY-INDEX.yml → buscar_por_objeto → encontrar funcionalidad → seguir enlace definicion"

  flujo_tipico:
    - paso_1: "Identificar qué se necesita (schema, tabla, o funcionalidad)"
    - paso_2: "Cargar archivo de referencia correspondiente"
    - paso_3: "Encontrar enlace a documentación detallada"
    - paso_4: "Cargar documentación detallada solo si es necesario"

# ============================================================================
# RELACIÓN CON OTROS ARCHIVOS
# ============================================================================

referencias_relacionadas:
  inventarios_detallados:
    - "orchestration/inventarios/DATABASE_INVENTORY.yml"
    - "orchestration/inventarios/BACKEND_INVENTORY.yml"
    - "orchestration/inventarios/FRONTEND_INVENTORY.yml"
    - "orchestration/inventarios/MASTER_INVENTORY.yml"

  trazabilidad_completa:
    - "orchestration/inventarios/TRACEABILITY_MATRIX.yml"

  documentacion_funcional:
    - "docs/01-fase-alcance-inicial/ (EAI-001 a EAI-006)"
    - "docs/03-fase-extensiones/ (EXT-001 a EXT-007)"

  diseño_mecanicas:
    - "docs/00-vision-general/DocumentoDeDiseño_Mecanicas_GAMILIT_v6_1.md"

# ============================================================================
# MANTENIMIENTO
# ============================================================================

mantenimiento:
  frecuencia: "Actualizar cuando se agreguen nuevos schemas, tablas o funcionalidades"
  responsable: "Agente que realiza cambios estructurales"
  validacion:
    - "Verificar que totales coincidan con inventarios"
    - "Verificar que enlaces a documentación sean válidos"
    - "Mantener tamaño de archivos < 10KB cada uno"

