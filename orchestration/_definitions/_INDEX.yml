# ─────────────────────────────────────────────────────────────────────────────────
# IoC RESOLUTION - MAPA DE KEYWORDS A CONTEXTO (NEXUS v4.1)
# ─────────────────────────────────────────────────────────────────────────────────

ioc_resolution:
  descripcion: |
    Sistema de Inversión de Control para resolución automática de contexto.
    El agente declara QUÉ necesita, el sistema resuelve DÓNDE está.

  keywords_ddl:
    - keyword: tabla
      dominio: DDL
      cargar: [SIMCO-DDL.md, DATABASE_INVENTORY.yml]
    - keyword: schema
      dominio: DDL
      cargar: [SIMCO-DDL.md, DATABASE_INVENTORY.yml]
    - keyword: constraint
      dominio: DDL
      cargar: [SIMCO-DDL.md, DATABASE_INVENTORY.yml]
    - keyword: index
      dominio: DDL
      cargar: [SIMCO-DDL.md, DATABASE_INVENTORY.yml]

  keywords_backend:
    - keyword: entity
      dominio: BACKEND
      cargar: [SIMCO-BACKEND.md, BACKEND_INVENTORY.yml]
    - keyword: endpoint
      dominio: BACKEND
      cargar: [SIMCO-BACKEND.md, BACKEND_INVENTORY.yml]
    - keyword: service
      dominio: BACKEND
      cargar: [SIMCO-BACKEND.md, BACKEND_INVENTORY.yml]
    - keyword: controller
      dominio: BACKEND
      cargar: [SIMCO-BACKEND.md, BACKEND_INVENTORY.yml]

  keywords_frontend:
    - keyword: componente
      dominio: FRONTEND
      cargar: [SIMCO-FRONTEND.md, FRONTEND_INVENTORY.yml]
    - keyword: page
      dominio: FRONTEND
      cargar: [SIMCO-FRONTEND.md, FRONTEND_INVENTORY.yml]
    - keyword: hook
      dominio: FRONTEND
      cargar: [SIMCO-FRONTEND.md, FRONTEND_INVENTORY.yml]

  keywords_operacion:
    - keyword: crear
      operacion: CREAR
      cargar: [SIMCO-CREAR.md]
    - keyword: modificar
      operacion: MODIFICAR
      cargar: [SIMCO-MODIFICAR.md]
    - keyword: bug
      operacion: MODIFICAR
      cargar: [SIMCO-MODIFICAR.md, REGISTRO-ERRORES.yml]
    - keyword: test
      operacion: VALIDAR
      cargar: [SIMCO-VALIDAR.md]

# ─────────────────────────────────────────────────────────────────────────────────
# TOKEN BUDGET - PRESUPUESTO POR NIVEL (NEXUS v4.1)
# ─────────────────────────────────────────────────────────────────────────────────

token_budget:
  total: 20000
  por_nivel:
    L0_sistema: 8000
    L1_proyecto: 5000
    L2_operacion: 4000
    L3_tarea: 3000
  umbrales:
    warning: 14000      # 70% - Alerta amarilla
    critical: 17000     # 85% - Checkpoint automático
    emergency: 19000    # 95% - Purga forzada
    max: 20000          # 100% - Límite absoluto

# ─────────────────────────────────────────────────────────────────────────────────
# INSTRUCCIONES DE USO
# ─────────────────────────────────────────────────────────────────────────────────

instructions:
  para_referenciar: |
    En lugar de copiar contenido, usar:
    ```markdown
    ## PROTOCOLO CCA
    > Definición: @DEF_CCA
    ```

  para_agregar_definicion: |
    1. Crear archivo en subdirectorio apropiado
    2. Agregar entrada en este índice
    3. Agregar alias en ALIASES.yml sección 'definitions'
    4. Actualizar archivos que tenían copias

  para_modificar_definicion: |
    1. Modificar SOLO el archivo en _definitions/
    2. Todas las referencias automáticamente usan versión actualizada
    3. NO modificar archivos que referencian

