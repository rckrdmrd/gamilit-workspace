---
# RESUMEN DE DEPENDENCIAS CRÍTICAS

dependencias_criticas:
  - flujo: "Login → Inicialización Usuario"
    frontend: LoginPage → authAPI.login()
    backend: AuthController → AuthService
    database:
      - INSERT auth.users
      - INSERT auth_management.profiles
      - TRIGGER → INSERT gamification_system.user_stats
    nota: Trigger inicializa stats del usuario automáticamente

  - flujo: "Ejercicio → Recompensas"
    frontend: ExercisePage → educationalAPI.submitExercise()
    backend: ProgressController → ProgressService
    database:
      - INSERT progress_tracking.exercise_attempts
      - TRIGGER → UPDATE gamification_system.user_stats (XP, coins)
      - TRIGGER → UPDATE progress_tracking.module_progress
      - FUNCTION → check_and_award_achievements()
    nota: Flujo más complejo con múltiples efectos secundarios

  - flujo: "Compra Power-Up"
    frontend: ShopPage → socialAPI.purchasePowerUp()
    backend: SocialController → SocialService
    database:
      - UPDATE gamification_system.user_stats (ml_coins -)
      - INSERT gamification_system.ml_coins_transactions
      - UPDATE gamification_system.comodines_inventory (+)
    nota: Transacción atómica requerida

  - flujo: "Claim Misión"
    frontend: MissionsPage → gamificationAPI.claimMission()
    backend: MissionsController → MissionsService
    database:
      - UPDATE gamification_system.missions (status = 'claimed')
      - UPDATE gamification_system.user_stats (ml_coins +, xp +)
      - INSERT gamification_system.ml_coins_transactions
    nota: Validar que misión esté completada antes de claim
