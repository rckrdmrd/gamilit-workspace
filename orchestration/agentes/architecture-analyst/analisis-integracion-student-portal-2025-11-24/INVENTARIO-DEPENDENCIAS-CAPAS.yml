---
# DEPENDENCIAS POR PÁGINA FRONTEND

paginas:
  # ============================================
  # DASHBOARD
  # ============================================
  dashboard_complete:
    ubicacion: apps/frontend/src/apps/student/pages/DashboardComplete.tsx
    hooks_consumidos:
      - useDashboardData
      - useMissions
      - useUserModules
      - useRecentActivities
    stores_zustand:
      - useAuthStore
    endpoints_consumidos:
      - endpoint: GET /api/v1/gamification/users/{id}/ml-coins
        service: GamificationService
        dto_response: MlCoinsBalanceDto
        tabla_db: gamification_system.user_stats
      - endpoint: GET /api/v1/gamification/ranks/current
        service: GamificationService
        dto_response: UserRankResponseDto
        tabla_db: gamification_system.user_ranks
      - endpoint: GET /api/v1/gamification/ranks/users/{id}/rank-progress
        service: GamificationService
        dto_response: RankProgressDto
        tabla_db: gamification_system.user_ranks
      - endpoint: GET /api/v1/gamification/users/{id}/achievements
        service: GamificationService
        dto_response: UserAchievementDto[]
        tabla_db: gamification_system.user_achievements
      - endpoint: GET /api/v1/progress/users/{id}
        service: ProgressService
        dto_response: UserProgressOverviewDto
        tabla_db: progress_tracking.module_progress
      - endpoint: GET /api/v1/modules
        service: EducationalService
        dto_response: ModuleResponseDto[]
        tabla_db: educational_content.modules
      - endpoint: GET /api/v1/gamification/missions
        service: GamificationService
        dto_response: MissionDto[]
        tabla_db: gamification_system.missions

