        - endpoint: GET /api/v1/gamification/transactions/{userId}
          tabla_db: gamification_system.ml_coins_transactions
      achievements_store:
        - endpoint: GET /api/v1/gamification/users/{id}/achievements
          tabla_db: gamification_system.user_achievements

  achievements_page:
    ubicacion: apps/frontend/src/apps/student/pages/AchievementsPage.tsx
    hooks_consumidos:
      - useAchievements
    endpoints_consumidos:
