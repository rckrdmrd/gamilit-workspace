---
# FUNCIONES Y TRIGGERS DB RELEVANTES

funciones_db:
  gamification:
    - nombre: calculate_level_from_xp()
      proposito: Calcula nivel a partir de XP acumulada
      invocada_por: Triggers de actualización de XP

    - nombre: update_user_rank()
      proposito: Actualiza rango maya del usuario
      invocada_por: Trigger después de update en user_stats

    - nombre: promote_to_next_rank()
      proposito: Promueve usuario al siguiente rango
      invocada_por: update_user_rank() cuando cumple requisitos

    - nombre: check_and_award_achievements()
      proposito: Verifica y otorga logros automáticamente
      invocada_por: Después de exercise completion, module completion, etc.

    - nombre: award_ml_coins()
      proposito: Otorga ML Coins y registra transacción
      invocada_por: ExerciseSubmission, Mission claim, Achievement claim

    - nombre: process_exercise_completion()
      proposito: Procesa completación de ejercicio (XP, coins, achievements)
      invocada_por: Trigger después de INSERT en exercise_attempts

  progress:
    - nombre: calculate_module_progress()
      proposito: Calcula porcentaje de progreso del módulo
      invocada_por: Trigger después de exercise_attempts INSERT

    - nombre: update_module_progress_on_exercise_complete()
      proposito: Actualiza module_progress cuando se completa ejercicio
      invocada_por: Trigger en exercise_attempts

triggers_db:
  - nombre: trg_initialize_user_stats
    tabla: auth_management.profiles
    evento: AFTER INSERT
    funcion: initialize_user_stats()
    proposito: Crear user_stats al crear perfil

  - nombre: trg_update_module_progress
    tabla: progress_tracking.exercise_attempts
    evento: AFTER INSERT
    funcion: update_module_progress_on_exercise_complete()
    proposito: Actualizar progreso de módulo

  - nombre: trg_check_rank_promotion
    tabla: gamification_system.user_stats
    evento: AFTER UPDATE
    funcion: check_rank_promotion()
    proposito: Verificar si usuario puede subir de rango
    nota: Actualmente deshabilitado/eliminado

