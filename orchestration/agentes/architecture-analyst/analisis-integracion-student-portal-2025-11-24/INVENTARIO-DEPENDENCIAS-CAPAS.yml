  # EJERCICIOS
  # ============================================
  exercise_page:
    ubicacion: apps/frontend/src/apps/student/pages/ExercisePage.tsx
    apis_consumidas:
      - educationalAPI
    endpoints_consumidos:
      - endpoint: GET /api/v1/exercises/{id}
        service: EducationalService
        dto_response: ExerciseResponseDto
        tabla_db: educational_content.exercises
      - endpoint: POST /api/v1/exercises/{id}/submit
        service: ProgressService
        dto_request: ExerciseSubmissionDto
        dto_response: SubmitExerciseResponseDto
        tablas_db:
          - progress_tracking.exercise_attempts
          - progress_tracking.exercise_submissions
          - gamification_system.user_stats (actualización XP/coins)
      - endpoint: GET /api/v1/exercises/{id}/hints
        service: EducationalService
        dto_response: HintDto[]
        tabla_db: educational_content.exercises.hints
      - endpoint: POST /api/v1/exercises/{id}/progress
        service: ProgressService
        dto_request: SaveProgressDto
        dto_response: ProgressSaveDto
        tabla_db: progress_tracking.module_progress
    funciones_db_invocadas:
      - process_exercise_completion()
      - award_ml_coins()
      - check_and_award_achievements()

  module_detail_page:
    ubicacion: apps/frontend/src/apps/student/pages/ModuleDetailPage.tsx
    endpoints_consumidos:
      - endpoint: GET /api/v1/modules/{id}
        service: EducationalService
        dto_response: ModuleResponseDto
        tabla_db: educational_content.modules
      - endpoint: GET /api/v1/progress/modules/{id}
        service: ProgressService
        dto_response: ModuleProgressDetailDto
        tabla_db: progress_tracking.module_progress

  # ============================================
  # GAMIFICACIÓN
  # ============================================
