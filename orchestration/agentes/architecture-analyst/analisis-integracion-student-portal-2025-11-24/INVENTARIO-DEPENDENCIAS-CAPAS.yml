        dto_response: LeaderboardEntryDto[]
        vista_db: gamification_system.leaderboard_global
      - endpoint: GET /api/v1/gamification/leaderboard/coins
        service: GamificationService
        dto_response: LeaderboardEntryDto[]
        vista_db: gamification_system.leaderboard_coins
      - endpoint: GET /api/v1/gamification/leaderboard/user/{id}/position
        service: GamificationService
        dto_response: UserPositionDto
        vista_db: gamification_system.leaderboard_global
    websocket_pendiente:
      url: ws://{host}:{port}
      eventos:
        - leaderboard:update
        - user:rank-change
      nota: Comentado actualmente, requiere implementación

  missions_page:
