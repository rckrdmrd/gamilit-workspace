        dto_response: ActivePowerUpDto[]
        tabla_db: gamification_system.comodines_inventory
      - endpoint: POST /api/v1/powerups/{id}/use
        service: SocialService
        dto_request: UsePowerUpDto
        dto_response: UsePowerUpResponseDto
        tabla_db: gamification_system.comodines_inventory

  # ============================================
  # PERFIL Y CONFIGURACIÓN
  # ============================================
  profile_page:
