gaps_criticos:
  # ──────────────────────────────────────────────────────────────────────
  - id: "GAP-001"
    titulo: "RegisterData usa fullName pero Backend espera first_name/last_name"
    severidad: "P2"
    categoria: "Transformación"
    archivos:
      frontend: "apps/frontend/src/features/auth/types/auth.types.ts"
      backend: "apps/backend/src/modules/auth/dto/register-user.dto.ts"
    descripcion: |
      Frontend captura 'fullName' del usuario, pero Backend espera
      'first_name' y 'last_name' por separado.
    estado_actual: "Frontend debe separar fullName antes de enviar"
    recomendacion: |
      Implementar función helper en frontend:
      ```typescript
      function splitFullName(fullName: string): { firstName: string, lastName: string } {
        const parts = fullName.trim().split(' ');
        return {
          firstName: parts[0] || '',
          lastName: parts.slice(1).join(' ') || ''
        };
      }
      ```
    impacto: "Medio - Afecta flujo de registro"

  # ──────────────────────────────────────────────────────────────────────
  - id: "GAP-002"
    titulo: "SubmitExerciseDto acepta formato dual (camelCase y snake_case)"
    severidad: "P2"
    categoria: "Deprecación"
    archivos:
      frontend: "apps/frontend/src/shared/types/exercise-submission.types.ts"
      backend: "apps/backend/src/modules/educational/dto/exercises/submit-exercise.dto.ts"
    descripcion: |
      Backend acepta AMBOS formatos por compatibilidad temporal:
      - Nuevo: answers, startedAt, hintsUsed, powerupsUsed (camelCase)
      - Legacy: submitted_answers, started_at, hints_used, comodines_used (snake_case)
    estado_actual: "Frontend aún usa formato legacy en algunos componentes"
    recomendacion: |
      1. Auditar todos los calls a submitExercise
      2. Migrar a formato nuevo (camelCase)
      3. Coordinar con Backend para deprecar formato legacy
    impacto: "Medio - Deuda técnica"
    archivos_frontend_afectados:
      - "apps/frontend/src/features/mechanics/module1/Crucigrama/CrucigramaExercise.tsx"
      - "apps/frontend/src/features/mechanics/module2/DetectiveTextual/DetectiveTextualExercise.tsx"
      - "apps/frontend/src/features/mechanics/module4/QuizTikTok/QuizTikTokExercise.tsx"
