  tablas_encontradas:
    - nombre: "auth_management.profiles"
      ubicacion: "apps/database/ddl/schemas/auth_management/tables/03-profiles.sql"
      estado: "✅ PRODUCCIÓN"
      propósito: "Perfiles de usuarios con información de actividad básica"

      campos_actividad:
        - last_sign_in_at: "TIMESTAMP - Último inicio de sesión (CAMPO CRÍTICO)"
        - last_activity_at: "TIMESTAMP - Última actividad en la plataforma"
        - created_at: "TIMESTAMP - Registro del usuario"
        - updated_at: "TIMESTAMP - Última actualización de perfil"

      indices_performance:
