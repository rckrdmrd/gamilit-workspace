# =====================================================
# 1. RESPUESTAS DE EJERCICIOS
# =====================================================
respuestas_ejercicios:
  estado: "✅ EXCELENTE - 2 tablas complementarias"

  tablas_encontradas:
    - nombre: "progress_tracking.exercise_attempts"
      ubicacion: "apps/database/ddl/schemas/progress_tracking/tables/03-exercise_attempts.sql"
      estado: "✅ PRODUCCIÓN"
      propósito: "Registro de TODOS los intentos de ejercicios (múltiples intentos permitidos)"

      campos_criticos:
        - user_id: "UUID - FK a auth_management.profiles"
        - exercise_id: "UUID - FK a educational_content.exercises"
        - attempt_number: "INTEGER - Número de intento (permite retry)"
        - submitted_answers: "JSONB - Respuestas completas del estudiante"
        - is_correct: "BOOLEAN - Corrección automática"
        - score: "INTEGER - Puntos obtenidos"
        - time_spent_seconds: "INTEGER - Tiempo invertido"
        - hints_used: "INTEGER - Pistas usadas"
        - comodines_used: "JSONB - Array de comodines aplicados"
        - xp_earned: "INTEGER - XP ganados"
        - ml_coins_earned: "INTEGER - ML coins ganados"
        - submitted_at: "TIMESTAMP - Fecha/hora de envío"
        - metadata: "JSONB - Datos adicionales (browser, device, response_pattern)"

      indices_performance:
        - "idx_exercise_attempts_user (user_id)"
        - "idx_exercise_attempts_exercise (exercise_id)"
        - "idx_exercise_attempts_user_exercise (user_id, exercise_id)"
        - "idx_exercise_attempts_user_exercise_date (user_id, exercise_id, submitted_at DESC)"
        - "idx_exercise_attempts_submitted (submitted_at DESC)"

      rls_policies:
        - "exercise_attempts_insert_own - Estudiantes solo insertan sus propios intentos"
        - "exercise_attempts_select_own - Estudiantes ven solo sus intentos"
        - "exercise_attempts_select_admin - Admins ven todos"
        - "exercise_attempts_select_teacher - Teachers ven intentos de sus estudiantes"

      triggers:
        - "trg_update_user_stats_on_exercise - Actualiza gamification_system.user_stats automáticamente"

      fortalezas:
        - "Diseño robusto para auditoría completa de intentos"
        - "Soporte para comodines y hints integrado"
        - "Metadata JSONB permite tracking de patrones de respuesta"
        - "Trigger automático actualiza stats de gamificación"
        - "Índices compuestos optimizan queries de dashboards"

      campos_disponibles_vs_necesarios:
        necesarios:
          - "✅ user_id"
          - "✅ exercise_id"
          - "✅ response_data (submitted_answers)"
          - "✅ is_correct"
          - "✅ points_earned (score)"
          - "✅ submitted_at"
        adicionales_utiles:
          - "✅ attempt_number - Tracking de reintentos"
          - "✅ time_spent_seconds - Analytics de tiempo"
          - "✅ hints_used - Uso de ayudas"
          - "✅ xp_earned / ml_coins_earned - Gamificación"
          - "✅ metadata - Contexto del intento"

    - nombre: "progress_tracking.exercise_submissions"
      ubicacion: "apps/database/ddl/schemas/progress_tracking/tables/04-exercise_submissions.sql"
      estado: "✅ PRODUCCIÓN"
      propósito: "Entregas de ejercicios para CALIFICACIÓN (1 entrega final por usuario/ejercicio)"

      campos_criticos:
        - user_id: "UUID - FK a auth_management.profiles"
        - exercise_id: "UUID - FK a educational_content.exercises"
        - answer_data: "JSONB - Respuesta final del estudiante"
        - is_correct: "BOOLEAN - Corrección"
        - score: "INTEGER - Puntuación (0-max_score)"
        - max_score: "INTEGER - Puntuación máxima (default 100)"
        - feedback: "TEXT - Retroalimentación del maestro"
        - hint_used: "BOOLEAN - Si usó pistas"
        - hints_count: "INTEGER - Cantidad de pistas"
        - comodines_used: "TEXT[] - Array de tipos de comodines"
        - ml_coins_spent: "INTEGER - ML coins gastados"
        - time_spent_seconds: "INTEGER - Tiempo invertido"
        - attempt_number: "INTEGER - Número de intento"
        - status: "TEXT - Estado: draft, submitted, graded, reviewed"
        - started_at: "TIMESTAMP - Inicio del ejercicio"
        - submitted_at: "TIMESTAMP - Envío de la entrega"
        - graded_at: "TIMESTAMP - Fecha de calificación"
        - created_at: "TIMESTAMP"
        - updated_at: "TIMESTAMP"

      indices_performance:
        - "idx_exercise_submissions_user_id (user_id)"
        - "idx_exercise_submissions_exercise_id (exercise_id)"
        - "idx_exercise_submissions_user_exercise (user_id, exercise_id)"
        - "idx_exercise_submissions_status (status)"
        - "idx_exercise_submissions_submitted_at (submitted_at DESC)"

      rls_policies:
        - "exercise_submissions_insert_own"
        - "exercise_submissions_select_own"
        - "exercise_submissions_select_admin"
        - "exercise_submissions_select_teacher"
        - "exercise_submissions_update_own"

      triggers:
        - "exercise_submissions_updated_at - Auto-actualiza updated_at"

      diferencia_vs_attempts:
        descripcion: "submissions es para CALIFICACIÓN (1 registro por user/exercise), attempts es para HISTORIAL (múltiples registros)"
        caso_uso_submissions: "Portal Teacher - Calificar entregas finales con feedback"
        caso_uso_attempts: "Portal Admin - Analytics de intentos múltiples y patrones"

  gap_identificado: "NINGUNO"
  recomendaciones:
    - "✅ Sistema dual (attempts + submissions) es robusto y completo"
    - "✅ Usar exercise_attempts para analytics de progreso detallado"
    - "✅ Usar exercise_submissions para interfaz de calificación del teacher"
    - "Considerar: Vista consolidada que unifique attempts + submissions para dashboards"

# =====================================================
# 2. AVANCES DE ESTUDIANTES
# =====================================================
avances_estudiantes:
  estado: "✅ EXCELENTE - Tabla central con tracking completo"

  tabla_principal:
    nombre: "progress_tracking.module_progress"
    ubicacion: "apps/database/ddl/schemas/progress_tracking/tables/01-module_progress.sql"
    estado: "✅ PRODUCCIÓN"
    propósito: "Tracking completo de avance por módulo educativo"

    campos_criticos:
      identificadores:
        - user_id: "UUID - FK a auth_management.profiles"
        - module_id: "UUID - FK a educational_content.modules"

      estado_progreso:
        - status: "ENUM progress_status (not_started, in_progress, completed, reviewed, mastered)"
        - progress_percentage: "INTEGER (0-100) - Porcentaje de completitud"
        - completed_exercises: "INTEGER - Ejercicios completados"
        - total_exercises: "INTEGER - Total de ejercicios del módulo"
        - skipped_exercises: "INTEGER - Ejercicios omitidos"

      metricas_desempeno:
        - total_score: "INTEGER - Suma de puntos obtenidos"
        - max_possible_score: "INTEGER - Puntuación máxima posible"
        - average_score: "NUMERIC(5,2) - Promedio de puntuación"
        - best_score: "INTEGER - Mejor puntuación individual"

      gamificacion:
        - total_xp_earned: "INTEGER - XP total ganado"
        - total_ml_coins_earned: "INTEGER - ML Coins totales ganados"

      tiempo_actividad:
        - time_spent: "INTERVAL - Tiempo total invertido"
        - sessions_count: "INTEGER - Número de sesiones"
        - attempts_count: "INTEGER - Total de intentos"

      comodines_ayudas:
        - hints_used_total: "INTEGER - Pistas usadas en total"
        - comodines_used_total: "INTEGER - Comodines usados"
        - comodines_cost_total: "INTEGER - Costo total en ML coins"

      fechas_control:
        - started_at: "TIMESTAMP - Primera vez que accedió"
        - completed_at: "TIMESTAMP - Fecha de completitud"
        - last_accessed_at: "TIMESTAMP - Último acceso"
        - deadline: "TIMESTAMP - Fecha límite (si aplica)"

      contexto_educativo:
        - classroom_id: "UUID - Aula asignada"
        - assignment_id: "UUID - Tarea asociada (si aplica)"
        - allow_retry: "BOOLEAN - Permite reintentos"
        - sequential_completion: "BOOLEAN - Completitud secuencial forzada"
        - adaptive_difficulty: "BOOLEAN - Dificultad adaptativa"

      datos_analiticos:
        - learning_path: "JSONB - Ruta de aprendizaje personalizada"
        - performance_analytics: "JSONB - Análisis de desempeño"
        - system_observations: "JSONB - Observaciones del sistema"

      notas:
        - student_notes: "TEXT - Notas del estudiante"
        - teacher_notes: "TEXT - Notas del maestro"

      metadata:
        - metadata: "JSONB - Datos adicionales"
        - created_at: "TIMESTAMP"
        - updated_at: "TIMESTAMP"

    constraints:
      - "UNIQUE (user_id, module_id) - Un solo registro de progreso por usuario/módulo"
      - "CHECK progress_percentage 0-100"

    indices_performance:
      - "idx_module_progress_user (user_id)"
      - "idx_module_progress_module (module_id)"
      - "idx_module_progress_classroom (classroom_id)"
      - "idx_module_progress_status (status)"
      - "idx_module_progress_user_status_updated (user_id, status, updated_at DESC)"
      - "idx_module_progress_completed (user_id, status) WHERE status='completed'"
      - "idx_module_progress_incomplete (user_id, updated_at DESC) WHERE status IN ('not_started','in_progress')"

    rls_policies:
      - "module_progress_insert_own"
      - "module_progress_select_own"
      - "module_progress_select_admin"
      - "module_progress_select_teacher - Teachers ven progreso de sus estudiantes activos"
      - "module_progress_update_own"

    triggers:
      - "trg_module_progress_updated_at"

    fortalezas:
      - "Tabla extremadamente completa para analytics de progreso"
      - "Soporte para múltiples contextos (classroom, assignments)"
      - "Tracking de tiempo, intentos, comodines, hints"
      - "Campos JSONB permiten analytics avanzados sin cambios de schema"
      - "Índices optimizados para queries de dashboards (completed, incomplete)"
      - "RLS permite acceso seguro por rol"

    campos_disponibles_vs_necesarios:
      necesarios:
        - "✅ completion_percentage (progress_percentage)"
        - "✅ exercises_completed"
        - "✅ time_spent"
      adicionales_robustos:
        - "✅ total_score, average_score, best_score - Métricas de desempeño"
        - "✅ total_xp_earned, total_ml_coins_earned - Gamificación"
        - "✅ learning_path, performance_analytics - Analytics avanzados"
        - "✅ student_notes, teacher_notes - Seguimiento cualitativo"
        - "✅ adaptive_difficulty, sequential_completion - Personalización"

  tablas_complementarias:
    - nombre: "progress_tracking.teacher_notes"
      ubicacion: "apps/database/ddl/schemas/progress_tracking/tables/teacher_notes.sql"
      estado: "✅ PRODUCCIÓN"
      propósito: "Notas de maestros sobre estudiantes (seguimiento cualitativo)"
      campos:
        - "teacher_id, student_id, note, is_private, created_at"
      indices:
        - "idx_teacher_notes_teacher_id"
        - "idx_teacher_notes_student_id"
        - "idx_teacher_notes_teacher_student"

  gap_identificado: "NINGUNO"
  recomendaciones:
    - "✅ module_progress es extremadamente completo"
    - "Considerar: Vista agregada que combine module_progress + exercise_submissions para dashboard maestro"

