        - "✅ ML Coins (ml_coins, earned, spent)"
        - "✅ Ranks (current_rank, rank_progress)"
      adicionales_robustos:
        - "✅ Streaks completo (current, max, started_at, days_active)"
        - "✅ Progreso educativo completo"
        - "✅ Rankings pre-calculados (global, clase, escuela)"
        - "✅ Métricas temporales (weekly_xp, monthly_xp)"
        - "✅ Perfect scores para leaderboards de perfección"

  tablas_complementarias:
