  tabla_principal:
    nombre: "educational_content.assignment_submissions"
    ubicacion: "apps/database/ddl/schemas/educational_content/tables/08-assignment_submissions.sql"
    estado: "✅ PRODUCCIÓN"
    propósito: "Entregas de estudiantes para asignaciones con sistema de calificación"

    campos_criticos:
      identificadores:
        - assignment_id: "UUID - FK a educational_content.assignments"
        - student_id: "UUID - FK a auth.users"

      calificacion:
        - score: "NUMERIC(5,2) - Puntuación otorgada"
        - feedback: "TEXT - Retroalimentación del maestro"
        - graded_at: "TIMESTAMP - Fecha de calificación"
        - graded_by: "UUID - FK a auth.users (maestro que calificó)"

      estado:
