    nombre: "gamification_system.user_stats"
    ubicacion: "apps/database/ddl/schemas/gamification_system/tables/01-user_stats.sql"
    estado: "✅ PRODUCCIÓN"
    propósito: "Estadísticas completas de gamificación por usuario"

    campos_criticos:
      nivel_xp:
        - level: "INTEGER - Nivel actual (>= 1)"
        - total_xp: "INTEGER - XP total acumulado"
        - xp_to_next_level: "INTEGER - XP necesario para subir nivel"

      rangos_maya:
        - current_rank: "ENUM maya_rank - Ajaw, Nacom, Ah K'in, Halach Uinic, K'uk'ulkan"
        - rank_progress: "NUMERIC(5,2) - Progreso hacia siguiente rango (0-100%)"

      economia_ml_coins:
        - ml_coins: "INTEGER - Balance actual de ML Coins"
        - ml_coins_earned_total: "INTEGER - Total ganado históricamente"
        - ml_coins_spent_total: "INTEGER - Total gastado"
        - ml_coins_earned_today: "INTEGER - Ganado hoy (límites diarios)"
        - last_ml_coins_reset: "TIMESTAMP - Último reset diario"

      streaks:
        - current_streak: "INTEGER - Racha actual de días consecutivos"
        - max_streak: "INTEGER - Racha más larga alcanzada"
        - streak_started_at: "TIMESTAMP - Inicio de racha actual"
        - days_active_total: "INTEGER - Total de días activos"

      progreso_educativo:
        - exercises_completed: "INTEGER - Ejercicios completados"
        - modules_completed: "INTEGER - Módulos completados"
        - total_score: "INTEGER - Suma de puntos"
        - average_score: "NUMERIC(5,2) - Promedio de puntuación (0-100)"
        - perfect_scores: "INTEGER - Ejercicios con puntuación perfecta"

      logros_certificados:
        - achievements_earned: "INTEGER - Logros obtenidos"
        - certificates_earned: "INTEGER - Certificados ganados"

      tiempo_actividad:
        - total_time_spent: "INTERVAL - Tiempo total en plataforma"
        - weekly_time_spent: "INTERVAL - Tiempo semanal"
        - sessions_count: "INTEGER - Número de sesiones"

      xp_periodico:
        - weekly_xp: "INTEGER - XP de la semana actual"
        - monthly_xp: "INTEGER - XP del mes actual"
        - weekly_exercises: "INTEGER - Ejercicios completados esta semana"

      rankings:
        - global_rank_position: "INTEGER - Posición en ranking global"
        - class_rank_position: "INTEGER - Posición en aula"
        - school_rank_position: "INTEGER - Posición en escuela"

      actividad:
        - last_activity_at: "TIMESTAMP - Última actividad"
        - last_login_at: "TIMESTAMP - Último login"

      metadata:
        - metadata: "JSONB - Datos adicionales flexibles"
        - created_at: "TIMESTAMP"
        - updated_at: "TIMESTAMP"

    constraints:
      - "UNIQUE (user_id) - Un solo registro por usuario"
      - "CHECK level > 0"
      - "CHECK total_xp >= 0"
      - "CHECK rank_progress >= 0 AND rank_progress <= 100"
      - "CHECK ml_coins >= 0"
      - "CHECK current_streak >= 0"
      - "CHECK perfect_scores >= 0"
      - "CHECK average_score IS NULL OR (average_score >= 0 AND average_score <= 100)"

    indices_performance:
      - "idx_user_stats_user_id (user_id)"
      - "idx_user_stats_tenant_id (tenant_id)"
      - "idx_user_stats_level (level)"
      - "idx_user_stats_tenant_level (tenant_id, level DESC)"
      - "idx_user_stats_ml_coins (ml_coins)"
      - "idx_user_stats_streak (current_streak DESC)"
      - "idx_user_stats_global_rank (global_rank_position) WHERE global_rank_position IS NOT NULL"
      - "idx_user_stats_current_rank (current_rank)"
      - "idx_user_stats_perfect_scores (perfect_scores DESC)"

    rls_policies:
      - "user_stats_select_own - Usuarios ven sus propias stats"
      - "user_stats_select_admin - Admins ven todas"
      - "user_stats_update_system - Sistema actualiza todas (para triggers)"

    triggers:
      - "trg_user_stats_updated_at"

    fortalezas:
      - "Tabla EXTREMADAMENTE completa para gamificación"
      - "Soporte para múltiples tipos de rankings (global, clase, escuela)"
      - "Sistema de economy ML Coins robusto con límites diarios"
      - "Tracking de streaks para engagement"
      - "Métricas periódicas (semanal, mensual) para leaderboards temporales"
      - "Índices optimizados para leaderboards por nivel, coins, streaks"
      - "Campo metadata JSONB permite extensión sin cambios de schema"

    campos_disponibles_vs_necesarios:
