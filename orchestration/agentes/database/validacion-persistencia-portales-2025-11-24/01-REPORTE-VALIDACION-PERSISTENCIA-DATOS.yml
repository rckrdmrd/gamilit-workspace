# =====================================================
# 10. RECOMENDACIONES PRIORIZADAS
# =====================================================
recomendaciones:
  prioridad_p0_mvp:
    - id: "REC-001"
      titulo: "Corregir vista recent_activity"
      descripcion: "Actualizar vista para usar user_activity_logs en lugar de activity_log inexistente"
      impacto: "Dashboard admin podrá mostrar actividad reciente"
      estimacion: "2 horas"
      archivos_modificar:
        - "apps/database/ddl/schemas/admin_dashboard/views/01-recent_activity.sql"
      query_propuesto: |
        CREATE OR REPLACE VIEW admin_dashboard.recent_activity AS
        SELECT
          ual.id,
          ual.user_id,
          u.email,
          p.first_name,
          p.last_name,
          ual.activity_type as action_type,
          ual.action_detail as description,
          ual.metadata,
          ual.created_at
        FROM audit_logging.user_activity_logs ual
        LEFT JOIN auth.users u ON ual.user_id = u.id
        LEFT JOIN auth_management.profiles p ON u.id = p.user_id
        ORDER BY ual.created_at DESC
        LIMIT 100;

    - id: "REC-002"
      titulo: "Crear seeds de assignments para producción"
      descripcion: "Generar datos de ejemplo para assignments (10-15 assignments)"
      impacto: "Portal Teacher tendrá datos demo para asignaciones"
      estimacion: "4 horas"
      archivos_crear:
        - "apps/database/seeds/prod/educational_content/05-assignments.sql"
      contenido:
        - "10-15 assignments distribuidos en 5 classrooms"
        - "Fechas variadas (pasadas, presentes, futuras)"
        - "Status: pending, active, completed, overdue"
        - "Vincular con ejercicios existentes de módulos 1-3"

  prioridad_p1_mejoras:
    - id: "REC-003"
      titulo: "Crear vista consolidada exercise_progress_summary"
      descripcion: "Vista que unifique exercise_attempts + exercise_submissions para dashboards"
      beneficio: "Queries más simples en backend, mejor performance"
      estimacion: "3 horas"

    - id: "REC-004"
      titulo: "Crear vista teacher_dashboard_summary"
      descripcion: "Vista agregada específica para portal teacher (similar a admin_dashboard)"
      beneficio: "Queries optimizadas para dashboard de maestros"
      estimacion: "4 horas"

    - id: "REC-005"
      titulo: "Agregar índice compuesto assignment_submissions(teacher, status)"
      descripcion: "Optimizar query de entregas pendientes por maestro"
      beneficio: "Mejor performance en listado de entregas del teacher"
      estimacion: "1 hora"

  prioridad_p2_futuro:
