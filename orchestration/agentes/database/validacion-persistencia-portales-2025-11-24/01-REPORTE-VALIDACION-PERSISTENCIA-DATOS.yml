      rls_policies:
        - "profiles_select_admin - Admins ven todos los perfiles"
        - "profiles_select_own - Usuarios ven su propio perfil"

      fortalezas:
        - "Campo last_sign_in_at DISPONIBLE para dashboard admin"
        - "Índice optimizado para queries de actividad reciente"

      campos_disponibles_vs_necesarios:
        necesarios:
          - "✅ last_sign_in_at - CRÍTICO DISPONIBLE"
        adicionales:
          - "✅ last_activity_at - Actividad general"
          - "✅ created_at - Fecha de registro"

    - nombre: "audit_logging.user_activity_logs"
      ubicacion: "apps/database/ddl/schemas/audit_logging/tables/05-user_activity_logs.sql"
      estado: "✅ PRODUCCIÓN"
      propósito: "Registro detallado de actividad de usuarios para analytics avanzados"

      campos_actividad:
        - user_id: "UUID - FK a auth_management.profiles"
        - activity_type: "TEXT - page_view, button_click, exercise_start, exercise_complete, etc."
        - action_detail: "TEXT - Detalle de la acción"
        - session_id: "TEXT - ID de sesión"
        - session_duration: "INTERVAL - Duración de sesión"
        - module_id: "UUID - Módulo accedido"
        - exercise_id: "UUID - Ejercicio realizado"
        - classroom_id: "UUID - Aula"
        - page_url: "TEXT - URL visitada"
        - page_title: "TEXT - Título de página"
        - created_at: "TIMESTAMP - Momento de la actividad"

      campos_tecnicos:
        - user_agent: "TEXT - Navegador"
        - ip_address: "INET - Dirección IP"
        - device_type: "TEXT - Tipo de dispositivo"
        - browser_name: "TEXT"
        - browser_version: "TEXT"
        - screen_resolution: "TEXT"
        - load_time_ms: "INTEGER - Performance"
        - interaction_time_ms: "INTEGER"

      indices_performance:
        - "idx_activity_user (user_id)"
        - "idx_activity_created (created_at DESC)"
        - "idx_activity_type (activity_type)"
        - "idx_activity_session (session_id)"
        - "idx_activity_module (module_id) WHERE module_id IS NOT NULL"

      rls_policies:
        - "user_activity_logs_select_admin"
        - "user_activity_logs_select_own"

      fortalezas:
        - "Sistema extremadamente detallado de tracking de actividad"
        - "Soporte para analytics de sesiones, páginas, ejercicios"
        - "Datos técnicos para debugging y performance"
        - "Índices optimizados para queries de dashboards"

    - nombre: "audit_logging.user_activity"
      ubicacion: "apps/database/ddl/schemas/audit_logging/tables/06-user_activity.sql"
      estado: "✅ PRODUCCIÓN"
      propósito: "Registro simplificado de actividad"

      campos:
        - user_id: "UUID - FK a auth.users"
        - activity_type: "VARCHAR(100)"
        - description: "TEXT"
        - metadata: "JSONB"
        - ip_address: "INET"
        - user_agent: "TEXT"
        - created_at: "TIMESTAMP"

      indices:
        - "idx_user_activity_user_id"
        - "idx_user_activity_created_at (created_at DESC)"
        - "idx_user_activity_type"
        - "idx_user_activity_metadata (GIN on metadata)"

  vistas_dashboard:
    - nombre: "admin_dashboard.recent_activity"
      ubicacion: "apps/database/ddl/schemas/admin_dashboard/views/01-recent_activity.sql"
      estado: "⚠️ PROBLEMA - Referencia tabla inexistente"
      propósito: "Vista para dashboard admin - Últimas 100 acciones"

      problema_identificado:
        descripcion: "Vista referencia audit_logging.activity_log que NO EXISTE"
        query_actual: "SELECT ... FROM audit_logging.activity_log al ..."
        tablas_reales_disponibles:
          - "audit_logging.user_activity_logs"
          - "audit_logging.user_activity"
          - "audit_logging.audit_logs"

      solucion_propuesta:
        opcion_1:
          descripcion: "Crear tabla activity_log como alias o vista materializada"
          query: "CREATE TABLE activity_log AS SELECT ... FROM user_activity_logs"
        opcion_2:
          descripcion: "Actualizar vista para usar user_activity_logs"
          query_corregida: |
            CREATE VIEW admin_dashboard.recent_activity AS
            SELECT
              ual.id,
              ual.user_id,
              u.email,
              p.first_name,
              p.last_name,
              ual.activity_type as action_type,
              ual.action_detail as description,
              ual.metadata,
              ual.created_at
            FROM audit_logging.user_activity_logs ual
            LEFT JOIN auth.users u ON ual.user_id = u.id
            LEFT JOIN auth_management.profiles p ON u.id = p.user_id
            ORDER BY ual.created_at DESC
            LIMIT 100;

    - nombre: "admin_dashboard.user_stats_summary"
      ubicacion: "apps/database/ddl/schemas/admin_dashboard/views/user_stats_summary.sql"
      estado: "✅ FUNCIONAL"
      propósito: "Estadísticas agregadas de usuarios"

      metricas_disponibles:
        - total_users: "COUNT total de usuarios"
        - users_today: "Usuarios creados hoy"
        - users_this_week: "Usuarios creados última semana"
        - users_this_month: "Usuarios creados último mes"
        - active_users_today: "COUNT WHERE last_sign_in_at >= CURRENT_DATE"
        - active_users_week: "COUNT WHERE last_sign_in_at >= CURRENT_DATE - 7 days"
        - total_students: "COUNT WHERE role = 'student'"
        - total_teachers: "COUNT WHERE role = 'admin_teacher'"
        - total_admins: "COUNT WHERE role = 'super_admin'"

      fuente_datos: "auth.users"
      nota: "Vista usa last_sign_in_at correctamente"

  gap_identificado:
    nombre: "VISTA recent_activity ROTA"
    severidad: "MEDIA"
    impacto: "Dashboard admin no puede mostrar acciones recientes"
    solucion_estimada: "2 horas - Actualizar vista para usar user_activity_logs"

  campos_disponibles_vs_necesarios:
    necesarios:
      - "✅ last_sign_in_at - DISPONIBLE en profiles"
    adicionales_excelentes:
      - "✅ user_activity_logs - Sistema completo de tracking"
      - "✅ user_activity - Registro simplificado"
      - "✅ Vistas agregadas para dashboards"

  recomendaciones:
    - "URGENTE P0: Corregir vista admin_dashboard.recent_activity para usar user_activity_logs"
    - "Verificar si tabla activity_log debe crearse o es error de documentación"
    - "Considerar: Vista consolidada que unifique user_activity + user_activity_logs"

# =====================================================
# 5. ESTADÍSTICAS DE GAMIFICACIÓN
