# Gaps Identificados
gaps:
  - id: "PG-GAP-001"
    descripcion: "89% de páginas sin tests unitarios"
    prioridad: "P2 (Media)"
    estimacion: "10-13 días"
    afectados:
      - "42 páginas sin tests"

  - id: "PG-GAP-002"
    descripcion: "No hay navegación directa entre portales"
    prioridad: "P2 (Media)"
    estimacion: "1 día"
    solucion: "Implementar role switcher para usuarios multi-rol"

  - id: "PG-GAP-003"
    descripcion: "Portales teacher y admin tienen baja integración de gamificación"
    prioridad: "P3 (Baja)"
    estimacion: "2-3 días"
    nota: "Por diseño, gamificación es principalmente para estudiantes"

