# -------------------------------------------------------------------------------
# INSTRUCCIONES DE USO
# -------------------------------------------------------------------------------

instructions:
  para_referenciar: |
    En lugar de copiar contenido, usar:
    ```markdown
    ## PROTOCOLO CCA
    > Definicion: @DEF_CCA
    ```

  para_agregar_definicion: |
    1. Crear archivo en subdirectorio apropiado
    2. Agregar entrada en este indice
    3. Agregar alias en referencias/ALIASES.yml seccion 'definitions'
    4. Actualizar archivos que tenian copias

  para_modificar_definicion: |
    1. Modificar SOLO el archivo en _definitions/
    2. Todas las referencias automaticamente usan version actualizada
    3. NO modificar archivos que referencian

  sincronizacion_workspace: |
    Si el workspace actualiza definiciones:
    1. Comparar con version local
    2. Aplicar cambios manteniendo adaptaciones locales
    3. Actualizar fecha de propagacion

