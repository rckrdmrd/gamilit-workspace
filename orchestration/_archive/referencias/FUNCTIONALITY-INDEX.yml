# FUNCTIONALITY-INDEX.yml
# ============================================================================
# Índice de Funcionalidades: Funcionalidad → Implementación Multi-Capa
# ============================================================================
# Propósito: Dado un nombre de funcionalidad, encontrar todos los objetos
# que la implementan en Database, Backend y Frontend
# ============================================================================

version: "1.0.0"
updated: "2026-01-16"
purpose: "Índice funcionalidad → objetos multi-capa"

# ============================================================================
# FUNCIONALIDADES CORE
# ============================================================================

funcionalidades:

  # --------------------------------------------------------------------------
  # AUTENTICACIÓN Y USUARIOS
  # --------------------------------------------------------------------------
  autenticacion:
    epic: "EAI-001"
    definicion: "docs/01-fase-alcance-inicial/EAI-001-fundamentos/especificaciones/ET-AUTH-001.md"
    database:
      schema: "auth_management"
      tablas: ["profiles", "user_roles", "tenants"]
      funciones: ["ensure_profile_name"]
      triggers: ["trg_ensure_profile_name", "trg_profiles_updated_at"]
    backend:
      modulo: "auth"
      entities: ["profile.entity.ts", "user-role.entity.ts"]
      services: ["auth.service.ts", "jwt.service.ts", "password.service.ts"]
      controllers: ["auth.controller.ts"]
      guards: ["jwt-auth.guard.ts", "roles.guard.ts"]
    frontend:
      feature: "auth"
      pages: ["LoginPage", "RegisterPage", "ForgotPasswordPage"]
      components: ["LoginForm", "RegisterForm", "PasswordInput"]
      stores: ["authStore"]
      api: ["authAPI.ts"]

  perfil_usuario:
    epic: "EXT-004"
    definicion: "docs/03-fase-extensiones/EXT-004-perfiles/"
    database:
      schema: "auth_management"
      tablas: ["profiles"]
      vistas: ["v_user_profile_complete"]
    backend:
      modulo: "profile"
      entities: ["profile.entity.ts"]
      services: ["profile.service.ts"]
      controllers: ["profile.controller.ts"]
    frontend:
      feature: "profile"
      pages: ["ProfilePage", "EditProfilePage"]
      components: ["ProfileCard", "AvatarUpload", "ProfileForm"]

  # --------------------------------------------------------------------------
  # GAMIFICACIÓN
  # --------------------------------------------------------------------------
  sistema_xp_niveles:
    epic: "EAI-003"
    definicion: "docs/01-fase-alcance-inicial/EAI-003-gamificacion/especificaciones/ET-GAM-001.md"
    documento_diseño: "docs/00-vision-general/DocumentoDeDiseño_Mecanicas_GAMILIT_v6_1.md"
    database:
      schema: "gamification_system"
      tablas: ["user_stats", "levels", "ranks", "xp_transactions"]
      funciones: ["calculate_xp", "update_user_level", "initialize_user_stats"]
      triggers: ["trg_update_xp", "trg_check_level_up"]
    backend:
      modulo: "gamification"
      entities: ["user-stats.entity.ts", "level.entity.ts", "rank.entity.ts"]
      services: ["user-stats.service.ts", "xp.service.ts", "levels.service.ts"]
      controllers: ["gamification.controller.ts"]
    frontend:
      feature: "gamification"
      pages: ["DashboardPage"]
      components: ["XPBar", "LevelBadge", "RankIcon", "GamifiedHeader"]
      stores: ["economyStore", "ranksStore"]

  logros_achievements:
    epic: "EAI-003"
    definicion: "docs/01-fase-alcance-inicial/EAI-003-gamificacion/especificaciones/ET-GAM-002.md"
    database:
      schema: "gamification_system"
      tablas: ["achievements", "user_achievements", "achievement_conditions"]
      funciones: ["check_achievement_unlock", "grant_achievement"]
      triggers: ["trg_achievement_unlock"]
    backend:
      modulo: "gamification"
      entities: ["achievement.entity.ts", "user-achievement.entity.ts"]
      services: ["achievements.service.ts"]
      controllers: ["achievements.controller.ts"]
    frontend:
      feature: "gamification"
      pages: ["AchievementsPage"]
      components: ["AchievementCard", "AchievementModal", "AchievementsGrid"]
      stores: ["achievementsStore"]

  misiones:
    epic: "EAI-003"
    database:
      schema: "gamification_system"
      tablas: ["missions", "mission_templates", "user_missions"]
      funciones: ["generate_daily_missions", "check_mission_completion"]
    backend:
      modulo: "gamification"
      entities: ["mission.entity.ts", "mission-template.entity.ts", "user-mission.entity.ts"]
      services: ["missions.service.ts", "mission-generator.service.ts"]
    frontend:
      pages: ["MissionsPage"]
      components: ["MissionCard", "MissionProgress"]
      stores: ["missionsStore"]

  leaderboards:
    epic: "EAI-003"
    database:
      schema: "gamification_system"
      tablas: ["leaderboards", "leaderboard_entries"]
      vistas_materializadas: ["mv_global_leaderboard", "mv_classroom_leaderboard"]
    backend:
      modulo: "gamification"
      entities: ["leaderboard.entity.ts"]
      services: ["leaderboard.service.ts"]
    frontend:
      pages: ["LeaderboardPage"]
      components: ["LeaderboardTable", "LeaderboardTabs"]
      stores: ["leaderboardsStore"]

  # --------------------------------------------------------------------------
  # CONTENIDO EDUCATIVO
  # --------------------------------------------------------------------------
  ejercicios:
    epic: "EAI-002"
    definicion: "docs/01-fase-alcance-inicial/EAI-002-actividades/"
    documento_diseño: "docs/00-vision-general/DocumentoDeDiseño_Mecanicas_GAMILIT_v6_1.md"
    database:
      schema: "educational_content"
      tablas: ["exercises", "modules"]
      funciones_validacion: 26  # Un validador por tipo de ejercicio
      ejemplos_funciones: ["validate_crucigrama", "validate_word_search", "validate_timeline"]
    backend:
      modulo: "educational"
      entities: ["exercise.entity.ts", "module.entity.ts"]
      services: ["exercises.service.ts", "exercise-validation.service.ts"]
      validadores: "modules/progress/services/validators/"
    frontend:
      feature: "exercises"
      mecanicas: 33  # Componentes de mecánicas de ejercicios
      ubicacion: "features/gamification/mechanics/"
      ejemplos: ["CrosswordMechanic", "TimelineMechanic", "WordSearchMechanic"]

  progreso_modulos:
    epic: "EAI-004"
    definicion: "docs/01-fase-alcance-inicial/EAI-004-analytics/"
    database:
      schema: "progress_tracking"
      tablas: ["module_progress", "exercise_attempts", "learning_sessions"]
      funciones: ["update_module_progress", "calculate_completion_percentage"]
      triggers: ["trg_auto_module_progress"]
    backend:
      modulo: "progress"
      entities: ["module-progress.entity.ts", "exercise-attempt.entity.ts"]
      services: ["module-progress.service.ts", "exercise-submission.service.ts"]
    frontend:
      pages: ["MyProgressPage", "ModuleDetailsPage"]
      components: ["ProgressCard", "ProgressFilter", "StatsOverview"]

  # --------------------------------------------------------------------------
  # SOCIAL
  # --------------------------------------------------------------------------
  amigos:
    epic: "EAI-003-EXT"
    definicion: "docs/03-fase-extensiones/EAI-003-EXT-gamificacion-social/"
    database:
      schema: "social_features"
      tablas: ["friendships", "friend_requests"]
      funciones: ["send_friend_request", "accept_friend_request"]
    backend:
      modulo: "social"
      entities: ["friendship.entity.ts"]
      services: ["friendships.service.ts"]
    frontend:
      pages: ["FriendsPage"]
      components: ["FriendCard", "FriendRequestCard", "FriendSearch"]
      stores: ["friendsStore"]

  aulas_classrooms:
    epic: "EAI-003-EXT"
    database:
      schema: "social_features"
      tablas: ["classrooms", "classroom_students", "teacher_classrooms"]
      funciones: ["update_classroom_member_count", "sync_teacher_classroom"]
      triggers: ["trg_update_classroom_count", "trg_sync_teacher_classroom"]
    backend:
      modulo: "social"
      entities: ["classroom.entity.ts", "classroom-student.entity.ts"]
      services: ["classrooms.service.ts"]
    frontend:
      portal_teacher: ["ClassroomsPage", "ClassroomDetailsPage"]
      portal_admin: ["ClassroomManagement"]

  # --------------------------------------------------------------------------
  # NOTIFICACIONES
  # --------------------------------------------------------------------------
  notificaciones_push:
    epic: "EXT-003"
    definicion: "docs/03-fase-extensiones/EXT-003-notificaciones/"
    database:
      schema: "notifications"
      tablas: ["notifications", "push_subscriptions", "notification_preferences"]
    backend:
      modulo: "notifications"
      entities: ["notification.entity.ts", "push-subscription.entity.ts"]
      services: ["notifications.service.ts", "push-notification.service.ts"]
      websocket: "gateways/notifications.gateway.ts"
    frontend:
      components: ["NotificationBell", "NotificationList", "NotificationItem"]
      stores: ["notificationsStore"]
      hooks: ["usePushNotifications"]

  # --------------------------------------------------------------------------
  # ADMINISTRACIÓN
  # --------------------------------------------------------------------------
  admin_usuarios:
    epic: "EAI-005"
    definicion: "docs/01-fase-alcance-inicial/EAI-005-admin-base/"
    database:
      schema: "admin_dashboard"
      vistas: ["v_user_overview", "v_recent_activity"]
    backend:
      modulo: "admin"
      services: ["admin-users.service.ts"]
      controllers: ["admin-users.controller.ts"]
    frontend:
      portal: "admin"
      pages: ["UsersPage", "UserDetailPage"]

  admin_reportes:
    epic: "EXT-005"
    definicion: "docs/03-fase-extensiones/EXT-005-reportes/"
    database:
      schema: "admin_dashboard"
      tablas: ["admin_reports"]
      vistas_materializadas: ["mv_organization_stats", "mv_user_activity_summary"]
    backend:
      modulo: "admin"
      services: ["admin-reports.service.ts", "admin-analytics.service.ts"]
    frontend:
      portal: "admin"
      pages: ["ReportsPage", "AnalyticsPage"]

# ============================================================================
# BÚSQUEDA RÁPIDA POR OBJETO
# ============================================================================

busqueda_por_objeto:
  stores:
    authStore: "autenticacion"
    economyStore: "sistema_xp_niveles"
    ranksStore: "sistema_xp_niveles"
    achievementsStore: "logros_achievements"
    missionsStore: "misiones"
    leaderboardsStore: "leaderboards"
    friendsStore: "amigos"
    notificationsStore: "notificaciones_push"

  tablas_principales:
    profiles: "autenticacion"
    user_stats: "sistema_xp_niveles"
    achievements: "logros_achievements"
    missions: "misiones"
    exercises: "ejercicios"
    module_progress: "progreso_modulos"
    friendships: "amigos"
    classrooms: "aulas_classrooms"
    notifications: "notificaciones_push"

# ============================================================================
# REFERENCIAS
# ============================================================================

referencias:
  documento_diseño: "docs/00-vision-general/DocumentoDeDiseño_Mecanicas_GAMILIT_v6_1.md"
  schema_references: "orchestration/referencias/SCHEMA-REFERENCES.yml"
  table_entity_map: "orchestration/referencias/TABLE-ENTITY-MAP.yml"
  traceability_matrix: "orchestration/inventarios/TRACEABILITY_MATRIX.yml"
