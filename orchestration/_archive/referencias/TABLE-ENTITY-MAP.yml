# ============================================================================
# ÍNDICE INVERSO: Entity → Tabla
# ============================================================================

entity_to_table:
  # Auth
  "profile.entity.ts": "auth_management.profiles"
  "user-role.entity.ts": "auth_management.user_roles"
  "tenant.entity.ts": "auth_management.tenants"
  "role.entity.ts": "auth_management.roles"

  # Educational
  "module.entity.ts": "educational_content.modules"
  "exercise.entity.ts": "educational_content.exercises"
  "assignment.entity.ts": "educational_content.assignments"

  # Gamification
  "user-stats.entity.ts": "gamification_system.user_stats"
  "achievement.entity.ts": "gamification_system.achievements"
  "mission.entity.ts": "gamification_system.missions"
  "leaderboard.entity.ts": "gamification_system.leaderboards"

  # Progress
  "module-progress.entity.ts": "progress_tracking.module_progress"
  "exercise-attempt.entity.ts": "progress_tracking.exercise_attempts"

  # Social
  "friendship.entity.ts": "social_features.friendships"
  "guild.entity.ts": "social_features.guilds"
  "classroom.entity.ts": "social_features.classrooms"

  # Notifications
  "notification.entity.ts": "notifications.notifications"

# ============================================================================
# TABLAS SIN ENTITY (INTENCIONALES)
# ============================================================================

tablas_sin_entity:
  tracking_automatico:
    - "progress_tracking.user_difficulty_progress"
    - "progress_tracking.user_current_level"
    - "progress_tracking.module_completion_tracking"
    motivo: "Gestionadas por triggers de BD, no expuestas a API"

  deprecated:
    - "educational_content.exercise_options"
    - "educational_content.exercise_answers"
    motivo: "Datos embebidos en JSONB de tablas principales"

  tablas_m2m_typeorm:
    - "gamification_system.achievement_conditions"
    - "social_features.guild_achievements"
    motivo: "Tablas M:N gestionadas automáticamente por TypeORM"

# ============================================================================
# REFERENCIAS
# ============================================================================

referencias:
  inventario_detallado_backend: "orchestration/inventarios/BACKEND_INVENTORY.yml"
  inventario_detallado_database: "orchestration/inventarios/DATABASE_INVENTORY.yml"
  matriz_coherencia: "orchestration/inventarios/TRACEABILITY_MATRIX.yml"
