# INSTRUCCIONES DE USO
# ─────────────────────────────────────────────────────────────────────────────────

instrucciones:
  uso: |
    Los aliases se pueden usar de las siguientes formas:
    1. En prompts: "Consultar @INDICE-TAREAS para ver tareas existentes"
    2. En documentación: "Ver [Índice de Tareas](@INDICE-TAREAS)"
    3. En comandos: "cat $(alias_resolver @TRAZA-BACKEND)"

  agregar_alias: |
    1. Identificar categoría del alias
    2. Agregar entrada con ruta y descripción
    3. Actualizar este archivo

