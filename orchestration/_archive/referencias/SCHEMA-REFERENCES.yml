    epic_name: "Fundamentos del Sistema"
    definicion: "docs/01-fase-alcance-inicial/EAI-001-fundamentos/"
    funcionalidad: "Autenticación, RBAC, Perfiles de Usuario"
    tablas_principales:
      - nombre: "profiles"
        entity: "profile.entity.ts"
        modulo_backend: "auth"
        ruta_entity: "modules/auth/entities/"
      - nombre: "user_roles"
        entity: "user-role.entity.ts"
        modulo_backend: "auth"
      - nombre: "tenants"
        entity: "tenant.entity.ts"
        modulo_backend: "admin"
