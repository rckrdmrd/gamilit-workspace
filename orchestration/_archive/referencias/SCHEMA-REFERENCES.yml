    ddl_path: "apps/database/ddl/schemas/audit_logging/"

  system_configuration:
    epic: "EAI-006"
    epic_name: "Configuración del Sistema"
    definicion: "docs/01-fase-alcance-inicial/EAI-006-configuracion-sistema/"
    funcionalidad: "Feature Flags, System Parameters"
    ddl_path: "apps/database/ddl/schemas/system_configuration/"

  storage:
    epic: "EXT-006"
    epic_name: "Almacenamiento"
    funcionalidad: "Files, Media Storage"
    ddl_path: "apps/database/ddl/schemas/storage/"
    nota: "4 enums deprecated"

# ============================================================================
# ÍNDICE INVERSO: ÉPICA → SCHEMAS
# ============================================================================

epics_to_schemas:
  EAI-001:
    name: "Fundamentos"
    schemas: ["auth_management", "auth", "audit_logging"]
  EAI-002:
    name: "Actividades Educativas"
    schemas: ["educational_content"]
  EAI-003:
    name: "Gamificación"
    schemas: ["gamification_system"]
  EAI-003-EXT:
    name: "Gamificación Social"
    schemas: ["social_features"]
  EAI-004:
    name: "Analytics"
    schemas: ["progress_tracking"]
  EAI-005:
    name: "Admin"
    schemas: ["admin_dashboard"]
  EAI-006:
    name: "Configuración"
    schemas: ["system_configuration"]
  EXT-003:
    name: "Notificaciones"
    schemas: ["notifications", "communication"]
  EXT-006:
    name: "Contenido"
    schemas: ["content_management", "storage"]
  EXT-007:
    name: "LTI"
    schemas: ["lti_integration"]

