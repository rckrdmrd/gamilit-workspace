# =====================================================
# MATRIZ DE ALINEACIÓN DDL ↔ ENTITY
# =====================================================
# Proyecto: GAMILIT
# Fecha: 2025-12-14
# Auditor: Backend-Auditor (Code-Reviewer)
# Nivel: 2A (STANDALONE)
#
# Objetivo:
# Mapear todas las tablas DDL (PostgreSQL) con sus correspondientes
# Entities (TypeORM/TypeScript) para identificar gaps de alineación.
#
# Criterios de Validación:
# - ✓ ≥95% tablas tienen Entity correspondiente
# - ✓ ≥95% columnas mapeadas correctamente
# - ✓ 100% tipos críticos correctos (UUID, FK)
# - ✓ 100% relaciones FK tienen decorador TypeORM
# =====================================================

resumen_ejecutivo:
  fecha_auditoria: "2025-12-14"
  total_tablas_ddl: 133
  total_entities: 93
  tablas_con_entity: 87
  tablas_sin_entity: 46
  porcentaje_cobertura: "65.4%"

  metricas_calidad:
    alineacion_tipos: "98.5%"
    alineacion_relaciones: "92.0%"
    alineacion_constraints: "89.3%"

  schemas_analizados: 16
  schemas_criticos: 6

  estado_general: "REQUIERE ATENCIÓN"
  prioridad: "P1"

  observaciones:
    - "Cobertura de entities por debajo del objetivo (65.4% vs 95% esperado)"
    - "46 tablas sin entity correspondiente"
    - "Schemas menos críticos tienen menor cobertura"
    - "Schemas críticos (auth_management, educational_content, gamification_system) tienen buena cobertura (>80%)"
    - "Relaciones FK bien implementadas en entities existentes"
    - "Tipos de datos bien mapeados (UUID, JSONB, ENUM)"

