# =====================================================
# ANÁLISIS DE CALIDAD DE DTOs
# =====================================================

calidad_dtos:
  # ---------------------------------------------------
  # CreateDto Quality
  # ---------------------------------------------------
  create_dtos:
    total: 78
    con_validadores: 78
    porcentaje_validadores: "100%"

    validadores_mas_usados:
      - nombre: "@IsString()"
        uso: "~95%"
        correcto: true
      - nombre: "@IsUUID()"
        uso: "~90%"
        correcto: true
      - nombre: "@IsOptional()"
        uso: "~85%"
        correcto: true
      - nombre: "@IsEnum()"
        uso: "~75%"
        correcto: true
      - nombre: "@IsInt() / @IsNumber()"
        uso: "~70%"
        correcto: true
      - nombre: "@IsArray()"
        uso: "~60%"
        correcto: true
      - nombre: "@Min() / @Max()"
        uso: "~40%"
        notas: "Debería usarse más para constraints numéricos"
      - nombre: "@MaxLength()"
        uso: "~35%"
        notas: "Debería usarse más para alineación con CHECK constraints DDL"

    campos_correctamente_excluidos:
      - "id (PK auto-generado)"
      - "created_at (@CreateDateColumn)"
      - "updated_at (@UpdateDateColumn)"
      - "deleted_at (soft delete timestamp)"

    mejores_practicas_observadas:
      - "✅ Uso de @IsOptional() para campos nullable"
      - "✅ @IsEnum() para ENUMs con types TypeScript"
      - "✅ @IsEmail() para validación de emails"
      - "✅ @Matches() para validación de patrones (phone, etc)"
      - "✅ @MaxLength() alineado con CHECK constraints DDL (ej: bio ≤500)"
      - "✅ Validadores custom para JSONB schemas"

  # ---------------------------------------------------
  # UpdateDto Quality
  # ---------------------------------------------------
  update_dtos:
    total: 73
    con_partial_type: 68
    porcentaje_partial_type: "93.2%"

    patrones_observados:
      - patron: "PartialType(CreateDto)"
        uso: "~85%"
        evaluacion: "✅ CORRECTO - Hace todos los campos opcionales"

      - patron: "PartialType(OmitType(CreateDto, [...]))"
        uso: "~10%"
        evaluacion: "✅ EXCELENTE - Excluye campos no actualizables"
        ejemplo: "UpdateProfileDto excluye tenant_id, user_id"

      - patron: "Custom DTO (no extends CreateDto)"
        uso: "~5%"
        evaluacion: "⚠️ ACEPTABLE - Para casos especiales"

    campos_correctamente_excluidos:
      - "id (nunca actualizable)"
      - "tenant_id (no cambia post-creación)"
      - "user_id (FK inmutable)"
      - "created_at (timestamp inmutable)"

    mejores_practicas:
      - "✅ UpdateDto siempre hace campos opcionales"
      - "✅ Excluye campos inmutables (id, tenant_id, etc)"
      - "✅ Mantiene validadores de CreateDto"

  # ---------------------------------------------------
  # ResponseDto Quality
  # ---------------------------------------------------
  response_dtos:
    total: 81
    con_transformaciones: 45
    porcentaje_transformaciones: "55.6%"

    campos_sensibles_excluidos:
      - campo: "encrypted_password (UserEntity)"
        metodo: "@Exclude() decorator"
        estado: "✅ CORRECTO"

      - campo: "Tokens (password_reset, email_verification)"
        metodo: "No incluidos en ResponseDto"
        estado: "✅ CORRECTO"

    transformaciones_observadas:
      - tipo: "@Expose() selectivo"
        uso: "~30%"
        evaluacion: "✅ BUENO"

      - tipo: "@Transform() para formateo"
        uso: "~15%"
        evaluacion: "✅ EXCELENTE"
        ejemplos:
          - "Formatear Date a ISO string"
          - "Redondear números"

      - tipo: "Relaciones anidadas"
        uso: "~40%"
        evaluacion: "✅ BUENO"
        ejemplos:
          - "ModuleResponseDto incluye exercises count"
          - "ProfileResponseDto incluye user role"

    mejores_practicas:
      - "✅ @Exclude() en campos sensibles"
      - "✅ @ApiProperty() para documentación Swagger"
      - "✅ DTOs compuestos para reducir queries (ej: ModuleWithProgressDto)"

