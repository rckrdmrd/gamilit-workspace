# =====================================================
# MATRIZ DE ALINEACIÓN ENTITY ↔ DTO
# =====================================================
# Proyecto: GAMILIT
# Fecha: 2025-12-14
# Auditor: Backend-Auditor (Code-Reviewer)
# Nivel: 2A (STANDALONE)
#
# Objetivo:
# Mapear todas las Entities con sus DTOs correspondientes
# (Create, Update, Response) para validar completitud del API.
#
# Criterios de Validación:
# - ≥90% Entities tienen CreateDto
# - ≥90% Entities tienen UpdateDto
# - ≥90% Entities tienen ResponseDto
# - 100% CreateDtos excluyen autogenerados (id, timestamps)
# - 100% DTOs tienen validadores
# =====================================================

resumen_ejecutivo:
  fecha_auditoria: "2025-12-14"
  total_entities: 93
  entities_con_create_dto: 78
  entities_con_update_dto: 73
  entities_con_response_dto: 81
  entities_sin_dtos: 8

  porcentajes:
    cobertura_create: "83.9%"
    cobertura_update: "78.5%"
    cobertura_response: "87.1%"
    cobertura_general: "83.2%"

  estado_general: "BUENO"
  prioridad: "P1"

  observaciones:
    - "Cobertura de DTOs por debajo del objetivo (83.2% vs 90% esperado)"
    - "Módulos críticos (auth, gamification, educational) tienen excelente cobertura (>95%)"
    - "DTOs bien estructurados con validadores class-validator"
    - "Uso correcto de PartialType y OmitType para UpdateDtos"
    - "ResponseDtos excluyen campos sensibles correctamente"
    - "Algunos entities de reporting/analytics no tienen DTOs (esperado)"

# =====================================================
# ANÁLISIS POR MÓDULO
# =====================================================

modulos:
  # ===================================================
  # MÓDULO: auth (CRÍTICO)
  # ===================================================
  - modulo: auth
    descripcion: "Autenticación, usuarios, perfiles, roles"
    prioridad: P0
    entities: 14
    cobertura_dtos: "100%"
    estado: "EXCELENTE"

    entities:
      # -----------------------------------------------
      # UserEntity (auth.users)
      # -----------------------------------------------
      - entity: UserEntity
        tabla: auth.users
        archivo_entity: apps/backend/src/modules/auth/entities/user.entity.ts

        create_dto:
          nombre: CreateUserDto
          archivo: apps/backend/src/modules/auth/dto/create-user.dto.ts
          campos: 7
          validadores: true
          excluye_autogenerados: true
          campos_excluidos: [id, created_at, updated_at, deleted_at]
          notas:
            - "Incluye: email, encrypted_password, role, status, phone, is_super_admin, banned_until"
            - "Validadores: @IsEmail, @IsString, @MinLength, @IsEnum, @IsBoolean"
          estado: "COMPLETO"

        update_dto:
          nombre: UpdateUserDto
          archivo: apps/backend/src/modules/auth/dto/update-user.dto.ts
          tipo: "PartialType(CreateUserDto)"
          excluye_campos: [id, created_at]
          estado: "COMPLETO"

        response_dto:
          nombre: UserResponseDto
          archivo: apps/backend/src/modules/auth/dto/user-response.dto.ts
          campos: 12
          excluye_sensibles: true
          campos_excluidos: [encrypted_password]
          transformaciones:
            - "@Exclude() en encrypted_password"
            - "@Expose() en campos públicos"
          estado: "COMPLETO"

        dtos_adicionales:
          - nombre: RegisterUserDto
            archivo: apps/backend/src/modules/auth/dto/register-user.dto.ts
            proposito: "Registro público (sin rol admin)"
          - nombre: LoginDto
            archivo: apps/backend/src/modules/auth/dto/login.dto.ts
            proposito: "Login con email/password"
          - nombre: ChangePasswordDto
            archivo: apps/backend/src/modules/auth/dto/change-password.dto.ts
            proposito: "Cambio de contraseña"

        estado_general: "✅ EXCELENTE"

      # -----------------------------------------------
      # ProfileEntity (auth_management.profiles)
      # -----------------------------------------------
      - entity: ProfileEntity
        tabla: auth_management.profiles
        archivo_entity: apps/backend/src/modules/auth/entities/profile.entity.ts

        create_dto:
          nombre: CreateProfileDto
          archivo: apps/backend/src/modules/auth/dto/create-profile.dto.ts
          campos: 22
          validadores: true
          excluye_autogenerados: true
          campos_excluidos: [id, created_at, updated_at, last_sign_in_at, last_activity_at]
          validadores_destacados:
            - "@IsEmail() en email"
            - "@IsUUID() en tenant_id, user_id"
            - "@MaxLength(500) en bio (alineado con CHECK constraint DDL)"
            - "@Matches() en phone (formato internacional)"
            - "@IsEnum() en role, status"
          estado: "COMPLETO"

        update_dto:
          nombre: UpdateProfileDto
          archivo: apps/backend/src/modules/auth/dto/update-profile.dto.ts
          tipo: "PartialType(OmitType(CreateProfileDto, ['tenant_id', 'user_id']))"
          excluye_campos: [tenant_id, user_id]
          notas:
            - "Excluye tenant_id y user_id (no modificables post-creación)"
          estado: "COMPLETO"

        response_dto:
          nombre: ProfileResponseDto
          archivo: apps/backend/src/modules/auth/dto/profile-response.dto.ts
          campos: 25
          excluye_sensibles: false
          notas:
            - "Incluye todos los campos (profile no tiene datos sensibles)"
            - "Bien documentado con @ApiProperty decorators"
          estado: "COMPLETO"

        estado_general: "✅ EXCELENTE"

      # -----------------------------------------------
      # TenantEntity (auth_management.tenants)
      # -----------------------------------------------
      - entity: TenantEntity
        tabla: auth_management.tenants
        archivo_entity: apps/backend/src/modules/auth/entities/tenant.entity.ts

        create_dto:
          nombre: CreateTenantDto
          archivo: apps/backend/src/modules/auth/dto/create-tenant.dto.ts
          campos: 10
          validadores: true
          excluye_autogenerados: true
          estado: "COMPLETO"

        update_dto:
          nombre: UpdateTenantDto
          archivo: apps/backend/src/modules/auth/dto/update-tenant.dto.ts
          tipo: "PartialType(CreateTenantDto)"
          estado: "COMPLETO"

        response_dto:
          nombre: TenantResponseDto
          archivo: apps/backend/src/modules/auth/dto/tenant-response.dto.ts
          campos: 13
          estado: "COMPLETO"

        estado_general: "✅ COMPLETO"

      # -----------------------------------------------
      # RoleEntity (auth_management.roles)
      # -----------------------------------------------
      - entity: RoleEntity
        tabla: auth_management.roles
