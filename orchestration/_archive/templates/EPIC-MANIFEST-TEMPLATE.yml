# EPIC-MANIFEST TEMPLATE
# Version: 1.0.0
# Uso: Copiar a docs/XX-fase-*/EPIC-XXX/EPIC-MANIFEST.yml

# =============================================================================
# IDENTIFICACION
# =============================================================================

epic:
  code: "EXX-000"           # Codigo unico de la epica
  name: "Nombre de la Epica"
  phase: 1                  # 1, 2 o 3
  phase_name: "Nombre de Fase"

# =============================================================================
# ESTADO Y METRICAS
# =============================================================================

status:
  overall: "completed"      # completed | partial | planned
  completion: 100%          # Porcentaje de completitud
  last_updated: "2026-01-18"

budget:
  mxn: 20000
  story_points: 40
  sprint: "5-6"

# =============================================================================
# ARTEFACTOS DOCUMENTALES
# =============================================================================

artifacts:
  requirements:
    total: 5
    files:
      - id: RF-XXX-001
        file: "requerimientos/RF-XXX-001-nombre.md"
        title: "Titulo del Requerimiento"
        status: implemented

  specifications:
    total: 4
    files:
      - id: ET-XXX-001
        file: "especificaciones/ET-XXX-001-nombre.md"
        rf: RF-XXX-001
        title: "Titulo de la Especificacion"
        status: implemented

  user_stories:
    total: 8
    implemented: 8
    files:
      - id: US-XXX-001
        file: "historias-usuario/US-XXX-001-nombre.md"
        rf: [RF-XXX-001]
        story_points: 5
        status: completed

# =============================================================================
# IMPLEMENTACION
# =============================================================================

implementation:
  database:
    schema: "nombre_schema"
    status: completed       # completed | partial | pending
    ddl_path: "apps/database/ddl/schemas/nombre_schema/"
    tables_count: 10
    key_tables:
      - name: tabla_principal
        file: "tables/01-tabla_principal.sql"
        description: "Descripcion breve"

  backend:
    module: "nombre_modulo"
    status: completed
    src_path: "apps/backend/src/modules/nombre_modulo/"
    entities_count: 8
    key_entities:
      - name: EntityPrincipal
        file: "entities/entity-principal.entity.ts"
    controllers_count: 3
    services_count: 4

  frontend:
    feature: "nombre_feature"
    status: completed
    src_path: "apps/frontend/src/features/nombre_feature/"
    components_count: 25
    key_components:
      - name: ComponentePrincipal
        file: "components/ComponentePrincipal.tsx"

# =============================================================================
# DEPENDENCIAS
# =============================================================================

dependencies:
  depends_on:
    - epic: EAI-001
      reason: "Requiere autenticacion"
    - epic: EAI-002
      reason: "Requiere actividades base"

  required_by:
    - epic: EXT-005
      reason: "Usa datos de esta epica"

  blockers: []              # Lista de bloqueantes actuales

# =============================================================================
# TESTING
# =============================================================================

testing:
  coverage:
    overall: 85%
    backend: 90%
    frontend: 75%
    database: 100%
  key_tests:
    - "descripcion del test critico"

# =============================================================================
# REFERENCIAS
# =============================================================================

references:
  traceability: "./implementacion/TRACEABILITY.yml"
  ssot_entry: "docs/_SSOT/TRACEABILITY-MASTER.yml#EPIC-CODE"
  epic_index: "docs/_SSOT/EPIC-INDEX.yml#EPIC-CODE"

# =============================================================================
# NOTAS
# =============================================================================

notes:
  - "Nota relevante sobre la epica"
  - "Decisiones arquitectonicas importantes"
