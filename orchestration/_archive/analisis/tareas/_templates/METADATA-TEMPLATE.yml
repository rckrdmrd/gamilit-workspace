# ═══════════════════════════════════════════════════════════════════════════════
# METADATA DE TAREA - TEMPLATE GAMILIT
# ═══════════════════════════════════════════════════════════════════════════════
#
# Sistema: NEXUS v4.0 + Gobernanza de Documentación
# Proyecto: GAMILIT
#
# Este template combina:
# - Sistema de fases F1-F7 de NEXUS
# - Metadata estructurado de Gobernanza workspace-v2
#
# Copiar este archivo al crear nueva tarea y completar campos.
#
# ═══════════════════════════════════════════════════════════════════════════════

version: "1.0.0"
task_id: "TAREA-{YYYY-MM-DD}-{NNN}-{NOMBRE}"

# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "{Título descriptivo de la tarea}"
  descripcion: |
    {Descripción detallada de qué se debe hacer y por qué}
  tipo: "feature|bugfix|refactor|documentation|analysis|migration|security"
  prioridad: "P0|P1|P2|P3"
  dominio: "auth|educational|gamification|progress|social|audit|shared|backend|frontend|database|devops|docs"
  tags:
    - "{tag1}"
    - "{tag2}"

# ─────────────────────────────────────────────────────────────────────────────────
# RESPONSABILIDAD
# ─────────────────────────────────────────────────────────────────────────────────

responsabilidad:
  agente_responsable: "NEXUS-BACKEND|NEXUS-FRONTEND|NEXUS-DATABASE|NEXUS-DEVOPS|NEXUS-INTEGRATION|META-ORQUESTADOR"
  agente_modelo: "{modelo LLM si aplica}"
  delegado_de: "{Agente que delegó, null si es tarea directa}"
  delegado_a: []  # Lista de subtareas delegadas

# ─────────────────────────────────────────────────────────────────────────────────
# ALCANCE (Sistema GAMILIT)
# ─────────────────────────────────────────────────────────────────────────────────

alcance:
  nivel: "workspace|proyecto|modulo"
  proyecto: "gamilit"  # Siempre gamilit para este template
  modulo: "{nombre-modulo: admin|student|teacher|shared|etc}"
  capas_afectadas:
    - "database|backend|frontend|devops|docs"
  schemas_afectados:
    - "{schema PostgreSQL si aplica}"

# ─────────────────────────────────────────────────────────────────────────────────
# TEMPORALIDAD
# ─────────────────────────────────────────────────────────────────────────────────

temporalidad:
  fecha_inicio: "{YYYY-MM-DD HH:MM}"
  fecha_fin: "{YYYY-MM-DD HH:MM o null si no completada}"
  duracion_estimada: "{N}h"
  duracion_real: "{N}h"

# ─────────────────────────────────────────────────────────────────────────────────
# ESTADO
# ─────────────────────────────────────────────────────────────────────────────────

estado:
  actual: "pendiente|en_progreso|completada|bloqueada|cancelada"
  fase_actual: "F1|F2|F3|F4|F5|F6|F7"
  porcentaje: 0
  motivo_bloqueo: null  # Si está bloqueada

# ─────────────────────────────────────────────────────────────────────────────────
# FASES NEXUS (F1-F7) - Mapeo a CAPVED
# ─────────────────────────────────────────────────────────────────────────────────
#
# Mapeo F1-F7 ↔ CAPVED:
#   F1 (Análisis Inicial)     ≈ C (Contexto)
#   F2 (Análisis Detallado)   ≈ A (Análisis)
#   F3 (Plan de Corrección)   ≈ P (Planeación)
#   F4 (Validación del Plan)  ≈ V (Validación)
#   F5 (Refinamiento)         ≈ V+ (Validación extendida)
#   F6 (Ejecución)            ≈ E (Ejecución)
#   F7 (Validación Ejecución) ≈ D (Documentación)
#
# Ver: _templates/MAPEO-FASES.md para detalles completos
# ─────────────────────────────────────────────────────────────────────────────────

fases:
  f1_analisis_inicial:
    estado: "pendiente|en_progreso|completada|omitida"
    archivo: "F1-ANALISIS-INICIAL-{DOMINIO}-{FECHA}.md"
    capved_equivalente: "C"
    completado_en: null

  f2_analisis_detallado:
    estado: "pendiente|en_progreso|completada|omitida"
    archivo: "F2-ANALISIS-DETALLADO-{DOMINIO}-{FECHA}.md"
    capved_equivalente: "A"
    completado_en: null

  f3_plan_correccion:
    estado: "pendiente|en_progreso|completada|omitida"
    archivo: "F3-PLAN-CORRECCION-{DOMINIO}-{FECHA}.md"
    capved_equivalente: "P"
    completado_en: null

  f4_validacion_plan:
    estado: "pendiente|en_progreso|completada|omitida"
    archivo: "F4-VALIDACION-PLAN-{DOMINIO}-{FECHA}.md"
    capved_equivalente: "V"
    completado_en: null

  f5_refinamiento:
    estado: "pendiente|en_progreso|completada|omitida"
    archivo: "F5-REFINAMIENTO-PLAN-{DOMINIO}-{FECHA}.md"
    capved_equivalente: "V+"
    completado_en: null

  f6_ejecucion:
    estado: "pendiente|en_progreso|completada|omitida"
    archivo: "F6-EJECUCION-{DOMINIO}-{FECHA}.md"
    capved_equivalente: "E"
    completado_en: null

  f7_validacion_ejecucion:
    estado: "pendiente|en_progreso|completada|omitida"
    archivo: "F7-VALIDACION-EJECUCION-{DOMINIO}-{FECHA}.md"
    capved_equivalente: "D"
    completado_en: null

# ─────────────────────────────────────────────────────────────────────────────────
# ARTEFACTOS
# ─────────────────────────────────────────────────────────────────────────────────

artefactos:
  archivos_creados: []
  # - ruta: "apps/backend/src/modules/xxx/xxx.service.ts"
  #   tipo: "service"
  #   lineas: N

  archivos_modificados: []
  # - ruta: "apps/backend/src/modules/xxx/xxx.service.ts"
  #   cambio: "descripción breve del cambio"

  archivos_eliminados: []
  # - ruta: "apps/backend/src/modules/xxx/deprecated.ts"
  #   razon: "duplicado de nuevo archivo"

  commits: []
  # - hash: "abc1234"
  #   mensaje: "mensaje del commit"
  #   fecha: "YYYY-MM-DD"

# ─────────────────────────────────────────────────────────────────────────────────
# RELACIONES
# ─────────────────────────────────────────────────────────────────────────────────

relaciones:
  tarea_padre: null  # TAREA-ID si es subtarea
  subtareas: []      # Lista de TAREA-IDs de subtareas
  tareas_relacionadas: []  # Tareas relacionadas pero independientes
  epica: null        # EAI-XXX, EMR-XXX, EXT-XXX
  user_story: null   # ID de US si aplica

# ─────────────────────────────────────────────────────────────────────────────────
# VALIDACIONES NEXUS
# ─────────────────────────────────────────────────────────────────────────────────

validaciones:
  # Validaciones de build
  build_backend:
    estado: "pendiente|pasa|falla|na"
    comando: "npm run build"
    output: null

  build_frontend:
    estado: "pendiente|pasa|falla|na"
    comando: "npm run build"
    output: null

  # Validaciones de lint
  lint_backend:
    estado: "pendiente|pasa|falla|na"
    errores: 0
    warnings: 0

  lint_frontend:
    estado: "pendiente|pasa|falla|na"
    errores: 0
    warnings: 0

  # Validaciones de tests
  tests_backend:
    estado: "pendiente|pasa|falla|na"
    passed: 0
    failed: 0
    coverage: null

  tests_frontend:
    estado: "pendiente|pasa|falla|na"
    passed: 0
    failed: 0
    coverage: null

  # Validación contra documentación
  documentacion_validada: false
  inventarios_actualizados: false

# ─────────────────────────────────────────────────────────────────────────────────
# REFERENCIAS NEXUS
# ─────────────────────────────────────────────────────────────────────────────────

referencias:
  documentos_consultados: []
  # - "docs/01-fase-alcance-inicial/EAI-001-fundamentos/..."
  # - "docs/90-transversal/arquitectura/..."

  directivas_aplicadas: []
  # - "DIRECTIVA-VALIDACION-DOCUMENTACION"
  # - "DIRECTIVA-POLITICA-CARGA-LIMPIA"

  inventarios_consultados: []
  # - "BACKEND_INVENTORY.yml"
  # - "DATABASE_INVENTORY.yml"

# ─────────────────────────────────────────────────────────────────────────────────
# NOTAS
# ─────────────────────────────────────────────────────────────────────────────────

notas: |
  {Notas adicionales, observaciones, lecciones aprendidas}

# ═══════════════════════════════════════════════════════════════════════════════
# FIN DE METADATA
# ═══════════════════════════════════════════════════════════════════════════════
