  rol_especial: "REFERENCE_SOURCE"
  descripcion: |
    GAMILIT es un proyecto STANDALONE_HEREDERO:
    - NO hereda codigo de otros proyectos
    - NO tiene parent_id formal (es independiente)
    - Sirve como REFERENCE_SOURCE (exporta patrones a shared/catalog/)
