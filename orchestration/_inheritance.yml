# -------------------------------------------------------------------------------
# PATRONES COMO REFERENCIA (Para shared/catalog/)
# -------------------------------------------------------------------------------

patrones_como_referencia:
  arquitectura_monorepo:
    descripcion: "Estructura monorepo con separacion clara apps/"
    ubicacion_catalogo: "shared/catalog/arquitectura/monorepo/"
    documentacion: "docs/20-architecture/"

  constants_ssot:
    descripcion: "Sistema de constantes sincronizadas entre capas"
    ubicacion_referencia: "apps/backend/src/shared/constants/"
    beneficios:
      - "Type-safety entre capas"
      - "Sin hardcoding de strings"
      - "Sincronizacion automatica DDL -> Backend -> Frontend"

  modulos_nestjs:
    descripcion: "Arquitectura de modulos NestJS estandarizada"
    ubicacion_referencia: "apps/backend/src/modules/"
    estructura_estandar:
      - "entities/"
      - "services/"
      - "controllers/"
      - "dto/"
      - "{modulo}.module.ts"

  inventarios_yaml:
    descripcion: "Sistema de inventarios maestros por capa"
    ubicacion_referencia: "orchestration/inventory/"
    archivos:
      - "MASTER_INVENTORY.yml"
      - "DATABASE_INVENTORY.yml"
      - "BACKEND_INVENTORY.yml"
      - "FRONTEND_INVENTORY.yml"

  gamificacion:
    descripcion: "Sistema completo de gamificacion educativa"
    unico_en: ["gamilit"]
    componentes:
      - "Sistema XP multinivel"
      - "Rangos jerarquicos (cultura maya)"
      - "Logros e insignias"
      - "Economia virtual (ML Coins)"
      - "Misiones y retos"
      - "Leaderboards con temporadas"
      - "Tienda de recompensas"

