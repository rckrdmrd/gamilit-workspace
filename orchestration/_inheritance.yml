# ─────────────────────────────────────────────────────────────────────────────────
# NOTA SOBRE RELACIONES (Solo Documentacion Historica)
# ─────────────────────────────────────────────────────────────────────────────────
#
# IMPORTANTE: Esta seccion es SOLO documentacion historica.
# NO representa herencia de codigo ni dependencia activa.
#
# Gamilit es 100% STANDALONE:
#   - NO es padre de ningun proyecto
#   - NO tiene consumidores de codigo
#   - NO debe usarse como "parent" en _inheritance.yml de otros proyectos
#
# La relacion correcta es:
#   gamilit (fuente historica) --> shared/catalog/ (patrones extraidos)
#                                        |
#                                        v
#                              Otros proyectos (consultan catalogo)
#
# Si un proyecto necesita funcionalidad similar a gamilit, debe:
#   1. Consultar shared/catalog/ para ver si existe el patron
#   2. Implementar usando el catalogo como referencia
#   3. NO heredar de gamilit directamente
#
# ─────────────────────────────────────────────────────────────────────────────────

historial_extraccion_patrones:
  nota: |
    DOCUMENTACION HISTORICA - NO ES HERENCIA
    Los siguientes patrones fueron EXTRAIDOS de gamilit hacia shared/catalog/
    en el pasado. Los proyectos listados consultaron esos patrones del catalogo,
    NO de gamilit directamente.

  patrones_extraidos_a_catalogo:
    - patron: "arquitectura_monorepo"
      extraido_a: "shared/catalog/ (documentacion)"
      fecha_extraccion: "2025-12"

    - patron: "modulos_nestjs"
      extraido_a: "shared/catalog/auth/, shared/catalog/session-management/, etc."
      fecha_extraccion: "2025-12"

    - patron: "constants_ssot"
      extraido_a: "projects/gamilit/orchestration/"  # Actualizado 2026-01-16: KB projects eliminado
      fecha_extraccion: "2025-12"

  proyectos_que_consultaron_catalogo:
    # Estos proyectos consultaron shared/catalog/, NO gamilit
    - proyecto: "erp-core"
      consulto: "shared/catalog/"
      patrones: ["auth", "session-management", "arquitectura"]
      nota: "erp-core hereda de template-saas, NO de gamilit"

    - proyecto: "template-saas"
      consulto: "shared/catalog/"
      patrones: ["auth", "modulos_nestjs"]
      nota: "template-saas es PROVIDER independiente, NO hereda de gamilit"

    - proyecto: "trading-platform"
      consulto: "shared/catalog/"
      patrones: ["arquitectura_monorepo"]
      nota: "trading-platform es STANDALONE, solo consulta catalogo"

