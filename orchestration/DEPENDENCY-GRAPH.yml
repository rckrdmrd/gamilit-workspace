# ─────────────────────────────────────────────────────────────────────────────
# NOTAS
# ─────────────────────────────────────────────────────────────────────────────

notas:
  - "Gamilit es STANDALONE - NO tiene consumidores directos de código"
  - "Sus patrones fueron EXTRAIDOS a shared/catalog/ para referencia"
  - "Otros proyectos CONSULTAN el catálogo, no heredan de Gamilit"
  - "Es el proyecto más maduro del workspace (200k+ líneas)"
