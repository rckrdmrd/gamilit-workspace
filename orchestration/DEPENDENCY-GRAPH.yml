# ═══════════════════════════════════════════════════════════════════════════════
# DEPENDENCY-GRAPH.yml - Gamilit
# ═══════════════════════════════════════════════════════════════════════════════
#
# Sistema: SIMCO v4.3.0 + NEXUS v4.0
# Propósito: Grafo de dependencias del proyecto
# Fecha: 2026-01-24
#
# ═══════════════════════════════════════════════════════════════════════════════

version: "1.0.0"
proyecto: "gamilit"
tipo: "STANDALONE"
rol_especial: "REFERENCIA_INTERNA"
fecha_actualizacion: "2026-01-24"

# ─────────────────────────────────────────────────────────────────────────────
# DEPENDENCIAS ENTRANTES
# ─────────────────────────────────────────────────────────────────────────────

depende_de:
  workspace:
    - ruta: "orchestration/directivas/simco/"
      tipo: "directivas"
      descripcion: "Directivas SIMCO del workspace"

    - ruta: "shared/catalog/"
      tipo: "documentacion"
      descripcion: "Catálogo de patrones (para referencia)"

  externos:
    - nombre: "PostgreSQL"
      version: "15+"
      tipo: "database"

    - nombre: "Redis"
      version: "7+"
      tipo: "cache"

    - nombre: "Node.js"
      version: "20+"
      tipo: "runtime"

# ─────────────────────────────────────────────────────────────────────────────
# DEPENDENCIAS SALIENTES
# ─────────────────────────────────────────────────────────────────────────────

# IMPORTANTE: Gamilit es STANDALONE, NO tiene consumidores directos
# Sus patrones fueron EXTRAIDOS a shared/catalog/ para referencia

consumidores:
  nota: |
    Gamilit es proyecto STANDALONE - NO tiene consumidores directos.
    Los patrones de Gamilit fueron extraídos a shared/catalog/ donde
    otros proyectos pueden consultarlos como REFERENCIA.
    NO hay herencia directa de código.

  patrones_en_catalogo:
    - patron: "arquitectura_monorepo"
      extraido_a: "shared/catalog/"
      consultado_por:
        - "erp-core"
        - "template-saas"
        - "trading-platform"

    - patron: "constants_ssot"
      extraido_a: "orchestration/directivas/"
      consultado_por:
        - "erp-core"

    - patron: "inventarios_yaml"
      extraido_a: "orchestration/inventarios/"
      consultado_por:
        - "erp-core"
        - "template-saas"

# ─────────────────────────────────────────────────────────────────────────────
# DEPENDENCIAS INTERNAS
# ─────────────────────────────────────────────────────────────────────────────

dependencias_internas:
  backend:
    auth:
      depende_de:
        - "users"
        - "shared/constants"
      consumidores:
        - "todos los módulos"

    users:
      depende_de:
        - "shared/constants"
      consumidores:
        - "auth"
        - "courses"
        - "gamification"

    courses:
      depende_de:
        - "users"
        - "shared/constants"
      consumidores:
        - "evaluations"
        - "activities"

    gamification-core:
      depende_de:
        - "users"
        - "courses"
      consumidores:
        - "points"
        - "ranks"
        - "achievements"
        - "leaderboards"

    points:
      depende_de:
        - "gamification-core"
        - "users"
      consumidores:
        - "ranks"
        - "rewards"

    ranks:
      depende_de:
        - "points"
        - "gamification-core"
      consumidores:
        - "leaderboards"

  frontend:
    auth:
      depende_de:
        - "hooks/useAuth"
        - "stores/authStore"
      consumidores:
        - "layout"
        - "routes"

    gamification:
      depende_de:
        - "auth"
        - "hooks/useGamification"
      consumidores:
        - "dashboard"
        - "leaderboards"

