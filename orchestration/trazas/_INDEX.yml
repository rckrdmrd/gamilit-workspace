# ─────────────────────────────────────────────────────────────────────────────────
# INSTRUCCIONES DE USO
# ─────────────────────────────────────────────────────────────────────────────────

instrucciones:
  registrar_tarea: |
    1. Identificar dominio de la tarea (backend, frontend, database)
    2. Abrir traza correspondiente (TRAZA-TAREAS-{DOMINIO}.md)
    3. Agregar entrada con formato estándar
    4. Actualizar este índice si es necesario

  consultar_historial: |
    Por dominio: trazas_por_dominio.backend.archivo
    Por agente: actividad_por_agente.NEXUS-BACKEND.traza
    Recientes: trazas_recientes
    Archivadas: historial_archivado.ubicacion

  formato_entrada: |
    ## [FECHA] TAREA-ID: Título
    - **Estado:** completada|en_progreso|bloqueada
    - **Agente:** NEXUS-{PERFIL}
    - **Cambios:** Resumen de cambios
    - **Validaciones:** Build OK | Lint OK | Tests OK

