# Nota: GAMILIT usa trazas por DOMINIO, no por AGENTE.
# Esta sección mapea actividad de agentes a trazas de dominio.
#
# ─────────────────────────────────────────────────────────────────────────────────

actividad_por_agente:
  nota: |
    Trazas por agente individuales (TRAZA-AGENTE-NEXUS-*.md, TRAZA-AGENTE-DOCUMENTACION-*.md,
    TRAZA-AGENTE-TEMPLATE.md) fueron eliminadas en consolidaciones previas.
    La actividad de agentes se rastrea ahora a través de las trazas por dominio.

  NEXUS-BACKEND:
    dominio_principal: "backend"
    traza_dominio: "TRAZA-TAREAS-BACKEND.md"

  NEXUS-FRONTEND:
    dominio_principal: "frontend"
    traza_dominio: "TRAZA-TAREAS-FRONTEND.md"

  NEXUS-DATABASE:
    dominio_principal: "database"
    traza_dominio: "TRAZA-TAREAS-DATABASE.md"

