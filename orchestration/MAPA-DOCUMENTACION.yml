# INSTRUCCIONES DE MANTENIMIENTO
# ─────────────────────────────────────────────────────────────────────────────────

mantenimiento:
  actualizacion: |
    1. Al crear nuevos archivos de documentación:
       - Agregar a la sección por_ubicacion correspondiente
       - Actualizar estadísticas
       - Agregar a historial_reciente

    2. Al completar una tarea:
       - Agregar a historial_reciente
       - Actualizar trazas correspondientes

    3. Al eliminar documentación:
       - Remover de todas las secciones
       - Actualizar contadores

  validacion: |
    Verificar que:
    - Todos los archivos listados existen
    - Estadísticas coinciden con realidad
    - Índices _MAP.md están actualizados

