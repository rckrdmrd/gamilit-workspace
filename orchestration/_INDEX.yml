# ===============================================================================
# _INDEX.yml - INDICE ESTRUCTURAL MAESTRO DE ORCHESTRATION GAMILIT
# ===============================================================================
#
# PROPOSITO: Indice estructural para navegacion y carga de contexto IoC (NEXUS)
# PROYECTO: GAMILIT - Plataforma EdTech con Gamificacion
# TIPO: STANDALONE (workspace independiente)
#
# USO: El sistema NEXUS usa este archivo para resolver rutas automaticamente
#
# ===============================================================================

version: "1.1.0"
fecha_creacion: "2026-01-25"
fecha_actualizacion: "2026-02-03"
descripcion: "Indice estructural maestro de orchestration/ de GAMILIT (V2 Compliant)"
sistema: "SIMCO v4.3.0 + NEXUS v4.0"
proyecto: "gamilit"
tipo_proyecto: "STANDALONE"

# ===============================================================================
# METRICAS DE ESTRUCTURA
# ===============================================================================

metricas:
  carpetas_nivel_1: 25
  carpetas_total: 60
  archivos_raiz: 12
  indices_existentes:
    - _MAP.md                        # Navegacion visual
    - MAPA-DOCUMENTACION.yml         # Documentacion
    - CONTEXT-MAP.yml                # Contexto NEXUS

# ===============================================================================
# ARCHIVOS RAIZ (12 archivos)
# ===============================================================================

archivos_raiz:
  # --- Indices y Mapas ---
  indices:
    - archivo: "_INDEX.yml"
      alias: "@INDEX"
      proposito: "Este archivo - Indice estructural maestro"

    - archivo: "_MAP.md"
      alias: "@MAP"
      proposito: "Mapa visual de navegacion"

    - archivo: "MAPA-DOCUMENTACION.yml"
      alias: "@MAPA-DOC"
      proposito: "Mapa de toda la documentacion"

  # --- Contexto y Estado ---
  contexto:
    - archivo: "CONTEXT-MAP.yml"
      alias: "@CONTEXT-MAP"
      proposito: "Mapa de contexto para NEXUS - Keywords a archivos"
      nivel_nexus: "L0"

    - archivo: "PROJECT-PROFILE.yml"
      alias: "@PROJECT-PROFILE"
      proposito: "Perfil del proyecto GAMILIT"

    - archivo: "PROJECT-STATUS.md"
      alias: "@PROJECT-STATUS"
      proposito: "Estado actual del proyecto"

    - archivo: "PROXIMA-ACCION.md"
      alias: "@PROXIMA-ACCION"
      proposito: "Checkpoint de sesion - Continuidad entre sesiones"

    - archivo: "BOOTLOADER.md"
      alias: "@BOOTLOADER"
      proposito: "Carga de contexto inicial de sesion"

    - archivo: "QUICK-REFERENCE.md"
      alias: "@QUICK-REF"
      proposito: "Referencia rapida para agentes"

  # --- Trazabilidad y Dependencias ---
  trazabilidad:
    - archivo: "TRACEABILITY.yml"
      alias: "@TRACEABILITY"
      proposito: "Trazabilidad maestra de cambios"

    - archivo: "DEPENDENCY-GRAPH.yml"
      alias: "@DEPENDENCY-GRAPH"
      proposito: "Grafo de dependencias internas"

  # --- Herencia ---
  herencia:
    - archivo: "_inheritance.yml"
      alias: "@INHERITANCE"
      proposito: "Declaracion de herencia del proyecto"

# ===============================================================================
# CARPETAS PRINCIPALES (25 carpetas nivel 1)
# ===============================================================================

carpetas:

  # ---------------------------------------------------------------------------
  # GRUPO 1: SISTEMA CORE (Definiciones, Directivas, Templates)
  # ---------------------------------------------------------------------------

  _definitions:
    alias: "@DEFINITIONS"
    proposito: "Definiciones SSOT - Checklists, Protocolos, Schemas, Triggers"
    prioridad: "ALTA"
    nivel_nexus: "L0"

  directivas:
    alias: "@DIRECTIVAS"
    proposito: "Sistema SIMCO completo - Directivas por operacion"
    prioridad: "CRITICA"
    nivel_nexus: "L0-L2"

  templates:
    alias: "@TEMPLATES"
    proposito: "Templates de documentacion y trabajo"
    prioridad: "MEDIA"

  # ---------------------------------------------------------------------------
  # GRUPO 2: OPERACIONALES V2 (Nuevas carpetas de gestion)
  # ---------------------------------------------------------------------------

  scrum:
    alias: "@SCRUM"
    proposito: "Artefactos de gestion agil (Sprints, Backlog)"
    prioridad: "ALTA"

  planes:
    alias: "@PLANES"
    proposito: "Planificacion estrategica y operativa"
    prioridad: "ALTA"

  features:
    alias: "@FEATURES"
    proposito: "Gestion y seguimiento de features V2"
    prioridad: "ALTA"

  analisis:
    alias: "@ANALISIS"
    proposito: "Reportes de analisis tecnico y funcional"

  reports:
    alias: "@REPORTS"
    proposito: "Reportes automaticos, manuales y de cierre"

  # ---------------------------------------------------------------------------
  # GRUPO 3: AGENTES Y TRAZABILIDAD
  # ---------------------------------------------------------------------------

  agents:
    alias: "@AGENTS"
    proposito: "Perfiles, configuraciones y trazas de agentes"
    prioridad: "ALTA"

  tareas:
    alias: "@TAREAS"
    proposito: "Documentacion de tareas con gobernanza CAPVED"
    prioridad: "CRITICA"

  trazas:
    alias: "@TRAZAS"
    proposito: "Trazas operacionales y de sesiones"

  # ---------------------------------------------------------------------------
  # GRUPO 4: INVENTARIOS Y REFERENCIAS
  # ---------------------------------------------------------------------------

  inventarios:
    alias: "@INVENTARIOS"
    proposito: "Inventarios del proyecto - SSOT de recursos"

  referencias:
    alias: "@REFERENCIAS"
    proposito: "Aliases, prompts activos, templates de prompts"

  # ---------------------------------------------------------------------------
  # GRUPO 5: PROCESOS Y CALIDAD
  # ---------------------------------------------------------------------------

  checklists:
    proposito: "Listas de verificacion para procesos estandar"
  
  errores:
    proposito: "Base de conocimiento de errores conocidos"
  
  escalamientos:
    proposito: "Protocolos de escalamiento bloqueantes"
  
  patrones:
    proposito: "Patrones de diseño y arquitectura adoptados"
  
  procesos:
    proposito: "Procedimientos estandar de operacion (SOPs)"

  # ---------------------------------------------------------------------------
  # GRUPO 6: UTILITARIOS Y OTROS
  # ---------------------------------------------------------------------------

  _internal:
    proposito: "Herramientas y contexto interno de orquestacion"

  _quick:
    proposito: "Quick references compactos para carga rapida"

  cambios:
    proposito: "Registro de control de cambios significativos"

  perfiles-giro:
    proposito: "Definiciones especificas del dominio de negocio"

  propagacion:
    proposito: "Reglas y scripts para la propagacion local"

  propuestas:
    proposito: "RFCs y propuestas de mejora tecnica"

  retrospectivas:
    proposito: "Lecciones aprendidas y retrospectivas de sprint"

# ===============================================================================
# MAPEO NEXUS - Niveles de Contexto
# ===============================================================================

nexus_mapping:
  L0_sistema:
    carpetas: ["_definitions/", "_quick/", "agents/configs/", "_internal/"]
  L1_proyecto:
    carpetas: ["inventarios/", "planes/", "scrum/"]
  L2_operacion:
    carpetas: ["directivas/simco/", "directivas/principios/", "features/"]
  L3_tarea:
    carpetas: ["tareas/"]

# ===============================================================================
# RELACION CON WORKSPACE PADRE
# ===============================================================================

workspace_padre:
  tipo: "REPLICA_COMPLETA"
  fecha_sincronizacion: "2026-02-03"
  politica: "V2 COMPLIANT - Redundancia total operativa"

mantenimiento:
  ultima_actualizacion: "2026-02-03"
  actualizado_por: "Meta-Orquestador - Integracion Workspace V2"