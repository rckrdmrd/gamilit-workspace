version: "2.0.0"
created: "2026-02-07"
updated: "2026-02-26"
proyecto: "gamilit"
tipo: "STANDALONE"

# -------------------------------------------------------------------------------
# METADATA
# -------------------------------------------------------------------------------

metadata:
  nombre_completo: "GAMILIT - Gamificacion Maya para la Lectoescritura en Tecnologia"
  tipo_proyecto: "STANDALONE"
  nivel_simco: "2A"
  wave: 3
  prefijo_us: "GAM"
  prefijo_epic: "EPIC-GAM"
  completitud: "98%"
  estado: "PRODUCCION_ACTIVA"
  stack:
    backend: "NestJS 11"
    frontend: "React 19"
    database: "PostgreSQL 15"
    realtime: "Socket.IO 4.8+"
    build: "Vite 6.x"
    orm: "TypeORM 0.3.x"
  repositorio:
    tipo: "MONOREPO"
    remote: "git@github.com:rckrdmrd/gamilit-workspace.git"
    branch: "master"
    nota: "GitHub (excepcional) - NO Gitea"

# -------------------------------------------------------------------------------
# ESTRUCTURA DE ORQUESTACION
# -------------------------------------------------------------------------------

estructura:
  raiz: "orchestration/"
  archivos_principales:
    - nombre: "_INDEX.yml"
      descripcion: "Este archivo - Indice maestro de orquestacion"

    - nombre: "_inheritance.yml"
      descripcion: "Declaracion de herencia STANDALONE"
      version: "2.0.0"

    - nombre: "PROJECT-CONTEXT.md"
      descripcion: "Contexto NEXUS L1 del proyecto"
      tipo: "NEXUS_L1"

  directorios:
    inventory:
      descripcion: "Inventarios SSOT por capa y dominio (10 archivos)"
      archivos:
        - "MASTER_INVENTORY.yml"
        - "DATABASE_INVENTORY.yml"
        - "BACKEND_INVENTORY.yml"
        - "FRONTEND_INVENTORY.yml"
        - "SEEDS_INVENTORY.yml"
        - "DEPENDENCY_GRAPH.yml"
        - "TRACEABILITY_MATRIX.yml"
        - "SKILLS-REGISTRY.yml"
        - "TEST_COVERAGE.yml"
        - "LOCAL-WSL-ENVIRONMENT.yml"

    work-items:
      descripcion: "Gestion de trabajo (epics, sprints, releases)"
      subdirectorios:
        - "epics/ (11 EPICs)"
        - "sprints/"
        - "releases/"

    references:
      descripcion: "Referencias tecnicas y documentacion auxiliar"

    analisis:
      descripcion: "Reportes de analisis y migracion"
      archivos:
        - "ANALISIS-MIGRACION-GAMILIT.md"
        - "MIGRATION-TRACKER.yml"
        - "MIGRATION-MANIFEST.yml"
        - "SNAPSHOT-PRE-MIGRATION.md"
        - "PURGA-DECISION-LOG.md"

    tareas:
      descripcion: "Tracking de tareas (activa + archive digest)"
      archivos_clave:
        - "_INDEX.yml"
        - "ARCHIVE-DIGEST.md"

# -------------------------------------------------------------------------------
# HERENCIA
# -------------------------------------------------------------------------------

herencia:
  tipo: "STANDALONE"
  parent_directo: null
  workspace: "standalone"
  gobernanza: "local"

  patrones_propios:
    - "Gamificacion cultura maya (rangos, iconografia)"
    - "5 modulos comprension lectora"
    - "4 portales diferenciados"
    - "23 tipos ejercicios interactivos"
    - "Motor de exercise evaluation (Strategy+Factory)"
    - "Spaced repetition engine"
    - "Virtual economy (ML Coins)"

# -------------------------------------------------------------------------------
# GOBERNANZA
# -------------------------------------------------------------------------------

gobernanza:
  simco_version: "4.0.0"
  saad_activo: true
  nexus_version: "4.1"

  paths_gobernanza:
    docs_local: "docs/"
    orchestration_local: "orchestration/"
    estandares: "docs/40-standards/"

  directivas_aplicables:
    - "PRINCIPIO-CAPVED.md"
    - "SIMCO-TAREA.md"
    - "SIMCO-GIT.md"
    - "SIMCO-EDICION-SEGURA.md"
    - "SIMCO-DDL.md"
    - "SIMCO-BACKEND.md (NestJS)"
    - "SIMCO-FRONTEND.md (React)"

  triggers_activos:
    - "TRIGGER-ANTI-DUPLICACION"
    - "TRIGGER-COHERENCIA-CAPAS"
    - "TRIGGER-INVENTARIOS-SINCRONIZADOS"
    - "TRIGGER-FETCH-OBLIGATORIO"
    - "TRIGGER-COMMIT-PUSH-OBLIGATORIO"
    - "TRIGGER-CIERRE-TAREA-OBLIGATORIO"
    - "TRIGGER-DDL-RECREAR-BD-WSL"
    - "TRIGGER-DOCUMENTACION-OBLIGATORIA"

# -------------------------------------------------------------------------------
# MODULOS DEL PROYECTO
# -------------------------------------------------------------------------------

modulos:
