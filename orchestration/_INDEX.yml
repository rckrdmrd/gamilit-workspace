  categorias:
    core_infrastructure:
      count: 7
      modulos: ["auth", "users", "tenants", "core", "health", "settings", "notifications"]

    educational_content:
      count: 5
      modulos: ["modules", "exercises", "content", "classrooms", "students"]

    gamification_system:
      count: 7
      modulos: ["gamification", "leaderboard", "missions", "store", "achievements", "social"]

    support_operations:
