# ─────────────────────────────────────────────────────────────────────────────────
# NOTAS Y LECCIONES APRENDIDAS
# ─────────────────────────────────────────────────────────────────────────────────

notas: |
  Esta tarea completó la reparación de todos los tests fallidos en el backend
  de GAMILIT. Los patrones de corrección identificados fueron:

  1. Repository tokens incorrectos (auth vs admin_dashboard vs gamification)
  2. Mocks de DataSource faltantes para servicios con transacciones
  3. Columnas renombradas (feature_* → flag_*)
  4. Tipos de permissions (array → object)
  5. Native modules (exceljs, pdfkit) requieren mocks completos

lecciones_aprendidas:
  - "Siempre verificar el connection name en @InjectRepository antes de mockear"
  - "Los servicios con transacciones necesitan mock de DataSource, no solo Repository"
  - "mockImplementation() es mejor que mockResolvedValue() para objetos mutables"
  - "Native modules deben mockearse ANTES de cualquier import"
  - "Documentar inmediatamente para mantener trazabilidad SIMCO"

