# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Fix notifDate.getTime is not a function en NotificationDropdown"
  descripcion: |
    Corrección de error crítico en el componente NotificationDropdown del Student Portal.

    PROBLEMA:
    - Al hacer clic en el icono de notificaciones, la pantalla se ponía en blanco
    - Error en consola: "notifDate.getTime is not a function"
    - Ubicación: NotificationDropdown.tsx:47

    CAUSA RAÍZ:
    - La función formatTimestamp usaba `typeof date === 'string'` para verificar
    - Cuando el dato venía del backend como objeto deserializado (no instancia Date),
      la condición fallaba y se asignaba el objeto plano directamente
    - Al llamar .getTime() sobre un objeto sin ese método, crasheaba

    SOLUCIÓN:
    - Cambiar `typeof date === 'string' ? new Date(date) : date`
    - Por: `date instanceof Date ? date : new Date(date)`
    - Esto garantiza que siempre se crea un Date válido

  tipo: "bugfix"
  prioridad: "P1"
  tags:
    - "bugfix"
    - "frontend"
    - "notifications"
    - "student-portal"
    - "date-handling"

