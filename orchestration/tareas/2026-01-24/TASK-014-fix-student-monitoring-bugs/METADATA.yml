# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Fix bugs en Student Monitoring - última actividad y pantalla negra"
  descripcion: |
    Corrección de dos bugs críticos en el portal de Teacher, página de monitoreo:

    Bug 1: "Última actividad" se muestra incorrectamente en los cards de estudiantes
    - Causa raíz: El backend puede devolver last_activity como null, pero el frontend
      no validaba este caso, causando que new Date(null) mostrara epoch (1970)

    Bug 2: Pantalla negra al hacer clic en un card de estudiante
    - Causa raíz: Si student.id era undefined (mapeo fallido de user_id), las APIs
      fallaban y el modal mostraba solo el overlay negro sin contenido

    Solución: Añadir validaciones defensivas en 5 archivos del frontend.
  tipo: "bugfix"
  prioridad: "P1"
  tags:
    - "teacher-portal"
    - "student-monitoring"
    - "null-safety"
    - "defensive-coding"

