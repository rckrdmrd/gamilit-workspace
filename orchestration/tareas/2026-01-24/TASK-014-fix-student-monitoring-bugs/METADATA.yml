# NOTAS Y LECCIONES APRENDIDAS
# ─────────────────────────────────────────────────────────────────────────────────

notas: |
  Bug reportado por usuario durante sesión de trabajo en gamilit.
  Los bugs estaban relacionados con manejo defensivo de valores null/undefined
  que el backend puede devolver legítimamente.

  La discrepancia de tipos entre backend (Date | null) y frontend (string)
  era la causa raíz principal.

lecciones_aprendidas:
  - "Siempre validar valores null/undefined antes de operaciones con Date"
  - "Los tipos del frontend deben reflejar la realidad del backend (nullable)"
  - "Añadir fallbacks en mapeo de datos para evitar errores de renderizado"
  - "El operador ?? es preferible a || para valores por defecto numéricos"
  - "Validar IDs antes de llamar APIs para evitar requests con undefined"

