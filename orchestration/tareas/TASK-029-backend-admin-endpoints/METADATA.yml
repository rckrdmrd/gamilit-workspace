# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Backend Admin Endpoints - Completar implementaciones"
  descripcion: |
    Completar endpoints de administración que actualmente usan mock/placeholder.

    Endpoints a implementar/completar:

    1. Admin System Settings (admin-system.service.ts)
       - GET /admin/system/settings - Configuración del sistema
       - POST /admin/system/settings - Guardar configuración
       - GET /admin/system/email-config - Configuración email
       - POST /admin/system/security-config - Configuración seguridad

    2. Storage Calculation (admin-organizations.service.ts)
       - Actualmente retorna 0 bytes (mock)
       - Implementar cálculo real de uso de storage

    3. Performance Tracking (admin-system.service.ts)
       - Actualmente retorna 125ms hardcoded
       - Implementar tracking real de response times

    4. Campo graded_by (exercise_submissions)
       - Campo faltante en DDL
       - Agregar migración si necesario

    Archivos involucrados:
    - apps/backend/src/modules/admin/services/admin-system.service.ts
    - apps/backend/src/modules/admin/services/admin-organizations.service.ts
    - apps/backend/src/modules/admin/controllers/admin-system.controller.ts
    - apps/database/ddl/schemas/progress_tracking/tables/ (si migración)
  tipo: "feature"
  prioridad: "P1"
  tags:
    - "backend"
    - "admin"
    - "mvp-completion"
    - "api"

