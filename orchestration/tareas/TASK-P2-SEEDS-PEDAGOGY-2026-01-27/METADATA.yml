# Descripcion
descripcion: |
  Poblar los 4 campos pedagogicos agregados en DB-125 (2025-11-19)
  que actualmente estan vacios en los seeds de ejercicios:

  - objective: Objetivo pedagogico (200-500 palabras)
  - how_to_solve: Guia de resolucion (300-800 palabras)
  - recommended_strategy: Estrategias recomendadas (100-300 palabras)
  - pedagogical_notes: Notas para educadores (100-400 palabras)

  Estos campos son parte del modelo de comprension lectora de
  Daniel Cassany y mejoran la experiencia educativa.

  Gap identificado: SEED-P2-003

