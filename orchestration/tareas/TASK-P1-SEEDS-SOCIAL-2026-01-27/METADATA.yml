version: "1.0.0"
task_id: "TASK-P1-SEEDS-SOCIAL-2026-01-27"
fecha_creacion: "2026-01-27"
fecha_completado: "2026-01-27"
estado: "COMPLETED"
modo: "@FULL"

# Identificacion
nombre: "Implementar Seeds P1 - Social Features (peer_challenges, team_challenges)"
tipo: "IMPLEMENTATION"
prioridad: "P1"
story_points: 5
origen: "TASK-BD-ANALYSIS-2026-01-27"

# Descripcion
descripcion: |
  Implementar seeds faltantes para funcionalidades sociales identificados
  en el analisis BD/Modelado como gaps P1 criticos.

  Gaps a resolver:
  - SEED-P1-001: peer_challenges (actualmente 2 registros, necesita 10+)
  - SEED-P1-002: team_challenges (actualmente vacio, necesita 5+)

# Subtareas
subtareas:
  - id: "1.1"
    nombre: "Crear seed peer_challenges"
    descripcion: |
      Crear archivo de seed con 10+ desafios entre pares variados.
      Tipos de desafios sugeridos:
      - Quien completa mas ejercicios M1
      - Mejor racha de respuestas correctas
      - Mayor puntaje en crucigrama
      - Velocidad en linea de tiempo
      - Precision en verdadero/falso
    archivo_destino: "apps/database/seeds/dev/social_features/04-peer_challenges.sql"
    archivo_prod: "apps/database/seeds/prod/social_features/04-peer_challenges.sql"
    estado: "COMPLETED"
    sp: 2

  - id: "1.2"
    nombre: "Crear seed team_challenges"
    descripcion: |
      Crear archivo de seed con 5+ competencias de equipo.
      Tipos de challenges sugeridos:
      - Equipo con mayor XP semanal
      - Primer equipo en completar modulo
      - Mayor cantidad de perfectos
      - Racha colectiva de equipo
      - Meta de lectura semanal
    archivo_destino: "apps/database/seeds/dev/social_features/05-team_challenges.sql"
    archivo_prod: "apps/database/seeds/prod/social_features/05-team_challenges.sql"
    estado: "COMPLETED"
    sp: 2

  - id: "1.3"
    nombre: "Validar y recrear BD"
    descripcion: |
      Ejecutar recreacion de BD para validar seeds:
      1. Ejecutar script unified-recreate-db.sh gamilit --drop
      2. Verificar registros insertados
      3. Validar FK constraints
    estado: "COMPLETED"
    sp: 1

# Archivos a crear/modificar
archivos:
  crear:
    - "apps/database/seeds/dev/social_features/04-peer_challenges.sql"
    - "apps/database/seeds/dev/social_features/05-team_challenges.sql"
    - "apps/database/seeds/prod/social_features/04-peer_challenges.sql"
    - "apps/database/seeds/prod/social_features/05-team_challenges.sql"

# Dependencias
dependencias:
  tablas_requeridas:
    - "social_features.peer_challenges"
    - "social_features.team_challenges"
    - "auth_management.profiles"  # Para user_id references
  seeds_previos:
    - "auth_management/01-tenants.sql"
    - "auth_management/02-profiles.sql"

# Validaciones
validaciones:
  pre_implementacion:
    - "Verificar estructura tabla peer_challenges"
    - "Verificar estructura tabla team_challenges"
    - "Identificar campos obligatorios y ENUMs"
  post_implementacion:
    - "npm run build (backend)"
    - "Recrear BD con seeds"
    - "Verificar conteo: SELECT COUNT(*) FROM social_features.peer_challenges"
    - "Verificar conteo: SELECT COUNT(*) FROM social_features.team_challenges"

# Criterios de aceptacion
criterios_aceptacion:
  - "peer_challenges tiene 10+ registros variados"
  - "team_challenges tiene 5+ registros variados"
  - "Seeds ejecutan sin errores FK"
  - "Datos son coherentes con modelo de dominio"

# Impacto
impacto:
  funcionalidades_habilitadas:
    - "Desafios entre pares en frontend"
    - "Competencias de equipo en frontend"
    - "Feature social completa operativa"
  riesgo: "BAJO"
  rollback: "Eliminar archivos de seeds"

# Trazabilidad
trazabilidad:
  analisis_origen: "TASK-BD-ANALYSIS-2026-01-27"
