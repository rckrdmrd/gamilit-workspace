identificacion:
  titulo: "US-PM-006: Implementar Bloqueo/Desbloqueo de Alumnos (Frontend)"
  descripcion: |
    Implementación del frontend para la funcionalidad de bloqueo/desbloqueo de
    estudiantes en el Portal del Maestro. El backend ya existía implementado
    en student-blocking.service.ts y TeacherClassroomsController.

    Features implementadas:
    - Modal de suspensión con tipo de bloqueo (completo/parcial)
    - Menú de acciones contextual para cada estudiante
    - Hook useStudentBlocking para gestión de estado
    - Integración con API existente de bloqueo
    - Badge visual de estado "Bloqueado" en listados
  tipo: "feature"
  prioridad: "P1"
  tags:
