    estado: "completada"
    fecha_completado: "2026-02-02"
    acciones:
      - "Crear trg_module_progress_complete (reemplaza 27+33)"
      - "Crear trg_process_xp_update (reemplaza 21)"
      - "Documentar rollback"
    archivos_creados:
      - "ddl/schemas/progress_tracking/triggers/40-trg_module_progress_complete.sql"
      - "ddl/schemas/gamification_system/triggers/30-trg_process_xp_update.sql"

# ─────────────────────────────────────────────────────────────────────────────────
# ENTREGABLES
# ─────────────────────────────────────────────────────────────────────────────────

entregables:
  funciones:
    - archivo: "progress_tracking/functions/20-update_module_progress_complete.sql"
      descripcion: "Funcion consolidada para module_progress + average_score"
      lineas: 220

    - archivo: "gamification_system/functions/09-process_xp_update.sql"
      descripcion: "Funcion consolidada para level + missions XP"
      lineas: 120

  triggers:
    - archivo: "progress_tracking/triggers/40-trg_module_progress_complete.sql"
      descripcion: "Trigger consolidado que reemplaza 27 y 33"
      reemplaza: ["trg_update_module_progress_on_submission", "trg_sync_average_score_on_submission"]

    - archivo: "gamification_system/triggers/30-trg_process_xp_update.sql"
      descripcion: "Trigger consolidado que reemplaza 21"
      reemplaza: ["trg_recalculate_level_on_xp_change"]

  indices:
    - archivo: "optimization/99-optimization-indexes-triggers.sql"
      descripcion: "5 indices de optimizacion para triggers"
      indices:
        - "idx_exercises_module_active"
        - "idx_submissions_user_exercise_status"
        - "idx_attempts_user_correct"
        - "idx_submissions_user_graded"
        - "idx_missions_user_active_type"

  migracion:
    - archivo: "migrations/MIGRATION-2026-02-02-OPTIMIZE-TRIGGERS.sql"
      descripcion: "Script de migracion para staging"

# ─────────────────────────────────────────────────────────────────────────────────
# METRICAS DE OPTIMIZACION
# ─────────────────────────────────────────────────────────────────────────────────

metricas:
  antes:
    triggers_en_cascade: 7
    latencia_p50: "180ms"
    latencia_p99: "300ms"
    desglose:
      - "trg_updated_at: <1ms"
      - "trg_missions_on_submission: 15-30ms"
      - "trg_module_progress: 40-70ms (+cascade <1ms)"
      - "trg_user_stats: 20-35ms"
      - "  → trg_level: 5-10ms"
      - "  → trg_missions_xp: 15-25ms"
      - "trg_sync_average: 20-35ms (+cascade <1ms)"
    total: "150-220ms"

  despues:
    triggers_en_cascade: 3
    latencia_p50_estimada: "120ms"
    latencia_p99_estimada: "200ms"
    desglose:
      - "trg_updated_at: <1ms"
      - "trg_missions_on_submission: 15-30ms (sin cambio)"
      - "trg_module_progress_complete: 50-80ms (consolidado)"
      - "trg_user_stats_complete: 30-45ms (consolidado)"
    total_estimado: "95-155ms"

  reduccion:
    latencia: "30-40%"
    triggers: "7 → 3"
    queries_eliminadas: 2
    indices_agregados: 5

