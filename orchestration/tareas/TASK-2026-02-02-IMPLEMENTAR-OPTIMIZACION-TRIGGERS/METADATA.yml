# ─────────────────────────────────────────────────────────────────────────────────
# OBJETIVOS
# ─────────────────────────────────────────────────────────────────────────────────

objetivos:
  principal: |
    Implementar las funciones consolidadas de triggers para reducir
    la latencia de 150-220ms a 95-155ms (-35%) en exercise_submissions.

  especificos:
    - Crear update_module_progress_complete() consolidando triggers 3+5
    - Crear process_xp_update() consolidando triggers 4A+4B
    - Crear índices de optimización
    - Reemplazar triggers antiguos
    - Validar funcionamiento

