    archivo: "apps/database/seeds/dev/communication/02-message_participants.sql"
    estado: "COMPLETED"
    nota: "Dynamic participant creation for all messages"
    sp: 1

  - id: "2.4"
    nombre: "Verificar seeds prod"
    descripcion: |
      Seeds prod ya existían con estructura correcta:
