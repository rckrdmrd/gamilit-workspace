# Identificacion
nombre: "Analizar y Planificar Consolidacion Sistema de Roles (ENUM vs RBAC)"
tipo: "ANALYSIS"
prioridad: "P2"
story_points: 5
origen: "TASK-BD-ANALYSIS-2026-01-27"

# Descripcion
descripcion: |
  Analizar la coexistencia de dos sistemas de roles y planificar consolidacion:

  Sistema 1 - ENUM (actual, en uso):
  - gamilit_role ENUM en auth_management.profiles
  - Valores: 'student', 'teacher', 'admin'
  - Usado en RLS y logica de negocio

  Sistema 2 - RBAC Tables (existente, subutilizado):
  - auth_management.roles (tabla)
  - auth_management.user_roles (tabla intermedia)
  - auth_management.permissions (tabla)
  - auth_management.role_permissions (tabla intermedia)

  Esta tarea es ANALISIS solamente. La implementacion sera en tarea separada.

  Gap identificado: ARCH-P2-001

# Subtareas
subtareas:
  - id: "2.1"
    nombre: "Documentar sistema ENUM actual"
    descripcion: |
      Documentado uso del ENUM gamilit_role:
      - DDL: apps/database/ddl/schemas/auth_management/enums/gamilit_role.sql
      - Valores: student, admin_teacher, super_admin
      - Usado en 47+ archivos backend (guards, decorators, services)
      - Usado en RLS policies via get_current_user_role()
    estado: "COMPLETED"
    sp: 1

  - id: "2.2"
    nombre: "Documentar sistema RBAC tables"
    descripcion: |
      Documentado estado del sistema RBAC:
      - Tabla roles: Catalogo con metadata y permisos
      - Tabla user_roles: Asignaciones con ENUM (hibrido!)
      - Seeds existentes en dev/auth_management/
      - Backend entities: role.entity.ts, user-role.entity.ts
    estado: "COMPLETED"
    sp: 1

  - id: "2.3"
    nombre: "Analizar opciones de consolidacion"
    descripcion: |
      Evaluadas 3 opciones:
      - Opcion A (Solo ENUM): Descartada - pierde metadata
      - Opcion B (Solo RBAC): Descartada - breaking changes
      - Opcion C (Hibrido): SELECCIONADA - ya funciona

      Hallazgo: El sistema YA es hibrido funcional.
      user_roles usa el ENUM para la columna role.
    estado: "COMPLETED"
    sp: 2

  - id: "2.4"
    nombre: "Crear ADR con recomendacion"
    descripcion: |
      Creado ADR-028-roles-system-hybrid-design.md:
      - Contexto del problema documentado
      - 3 opciones evaluadas con pros/cons
      - Decision: Mantener hibrido (by design)
      - Proceso para agregar roles futuros documentado
    archivo_destino: "docs/97-adr/ADR-028-roles-system-hybrid-design.md"
    estado: "COMPLETED"
    sp: 1

