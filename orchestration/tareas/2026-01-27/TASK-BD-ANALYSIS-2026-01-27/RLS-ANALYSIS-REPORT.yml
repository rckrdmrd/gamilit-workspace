# ============================================================================
# PATRONES RLS UTILIZADOS
# ============================================================================

patrones_rls:

  patron_owner:
    descripcion: "Usuario es dueno del registro"
    ejemplo: "user_id = auth.uid()"
    usado_en: ["user_stats", "module_progress", "notifications"]

  patron_tenant:
    descripcion: "Registro pertenece al tenant del usuario"
    ejemplo: "tenant_id = get_current_tenant_id()"
    usado_en: ["profiles", "classrooms", "assignments"]

  patron_role:
    descripcion: "Basado en rol del usuario"
    ejemplo: "get_user_role() IN ('admin_teacher', 'super_admin')"
    usado_en: ["teacher_content", "manual_reviews"]

  patron_membership:
    descripcion: "Usuario es miembro de grupo/clase"
    ejemplo: "EXISTS (SELECT 1 FROM classroom_members WHERE ...)"
    usado_en: ["classroom_members", "assignments"]

  patron_relationship:
    descripcion: "Usuario tiene relacion con otro"
    ejemplo: "EXISTS (SELECT 1 FROM friendships WHERE ...)"
    usado_en: ["friendships", "peer_challenges"]

