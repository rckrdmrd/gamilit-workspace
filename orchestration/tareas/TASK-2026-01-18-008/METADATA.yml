# Contexto
descripcion: |
  La página teacher/reviews muestra errores al intentar evaluar ejercicios M3-M5.
  - Error: "Maximum update depth exceeded" (bucle de re-render infinito)
  - Causa raíz 1: Backend no envía rubric al frontend
  - Causa raíz 2: handleEvaluationChange no memoizado en ReviewDetail.tsx

dominios:
  - Backend
  - Frontend
  - Teacher Portal
  - Manual Reviews

# Análisis de Causa Raíz
root_cause_analysis:
  issue_1_rubric:
    sintoma: "RubricEvaluator recibe rubric=undefined"
    ubicacion_backend: "apps/backend/src/modules/teacher/services/manual-review.service.ts"
    funcion: "enrichReview()"
    problema: "No incluye rubric en el enriched review"
    solucion: "Cargar rubric desde exercise_type_rubrics tabla"

  issue_2_infinite_loop:
    sintoma: "Maximum update depth exceeded"
    ubicacion_frontend: "apps/frontend/src/apps/teacher/components/review-panel/ReviewDetail.tsx"
    funcion: "handleEvaluationChange"
    problema: "Callback no memoizado con useCallback"
    solucion: "Memoizar callback y corregir useEffect en RubricEvaluator"

# Archivos a Modificar
archivos_modificar:
  backend:
    - path: "apps/backend/src/modules/teacher/services/manual-review.service.ts"
      cambio: "Agregar ExerciseTypeRubrics repository y cargar rubric en enrichReview"

  frontend:
    - path: "apps/frontend/src/apps/teacher/components/review-panel/ReviewDetail.tsx"
      cambio: "Memoizar handleEvaluationChange con useCallback"
    - path: "apps/frontend/src/shared/components/mechanics/RubricEvaluator.tsx"
      cambio: "Corregir useEffect para evitar llamadas innecesarias a onChange"

