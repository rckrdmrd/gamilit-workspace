# TASK-2026-01-18-009: Erradicar Datos Hardcodeados
# ==================================================
# Ciclo CAPVED: C-A-P-V-E-D

id: TASK-2026-01-18-009
titulo: "Erradicar datos hardcodeados - Consumir desde BD/API"
fecha: "2026-01-18"
estado: completed
prioridad: P1
tipo: refactor
metodologia: CAPVED

# Contexto
descripcion: |
  Identificar y eliminar todos los datos hardcodeados que deberían consumirse
  desde la base de datos o API. Solo los tests deben tener datos mockeados.

  PRINCIPIO: "Datos de producción siempre desde BD, nunca hardcodeados"

dominios:
  - Backend
  - Frontend
  - Teacher Portal
  - Educational Content

# Análisis de Datos Hardcodeados
datos_hardcodeados:
  frontend:
    - archivo: "apps/frontend/src/apps/teacher/constants/manualReviewExercises.ts"
      lineas: 138
      contenido: "MANUAL_REVIEW_MODULES + MANUAL_REVIEW_EXERCISES (12 ejercicios)"
      fuente_correcta: "BD: educational_content.exercises WHERE requires_manual_grading = true"
      severidad: P1

    - archivo: "apps/frontend/src/apps/teacher/constants/standardRubrics.ts"
      lineas: 624
      contenido: "12 rúbricas completas con criterios hardcodeados"
      fuente_correcta: "BD: educational_content.exercise_type_rubrics (YA INTEGRADO en TASK-008)"
      severidad: P0
      nota: "Ya se consume desde API después de TASK-008, archivo puede eliminarse"

  backend:
    - archivo: "apps/backend/src/modules/teacher/services/rubric-scoring.service.ts"
      lineas: 835
      contenido: "RUBRICS_BY_TYPE - 12 rúbricas hardcodeadas"
      fuente_correcta: "BD: educational_content.exercise_type_rubrics"
      severidad: P2
      nota: "CÓDIGO HUÉRFANO - Registrado pero nunca inyectado/usado"

# Fuentes de Datos Correctas (BD)
fuentes_bd:
  modulos:
    tabla: "educational_content.modules"
    campos_relevantes: ["id", "name", "order_index", "is_published"]

  ejercicios:
    tabla: "educational_content.exercises"
    campos_relevantes: ["id", "title", "module_id", "exercise_type", "requires_manual_grading"]

  rubricas:
    tabla: "educational_content.exercise_type_rubrics"
    campos_relevantes: ["exercise_type", "rubric_name", "criteria", "is_default"]
    nota: "YA INTEGRADO en manual-review.service.ts (TASK-008)"

# Plan de Erradicación
plan:
  fase_1_backend:
    descripcion: "Crear endpoint para ejercicios con revisión manual"
    acciones:
      - "Crear endpoint GET /api/v1/teacher/exercises/manual-review"
      - "Retornar ejercicios con requires_manual_grading=true + info de módulo"
      - "Opcional: Crear endpoint para módulos con ejercicios manuales"

  fase_2_frontend:
    descripcion: "Refactorizar frontend para consumir desde API"
    acciones:
      - "Crear hook useManualReviewExercises que consume el nuevo endpoint"
      - "Actualizar TeacherReviewPanelPage para usar el hook"
      - "Eliminar o deprecar manualReviewExercises.ts"

  fase_3_limpieza:
    descripcion: "Eliminar código huérfano y archivos obsoletos"
    acciones:
      - "Eliminar standardRubrics.ts (ya no se usa)"
      - "Eliminar rubric-scoring.service.ts (código huérfano)"
      - "Actualizar teacher.module.ts para remover imports"

# Métricas Esperadas
metricas_esperadas:
  archivos_eliminados: 2
  lineas_eliminadas: ~1500
  endpoints_creados: 1
  hooks_creados: 1
