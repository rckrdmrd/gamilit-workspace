# TASK-2026-01-18-010: Fix Teacher Reviews - Evaluación y Gamificación
# ==================================================================
# Ciclo CAPVED: C-A-P-V-E-D

id: TASK-2026-01-18-010
titulo: "Fix Teacher Reviews - Flujo de Evaluación y Gamificación"
fecha: "2026-01-18"
estado: completed
prioridad: P0
tipo: bug-fix + enhancement
metodologia: CAPVED

# Contexto
descripcion: |
  Corrección del flujo de evaluación manual en teacher/reviews:
  1. Las respuestas se mostraban como JSON crudo
  2. El botón "Guardar Progreso" no funcionaba (data mismatch)
  3. La integración con gamificación no se completaba correctamente

  PROBLEMA RAÍZ: Frontend enviaba datos en formato diferente al esperado por backend.

dominios:
  - Frontend
  - Teacher Portal
  - Manual Reviews
  - Gamification

# Issues Identificados y Corregidos
issues_corregidos:
  - id: DATA-001
    descripcion: "Frontend envía evaluations[] pero backend espera rubricScores{}"
    severidad: P0
    solucion: "Función transformEvaluationsToBackend() convierte formato"

  - id: FLOW-001
    descripcion: "completeReview endpoint no acepta body, pero frontend enviaba datos"
    severidad: P0
    solucion: "Modificado completeReview() para no enviar body"

  - id: FLOW-002
    descripcion: "Evaluaciones no se guardaban antes de completar"
    severidad: P0
    solucion: "handleCompleteReview() ahora guarda evaluación primero, luego completa"

  - id: UX-001
    descripcion: "Botones poco claros sobre acción de calificar"
    severidad: P1
    solucion: "Renombrados a 'Guardar Borrador' y 'Calificar Respuesta'"

  - id: DISPLAY-001
    descripcion: "FallbackRenderer mostraba JSON crudo"
    severidad: P2
    solucion: "Mejorado FallbackRenderer con renderizado inteligente"

# Cambios Implementados
cambios:
  frontend:
    - archivo: "apps/frontend/src/apps/teacher/components/review-panel/ReviewDetail.tsx"
      cambios:
        - "Agregada función transformEvaluationsToBackend()"
        - "handleSaveProgress() ahora envía rubricScores y totalScore"
        - "handleCompleteReview() guarda evaluación ANTES de completar"
        - "Mejorada confirmación con puntaje y mensaje de recompensas"
        - "Botones renombrados: 'Guardar Borrador' y 'Calificar Respuesta'"
        - "Agregado badge de puntaje actual"

    - archivo: "apps/frontend/src/shared/api/manualReviewApi.ts"
      cambios:
        - "UpdateReviewRequest ahora incluye rubricScores, totalScore, detailedFeedback"
        - "completeReview() ya no envía body (backend lo ignora)"
        - "Documentación actualizada sobre flujo correcto"

    - archivo: "apps/frontend/src/shared/components/mechanics/ExerciseContentRenderer.tsx"
      cambios:
        - "FallbackRenderer mejorado con renderizado inteligente"
        - "Detección automática de URLs de media (img/video/audio)"
        - "Advertencia de debug para tipos no reconocidos"
        - "Mejor presentación de datos complejos"

# Flujo Corregido
flujo_evaluacion:
  paso_1:
    descripcion: "Docente evalúa con rúbrica"
    componente: "RubricEvaluator"
    datos: "RubricEvaluation[] + totalScore"

  paso_2:
    descripcion: "Docente hace clic en 'Calificar Respuesta'"
    accion: "handleCompleteReview()"

  paso_3:
    descripcion: "Frontend transforma y guarda evaluación"
    endpoint: "PUT /teacher/reviews/:id"
    datos: "{ rubricScores, totalScore, generalFeedback, detailedFeedback }"

  paso_4:
    descripcion: "Frontend completa review"
    endpoint: "POST /teacher/reviews/:id/complete"
    datos: "{} (empty body)"

  paso_5:
    descripcion: "Backend distribuye recompensas"
    acciones:
      - "gradeSubmission() - califica submission"
      - "claimRewards() - distribuye XP y ML Coins"
      - "WebSocket emit - actualiza balance en tiempo real"
      - "Notificación al estudiante"

  paso_6:
    descripcion: "Frontend muestra recompensas asignadas"
    componente: "ReviewDetail - assignedRewards card"

# Integración Gamificación (Verificada)
gamificacion:
  flujo_backend:
    - "ManualReviewService.completeReview()"
    - "ExerciseSubmissionService.gradeSubmission()"
    - "ExerciseSubmissionService.claimRewards()"

  calculo_recompensas:
    xp: "base × score_ratio × rank_multiplier"
    ml_coins: "base × score_ratio - penalties"
    bonuses:
      - "Perfect score: +50 XP, +10 ML Coins"
      - "Rank promotion: bonus ML Coins"

  notificacion:
    titulo: "Tu ejercicio ha sido calificado"
    datos: "score, xp_earned, ml_coins_earned, rankUp"

# Métricas
metricas:
  archivos_modificados: 3
  funciones_agregadas: 1
  bugs_corregidos: 5
  ux_mejoras: 3

# Validaciones
validaciones:
  build: PASSED
  lint: PASSED
  tipos: PASSED
