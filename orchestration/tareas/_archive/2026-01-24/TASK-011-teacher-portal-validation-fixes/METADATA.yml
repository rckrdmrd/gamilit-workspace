# -----------------------------------------------------------------------------
# ISSUES CORREGIDOS POR FASE
# -----------------------------------------------------------------------------
issues_corregidos:
  fase_1_criticos:
    total: 5
    items:
      - id: "CRIT-001"
        descripcion: "Tipos InterventionAlert desincronizados (priority vs severity)"
        solucion: "Actualizar interface en types/index.ts y AlertCard.tsx"
      - id: "CRIT-002"
        descripcion: "Datos mock en AssignmentCreator como fallback de error"
        solucion: "Eliminar mock data, mostrar toast de error al usuario"
      - id: "CRIT-003"
        descripcion: "Fallback silencioso a 0 en ReviewDetail.totalScore"
        solucion: "Validar explicitamente y mostrar error si invalido"
      - id: "CRIT-004"
        descripcion: "console.log de debug en manual-review.controller.ts"
        solucion: "Eliminar console.log del backend"
      - id: "CRIT-005"
        descripcion: "Validacion de classroom_id via RLS"
        solucion: "Verificado - ya implementado correctamente"

  fase_2_alta:
    total: 3
    items:
      - id: "ALTA-001"
        descripcion: "RLS validation no documentada"
        solucion: "Verificado implementacion en exercise-responses.service.ts"
      - id: "ALTA-002"
        descripcion: "Error handling sin feedback UI en ResponseFilters"
        solucion: "Agregar toast.error cuando modulos fallan en cargar"
      - id: "ALTA-003"
        descripcion: "Error generico en lugar de UnauthorizedException"
        solucion: "Usar UnauthorizedException de NestJS con mensaje claro"

  fase_3_media:
    total: 3
    items:
      - id: "MEDIA-001"
        descripcion: "Archivo deprecado manualReviewExercises.ts (156 lineas)"
        solucion: "Eliminar archivo - reemplazado por useManualReviewConfig hook"
      - id: "MEDIA-002"
        descripcion: "useEffects superpuestos en TeacherProgressPage"
        solucion: "Consolidar en un solo effect sin dependencias circulares"
      - id: "MEDIA-003"
        descripcion: "Respuestas vacias de endpoints"
        solucion: "Verificado - patron REST correcto con arrays vacios"

  fase_4_baja:
    total: 4
    items:
      - id: "BAJA-001"
        descripcion: "12 console.log de debug en ReviewDetail.tsx"
        solucion: "Eliminar todos los console.log de depuracion"
      - id: "BAJA-002"
        descripcion: "Tipos 'any' en StudentProgressList.tsx"
        solucion: "Cambiar a 'string | number' y eliminar eslint-disable"
      - id: "BAJA-003"
        descripcion: "console.warn sin feedback UI en TeacherProgressPage"
        solucion: "Reemplazar con toast y resetear a 'all'"
      - id: "BAJA-004"
        descripcion: "Multiples 'as any' en otros archivos"
        solucion: "Verificado - tienen eslint-disable a nivel de archivo (decision de diseño)"

