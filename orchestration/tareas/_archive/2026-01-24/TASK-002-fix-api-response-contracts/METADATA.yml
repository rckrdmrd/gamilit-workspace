# -----------------------------------------------------------------------------
# NOTAS Y LECCIONES
# -----------------------------------------------------------------------------
notas: |
  Patron identificado: Inconsistencia en contratos API entre backend y frontend
  causan errores silenciosos que son dificiles de debuggear.

  Sintomas tipicos:
  - Funcionalidad "no funciona" pero no hay errores en consola
  - Frontend recibe undefined donde espera datos
  - Campos con nombres diferentes (read vs status)

lecciones_aprendidas:
  - leccion: "Verificar que backend no envuelva manualmente respuestas que ya envuelve TransformResponseInterceptor"
    categoria: "backend"
    impacto: "alto"
  - leccion: "Alinear nombres de campos entre DTOs de backend y interfaces de frontend"
    categoria: "api-contract"
    impacto: "alto"
  - leccion: "Validar siempre fechas antes de llamar metodos de Date"
    categoria: "frontend"
    impacto: "medio"
