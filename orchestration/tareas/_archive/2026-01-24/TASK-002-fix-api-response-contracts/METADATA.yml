identificacion:
  titulo: "Correcciones Contratos API Backend-Frontend"
  descripcion: |
    Corrección de 4 inconsistencias entre contratos API del backend y
    expectativas del frontend que causaban fallos silenciosos:

    1. claimReward: Doble envoltorio de respuesta
    2. GET /notifications: Estructura respuesta incorrecta
    3. NotificationResponseDto: Campo read vs status
    4. NotificationDropdown: formatTimestamp con fecha undefined
  tipo: "bugfix"
  prioridad: "P1"
  tags:
