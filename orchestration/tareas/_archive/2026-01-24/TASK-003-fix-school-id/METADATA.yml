# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACION
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Corregir asignacion de school_id a usuarios - Institucion Default"
  descripcion: |
    Los usuarios registrados en GAMILIT no tenian asignado el school_id, quedando
    con valor NULL cuando debian pertenecer a la institucion default (GAMILIT-DEFAULT).

    Problema detectado:
    - 48 usuarios con school_id = NULL
    - El trigger set_default_tenant solo asignaba tenant_id, no school_id

    Solucion implementada:
    - Modificar trigger para asignar school_id automaticamente
    - Migrar datos existentes a la institucion default
  tipo: "bugfix"
  prioridad: "P1"
  tags:
    - "database"
    - "trigger"
    - "school_id"
    - "institucion"
    - "integridad-datos"

