# NOTAS Y LECCIONES APRENDIDAS
# ─────────────────────────────────────────────────────────────────────────────────

notas: |
  La sincronizacion se realizo sin problemas. Se uso cp -r para copiar
  los directorios completos desde workspace-v2/orchestration/ a
  projects/gamilit/orchestration/.

  El unico inconveniente fue un error de permisos temporal al hacer
  git add, que se resolvio agregando los archivos en lotes.

lecciones_aprendidas:
  - "Agregar archivos en lotes cuando hay muchos archivos para evitar errores de permisos"
  - "Verificar estructura con find y wc -l antes de commit"
  - "Documentar la tarea ANTES de hacer commit segun estandares SIMCO"

