  descripcion: |
    Replicar la estructura completa de orchestration/ del workspace a gamilit
    para lograr independencia total del proyecto. Cambiar politica de
    REFERENCIAR_NO_COPIAR a REPLICA_COMPLETA.

    Incluye:
    - agents/ (66 archivos): perfiles, configs, trazas
    - directivas/ (124 archivos): SIMCO completo, triggers, modos
    - _definitions/ (29 archivos): checklists, protocols, schemas
