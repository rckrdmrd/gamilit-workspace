# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Fix cache invalidation en Teacher Reviews - Completadas no aparecen"
  descripcion: |
    Bug reportado: Después de calificar un ejercicio, no aparece en la pestaña "Completadas".

    Causa raíz: En ReviewDetail.tsx:231, se llama directamente a manualReviewApi.completeReview()
    en lugar de usar el hook useCompleteReview(). El hook tiene la lógica de invalidar la cache
    de React Query en onSuccess, pero al llamar directamente a la API, la cache no se invalida.

    Solución: Agregar invalidación manual de cache usando queryClient.invalidateQueries()
    después de completar exitosamente el review.
  tipo: "bugfix"
  prioridad: "P1"
  tags:
    - "teacher-portal"
    - "react-query"
    - "cache"
    - "reviews"

