# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Implementar generación real de reportes PDF/Excel/CSV en Admin Portal"
  descripcion: |
    Corrección del sistema de reportes administrativos que generaba archivos
    mock (texto plano) en lugar de archivos binarios reales. Los reportes
    PDF/Excel se descargaban corruptos porque contenían solo texto plano.

    Cambios principales:
    - Implementar generación real de PDF con pdfkit
    - Implementar generación real de Excel con exceljs
    - Implementar generación de CSV con csv-stringify
    - Actualizar controller para streaming con Content-Type correcto
    - Agregar endpoint /info para metadata sin descarga
  tipo: "bugfix"
  prioridad: "P0"
  tags:
    - "admin-portal"
    - "reports"
    - "pdf"
    - "excel"
    - "csv"

