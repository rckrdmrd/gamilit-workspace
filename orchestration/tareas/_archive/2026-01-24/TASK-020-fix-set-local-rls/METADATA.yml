# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Fix SET LOCAL RLS Error - syntax error at or near $1"
  descripcion: |
    Corrección de error crítico en TeacherReportsService donde SET LOCAL
    se usaba con queries parametrizadas ($1) que PostgreSQL no soporta.

    Error: QueryFailedError: syntax error at or near "$1"
    Query: SET LOCAL app.current_user_id = $1

    Causa: PostgreSQL SET commands no soportan placeholders.
    Solución: Usar interpolación de string con validación UUID previa.
  tipo: "bugfix"
  prioridad: "P0"
  tags:
    - "teacher-portal"
    - "rls"
    - "postgresql"
    - "critical-bug"

