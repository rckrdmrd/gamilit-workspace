# NOTAS
# ─────────────────────────────────────────────────────────────────────────────────

notas: |
  Bug introducido en TASK-015 donde se intentó usar SET LOCAL con
  queries parametrizadas. PostgreSQL no soporta esto para comandos SET.

  La solución es segura porque:
  1. teacherId viene del JWT ya validado
  2. Se valida formato UUID antes de interpolar
  3. UUID regex solo permite caracteres hexadecimales y guiones

lecciones_aprendidas:
  - "SET LOCAL en PostgreSQL NO soporta queries parametrizadas ($1, $2)"
  - "Siempre verificar la sintaxis SQL del comando antes de usar placeholders"

