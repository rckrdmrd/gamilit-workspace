# ============================================================================
# FUNCIONALIDADES IMPLEMENTADAS
# ============================================================================

funcionalidades:
  backup_production_data:
    descripcion: "Backup de datos criticos antes de deploy"
    datos_respaldados:
      - "auth.users - Usuarios del sistema"
      - "auth_management.profiles - Perfiles de usuario"
      - "progress_tracking.* - Progreso de estudiantes"
      - "gamification_system.* - Estadisticas y logros"
      - "educational_content.teacher_content - Contenido de profesores"
      - "social_features.* - Relaciones sociales"
    comandos:
      - "./backup-production-data.sh --env prod"
      - "./backup-production-data.sh --list"
      - "./backup-production-data.sh --restore BACKUP.tar.gz"

  deploy_production:
    descripcion: "Deploy seguro a produccion"
    pasos:
      - "Validar prerequisitos"
      - "Ejecutar tests"
      - "Crear backup automatico"
      - "Ejecutar migraciones BD"
      - "Build de aplicaciones"
      - "Deploy con PM2"
      - "Health checks"
      - "Rollback automatico si falla"
    comandos:
      - "./deploy-production.sh --env prod"
      - "./deploy-production.sh --env prod --dry-run"
      - "./deploy-production.sh --rollback BACKUP.tar.gz"

  cors_configuration:
    descripcion: "Configuracion CORS para produccion"
    ubicacion: "apps/backend/src/main.ts"
    estado: "Ya implementado"
    notas: |
      CORS configurado correctamente:
      - Soporta multiples origenes via CORS_ORIGIN
      - Incluye headers Authorization, Content-Type, x-tenant-id
      - Credentials habilitados
      - nginx NO debe agregar headers CORS (NestJS los maneja)

  https_ssl:
    descripcion: "Configuracion HTTPS/SSL"
    proveedor: "Let's Encrypt"
    herramienta: "certbot"
    comandos_documentados:
      - "sudo certbot --nginx -d gamilit.com -d www.gamilit.com"
      - "sudo certbot renew --dry-run"
    configuracion_nginx: "Documentada en SIMCO-DEPLOY-PRODUCTION.md"

