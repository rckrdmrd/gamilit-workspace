# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACION
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Corregir serializacion de last_sign_in_at en tabla de usuarios admin"
  descripcion: |
    La pagina de usuarios del portal admin mostraba "Nunca" para todos los usuarios
    en la columna "Last Login", aunque los datos existian correctamente en la BD.

    Problema detectado:
    - El DTO UserDetailsDto no serializaba campos Date a ISO string correctamente
    - Los decorators @Transform no tenian la opcion toPlainOnly
    - El servicio no usaba instanceToPlain para ejecutar los decorators

    Solucion implementada:
    - Agregar @Transform con toPlainOnly: true en UserDetailsDto
    - Usar instanceToPlain en admin-users.service.ts para trigger decorators
    - Helper toISOString para conversion segura de Date a string
  tipo: "bugfix"
  prioridad: "P1"
  tags:
    - "backend"
    - "admin"
    - "serialization"
    - "class-transformer"
    - "last-login"

