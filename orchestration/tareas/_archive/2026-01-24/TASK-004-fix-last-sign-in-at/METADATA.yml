# ─────────────────────────────────────────────────────────────────────────────────
# NOTAS Y LECCIONES APRENDIDAS
# ─────────────────────────────────────────────────────────────────────────────────

notas: |
  Tarea solicitada por usuario al reportar que la columna "Last Login"
  mostraba "Nunca" para todos los usuarios en la pagina de admin.

  El diagnostico revelo que el problema era de serializacion, no de datos:
  - Los datos existian correctamente en la BD (verificado con psql)
  - El backend devolvia el campo pero class-transformer no lo convertia
  - El frontend esperaba ISO string pero recibia undefined

  La clave fue identificar que @Transform necesita toPlainOnly: true
  para ejecutarse solo en instanceToPlain, no en plainToInstance.

lecciones_aprendidas:
  - "Los decorators @Transform de class-transformer necesitan toPlainOnly: true para respuestas API"
  - "Siempre usar instanceToPlain despues de plainToInstance cuando se necesitan @Transform"
  - "Verificar primero si los datos existen en BD antes de debugear el frontend"
  - "El patron user-response.dto.ts ya tenia la solucion correcta para referencia"

