contexto:
  origen: "US-AUDIT-004 - Test Coverage Improvement"
  problema: |
    45 tests fallando en el módulo de gamification debido a:
    1. Mocks usando req.user.sub en lugar de req.user.id
    2. Mock de query() faltante para getMayaRanks
    3. Assertions incorrectas (userId vs profileId)
    4. Método incorrecto mockeado (getActiveByTypeAndLevel vs getActiveByType)
  impacto: "Tests fallidos bloqueaban validación de CI/CD"

