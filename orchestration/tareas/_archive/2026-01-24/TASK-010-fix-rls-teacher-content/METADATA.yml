# NOTAS Y LECCIONES APRENDIDAS
# ─────────────────────────────────────────────────────────────────────────────────

notas: |
  Este fix resuelve un problema de seguridad potencial donde las políticas RLS
  no se aplicarían correctamente debido a sintaxis incorrecta.

  El hallazgo ALTA-001 indicaba que las políticas "no estaban documentadas",
  pero en realidad existían archivos que simplemente no funcionarían por usar
  funciones inexistentes (auth.uid() vs current_setting()).

lecciones_aprendidas:
  - "Verificar que la sintaxis de RLS policies coincida con el patrón del proyecto"
  - "Este proyecto NO usa Supabase (auth.uid), usa PostgreSQL directo con current_setting()"
  - "Usar DROP IF EXISTS en archivos DDL para hacerlos idempotentes"
  - "Revisar scripts de carga (init-database.sh) para entender cómo se cargan los archivos"

