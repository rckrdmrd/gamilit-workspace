# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Consolidar RLS Policies para teacher_content (ALTA-001)"
  descripcion: |
    Fix del hallazgo ALTA-001 de TASK-2026-01-25-VALIDACION-PORTAL-TEACHER.

    PROBLEMA:
    - Existían 2 archivos de políticas RLS para teacher_content
    - 02-teacher_content-policies.sql usaba auth.uid() (sintaxis Supabase)
    - 02-teacher_content-policies-fixed.sql usaba current_setting() (correcto)
    - El script init-database.sh cargaba AMBOS archivos causando conflictos

    CAUSA RAÍZ:
    - Las funciones auth.uid(), auth.current_tenant_id(), auth.has_role() NO EXISTEN
    - Este proyecto usa current_setting('app.current_user_id', true) como patrón
    - El archivo con sintaxis incorrecta causaría errores al recrear la BD

    SOLUCIÓN:
    - Eliminar archivo con sintaxis incorrecta
    - Consolidar en archivo único idempotente con DROP IF EXISTS
    - Documentar patrón correcto en comentarios del archivo
  tipo: "bugfix"
  prioridad: "P1"
  tags:
    - "security"
    - "database"
    - "rls"
    - "teacher-content"
    - "ALTA-001"

