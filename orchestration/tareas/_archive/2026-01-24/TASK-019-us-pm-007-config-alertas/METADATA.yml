# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "US-PM-007: Implementar Configuración de Alertas (Full Stack)"
  descripcion: |
    Implementación completa (Database + Backend + Frontend) del sistema de
    configuración de alertas para el Portal del Maestro.

    Permite a los maestros personalizar umbrales y preferencias de notificación
    para 6 tipos de alertas:
    - NO_ACTIVITY: Sin actividad por X días
    - LOW_SCORE: Puntaje bajo (< X%)
    - DECLINING_TREND: Tendencia de declive (> X%)
    - REPEATED_FAILURES: Fallos repetidos (> X veces)
    - EXCESSIVE_TIME: Tiempo excesivo (> X minutos)
    - LOW_ENGAGEMENT: Bajo engagement (< X%)

    Features implementadas:
    - Tabla teacher_alert_configurations con RLS
    - Entity, Service y Controller en NestJS
    - API Client y Hook en React
    - Página de configuración con cards por tipo de alerta
    - Toggle enable/disable, edición de umbrales
    - Preferencias de notificación (email/in-app)
  tipo: "feature"
  prioridad: "P1"
  tags:
    - "teacher-portal"
    - "alert-config"
    - "full-stack"
    - "US-PM-007"

