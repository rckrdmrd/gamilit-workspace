# METADATA DE TAREA - TASK-017
# ═══════════════════════════════════════════════════════════════════════════════
#
# Fix CASE alias error en servicios de alertas del backend
# Error: "CASE alert" alias was not found. Maybe you forgot to join it?
#
# ═══════════════════════════════════════════════════════════════════════════════

version: "1.0.0"
task_id: "TASK-017"

# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Fix CASE alias error en servicios de alertas - Error 500"
  descripcion: |
    Corrección de error 500 en endpoint GET /api/v1/teacher/alerts causado por
    expresión CASE con alias incorrecto en TypeORM QueryBuilder.

    Error reportado:
    "CASE alert" alias was not found. Maybe you forgot to join it?

    Causa raíz:
    TypeORM no reconoce el alias "alert" dentro de expresiones CASE raw cuando
    se usa en .orderBy(). La sintaxis "CASE alert.severity WHEN..." es interpretada
    incorrectamente por el parser de TypeORM.

    Solución:
    Cambiar de "CASE alert.severity WHEN..." a "CASE severity WHEN..." ya que
    TypeORM puede resolver la columna directamente sin el alias cuando hay un
    único alias principal en el QueryBuilder.

  tipo: "bugfix"
  prioridad: "P1"
  tags:
    - "teacher-portal"
    - "admin-portal"
    - "alerts"
    - "typeorm"
    - "query-builder"
    - "error-500"

