  perfil:
    nombre: Explore
    descripcion: "Fast agent specialized for exploring codebases"
    capacidades:
      - Glob (busqueda de archivos por patron)
      - Grep (busqueda de contenido)
      - Read (lectura de archivos)
      - Bash (comandos de lectura)
      - WebFetch (si aplica)
      - WebSearch (si aplica)
    restricciones:
      - "Sin Task tool"
      - "Sin ExitPlanMode"
      - "Sin Edit/Write/NotebookEdit"
