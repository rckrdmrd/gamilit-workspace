identificacion:
  titulo: "Backend Admin Endpoints - Completar implementaciones"
  descripcion: |
    Completar endpoints de administración que usaban mock/placeholder.

    ANÁLISIS REALIZADO:
    - Revisión de admin-system.service.ts y admin-organizations.service.ts
    - Identificación de TODOs y placeholders
    - Verificación de esquemas de BD disponibles

    HALLAZGOS:
    1. avg_response_time_ms: Hardcoded a 125ms
       - audit_logging.system_logs tiene columna execution_time_ms
       - Implementado: Query para calcular promedio real

    2. storageUsedGb: Placeholder retornando 0
       - content_management.media_files tiene columna file_size_bytes
       - Implementado: Query para sumar storage por tenant

    3. Campo graded_by en exercise_submissions:
       - YA RESUELTO: El sistema usa manual_reviews.reviewer_id
       - No requiere cambios

    4. clearCache() y cleanupExpiredSessions():
       - Son placeholders BY DESIGN (dependen de infraestructura Redis/sessions)
       - Documentados como "not applicable for MVP"

    CAMBIOS IMPLEMENTADOS:

    1. admin-organizations.service.ts:
       - Agregado InjectDataSource('educational') para acceso a content_management
       - Nuevo método calculateStorageUsage() que consulta media_files
       - getOrganizationStats() ahora retorna storage real

    2. admin-system.service.ts:
       - Nuevo método calculateAverageResponseTime() que consulta system_logs
       - getSystemMetrics() ahora retorna avg_response_time_ms real
