# ─────────────────────────────────────────────────────────────────────────────────
# NOTAS
# ─────────────────────────────────────────────────────────────────────────────────

notas: |
  La solución fue más simple de lo esperado: el problema no era que faltaran
  datos en el tipo PendingExercise, sino que la API de pending content no
  retorna el contenido completo del ejercicio.

  La solución de fetch on-demand es mejor porque:
  1. No sobrecarga la lista de pending content con datos innecesarios
  2. Solo carga detalles cuando el admin quiere ver el preview
  3. Permite mostrar loading state apropiado
  4. Maneja errores de forma granular

