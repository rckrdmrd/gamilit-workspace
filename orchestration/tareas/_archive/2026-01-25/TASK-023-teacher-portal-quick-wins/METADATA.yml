hallazgos:
  - tipo: "discrepancia_documentacion"
    descripcion: |
      PROXIMA-ACCION.md reportaba Teacher Portal al ~60% con múltiples componentes
      faltantes. Análisis real mostró:
      - RubricEvaluator.tsx: EXISTE (354 líneas)
      - ExerciseContentRenderer.tsx: EXISTE (1761 líneas)
      - TeacherContentPage: YA FUNCIONAL (flag por defecto = false)
      - Estado real: ~85-90%
    impacto: "Actualizar PROXIMA-ACCION.md con estado correcto"

  - tipo: "endpoint_incorrecto"
    descripcion: |
      profileAPI.updatePassword llamaba a /users/:id/password que NO existe.
      El endpoint correcto es /auth/change-password (usa JWT para identificar usuario).
    impacto: "Fix aplicado, funcionalidad de cambio de password restaurada"

