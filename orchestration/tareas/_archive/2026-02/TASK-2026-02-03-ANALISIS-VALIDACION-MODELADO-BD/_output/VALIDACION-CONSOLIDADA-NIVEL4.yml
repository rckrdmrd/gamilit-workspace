        - "content_management.moderation_rules.created_by"
      problema: "References auth.users(id) pero schema renombrado a auth_management"
      impacto: "FK constraints fail silently, orphaned records possible"
      recomendacion: "Update to REFERENCES auth_management.profiles(id)"
      timeline: "IMMEDIATE (1-2 days)"

