    - id: "OVR-006"
      tipo: "Function Duplication"
      estado: "RESUELTO 2026-02-03"
      objetos:
        - "gamilit.update_updated_at_column()"
        - "communication.update_message_tracking_fields()"  # Renombrada
      problema_original: "Reportado como misma logica implementada 2 veces"
      resolucion: |
        ANALISIS reveló que NO es duplicado. La función de communication tiene
        LOGICA UNICA para la tabla messages:
        1. updated_at (similar a gamilit)
        2. edited_at, edit_count (tracking de ediciones)
        3. read_at (auto-set cuando is_read cambia)
        4. deleted_at (auto-set cuando is_deleted cambia)
        5. flagged_at (auto-set cuando is_flagged cambia)

        ACCION: Funcion RENOMBRADA para clarificar proposito.
        Antes: update_messages_timestamp()
        Ahora: update_message_tracking_fields()
      impacto: "NINGUNO - función conservada con nombre descriptivo"
      migration: "2026-02-03-rename-messages-trigger-function.sql"

    - id: "OVR-007"
      tipo: "Broken FK Constraints"
      objetos:
