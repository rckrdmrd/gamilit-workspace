# Descripcion
descripcion: |
  Implementar relaciones ORM faltantes identificadas en el analisis
  BD/Modelado como gaps P1 criticos. Estas relaciones existen como FK
  en DDL pero no tienen decoradores @ManyToOne/@OneToOne en las entities.

  Gaps a resolver:
  - ORM-P1-001: Exercise → Module (@ManyToOne falta)
  - ORM-P1-002: UserStats → Profile (relacion comentada)
  - ORM-P1-003: ModuleProgress → Module/Profile (relaciones parciales)
  - ORM-P1-004: ExerciseAttempt → Exercise (@ManyToOne falta)

# Subtareas
subtareas:
  - id: "1.1"
    nombre: "Implementar Exercise → Module"
    descripcion: |
      Agregar relacion @ManyToOne de Exercise a Module.

      FK DDL: exercises_module_id_fkey (NOT NULL, CASCADE)

      Codigo a agregar en exercise.entity.ts:
      ```typescript
      @ManyToOne(() => Module, module => module.exercises, { onDelete: 'CASCADE' })
      @JoinColumn({ name: 'module_id' })
      module: Module;
      ```

      Codigo a agregar en module.entity.ts:
      ```typescript
      @OneToMany(() => Exercise, exercise => exercise.module)
      exercises: Exercise[];
      ```
    archivo: "apps/backend/src/modules/educational/entities/exercise.entity.ts"
    archivo_relacionado: "apps/backend/src/modules/educational/entities/module.entity.ts"
    linea_aproximada: 55
    estado: "COMPLETED"
    sp: 2
    impacto: "Habilita eager loading de Module desde Exercise"

  - id: "1.2"
    nombre: "Implementar UserStats → Profile"
    descripcion: |
      Descomentar/agregar relacion @OneToOne de UserStats a Profile.

      FK DDL: user_stats_user_id_fkey (UNIQUE, CASCADE)

      Codigo a agregar en user-stats.entity.ts:
      ```typescript
      @OneToOne(() => Profile, { createForeignKeyConstraint: false })
      @JoinColumn({ name: 'user_id' })
      profile: Profile;
      ```

      Nota: createForeignKeyConstraint: false evita conflicto con FK existente
    archivo: "apps/backend/src/modules/gamification/entities/user-stats.entity.ts"
    linea_aproximada: 48
    estado: "COMPLETED"
    sp: 2
    impacto: "Habilita carga de Profile desde UserStats"

  - id: "1.3"
    nombre: "Implementar ModuleProgress relaciones"
    descripcion: |
      Agregar relaciones @ManyToOne de ModuleProgress a Profile y Module.

      FKs DDL:
      - module_progress_profile_id_fkey (CASCADE)
      - module_progress_module_id_fkey (CASCADE)

      Codigo a agregar en module-progress.entity.ts:
      ```typescript
      @ManyToOne(() => Profile)
      @JoinColumn({ name: 'user_id' })
      user: Profile;

      @ManyToOne(() => Module)
      @JoinColumn({ name: 'module_id' })
      module: Module;
      ```
    archivo: "apps/backend/src/modules/progress/entities/module-progress.entity.ts"
    estado: "COMPLETED"
    sp: 2
    impacto: "Dashboard puede cargar progreso con modulo y usuario relacionados"

  - id: "1.4"
    nombre: "Implementar ExerciseAttempt → Exercise"
    descripcion: |
      Agregar relacion @ManyToOne de ExerciseAttempt a Exercise.

      FK DDL: exercise_attempts_exercise_id_fkey (CASCADE)

      Codigo a agregar en exercise-attempt.entity.ts:
