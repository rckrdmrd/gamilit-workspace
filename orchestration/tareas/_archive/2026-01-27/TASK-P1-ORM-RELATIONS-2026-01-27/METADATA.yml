# Consideraciones tecnicas
consideraciones:
  eager_loading: |
    IMPORTANTE: Agregar relaciones con eager: false por defecto
    para evitar over-fetching. El eager loading debe ser explicito
    en las queries que lo necesiten.

    Ejemplo:
    @ManyToOne(() => Module, { eager: false })

  cascade_options: |
    No agregar cascade en el lado @ManyToOne ya que el DDL
    ya define ON DELETE CASCADE. Solo definir onDelete para
    documentacion.

  circular_imports: |
    Si hay error de circular imports, usar forwardRef:
    @ManyToOne(() => Module, module => module.exercises)

    O lazy import:
    @ManyToOne('Module', 'exercises')

