# Contenido ejemplo
contenido_ejemplo:
  objective: |
    Este ejercicio desarrolla la capacidad de identificar informacion
    explicita en el texto, una habilidad fundamental de comprension
    literal segun el modelo de Daniel Cassany. El estudiante aprendera
    a reconocer datos, hechos y detalles que el autor comunica
    directamente, sin necesidad de inferencia...

  how_to_solve: |
    1. Lee el texto completo una primera vez para tener una vision general
    2. Identifica las palabras clave de cada pregunta
    3. Busca en el texto las oraciones que contienen esas palabras
    4. Compara la informacion del texto con las opciones de respuesta
    5. Selecciona la opcion que coincide exactamente con lo que dice el texto
    ...

  recommended_strategy: |
    - Subraya las palabras clave mientras lees
    - No asumas informacion que no esta en el texto
    - Si dudas entre dos opciones, vuelve al texto
    ...

  pedagogical_notes: |
    Este ejercicio se alinea con el nivel "leer las lineas" del modelo
    Cassany. Es importante que el docente verifique que el estudiante
    distingue entre informacion explicita e implicita...

