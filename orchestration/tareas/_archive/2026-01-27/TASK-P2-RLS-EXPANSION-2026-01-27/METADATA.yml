# Descripcion
descripcion: |
  Expandir cobertura de Row Level Security (RLS) de 18% (25 tablas)
  a 50%+ (59 tablas). Implementada Fase 2 con 34 tablas adicionales.

  Schemas cubiertos en Fase 2:
  - gamification_system: 8 tablas (user_stats, user_achievements, ml_coins_transactions, etc.)
  - notifications: 4 tablas (notifications, notification_preferences, etc.)
  - communication: 1 tabla (messages)
  - progress_tracking: 8 tablas (learning_sessions, exercise_attempts, etc.)
  - social_features: 6 tablas (classroom_members, team_members, friendships, etc.)
  - audit_logging: 2 tablas (audit_logs, user_activity_logs)
  - auth_management: 4 tablas (user_preferences, user_sessions, etc.)
  - admin_dashboard: 1 tabla (bulk_operations)

  Gap cerrado: RLS-P1-001

# Subtareas
subtareas:
  - id: "2.1"
    nombre: "Inventariar tablas sin RLS"
    descripcion: |
      Listadas 77+ tablas sin RLS.
      Clasificadas por schema y criticidad.
      Identificadas tablas con user_id/student_id que requieren RLS.
    archivo_destino: "apps/database/ddl/07-enable-rls.sql"
    estado: "COMPLETED"
    sp: 2

  - id: "2.2"
    nombre: "Implementar RLS gamification_system"
    descripcion: |
      Implementadas politicas RLS para 8 tablas:
      - user_stats (ya tenia policies, habilitado RLS)
      - user_achievements (ya tenia policies, habilitado RLS)
      - ml_coins_transactions (ya tenia policies, habilitado RLS)
      - comodines_inventory (nuevas policies + RLS)
      - user_ranks (nuevas policies + RLS)
      - comodin_usage_log (nuevas policies + RLS)
      - comodin_usage_tracking (nuevas policies + RLS)
      - classroom_missions (nuevas policies + RLS)
    tablas:
      - "gamification_system.user_stats"
      - "gamification_system.user_achievements"
      - "gamification_system.ml_coins_transactions"
      - "gamification_system.comodines_inventory"
      - "gamification_system.user_ranks"
      - "gamification_system.comodin_usage_log"
      - "gamification_system.comodin_usage_tracking"
      - "gamification_system.classroom_missions"
    estado: "COMPLETED"
    sp: 3

  - id: "2.3"
    nombre: "Implementar RLS notifications"
    descripcion: |
      Implementadas politicas RLS para 4 tablas:
      - notifications (filtrar por user_id)
      - notification_preferences (filtrar por user_id)
      - notification_logs (solo admin)
      - user_devices (filtrar por user_id)
    tablas:
      - "notifications.notifications"
      - "notifications.notification_preferences"
      - "notifications.notification_logs"
      - "notifications.user_devices"
    estado: "COMPLETED"
    sp: 2

  - id: "2.4"
    nombre: "Implementar RLS communication"
    descripcion: |
      Implementadas politicas RLS para 1 tabla:
      - messages (sender_id o recipient_id o classroom_members)

      Nota: No existe tabla conversations, se usa messages+message_participants
    tablas:
      - "communication.messages"
    estado: "COMPLETED"
    sp: 2

  - id: "2.5"
    nombre: "Implementar RLS adicionales"
    descripcion: |
      Implementadas politicas RLS adicionales para:

      progress_tracking (8 tablas):
      - learning_sessions, exercise_attempts, exercise_submissions
      - scheduled_missions, user_difficulty_progress, module_progress
      - teacher_notes, certificates

      social_features (6 tablas):
      - classroom_members, team_members, friendships
      - team_challenges, social_interactions, classrooms

      audit_logging (2 tablas):
      - audit_logs, user_activity_logs

      auth_management (4 tablas):
      - user_preferences, user_sessions, security_events
      - email_verification_tokens

      admin_dashboard (1 tabla):
      - bulk_operations
    estado: "COMPLETED"
    sp: 2

  - id: "2.6"
    nombre: "Documentar implementacion"
    descripcion: |
      Creado archivo 07b-enable-rls-phase2.sql con:
      - 34 tablas con RLS habilitado
      - Comentarios documentando politicas
      - Total RLS ahora: 25 (Fase 1) + 34 (Fase 2) = 59 tablas
    estado: "COMPLETED"
    sp: 2

