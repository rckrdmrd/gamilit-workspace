# ============================================================================
# FKs PENDIENTES ORM - P1 (CRITICAS)
# ============================================================================

p1_criticas:

  - id: "ORM-P1-001"
    entity: "Exercise"
    fk_ddl: "module_id → modules(id)"
    estado: "FK existe, @ManyToOne falta"
    impacto: |
      Queries de ejercicios no hacen eager loading del modulo.
      Frontend hace request adicional para obtener modulo.
    solucion:
      archivo: "modules/educational/entities/exercise.entity.ts"
      agregar: |
        @ManyToOne(() => Module, module => module.exercises)
        @JoinColumn({ name: 'module_id' })
        module: Module;
    en_module_entity: |
      @OneToMany(() => Exercise, exercise => exercise.module)
      exercises: Exercise[];

  - id: "ORM-P1-002"
    entity: "UserStats"
    fk_ddl: "user_id → profiles(id)"
    estado: "FK existe, relacion comentada"
    impacto: |
      Stats de usuario no relacionados a perfil.
      Queries separadas para obtener datos completos.
    solucion:
      archivo: "modules/gamification/entities/user-stats.entity.ts"
      agregar: |
        @OneToOne(() => Profile, { createForeignKeyConstraint: false })
        @JoinColumn({ name: 'user_id' })
        profile: Profile;

  - id: "ORM-P1-003"
    entity: "ModuleProgress"
    fk_ddl: "user_id → profiles(id), module_id → modules(id)"
    estado: "FKs existen, relaciones parciales"
    impacto: |
      Progreso de modulo sin relacion a perfil.
      Dashboard requiere queries adicionales.
    solucion:
      archivo: "modules/progress/entities/module-progress.entity.ts"
      agregar: |
        @ManyToOne(() => Profile)
        @JoinColumn({ name: 'user_id' })
        user: Profile;

        @ManyToOne(() => Module)
        @JoinColumn({ name: 'module_id' })
        module: Module;

  - id: "ORM-P1-004"
    entity: "ExerciseAttempt"
    fk_ddl: "exercise_id → exercises(id)"
    estado: "FK existe, relacion falta"
    impacto: |
      Intentos no eager load ejercicio.
      Historial de intentos requiere query extra.
    solucion:
      archivo: "modules/progress/entities/exercise-attempt.entity.ts"
      agregar: |
        @ManyToOne(() => Exercise)
        @JoinColumn({ name: 'exercise_id' })
        exercise: Exercise;

