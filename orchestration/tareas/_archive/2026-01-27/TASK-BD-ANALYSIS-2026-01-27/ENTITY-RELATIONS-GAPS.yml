# ============================================================================
# SISTEMA DE ROLES - ANALISIS
# ============================================================================

sistema_roles:
  estado: "DUAL - Requiere consolidacion"

  implementacion_actual:
    enum_gamilit_role:
      ubicacion: "DDL 00-prerequisites.sql"
      valores: ["student", "admin_teacher", "super_admin"]
      usado_en: ["profiles.role", "User entity"]

    tabla_rbac:
      tabla: "auth_management.roles"
      registros: 3  # Mismos valores que ENUM
      tabla_asignacion: "auth_management.user_roles"

  problema: |
    Coexisten dos sistemas de roles:
    1. ENUM gamilit_role en Profile (simple)
    2. Tabla RBAC roles + user_roles (extensible)

    Ambos tienen los mismos 3 roles base.
    Backend usa principalmente el ENUM.
    Tabla RBAC preparada para roles custom.

  recomendacion:
    corto_plazo: "Mantener ENUM para roles base, RBAC para extensiones"
    largo_plazo: "Migrar completamente a RBAC si se requieren roles custom"
    prioridad: P3
    impacto: "Bajo - funcionalidad actual no afectada"

