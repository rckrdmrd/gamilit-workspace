# ==============================================================================
# INSTRUCCIONES DE USO
# ==============================================================================

instrucciones:
  para_navegar: |
    Usa los paths absolutos directamente con:
    - cat {path}
    - code {path}
    - Read tool con file_path: {path}

  para_validar: |
    Verifica existencia con:
    - ls -la {path}
    - test -f {path} && echo "existe"

  para_referencias_cruzadas: |
    Los archivos SSOT contienen referencias a:
    - EPIC-INDEX.yml -> directorio de cada EPIC
    - TRACEABILITY-MASTER.yml -> RF, ET, US por EPIC
    - CODE-MAPPINGS.yml -> codigo backend/frontend

  para_replicar_tarea: |
    1. Leer prompts/ para estructura de subagentes
    2. Adaptar paths a nuevo proyecto
    3. Usar METADATA.yml como template de ciclo CAPVED
