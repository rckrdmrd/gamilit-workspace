    story_points: 1
    capas_afectadas:
      - "frontend"
    descripcion: |
      Corrección de error crítico en NotificationDropdown.tsx:47.
      El componente crasheaba al renderizar porque notifDate.getTime()
      se llamaba sobre un objeto que no era instancia de Date.
      Fix: Cambiar typeof por instanceof para manejo correcto de fechas.

