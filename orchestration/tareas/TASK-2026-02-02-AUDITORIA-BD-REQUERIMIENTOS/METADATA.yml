  formato: |
    NIVEL 0: Tarea Principal (Esta tarea)
    └── NIVEL 1: Fases (5 fases principales)
        └── NIVEL 2: Subtareas (21 subtareas)
            └── NIVEL 3: Acciones atomicas (~65 acciones)
                └── NIVEL 4: Verificaciones puntuales

  resumen:
    fases: 5
    subtareas: 21
    acciones_atomicas: 65
    tiempo_estimado: "16-20 horas"

