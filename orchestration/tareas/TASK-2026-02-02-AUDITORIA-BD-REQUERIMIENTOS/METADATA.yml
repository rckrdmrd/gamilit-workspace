# ═══════════════════════════════════════════════════════════════════════════════
# METADATA - TASK-2026-02-02-AUDITORIA-BD-REQUERIMIENTOS
# ═══════════════════════════════════════════════════════════════════════════════

task_id: "TASK-2026-02-02-AUDITORIA-BD-REQUERIMIENTOS"
titulo: "Auditoria Integral del Modelo de BD vs Requerimientos"
tipo: "ANALYSIS"
prioridad: "P0"
estado: "en_progreso"
fecha_inicio: "2026-02-02"
fecha_fin_estimada: "2026-02-03"
version: "1.0.0"

# ─────────────────────────────────────────────────────────────────────────────────
# PERFIL DEL AGENTE
# ─────────────────────────────────────────────────────────────────────────────────

agente:
  rol: "Arquitecto de Datos / Lead DBA"
  capacidades:
    - Auditoria de modelos de datos
    - Analisis de trazabilidad DDL-Requerimientos
    - Deteccion de duplicidades y anomalias
    - Reconciliacion de inventarios
    - Validacion de dependencias entre objetos

# ─────────────────────────────────────────────────────────────────────────────────
# OBJETIVOS
# ─────────────────────────────────────────────────────────────────────────────────

objetivos:
  principal: |
    Realizar auditoria exhaustiva del modelo de base de datos de Gamilit,
    validando alineacion con requerimientos, detectando incoherencias,
    duplicidades y errores en objetos DDL (tablas, triggers, funciones, etc.)

  especificos:
    - Reconciliar discrepancias en inventarios (funciones: 232 vs 15 vs 89)
    - Validar trazabilidad DDL ↔ Requerimientos Funcionales (112 RF)
    - Detectar duplicidades en funciones, triggers y tablas
    - Identificar objetos huerfanos (sin trazabilidad a requerimientos)
    - Validar dependencias entre schemas y objetos
    - Purgar documentacion de tareas obsoletas
    - Crear plan de ejecucion ordenado por dependencias

# ─────────────────────────────────────────────────────────────────────────────────
# HALLAZGOS INICIALES CRITICOS
# ─────────────────────────────────────────────────────────────────────────────────

hallazgos_iniciales:
  criticos:
    - id: "HAL-001"
      tipo: "DISCREPANCIA_INVENTARIOS"
      severidad: "CRITICA"
      descripcion: |
        Discrepancias severas en conteos de objetos entre inventarios:
        - Funciones: DATABASE_INVENTORY=232, MASTER_INVENTORY=15, PROJECT-STATUS=89
        - Triggers: DATABASE_INVENTORY=109, MASTER_INVENTORY=10, PROJECT-STATUS=37
        - ENUMs: DATABASE_INVENTORY=39, MASTER_INVENTORY=36
      accion: "Reconciliar mediante auditoria real de DDL"

    - id: "HAL-002"
      tipo: "INCONSISTENCIA_TABLAS"
      severidad: "MEDIA"
      descripcion: |
        Conteo de tablas varia entre documentos:
        - DATABASE_INVENTORY: 141 (DDL files), 147 (DB validated), 134 (active)
        - MASTER_INVENTORY: 138
        - PROJECT-STATUS: 138-147
      accion: "Definir fuente unica de verdad (SSOT)"

# ─────────────────────────────────────────────────────────────────────────────────
# ESTRUCTURA DE SUBTAREAS (CAPVED en cada nivel)
# ─────────────────────────────────────────────────────────────────────────────────

