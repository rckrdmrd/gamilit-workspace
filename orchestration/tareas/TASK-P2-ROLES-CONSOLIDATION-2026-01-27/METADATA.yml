# Criterios de aceptacion
criterios_aceptacion:
  - "Sistema ENUM documentado completamente"
  - "Sistema RBAC documentado completamente"
  - "Opciones de consolidacion evaluadas"
  - "ADR creado con recomendacion clara"
  - "NO se implementan cambios de codigo"

# Consideraciones
consideraciones:
  migracion_datos: |
    Si se decide migrar a RBAC, considerar:
    - Mapeo de ENUM valores a roles RBAC
    - Migracion de datos existentes
    - Backward compatibility durante transicion

  breaking_changes: |
    Cambiar de ENUM a RBAC afectaria:
    - RLS policies (07-enable-rls.sql)
    - Auth guards (backend)
    - DTOs y tipos (frontend)

  recomendacion_preliminar: |
    OPCION C (Hibrido) parece la mas pragmatica:
    - Mantener ENUM para roles basicos (funciona)
    - Agregar RBAC para permisos granulares (futuro)
    - No hay breaking changes inmediatos

