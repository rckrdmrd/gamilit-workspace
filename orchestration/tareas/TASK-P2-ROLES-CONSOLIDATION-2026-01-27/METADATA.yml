modo: "@ANALYSIS"

# Identificacion
nombre: "Analizar y Planificar Consolidacion Sistema de Roles (ENUM vs RBAC)"
tipo: "ANALYSIS"
prioridad: "P2"
story_points: 5
origen: "TASK-BD-ANALYSIS-2026-01-27"

# Descripcion
descripcion: |
  Analizar la coexistencia de dos sistemas de roles y planificar consolidacion:

  Sistema 1 - ENUM (actual, en uso):
  - gamilit_role ENUM en auth_management.profiles
  - Valores: 'student', 'teacher', 'admin'
  - Usado en RLS y logica de negocio

  Sistema 2 - RBAC Tables (existente, subutilizado):
  - auth_management.roles (tabla)
  - auth_management.user_roles (tabla intermedia)
  - auth_management.permissions (tabla)
  - auth_management.role_permissions (tabla intermedia)

  Esta tarea es ANALISIS solamente. La implementacion sera en tarea separada.

  Gap identificado: ARCH-P2-001

# Subtareas
subtareas:
  - id: "2.1"
    nombre: "Documentar sistema ENUM actual"
    descripcion: |
      Documentar uso actual del ENUM gamilit_role:
      - Donde se usa en codigo backend
      - Donde se usa en RLS policies
      - Guards y decoradores que lo referencian
    estado: "PENDING"
    sp: 1

  - id: "2.2"
    nombre: "Documentar sistema RBAC tables"
    descripcion: |
      Documentar estado del sistema RBAC:
      - Estructura de tablas roles/permissions
      - Seeds existentes (si hay)
      - Codigo que lo referencia (si hay)
    estado: "PENDING"
    sp: 1

  - id: "2.3"
    nombre: "Analizar opciones de consolidacion"
    descripcion: |
      Evaluar opciones:

      Opcion A - Mantener ENUM (simple):
      - Pros: Funciona, rapido, simple
      - Cons: No extensible, hardcoded

      Opcion B - Migrar a RBAC (completo):
      - Pros: Flexible, permisos granulares
      - Cons: Migracion compleja, breaking changes

      Opcion C - Hibrido:
      - ENUM para roles basicos (backward compatible)
      - RBAC para permisos avanzados (futuro)
    estado: "PENDING"
    sp: 2

  - id: "2.4"
    nombre: "Crear ADR con recomendacion"
    descripcion: |
      Crear Architecture Decision Record con:
      - Contexto del problema
      - Opciones evaluadas
      - Decision recomendada
      - Consecuencias
    archivo_destino: "docs/97-adr/ADR-XXX-roles-system-consolidation.md"
    estado: "PENDING"
    sp: 1

# Archivos a analizar
archivos:
  ddl:
    - "apps/database/ddl/00-prerequisites.sql (gamilit_role ENUM)"
    - "apps/database/ddl/schemas/auth_management/tables/03-roles.sql"
