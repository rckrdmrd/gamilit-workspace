#
# Fix dependencias cross-schema en create-database.sh
# - classroom_modules table no se creaba (FK a social_features antes de FASE 9)
# - Seeds de classroom_modules no se cargaban
#
# ═══════════════════════════════════════════════════════════════════════════════

version: "1.0.0"
task_id: "TASK-016"

# ─────────────────────────────────────────────────────────────────────────────────
# IDENTIFICACIÓN
# ─────────────────────────────────────────────────────────────────────────────────

identificacion:
  titulo: "Fix database cross-schema dependencies - classroom_modules table"
  descripcion: |
    Corrección de bug crítico en create-database.sh donde la tabla
    educational_content.classroom_modules no se creaba correctamente.

    Problema:
    - classroom_modules tiene FK a social_features.classrooms
    - El DDL estaba en FASE 6 (educational_content) pero la dependencia (social_features)
      no se crea hasta FASE 9
    - Resultado: La tabla no se creaba y student portal no mostraba módulos

    Solución:
    1. Mover DDL a subdirectorio _cross_schema/ (excluido de carga automática)
    2. Agregar FASE 9.7 en create-database.sh para ejecutar tablas cross-schema
    3. Crear seed 14-classroom_modules.sql para asignar módulos al classroom DEFAULT
    4. Actualizar execute_sql_files para excluir _cross_schema/
  tipo: "bugfix"
  prioridad: "P0"
  tags:
    - "database"
    - "cross-schema"
    - "student-portal"
    - "create-database"
    - "foreign-key"

