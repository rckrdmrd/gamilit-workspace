# ─────────────────────────────────────────────────────────────────────────────────
# NOTAS Y LECCIONES APRENDIDAS
# ─────────────────────────────────────────────────────────────────────────────────

notas: |
  Bug descubierto durante investigación de TASK-014 cuando student portal
  no mostraba módulos. El análisis de impacto confirmó que los cambios de
  TASK-014 NO causaron el problema - era un bug pre-existente en el script
  de creación de base de datos.

  La tabla classroom_modules es especial porque tiene FKs a dos schemas:
  - educational_content.modules (FASE 6)
  - social_features.classrooms (FASE 9)

  Esto requiere que se ejecute DESPUÉS de ambas fases.

lecciones_aprendidas:
  - "Las tablas con FKs cross-schema deben ejecutarse después de todas las dependencias"
  - "Usar subdirectorio _cross_schema/ para aislar tablas con dependencias especiales"
  - "Siempre verificar que create-database.sh recrea la BD completa antes de hacer commit"
  - "El orden de ejecución de DDL en scripts debe seguir el grafo de dependencias FK"

