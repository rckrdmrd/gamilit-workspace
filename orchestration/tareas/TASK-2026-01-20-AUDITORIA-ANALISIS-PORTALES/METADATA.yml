estado: EN_PROGRESO
prioridad: P0

# Clasificacion
tipo: AUDITORIA
dominio:
  - frontend
  - backend
  - database
  - documentation

# Alcance
alcance:
  objetivo: |
    Realizar una auditoria exhaustiva de las tareas de analisis realizadas
    por multiples agentes en el proyecto gamilit, validando que cada pagina
    y componente haya sido correctamente analizado, documentado y que el
    modelado de base de datos sea coherente.

  entradas:
    - "Archivos de referencia de 4 tareas anteriores"
    - "Codigo fuente frontend (3 portales, 69 paginas)"
    - "Codigo fuente backend (17 modulos, 84 controllers)"
    - "Base de datos (16 schemas, 142 tablas)"

  salidas:
    - "Reporte de auditoria por portal"
    - "Mapa de cobertura de analisis"
    - "GAPs identificados"
    - "Plan de remediacion"

# Metodologia
metodologia: CAPVED
fases:
  - fase: CONTEXTO
    estado: COMPLETADO
    descripcion: "Carga de archivos de referencia y mapeo de estructura"

  - fase: ANALISIS
    estado: EN_PROGRESO
    descripcion: "Comparacion de lo documentado vs lo existente en codigo"

  - fase: PLANEACION
    estado: EN_PROGRESO
    descripcion: "Creacion de plan de auditoria con subtareas CAPVED"

  - fase: VALIDACION
    estado: PENDIENTE
    descripcion: "Ejecucion de auditorias por portal"

  - fase: EJECUCION
    estado: PENDIENTE
    descripcion: "Verificacion exhaustiva de cada componente"

  - fase: DOCUMENTACION
    estado: PENDIENTE
    descripcion: "Consolidacion de hallazgos y reporte final"

# Metricas objetivo
metricas_objetivo:
  paginas_a_auditar: 69
  controllers_a_auditar: 84
  entities_a_auditar: 126
  tablas_a_auditar: 142
  coherencia_minima: 95%

