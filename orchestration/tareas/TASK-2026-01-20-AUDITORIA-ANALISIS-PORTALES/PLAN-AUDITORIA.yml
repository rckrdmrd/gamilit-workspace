    - fase: "FASE-0"
      nombre: "Contexto y Setup"
      descripcion: "Cargar contexto y crear estructura de auditoria"
      subtareas:
        - id: "T0.1"
          titulo: "Crear carpeta de tarea con estructura SIMCO"
          perfil: "@PERFIL_ORQUESTADOR"
          estado: "COMPLETADO"

        - id: "T0.2"
          titulo: "Mapear estado actual de documentacion"
          perfil: "@PERFIL_DOCUMENTATION"
          estado: "PENDIENTE"

    # FASE 1: AUDITORIA STUDENT PORTAL
    - fase: "FASE-1"
      nombre: "Auditoria Student Portal"
      prioridad: "P0"
      subtareas:
