# METADATA.yml - TASK-2026-01-19-013
# Fix TypeORM Cross-Datasource Relations Error
# Version: 1.0.0

task:
  id: "TASK-2026-01-19-013"
  title: "Fix TypeORM Cross-Datasource Entity Metadata Error"
  created: "2026-01-19"
  updated: "2026-01-19"

classification:
  type: "bug-fix"
  priority: "P0"
  mode: "QUICK"
  epic: "TYPEORM-DATASOURCE-FIX"
  parent_task: null

status:
  current: "completed"
  phase: "D"
  completion_percentage: 100

context:
  origen: |
    Error critico al ejecutar backend:
    - TypeORMError: Entity metadata for Classroom#tenant was not found
    - TypeORMError: Entity metadata for Classroom#school was not found

    Causa: Las relaciones @ManyToOne agregadas en FIX-2026-01-19 (TASK-2026-01-19-001)
    referencian entidades (Tenant, Profile) que no estaban registradas en el
    datasource 'social'.

problema:
  descripcion: |
    TypeORM con multiples datasources requiere que TODAS las entidades
    referenciadas en relaciones esten registradas en el MISMO datasource.

    Entidades afectadas en datasource 'social':
    - Classroom: @ManyToOne(() => Tenant), @ManyToOne(() => Profile)
    - TeacherClassroom: @ManyToOne(() => Tenant), @ManyToOne(() => Profile)
    - ClassroomMember: @ManyToOne(() => Profile) x2

  error: |
    TypeORMError: Entity metadata for Classroom#tenant was not found.
    Check if you specified a correct entity object and if it's connected
    in the connection options.

solucion:
  descripcion: "Agregar Profile y Tenant al datasource 'social' en app.module.ts"
  archivos_modificados:
    - path: "apps/backend/src/app.module.ts"
      cambio: |
        Agregado al datasource 'social':
        - __dirname + '/modules/auth/entities/profile.entity{.ts,.js}'
        - __dirname + '/modules/auth/entities/tenant.entity{.ts,.js}'
      fix_id: "FIX-BE-012-2026-01-19"

directiva_creada:
  nombre: "TRIGGER-TYPEORM-CROSS-DATASOURCE"
  path: "orchestration/directivas/triggers/TRIGGER-TYPEORM-CROSS-DATASOURCE.md"
  proposito: "Prevenir errores de metadata en relaciones cross-datasource"

