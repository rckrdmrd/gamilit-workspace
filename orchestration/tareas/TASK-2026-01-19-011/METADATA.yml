context:
  origen: |
    Durante análisis de cierre inesperado, se identificó que TASK-2026-01-18-015 tiene
    14 GAPs documentados en 01-GAPS-IDENTIFICADOS.md con ~108 horas de trabajo estimado.

    El METADATA de esa tarea indica que los 5 Sprints están "completados" pero con la nota
    "Verificado que implementación ya existía" - esto requiere validación manual para
    confirmar que los GAPs realmente están resueltos.

  gaps_a_validar:
    criticos:
      - id: "G1"
        descripcion: "MasteryTracking No Conectado a Reportes"
        archivo_validar: "apps/backend/src/modules/teacher/services/analytics.service.ts"
        buscar: "getMasteryData() o uso de masteryTrackingRepo"
        esfuerzo_si_falta: "8h"

      - id: "G2"
        descripcion: "SkillAssessment Aislado"
        archivo_validar: "apps/backend/src/modules/teacher/services/analytics.service.ts"
        buscar: "getSkillAssessments() o uso de skillAssessmentRepo"
        esfuerzo_si_falta: "12h"

      - id: "G3"
        descripcion: "No Rollback en Transacciones de Coins"
        archivo_validar: "apps/backend/src/modules/gamification/services/ml-coins.service.ts"
        buscar: "dataSource.transaction o EntityManager"
        esfuerzo_si_falta: "6h"

    medios:
      - id: "G4"
        descripcion: "Filtrado Temporal No Funcional"
        archivo_validar: "apps/backend/src/modules/teacher/services/reports.service.ts"
        buscar: "start_date, end_date, Between() en queries"
        esfuerzo_si_falta: "4h"

      - id: "G5"
        descripcion: "EngagementMetrics Sin Frecuencia Clara"
        archivo_validar: "apps/backend/src/modules/progress/services/"
        buscar: "EngagementMetricsService o @Cron para métricas"
        esfuerzo_si_falta: "8h"

      - id: "G6"
        descripcion: "UserAchievement Rewards Async"
        archivo_validar: "apps/backend/src/modules/gamification/"
        buscar: "auto-claim o job de reconciliación"
        esfuerzo_si_falta: "4h"

    menores:
      - id: "G9"
        descripcion: "Scheduled Reports No Implementado"
        archivo_validar: "apps/database/ddl/schemas/social_features/tables/"
        buscar: "scheduled_reports.sql o report_schedules"
        esfuerzo_si_falta: "24h"

      - id: "G10"
        descripcion: "No Automatic Session Cleanup"
        archivo_validar: "apps/backend/src/modules/progress/services/"
        buscar: "SessionCleanupService o @Cron para sesiones"
        esfuerzo_si_falta: "2h"

      - id: "G12"
        descripcion: "File Size Not Shown"
        archivo_validar: "apps/frontend/src/apps/teacher/pages/TeacherReportsPage.tsx"
        buscar: "fileSizeBytes o formatFileSize"
        esfuerzo_si_falta: "1h"

      - id: "G13"
        descripcion: "No Report Deletion UI"
        archivo_validar: "apps/frontend/src/apps/teacher/pages/TeacherReportsPage.tsx"
        buscar: "handleDeleteReport o deleteReport"
        esfuerzo_si_falta: "2h"

      - id: "G14"
        descripcion: "No Report Sharing"
        archivo_validar: "apps/database/ddl/schemas/social_features/tables/"
        buscar: "shared_reports.sql o report_sharing"
        esfuerzo_si_falta: "16h"

