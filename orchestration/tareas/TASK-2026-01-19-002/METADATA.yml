# =============================================================================
# CONTEXTO (FASE C)
# =============================================================================

context:
  description: |
    Al visualizar el detalle de un estudiante en teacher/monitoring,
    el modal StudentDetailModal no muestra ningún dato (progress, stats, notes).

    El problema se manifiesta porque las llamadas a los endpoints devuelven
    404 Not Found o datos vacíos.

  problema_reportado: |
    Usuario navega a /teacher/monitoring
    Hace click en tarjeta de estudiante
    StudentDetailModal se abre pero todas las secciones están vacías:
    - Gamification Stats: vacío
    - Progress by Module: vacío
    - Teacher Notes: vacío

  root_cause: |
    **CAUSA RAIZ IDENTIFICADA:**

    Discrepancia de IDs entre capas:

    1. ClassroomMember.student_id → FK a profiles.id (PK de profiles)
    2. StudentInClassroomDto.user_id → se mapea desde member.student_id → ES profiles.id
    3. Frontend envía student.id (que viene de user_id) → ES profiles.id

    4. PERO student-progress.service.ts busca:
       `profileRepository.findOne({ where: { user_id: studentId } })`

       user_id en Profile es FK a auth.users.id (NO es profiles.id)

    **RESULTADO:** La query no encuentra el profile porque busca por el campo equivocado.

    **FIX REQUERIDO:** Cambiar búsqueda de `user_id: studentId` a `id: studentId`

