# ============================================================================
# HOOKS ESPECÍFICOS DEL ADMIN PORTAL
# ============================================================================
admin_hooks:
  useAdminDashboard:
    file: "features/admin/hooks/useAdminDashboard.ts"
    provides:
      - systemStats
      - activeUsers
      - recentActivity
    api_calls:
      - "GET /admin/dashboard/stats"
      - "GET /admin/dashboard/activity"

  useSystemMetrics:
    file: "features/admin/hooks/useSystemMetrics.ts"
    provides:
      - cpuUsage
      - memoryUsage
      - activeConnections
      - errorRate
    api_calls:
      - "GET /admin/metrics/system"

  useAdminUsers:
    file: "features/admin/hooks/useAdminUsers.ts"
    provides:
      - users
      - searchUsers
      - createUser
      - updateUser
      - deleteUser
      - bulkActions
    api_calls:
      - "GET /admin/users"
      - "POST /admin/users"
      - "PUT /admin/users/:id"
      - "DELETE /admin/users/:id"
      - "POST /admin/users/bulk"

  useRoles:
    file: "features/admin/hooks/useRoles.ts"
    provides:
      - roles
      - createRole
      - updateRole
      - assignPermissions
    api_calls:
      - "GET /admin/roles"
      - "POST /admin/roles"
      - "PUT /admin/roles/:id/permissions"

  useInstitutions:
    file: "features/admin/hooks/useInstitutions.ts"
    provides:
      - institutions
      - createInstitution
      - updateInstitution
      - institutionStats
    api_calls:
      - "GET /admin/institutions"
      - "POST /admin/institutions"
      - "GET /admin/institutions/:id/stats"

  useGlobalAnalytics:
    file: "features/admin/hooks/useGlobalAnalytics.ts"
    provides:
      - globalStats
      - institutionComparison
      - trends
    api_calls:
      - "GET /admin/analytics/global"
      - "GET /admin/analytics/comparison"

  useGamificationConfig:
    file: "features/admin/hooks/useGamificationConfig.ts"
    provides:
      - parameters
      - updateParameter
      - rankConfig
      - achievementConfig
    api_calls:
      - "GET /admin/gamification/config"
      - "PUT /admin/gamification/config"

  useFeatureFlags:
    file: "features/admin/hooks/useFeatureFlags.ts"
    provides:
      - flags
      - toggleFlag
      - createFlag
      - flagHistory
    api_calls:
      - "GET /admin/feature-flags"
      - "PUT /admin/feature-flags/:id"

  useSystemMonitoring:
    file: "features/admin/hooks/useSystemMonitoring.ts"
    provides:
      - healthStatus
      - resourceUsage
      - activeServices
    api_calls:
      - "GET /admin/monitoring/health"
      - "GET /admin/monitoring/resources"

  useAuditLogs:
    file: "features/admin/hooks/useAuditLogs.ts"
    provides:
      - logs
      - searchLogs
      - exportLogs
    api_calls:
      - "GET /admin/audit-logs"
      - "GET /admin/audit-logs/export"

  useSystemSettings:
    file: "features/admin/hooks/useSystemSettings.ts"
    provides:
      - settings
      - updateSettings
      - resetToDefault
    api_calls:
      - "GET /admin/settings"
      - "PUT /admin/settings"

