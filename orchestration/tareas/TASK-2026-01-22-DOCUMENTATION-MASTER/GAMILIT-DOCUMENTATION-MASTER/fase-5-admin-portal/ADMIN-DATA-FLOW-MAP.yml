# ============================================================================
# FLUJO DE DATOS TÍPICO
# ============================================================================
typical_flows:
  - name: "Gestión de usuarios"
    steps:
      1: "AdminUsersPage: useAdminUsers()"
      2: "Render UserDataTable with pagination"
      3: "User clicks 'Edit'"
      4: "UserEditModal opens with user data"
      5: "Submit changes via updateUser()"
      6: "Table refreshes"

  - name: "Configurar feature flag"
    steps:
      1: "AdminAdvancedPage: useFeatureFlags()"
      2: "FeatureFlagsManager lists all flags"
      3: "Admin toggles a flag"
      4: "toggleFlag() → PUT /admin/feature-flags/:id"
      5: "Change propagates to all services"

  - name: "Generar reporte global"
    steps:
      1: "AdminReportsPage: Select report type"
      2: "Configure parameters (date range, institutions)"
      3: "useAdminReports.generateReport()"
      4: "Report generated in background"
      5: "Download available via exportReport()"

