# ─────────────────────────────────────────────────────────────────────────────────
# ALCANCE
# ─────────────────────────────────────────────────────────────────────────────────

alcance:
  nivel: "proyecto"
  proyecto: "gamilit"
  ubicacion_determinada:
    resultado: "proyecto"
    razon: "Afecta SOLO código y documentación de gamilit"
    criterio_aplicado: "SIMCO-UBICACION-DOCUMENTACION §2.2"
  capas_afectadas:
    - "backend"
    - "orchestration"

# ─────────────────────────────────────────────────────────────────────────────────
# CONTEXTO
# ─────────────────────────────────────────────────────────────────────────────────

contexto:
  origen: "Auditoría integral de documentación GAMILIT solicitada por usuario"
  problema: |
    Durante la auditoría se detectaron 7 tablas DDL sin entities TypeORM:
    - progress_tracking.user_current_level
    - progress_tracking.user_difficulty_progress
    - progress_tracking.module_completion_tracking
    - educational_content.content_metadata
    - educational_content.module_dependencies
    - educational_content.taxonomies
    - gamification_system.comodin_usage_tracking

    Coherencia DDL-Entity inicial: 94.3% (133/141 tablas)
  objetivo: "Alcanzar 100% coherencia DDL-Entity para las tablas identificadas"
  documentos_relacionados:
    - "orchestration/inventarios/MASTER_INVENTORY.yml"
    - "orchestration/inventarios/BACKEND_INVENTORY.yml"
    - "apps/database/ddl/schemas/*/tables/*.sql"

# ─────────────────────────────────────────────────────────────────────────────────
# ANÁLISIS
# ─────────────────────────────────────────────────────────────────────────────────

analisis:
  objetos_impactados:
    backend:
      entities_creadas:
        - path: "src/modules/progress/entities/user-current-level.entity.ts"
          tabla_ddl: "progress_tracking.user_current_level"
          descripcion: "Nivel actual del usuario (denormalizado para performance)"
        - path: "src/modules/progress/entities/user-difficulty-progress.entity.ts"
          tabla_ddl: "progress_tracking.user_difficulty_progress"
          descripcion: "Progreso por nivel de dificultad CEFR"
        - path: "src/modules/progress/entities/module-completion-tracking.entity.ts"
          tabla_ddl: "progress_tracking.module_completion_tracking"
          descripcion: "Seguimiento detallado de completitud de módulos"
        - path: "src/modules/educational/entities/content-metadata.entity.ts"
          tabla_ddl: "educational_content.content_metadata"
          descripcion: "Metadatos adicionales para contenido educativo"
        - path: "src/modules/educational/entities/module-dependencies.entity.ts"
          tabla_ddl: "educational_content.module_dependencies"
          descripcion: "Dependencias entre módulos (prerrequisitos)"
        - path: "src/modules/educational/entities/taxonomy.entity.ts"
          tabla_ddl: "educational_content.taxonomies"
          descripcion: "Taxonomías educativas (Bloom, SOLO, Webb, custom)"
        - path: "src/modules/gamification/entities/comodin-usage-tracking.entity.ts"
          tabla_ddl: "gamification_system.comodin_usage_tracking"
          descripcion: "Tracking de uso de comodines por intento"
      index_actualizados:
        - "src/modules/progress/entities/index.ts"
        - "src/modules/educational/entities/index.ts"
        - "src/modules/gamification/entities/index.ts"

  validaciones_ddl:
    - entity: "user-current-level"
      cambios: "PrimaryColumn(user_id), current_level varchar(50)"
      coherencia: "100%"
    - entity: "user-difficulty-progress"
      cambios: "Composite PK (user_id, difficulty_level)"
      coherencia: "100%"
    - entity: "module-completion-tracking"
      cambios: "UNIQUE constraint, indexes"
      coherencia: "100%"
    - entity: "content-metadata"
      cambios: "UNIQUE(content_type, content_id, metadata_key), JSONB"
      coherencia: "100%"
    - entity: "module-dependencies"
      cambios: "dependency_type enum, minimum_completion_percentage"
      coherencia: "100%"
    - entity: "taxonomy"
      cambios: "levels JSONB, taxonomy_type (bloom/solo/webb/custom)"
      coherencia: "100%"
    - entity: "comodin-usage-tracking"
      cambios: "Per-attempt tracking, límites de comodines"
      coherencia: "100%"

# ─────────────────────────────────────────────────────────────────────────────────
# EJECUCIÓN
# ─────────────────────────────────────────────────────────────────────────────────

