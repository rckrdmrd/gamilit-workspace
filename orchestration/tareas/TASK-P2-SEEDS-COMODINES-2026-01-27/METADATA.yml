# Descripcion
descripcion: |
  Implementar seeds para el sistema de comodines (power-ups):
  - comodines_inventory: Inventario de comodines por usuario
  - comodin_usage_tracking: Historial de uso de comodines

  El sistema de comodines es parte core de la gamificacion:
  - pistas: Pistas Contextuales (15 ML Coins)
  - vision_lectora: Vision Lectora (25 ML Coins)
  - segunda_oportunidad: Segunda Oportunidad (40 ML Coins)

  Gap identificado: SEED-P2-001

# Subtareas
subtareas:
  - id: "2.1"
    nombre: "Verificar estructura tablas comodines"
    descripcion: |
      Leer DDL para verificar campos de:
      - gamification_system.comodines_inventory
      - gamification_system.comodin_usage_tracking
    archivos:
      - "apps/database/ddl/schemas/gamification_system/tables/07-comodines_inventory.sql"
      - "apps/database/ddl/schemas/gamification_system/tables/08-comodin_usage_tracking.sql"
    estado: "COMPLETED"
    sp: 1

  - id: "2.2"
    nombre: "Crear seed comodines_inventory dev"
    descripcion: |
      Crear seed con inventario inicial para usuarios de prueba:
      - Cada estudiante inicia con 3 de cada comodin
      - Profesores tienen comodines ilimitados (99)
      - Variar cantidades segun nivel del usuario
    archivo_destino: "apps/database/seeds/dev/gamification_system/08-comodines_inventory.sql"
    datos_ejemplo:
      - user: "estudiante_1"
        pistas: 5
        vision_lectora: 3
        segunda_oportunidad: 2
      - user: "estudiante_2"
        pistas: 3
        vision_lectora: 3
        segunda_oportunidad: 3
    estado: "COMPLETED"
    nota: "Seed ya existia (09-comodines_inventory.sql)"
    sp: 2

  - id: "2.3"
    nombre: "Crear seed comodin_usage_tracking dev"
    descripcion: |
      Crear seed con historial de uso de comodines:
      - 10+ registros de uso variados
      - Diferentes comodines, ejercicios, fechas
      - Incluir casos exitosos y fallidos
    archivo_destino: "apps/database/seeds/dev/gamification_system/15-comodin_usage_tracking.sql"
    estado: "COMPLETED"
    sp: 1

  - id: "2.4"
    nombre: "Crear seed comodines_inventory prod"
    descripcion: |
      Version minima para produccion:
      - Solo configuracion base
      - Usuarios reales reciben comodines al registrarse
    archivo_destino: "apps/database/seeds/prod/gamification_system/08-comodines_inventory.sql"
    estado: "COMPLETED"
    nota: "Seed ya existia (09-comodines_inventory.sql) + creado 15-comodin_usage_tracking.sql"
    sp: 1

