# =============================================================================
# DESCRIPCION DEL PROBLEMA
# =============================================================================

problem_description: |
  El combo de seleccion de clases en la pagina Teacher/Progress no funciona correctamente:

  1. Solo existe UNA clase (DEFAULT) en el sistema
  2. La opcion "Todas las clases" no muestra datos correctos - pide seleccionar una clase
  3. Existe un mismatch de nombres de campos entre backend y frontend para ClassroomStats
     - Backend: avg_score, avg_attendance, avg_progress
     - Frontend: average_score, engagement_rate

  Este mismatch causa que las estadisticas agregadas muestren 0 o undefined.

# =============================================================================
# HALLAZGOS
# =============================================================================

findings:
  mismatch_campos:
    - field: "avg_score vs average_score"
      backend: "ClassroomStatsDto.avg_score"
      frontend: "ClassroomStats.average_score"
      impact: "Stats muestran 0"

    - field: "avg_attendance vs engagement_rate"
      backend: "ClassroomStatsDto.avg_attendance"
      frontend: "ClassroomStats.engagement_rate"
      impact: "Engagement rate undefined"

  comportamiento_all:
    - "Tab Progress muestra 'Selecciona una clase' cuando all esta seleccionado"
    - "Tab Engagement tambien pide seleccionar clase especifica"
    - "Las stats cards superiores si muestran datos agregados"

  seeds:
    - "Solo existe 1 classroom en seeds: GAMILIT - Aula General (DEFAULT)"
    - "Filtro por clase tiene poco sentido con solo 1 opcion"

# =============================================================================
# SOLUCIONES PROPUESTAS
# =============================================================================

proposed_solutions:
  solution_1:
    title: "Corregir mismatch de campos en frontend"
    priority: "P0"
    effort: "1h"
    approach: "Modificar useClassroomsStats para mapear nombres de backend"
    files:
      - "apps/frontend/src/apps/teacher/hooks/useClassroomsStats.ts"

  solution_2:
    title: "Auto-seleccionar unica clase cuando solo hay 1"
    priority: "P1"
    effort: "30m"
    approach: "En TeacherProgressPage, si classrooms.length === 1, auto-seleccionar"
    files:
      - "apps/frontend/src/apps/teacher/pages/TeacherProgressPage.tsx"

  solution_3:
    title: "Mejorar UX de 'Todas las clases'"
    priority: "P2"
    effort: "2h"
    approach: "Mostrar datos agregados en vez de mensaje 'Selecciona una clase'"
    files:
      - "apps/frontend/src/apps/teacher/pages/TeacherProgressPage.tsx"

# =============================================================================
