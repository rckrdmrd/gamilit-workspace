execution_plan:
  fase_1:
    title: "Fix mismatch campos"
    subtasks:
      - "Modificar useClassroomsStats para mapear avg_score -> average_score"
      - "Mapear avg_attendance o avg_progress a engagement_rate"
      - "Validar que stats cards muestren datos correctos"

  fase_2:
    title: "Auto-seleccion de clase unica"
    subtasks:
      - "Detectar cuando solo hay 1 classroom"
      - "Auto-seleccionar en lugar de mostrar 'all'"
      - "Ocultar opcion 'Todas las clases' cuando solo hay 1"

