plan_correccion:

  fase_1_critico:
    prioridad: "P0"
    tiempo_estimado: "30 minutos"

    tareas:
      - id: "CORR-001"
        titulo: "Crear ENUM content_status"
        archivo_crear: "apps/database/ddl/schemas/content_management/enums/content_status.sql"
        contenido: |
          CREATE TYPE content_management.content_status AS ENUM (
              'draft',
              'published',
              'archived',
              'under_review'
          );

          COMMENT ON TYPE content_management.content_status IS
          'Estados del ciclo de vida del contenido. Usado en marie_curie_content y otras tablas de contenido.';

      - id: "CORR-002"
        titulo: "Verificar y aplicar ENUM content_status en BD"
        comando: "psql -d gamilit -f apps/database/ddl/schemas/content_management/enums/content_status.sql"
        validacion: "SELECT typname, nspname FROM pg_type t JOIN pg_namespace n ON t.typnamespace = n.oid WHERE typname = 'content_status';"

