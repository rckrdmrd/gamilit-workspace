        impacto: "Queries a marie_curie_content fallarán si usan status"

      - factor: "Referencias DDL incorrectas"
        riesgo: "BAJO"
        impacto: "Solo documentación - no afecta runtime"

      - factor: "Query directo en leaderboard"
        riesgo: "MEDIO"
        impacto: "Más difícil de mantener y testear"

  siguiente_pasos:
    - paso: "1. Ejecutar FASE 1 - Crear content_status ENUM"
      tiempo: "30 min"

    - paso: "2. Ejecutar FASE 2 - Actualizar referencias DDL críticas"
      tiempo: "20 min"

    - paso: "3. Ejecutar FASE 3 - Actualizar referencias DDL medias"
      tiempo: "30 min"

    - paso: "4. Planificar FASE 4 - Refactoring leaderboard"
      tiempo: "45 min"

    - paso: "5. Testing completo post-correcciones"
      tiempo: "1 hora"

