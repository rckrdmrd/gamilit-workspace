  - id: "HAL-009"
    archivo: "apps/backend/src/modules/gamification/services/leaderboard.service.ts"
    linea: 280-289
    tipo: "QUERY"
    severidad: "MEDIO"
    categoria: "Query SQL directo"
    problema: "Query directo a social_features.classroom_members sin usar entity"
    referencia_actual: |
      const classroomMembersQuery = `
        SELECT student_id as user_id
        FROM social_features.classroom_members
        WHERE classroom_id = $1
      `;
      const classroomMembers = await this.userStatsRepo.query(
        classroomMembersQuery,
        [classroomId],
      );
    referencia_correcta: "Usar ClassroomMember entity con QueryBuilder"
    impacto: "Código menos mantenible - no usa TypeORM entities"
    accion_requerida: |
      Refactorizar para usar ClassroomMember entity:
      1. Importar ClassroomMember entity
      2. Inyectar ClassroomMemberRepository
      3. Usar createQueryBuilder() en lugar de query directo
    codigo_sugerido: |
      // En constructor
      @InjectRepository(ClassroomMember, 'social')
      private readonly classroomMemberRepo: Repository<ClassroomMember>,

      // En getClassroomLeaderboard()
      const classroomMembers = await this.classroomMemberRepo
        .createQueryBuilder('cm')
        .select(['cm.student_id'])
        .where('cm.classroom_id = :classroomId', { classroomId })
        .getRawMany();

      const userIds = classroomMembers.map(m => m.cm_student_id);

