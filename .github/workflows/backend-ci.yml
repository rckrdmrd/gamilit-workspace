name: Backend CI

on:
  push:
    branches:
      - master
    paths:
      - 'apps/backend/**'
      - 'apps/database/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'apps/backend/**'
      - 'apps/database/**'
      - '.github/workflows/backend-ci.yml'

env:
  NODE_VERSION: '20'
  POSTGRES_VERSION: '15'

jobs:
  # Job 1: Linting and Code Quality
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run ESLint
        working-directory: apps/backend
        run: npm run lint

      - name: Check code formatting (Prettier)
        working-directory: apps/backend
        run: npm run format -- --check

  # Job 2: TypeScript Type Checking
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run TypeScript compilation
        working-directory: apps/backend
        run: npm run build

  # Job 3: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gamilit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run unit tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gamilit_test
          NODE_ENV: test
        run: npm test

      - name: Generate coverage report
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gamilit_test
          NODE_ENV: test
        run: npm run test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/backend/coverage/coverage-final.json
          flags: backend
          name: backend-coverage
        continue-on-error: true

  # Job 4: Build
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, type-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Build application
        working-directory: apps/backend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: backend-dist-${{ github.sha }}
          path: apps/backend/dist/
          retention-days: 7

  # Job 5a: Migration Detection (DBOPS-005)
  # DDL-First enforcement: fails if any TypeORM migration patterns are found.
  # gamilit manages schema via apps/database/ddl/ — migrations are forbidden.
  migration-detection:
    name: DDL-First Migration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run migration detection check
        run: |
          chmod +x apps/database/scripts/check-no-migrations.sh
          bash apps/database/scripts/check-no-migrations.sh --verbose

      - name: Report architecture compliance
        if: success()
        run: |
          echo "## DDL-First Architecture Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No TypeORM migration patterns detected." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Schema changes are managed via:" >> $GITHUB_STEP_SUMMARY
          echo "- \`apps/database/ddl/schemas/\` (DDL source files)" >> $GITHUB_STEP_SUMMARY
          echo "- \`apps/database/scripts/recreate-database.sh\` (apply DDL)" >> $GITHUB_STEP_SUMMARY

  # Job 5: Database Schema Validation
  database-validation:
    name: Database Schema Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gamilit_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate DDL scripts
        working-directory: apps/database
        run: |
          echo "## 🗄️ Database Schema Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checking DDL file structure..." >> $GITHUB_STEP_SUMMARY
          find ddl/schemas -name "*.sql" | wc -l >> $GITHUB_STEP_SUMMARY
          echo " DDL files found" >> $GITHUB_STEP_SUMMARY

      - name: Check for SQL syntax errors
        working-directory: apps/database
        run: |
          # Basic SQL syntax validation
          for file in $(find ddl/schemas -name "*.sql"); do
            if grep -q "syntax error" "$file" 2>/dev/null; then
              echo "⚠️ Potential syntax error in $file"
            fi
          done

  # Job 6: API Documentation Check
  # Validates that Swagger/OpenAPI decorators are present in controllers
  # and that the NestJS build succeeds with Swagger module loaded.
  api-docs-check:
    name: API Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Verify Swagger decorators in controllers
        working-directory: apps/backend
        run: |
          echo "## API Documentation Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count controllers and Swagger-decorated controllers
          TOTAL_CONTROLLERS=$(find src -name "*.controller.ts" -not -path "*/node_modules/*" | wc -l)
          SWAGGER_CONTROLLERS=$(grep -rl "@ApiTags\|@ApiOperation\|@ApiResponse" src --include="*.controller.ts" | wc -l)
          SWAGGER_DECORATORS=$(grep -r "@ApiTags\|@ApiOperation\|@ApiResponse\|@ApiParam\|@ApiBody\|@ApiQuery\|@ApiBearerAuth" src --include="*.controller.ts" | wc -l)

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total controllers | $TOTAL_CONTROLLERS |" >> $GITHUB_STEP_SUMMARY
          echo "| Controllers with Swagger | $SWAGGER_CONTROLLERS |" >> $GITHUB_STEP_SUMMARY
          echo "| Swagger decorators total | $SWAGGER_DECORATORS |" >> $GITHUB_STEP_SUMMARY

          # Fail if less than 80% of controllers have Swagger decorators
          if [ "$TOTAL_CONTROLLERS" -gt 0 ]; then
            COVERAGE=$((SWAGGER_CONTROLLERS * 100 / TOTAL_CONTROLLERS))
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Swagger coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
            if [ "$COVERAGE" -lt 80 ]; then
              echo "::warning::Swagger coverage is ${COVERAGE}% (threshold: 80%)"
            fi
          fi

  # Job 7: Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Run npm audit
        working-directory: apps/backend
        run: npm audit --production --audit-level=high

      - name: Check for environment variables
        working-directory: apps/backend
        run: |
          if [ -f ".env" ]; then
            echo "⚠️ Warning: .env file exists (should be gitignored)"
          fi
          if [ ! -f ".env.example" ]; then
            echo "⚠️ Warning: .env.example is missing"
          fi

  # Job 8: Cache Performance Test — REMOVED
  # Was a placeholder outputting static strings. Cache validation requires a
  # running Redis instance and app bootstrap, which is better tested via
  # integration/smoke tests. Revisit when Redis service is added to CI.

  # Job 9: Report Summary
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, unit-tests, build, migration-detection, database-validation, api-docs-check, security-audit]
    if: always()

    steps:
      - name: Generate CI Summary
        run: |
          echo "# 🎯 Backend CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Detection | ${{ needs.migration-detection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Validation | ${{ needs.database-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Docs Check | ${{ needs.api-docs-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
