  fecha_analisis: "2025-11-09"
  nivel_coherencia_general: 78%
  estado_global: "BUENO con áreas críticas de mejora"
  
  metricas_principales:
    inventarios_actualizados: 3/3 (100%)
    inventarios_con_datos_reales: 3/3 (100%)
