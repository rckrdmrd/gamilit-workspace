problemas_criticos:
  total: 7
  
  detalle:
    - id: PC-01
      titulo: "ORM documentado incorrectamente (Prisma vs TypeORM)"
      severidad: CRÍTICA
      impacto: DOCUMENTACIÓN
      descripcion: |
        BACKEND_INVENTORY.yml dice que el ORM es Prisma, pero el código real usa TypeORM 0.3.17.
        Además, apps/backend/_MAP.md menciona Express.js cuando es NestJS.
      archivos_afectados:
        - docs/90-transversal/inventarios/BACKEND_INVENTORY.yml
        - apps/backend/_MAP.md
      solucion:
        - "Actualizar BACKEND_INVENTORY.yml campo 'orm' a TypeORM"
        - "Reescribir apps/backend/_MAP.md con stack real"
      prioridad: P0
      tiempo_estimado: "2 horas"
      
    - id: PC-02
      titulo: "Assignments en schema público (debería ser educational_content/social_features)"
      severidad: CRÍTICA
      impacto: RUNTIME
      descripcion: |
        3 entidades backend (Assignment, AssignmentSubmission, AssignmentClassroom) apuntan a schema 'public',
        pero las tablas fueron movidas a educational_content y social_features el 2025-11-08.
        Esto causa fallos en queries en runtime.
      entidades_afectadas:
        - Assignment → educational_content.assignments
        - AssignmentSubmission → educational_content.assignment_submissions
        - AssignmentClassroom → social_features.assignment_classrooms
        - AssignmentExercise → educational_content.assignment_exercises (CREADA 2025-11-08)
        - AssignmentStudent → FALTA entidad backend
      solucion:
        - "Actualizar @Entity decorators de Assignment, AssignmentSubmission, AssignmentClassroom"
        - "Crear entidad AssignmentStudent (tabla existe en DDL)"
        - "Actualizar constantes DB_SCHEMAS y DB_TABLES"
        - "Probar todos los endpoints de assignments"
      prioridad: P0
      tiempo_estimado: "1 día"
      
    - id: PC-03
      titulo: "ProgressStatusEnum discrepancia (mastered vs abandoned)"
      severidad: CRÍTICA
      impacto: RUNTIME
      descripcion: |
        Backend define enum con valor 'mastered' que NO EXISTE en BD.
        BD define valor 'abandoned' que NO EXISTE en backend.
        Esto causa errores en INSERT/UPDATE de status.
      ubicacion_backend: "apps/backend/src/shared/enums/enums.constants.ts"
      ubicacion_bd: "apps/database/ddl/schemas/progress_tracking/enums/progress_status.sql"
      valores_backend: ["not_started", "in_progress", "completed", "needs_review", "mastered"]
      valores_bd: ["not_started", "in_progress", "completed", "needs_review", "abandoned"]
      solucion_opcion_a: "Agregar 'mastered' a BD, mantener 'abandoned'"
      solucion_opcion_b: "Reemplazar 'mastered' por 'abandoned' en backend"
      solucion_opcion_c: "Tener ambos valores en ambos lados"
      prioridad: P0
      tiempo_estimado: "4 horas (incluye migración de datos)"
      
    - id: PC-04
      titulo: "48% de tablas BD sin entidades backend (42 tablas huérfanas)"
      severidad: ALTA
      impacto: FUNCIONALIDAD
      descripcion: |
        42 de 89 tablas en base de datos NO tienen entidades correspondientes en backend.
        Esto significa que funcionalidad documentada no es accesible desde la API.
      tablas_afectadas: 42
      schemas_mas_afectados:
        - educational_content: 11 tablas
        - progress_tracking: 8 tablas
        - system_configuration: 6 tablas (0% implementado)
      solucion:
        - "Clasificar tablas: legacy vs features futuras"
        - "Crear entidades para tablas críticas de Fase 1-2"
        - "Documentar plan de implementación para Fase 3"
        - "Eliminar tablas legacy no usadas"
      prioridad: P1
      tiempo_estimado: "2 semanas"
      
    - id: PC-05
      titulo: "Test coverage real vs documentado (-70% gap)"
      severidad: CRÍTICA
      impacto: CALIDAD
      descripcion: |
        Documentación original estimaba 88% test coverage.
        Coverage real: Backend 18%, Frontend 13%.
        Gap crítico de -70% representa deuda técnica masiva.
      metricas:
        backend_estimado: 88%
        backend_real: 18%
        backend_gap: -70%
        frontend_estimado: 40%
        frontend_real: 13%
        frontend_gap: -27%
      modulos_sin_tests:
        backend: 14 de 15 módulos
        frontend: "~371 de 379 componentes"
      solucion:
        - "Sprint dedicado a testing (2 semanas)"
        - "Priorizar módulos críticos (educational, progress, social)"
        - "Meta realista: 30% backend, 25% frontend en 1 mes"
      prioridad: P0
      tiempo_estimado: "2 sprints (4 semanas)"
      
    - id: PC-06
      titulo: "6 ENUMs con discrepancias entre capas"
      severidad: ALTA
      impacto: "RUNTIME + VALIDACIÓN"
      descripcion: |
        6 enums presentan diferencias entre backend, base de datos y documentación.
      enums_afectados:
        - progress_status: "mastered vs abandoned"
        - difficulty_level: "8 valores diferentes"
        - notification_type: "Backend ENUM, BD TEXT"
        - notification_priority: "Backend ENUM, BD NO EXISTE"
        - content_status: "Posible discrepancia (no verificado)"
        - module_status: "Confusión con content_status"
      solucion:
        - "Auditoría completa de todos los ENUMs"
        - "Crear script de validación automática"
        - "CI/CD check para prevenir futuras discrepancias"
      prioridad: P1
      tiempo_estimado: "1 semana"
      
    - id: PC-07
      titulo: "60% de archivos TRACEABILITY.yml desactualizados"
      severidad: MEDIA
      impacto: DOCUMENTACIÓN
      descripcion: |
        Solo 3 de 17 archivos TRACEABILITY.yml están actualizados (2025-11-08).
        Los 14 restantes no se revisaron y probablemente están desactualizados.
      archivos_actualizados:
        - EAI-001-fundamentos
        - EAI-003-gamificacion
        - EMR-001-migracion-bd
      archivos_sin_revisar: 14
      epicas_fase_3_sin_traceability:
        - EXT-001 a EXT-010
      solucion:
        - "Revisar y actualizar TRACEABILITY de Fase 3"
        - "Eliminar referencias a 'phantom modules' (lti, white-label, peer-challenges, parent-portal)"
        - "Validar que objetos referenciados existen"
      prioridad: P2
      tiempo_estimado: "1 semana"

